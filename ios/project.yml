# XcodeGen spec — the Xcode project is GENERATED from this file, never committed.
#
# That is the whole reason this approach was picked over Capacitor: there is no .xcodeproj to create
# or open, so the build needs no Mac in the loop. CI runs `xcodegen generate` on a macOS runner and
# the project appears. Locally (on a Mac) it's `brew install xcodegen && xcodegen generate`.
#
# Everything the app is: one Swift file, one asset catalog, and index.html referenced in place from
# the repo root — no copy step, no www/ staging directory, no duplicate of the game.
#
#   npm run ios:project   → regenerate ios/Sideline.xcodeproj
#   .github/workflows/ios.yml → does the same, then archives an unsigned .ipa

name: Sideline

options:
  bundleIdPrefix: com.sideline
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    # iPhone only. The game is a 560px mobile-first column; add "2" here for iPad if you want it.
    TARGETED_DEVICE_FAMILY: "1"
    # Deliberately NOT setting code-signing here. CI archives with signing switched off on the
    # command line (SideStore re-signs the .ipa with your Apple ID anyway), and leaving these alone
    # means opening the project on a Mac still behaves like a normal Xcode project.

targets:
  Sideline:
    type: application
    platform: iOS

    sources:
      - path: Sources
      - path: Resources
      # The game itself, referenced where it lives rather than copied in. Editing index.html and
      # rebuilding is the entire dev loop; there is no bundler to re-run.
      - path: ../index.html
        type: file
        buildPhase: resources

    settings:
      base:
        # CHANGE THIS to something of your own (com.yourname.sideline) before the first install.
        # Apple requires globally unique bundle IDs even under free provisioning, so a generic one
        # may already be registered to someone else and fails at signing with a misleading error.
        # It also identifies the app's container: changing it later strands the saves in the old one.
        PRODUCT_BUNDLE_IDENTIFIER: com.sideline.game
        PRODUCT_NAME: Sideline
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

    info:
      path: Sideline-Info.plist
      properties:
        CFBundleDisplayName: Sideline
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # A storyboard-free launch screen that is just the app's own background colour.
        UILaunchScreen:
          UIColorName: LaunchBackground
        # Dark-only, so the keyboard, share sheet and system alerts match the booth palette.
        UIUserInterfaceStyle: Dark
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UIViewControllerBasedStatusBarAppearance: true
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # Nothing here uses non-exempt encryption; declaring it keeps upload tooling quiet.
        ITSAppUsesNonExemptEncryption: false
