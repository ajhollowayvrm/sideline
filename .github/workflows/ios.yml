name: iOS ipa

# Builds an UNSIGNED .ipa on a free macOS runner (this repo is public, so macOS minutes cost
# nothing) and uploads it as a workflow artifact.
#
# There are no certificates, provisioning profiles or secrets anywhere in here, and that is the
# point. Compiling needs macOS + Xcode; SIGNING needs your Apple ID. Only the first belongs in CI —
# AltStore/SideStore re-signs the .ipa locally with your Apple ID when it installs, and would strip
# and redo any signature applied here anyway. So CI does the half that needs a Mac and you do the
# half that needs your account, which is what makes the whole path work from Windows.
#
# To install: Actions → this run → Artifacts → sideline-ipa → unzip → hand the .ipa to SideStore.
# On a free Apple ID the install expires after 7 days, but SideStore refreshes the signature
# on-device from the same file. You only need to re-run this when the game itself changes.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'ios/**'
      - '.github/workflows/ios.yml'

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate the Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Archive (unsigned)
        run: |
          xcodebuild \
            -project ios/Sideline.xcodeproj \
            -scheme Sideline \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Sideline.xcarchive" \
            archive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""

      # `xcodebuild -exportArchive` insists on a signing identity, so the .ipa is assembled by hand.
      # An .ipa is just a zip with the .app inside a top-level Payload/ directory — that's the whole
      # format, and it is exactly what SideStore expects to be handed.
      - name: Package as .ipa
        run: |
          APP="$RUNNER_TEMP/Sideline.xcarchive/Products/Applications/Sideline.app"
          test -d "$APP" || { echo "no .app in the archive"; exit 1; }
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$APP" "$RUNNER_TEMP/Payload/"
          cd "$RUNNER_TEMP" && zip -qry sideline-unsigned.ipa Payload
          echo "built $(du -h sideline-unsigned.ipa | cut -f1)"

      - uses: actions/upload-artifact@v4
        with:
          name: sideline-ipa
          path: ${{ runner.temp }}/sideline-unsigned.ipa
          if-no-files-found: error
