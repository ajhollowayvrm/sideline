/* ============================================================
   NON-CONFERENCE SERIES — multi-year scheduling agreements (Phase 8)
   Conference games stay auto-assigned; only non-conf openings are player-fillable. A series is
   pulled into the slate at kickoff via seriesLegsForYear (locked edges in genSchedule).
   ============================================================ */
const SERIES_TYPES=[['home-home','Home-and-Home','Two games, alternating hosts, across two seasons.'],
  ['2-for-1','2-for-1','You host twice, they host once — three games over three seasons (for a smaller opponent).'],
  ['neutral','Neutral-Site','One game at a neutral venue (a season-opening showcase).'],
  ['buy','Guarantee (Buy) Game','Pay a smaller program a guarantee to visit for one game.']];
// The season the first leg lands: the upcoming one (this Preseason if not yet kicked off, else next).
function nextSeriesYear(){return (!S.schedule)?(S.year||2026):((S.year||2026)+1);}
// A smaller program's asking guarantee for a buy game (scales with its prestige).
function seriesAsk(to){return Math.round(to.prestige*150000+1.0e6);}
// Will `to` accept a series of `type` from `from`? Buy games hinge on the guarantee; a 2-for-1
// needs `from` to be the bigger draw (the smaller side trades two road trips for a marquee + payday);
// home-and-homes on prestige proximity (a smaller school gladly hosts a marquee opponent).
function seriesWillingness(from,to,type,guarantee){
  if(from.conf===to.conf)return false;               // conference games are auto-scheduled
  const dp=Math.abs(from.prestige-to.prestige);
  if(type==='buy'){if(from.prestige<=to.prestige+8)return false;return (guarantee||0)>=seriesAsk(to);}
  if(type==='2-for-1')return from.prestige>to.prestige+6 && to.prestige>=from.prestige-45;
  return dp<=24 || (from.prestige>to.prestige && to.prestige>=from.prestige-40);
}
// Build the leg schedule for a series of `type` from host-perspective `aId` vs `bId`, starting year Y.
function seriesLegs(type,aId,bId,Y){
  if(type==='home-home')return [{year:Y,home:aId,away:bId},{year:Y+1,home:bId,away:aId}];
  if(type==='2-for-1')return [{year:Y,home:aId,away:bId},{year:Y+1,home:aId,away:bId},{year:Y+2,home:bId,away:aId}];
  if(type==='neutral')return [{year:Y,home:aId,away:bId,neutralSite:true}];
  return [{year:Y,home:aId,away:bId}];               // buy game: bId visits aId once
}
function mySeries(){return (S.series||[]).filter(s=>s.a===S.teamId||s.b===S.teamId);}
function seriesExistsWith(toId){return (S.series||[]).some(s=>(s.a===S.teamId&&s.b===toId)||(s.b===S.teamId&&s.a===toId));}
// Propose (and, if accepted, book) a series from the controlled team to `toId`.
function proposeSeries(toId,type,guarantee){
  const from=controlled(),to=teamById(toId);
  if(!to)return {ok:false,msg:'Unknown program'};
  if(to.id===from.id)return {ok:false,msg:'Pick another program'};
  if(from.conf===to.conf)return {ok:false,msg:'Conference games are auto-scheduled'};
  if(seriesExistsWith(toId))return {ok:false,msg:'You already have a series with them'};
  if(!seriesWillingness(from,to,type,guarantee))
    return {ok:false,msg:type==='buy'?('They want at least '+money(seriesAsk(to))):type==='2-for-1'?'Only a smaller program takes a 2-for-1':'They declined — prestige mismatch'};
  const Y=nextSeriesYear();
  const s={id:'s'+(S.series.length).toString(36)+Y,type,a:from.id,b:to.id,legs:seriesLegs(type,from.id,to.id,Y)};
  if(type==='buy'){s.guarantee=guarantee;from.budget-=guarantee;}   // pay the guarantee on booking
  S.series.push(s);autosave();
  return {ok:true,msg:'Series booked with '+to.name,series:s};
}

/* ---- AI-initiated series offers (the other half of "either side can initiate") ---- */
// A deterministic handful of non-conference programs that want to schedule YOU, refreshed each
// offseason (like the coach market). Bigger schools offer a 2-for-1 or a buy game (they pay YOU);
// near-peers offer a home-and-home. Stored in S.seriesOffers; accept/decline from the series card.
function genSeriesOffers(seed,year,meId){
  const me=teamById(meId);if(!me)return [];
  const r=rng((seed^hashStr('seriesoffers'+year))>>>0);
  const pool=S.world.teams.filter(t=>t.id!==meId&&t.conf!==me.conf&&!seriesExistsWith(t.id));
  const ranked=pool.map(t=>({t,k:r()+(1-Math.abs(t.prestige-me.prestige)/60)})).sort((a,b)=>b.k-a.k);
  const out=[], n=ri(r,2,4);
  for(let i=0;i<ranked.length&&out.length<n;i++){
    const o=ranked[i].t, dp=o.prestige-me.prestige; let type='home-home', guarantee=0;
    if(dp>12){ if(r()<0.5){type='2-for-1';} else {type='buy';guarantee=seriesAsk(me);} }  // they pay you to visit
    out.push({id:'so'+year.toString(36)+i.toString(36),fromId:o.id,type,guarantee});
  }
  return out;
}
function ensureSeriesOffers(){if(!S.seriesOffers)S.seriesOffers=genSeriesOffers(S.seed,S.year||2026,S.teamId);return S.seriesOffers;}
function acceptSeriesOffer(offerId){
  const o=(S.seriesOffers||[]).find(x=>x.id===offerId);if(!o)return false;
  const me=controlled(),from=teamById(o.fromId);if(!from){declineSeriesOffer(offerId);return false;}
  if(seriesExistsWith(from.id)){declineSeriesOffer(offerId);return false;}
  const Y=nextSeriesYear();
  // AI is the initiator/host of record: home-home → you host first; 2-for-1 → they host twice; buy → you visit, they pay you
  let legs;
  if(o.type==='home-home')legs=[{year:Y,home:me.id,away:from.id},{year:Y+1,home:from.id,away:me.id}];
  else legs=seriesLegs(o.type,from.id,me.id,Y);       // 2-for-1 / buy: `from` hosts
  const s={id:'s'+S.series.length.toString(36)+Y,type:o.type,a:from.id,b:me.id,legs};
  if(o.type==='buy'){s.guarantee=o.guarantee;me.budget+=o.guarantee;}   // you're bought → you receive
  S.series.push(s);S.seriesOffers=S.seriesOffers.filter(x=>x.id!==offerId);autosave();
  return true;
}
function declineSeriesOffer(offerId){S.seriesOffers=(S.seriesOffers||[]).filter(x=>x.id!==offerId);autosave();}

/* ============================================================
   RECRUITING — weekly economy + player actions (Phase 4)
   The pure engine (genRecruits/advanceRecruiting/coachMods/…) lives in the RECRUIT ENGINE
   block above; this layer owns S.recruiting, the points economy, and the five player actions.
   ============================================================ */
const RECRUIT_COSTS={scout:2,pitch:3,promise:4,alumni:4,nil:0};   // offer free (board slot); NIL pays $ (Phase 37); visits are a weekend calendar, not a weekly intent (Phase 38)
// Phase 37 — NIL bid tiers (money → interest). [key, label, $amount]. A bid pays from team.budget, not points.
const NIL_TIERS=[['modest','Modest',0.6e6],['strong','Strong',1.8e6],['blockbuster','Blockbuster',4.5e6]];
const SEASON_VISITS=12;   // Phase 37: official-visit calendar — a season-long budget on top of the weekly cap
// How much a recruit values NIL → the multiplier on a NIL bid (top priority → big, otherwise modest).
function nilWeightOf(rec){return rec.prefs&&rec.prefs[0]==='nil'?1.5:rec.prefs&&rec.prefs[1]==='nil'?1.0:0.45;}
function nilFacMult(team){return 0.7+((team&&team.fac&&team.fac.nil||5)/10)*0.6;}   // a strong collective amplifies
function myMods(){return coachMods(S.coach);}
// Phase 33: the weekly budget is driven by the SCOUTING facility (with a small base + coach-archetype
// term, so Recruiter still matters) — not prestige. Better scouting → more weekly actions.
function weeklyPoints(){const t=controlled(),m=myMods();
  const sc=(t.fac&&t.fac.scouting)||5;
  return Math.max(4,Math.round(REC.BASE_POINTS+sc*1.6+m.points));}
function boardSlots(){return Math.max(6,REC.SLOTS+myMods().slots);}
function initRecruiting(){
  // stage: 'open' (in-season, taking verbals) → 'national' (offseason, ESP done, NSD pending) → 'closed'
  // intents = the week's queued actions, keyed by recruit id → an ARRAY of ≤2 actions (Phase 35 double-down).
  // doubles = this week's double-down tokens (Phase 35) that let one recruit hold a 2nd action.
  // visitsLeft = the season-long official-visit budget; visitPlan = recruits booked per home-game
  //   weekend (Phase 38 scheduler — official visits are now a calendar, reserved at booking).
  S.recruiting={cycle:1,points:weeklyPoints(),pool:genRecruits(S.seed,S.world.teams),board:[],signed:false,stage:'open',intents:{},doubles:doublesPerWeek(),visitsLeft:SEASON_VISITS,visitPlan:{},report:null,autopilot:true};   // Phase 44: staff works the board by default
}
// Official visits remaining this season — reserved at booking onto a weekend (Phase 38).
function visitsLeft(){const R=S.recruiting;return (R&&R.visitsLeft==null?SEASON_VISITS:R.visitsLeft);}
function visitPlan(){const R=S.recruiting;return R.visitPlan||(R.visitPlan={});}
function grantRecruitPoints(){if(S.recruiting&&!S.recruiting.signed){S.recruiting.points=weeklyPoints();S.recruiting.doubles=doublesPerWeek();}}
// Phase 35/38 — weekly scarcity caps. A Recruiter brings more (double-downs let you stack a 2nd action
// on one recruit; weekendCap = how many recruits you can host on a single home weekend, Phase 38).
function weekendCap(){return (S.coach&&S.coach.archetype==='Recruiter')?3:2;}
function doublesPerWeek(){return (S.coach&&S.coach.archetype==='Recruiter')?2:1;}
/* ---- official-visit weekend scheduler (Phase 38) ----
   Official visits are a CALENDAR tied to the controlled team's HOME-game weekends. You book a recruit
   onto an upcoming home weekend (reserving a season-budget slot); on advancing through that week the
   booked visits resolve, scaled by the weekend's QUALITY (opponent + my form + marquee). */
// Upcoming home-game weekends (this week onward, not yet played) — the bookable visit slots.
function homeWeekends(){const me=S.teamId;if(!S.schedule)return [];
  return S.schedule.games.filter(g=>g.home===me&&!g.played&&g.week>=S.week)
    .sort((a,b)=>a.week-b.week)
    .map(g=>({week:g.week,game:g,opp:teamById(g.away)}));}
// The quality/tier/booked state of one home weekend (from the live matchup + standings).
function weekendInfo(week){const me=S.teamId,g=teamGame(me,week);
  if(!g||g.home!==me)return null;
  const opp=teamById(g.away), my=controlled();
  const q=weekendQuality({myRank:my.natRank,oppRank:opp&&opp.natRank,oppPrestige:opp&&opp.prestige,week,rivalry:!!(opp&&rivalryFor(me,opp.id))});
  const booked=(visitPlan()[week]||[]);
  return {week,game:g,opp,q,tier:weekendTier(q),booked,slotsLeft:Math.max(0,weekendCap()-booked.length)};}
function visitWeekFor(rec){for(const wk in visitPlan())if(visitPlan()[wk].includes(rec.id))return +wk;return null;}
function isVisitBooked(rec){return visitWeekFor(rec)!=null;}
function totalBooked(){return Object.values(visitPlan()).reduce((n,a)=>n+a.length,0);}
// Can this recruit be booked at all (independent of a specific weekend)?
function canBookVisit(rec){const R=S.recruiting;
  if(!R||R.signed||rec.signed)return false;
  if(rec.committedTo===S.teamId||rec.visited||isVisitBooked(rec))return false;
  if(rec.finalists&&!rec.committedTo&&rec.finalists.indexOf(S.teamId)<0)return false;   // cut from his shortlist
  if(!onBoard(rec))return false;
  return visitsLeft()>0&&homeWeekends().some(w=>weekendCap()-(visitPlan()[w.week]||[]).length>0);}
// Book a recruit onto a home weekend (reserves a season-visit slot). Returns true on success.
function bookVisit(rec,week){const R=S.recruiting;
  if(rec.visited){toast('Already visited');return false;}
  if(isVisitBooked(rec)){toast('Already booked for a weekend');return false;}
  if(visitsLeft()<=0){toast('Out of official visits for the season ('+SEASON_VISITS+' total)');return false;}
  const info=weekendInfo(week);
  if(!info){toast('Not a home weekend');return false;}
  if(info.slotsLeft<=0){toast('That weekend is full ('+weekendCap()+' visit'+(weekendCap()===1?'':'s')+' max)');return false;}
  (visitPlan()[week]||(visitPlan()[week]=[])).push(rec.id);
  R.visitsLeft=visitsLeft()-1;autosave();return true;}
function unbookVisit(rec){const wk=visitWeekFor(rec);if(wk==null)return false;
  const R=S.recruiting,arr=visitPlan()[wk];arr.splice(arr.indexOf(rec.id),1);
  if(!arr.length)delete visitPlan()[wk];
  R.visitsLeft=visitsLeft()+1;autosave();return true;}
// Resolve every visit booked for `week` (called at the week change in resolveRecruitingWeek, after the
// game is played). The weekend's billing (opponent + my form + marquee) scales the interest boost.
// Returns a one-line note for the weekly board report. The season slot was spent at booking time.
function applyWeekendVisits(week){const R=S.recruiting;if(!R)return null;
  const ids=(visitPlan()[week]||[]);if(!ids.length)return null;
  const me=S.teamId,my=controlled(),g=teamGame(me,week),opp=g&&teamById(g.away===me?g.home:g.away);
  const q=weekendQuality({myRank:my.natRank,oppRank:opp&&opp.natRank,oppPrestige:opp&&opp.prestige,week,rivalry:!!(opp&&rivalryFor(me,opp.id))});
  const m=myMods();let n=0;
  ids.forEach(id=>{const rec=recById(id);if(!rec||rec.signed||rec.committedTo===me)return;
    let gain=20*q*m.visit*recScoutMult(rec);
    if(m.homeState&&rec.st===m.homeState)gain*=m.homeBonus;
    bumpInterest(rec,gain);rec.visited=true;rec.hits=rec.hits||{};rec.hits.visit=(rec.hits.visit||0)+1;n++;});
  delete visitPlan()[week];
  return n?'🏟️ Hosted '+n+' recruit'+(n===1?'':'s')+' for the '+(opp?(opp.natRank?'#'+opp.natRank+' ':'')+opp.abbr:'home')+' game ('+weekendTier(q)+' weekend)':null;}
// Phase 34 (legibility): snapshot each board recruit's pre-resolution state (my interest/rank, the full
// suitor interest map, and my queued intent) so the post-week report can diff what actually moved + why.
function recruitPreSnaps(){
  const me=S.teamId, R=S.recruiting, I=R.intents||{};
  return R.board.map(recById).filter(Boolean).map(rec=>{
    const arr=I[rec.id]||[], main=arr.find(x=>x.action!=='scout')||arr[0];   // the headline action (Phase 35 arrays)
    return {id:rec.id, myIv:rec.iv[me]||0, rank:myRank(rec)||(suitorList(rec).length+1),
      committedToMe:rec.committedTo===me, decideWeek:rec.decideWeek, iv:Object.assign({},rec.iv),
      finalists:rec.finalists?rec.finalists.slice():null, wasSuitor:rec.iv[me]!=null,   // Phase 36: shortlist state
      intent:main?{action:main.action,angle:main.angle}:null};
  });
}
// Diff the snapshots against the resolved board into a readable weekly report (S.recruiting.report).
// note = a board-wide headline (e.g. the season-result ripple). Phase 35 also reports decision announcements.
function buildRecruitReport(snaps,week,note){
  const me=S.teamId, rows=[];
  snaps.forEach(s=>{
    const rec=recById(s.id); if(!rec)return;
    const sl=suitorList(rec), myNow=rec.iv[me]||0, myDelta=Math.round(myNow-s.myIv);
    const rankNow=myRank(rec)||(sl.length+1);
    let rivalAbbr=null,rivalDelta=0;                        // the biggest rival mover this week
    for(const su of sl){if(su.id===me)continue;const d=su.v-(s.iv[su.id]||0);if(d>rivalDelta){rivalDelta=Math.round(d);rivalAbbr=su.team.abbr;}}
    const leader=sl[0], rivalLeads=!!(leader&&leader.id!==me);
    const committedMine=rec.committedTo===me&&!s.committedToMe;
    const flippedAway=s.committedToMe&&rec.committedTo!==me;
    const flippedToMe=!!(rec._flipped&&rec._flipped.to===me);
    const announced=rec.decideWeek!=null&&s.decideWeek==null&&!rec.committedTo;   // Phase 35: just set a decision date
    const finalNew=rec.finalists&&!s.finalists;                                   // Phase 36: shortlist just set
    const madeList=finalNew&&rec.finalists.indexOf(me)>=0, cutList=finalNew&&s.wasSuitor&&rec.finalists.indexOf(me)<0;
    const it=s.intent, prefMatch=it&&it.action==='pitch'?(rec.prefs[0]===it.angle?0:rec.prefs[1]===it.angle?1:2):null;
    let r;
    if(cutList)r={text:'✂️ Cut from his finalists',tone:'bad'};
    else if(madeList)r={text:'✅ Made his top '+rec.finalists.length+' finalists'+(rankNow===1?' (you lead)':''),tone:'good'};
    else if(announced)r={text:'🗓️ Announced his decision — commits Week '+rec.decideWeek+(rankNow===1?' (you lead!)':rankNow?' (you’re #'+rankNow+')':''),tone:rankNow===1?'good':'warn'};
    else r=recruitReaction({action:it?it.action:null,angle:it&&it.angle,angleLabel:it&&it.angle?prefLabel(it.angle):'',
      prefMatch,myDelta,rivalAbbr,rivalDelta,rivalLeads,rankNow,rankPrev:s.rank,nSuitors:sl.length,committedMine,flippedToMe,flippedAway});
    // surface a row if you acted on him, or something notable happened
    if(!(it||committedMine||flippedAway||flippedToMe||announced||madeList||cutList||rivalDelta>=10||Math.abs(myDelta)>=6))return;
    const pri=(committedMine||flippedToMe||cutList)?0:flippedAway?0:announced?0:r.tone==='warn'?1:r.tone==='good'?2:3;
    rows.push({id:rec.id,name:rec.fn+' '+rec.ln,pos:rec.pos,stars:rec.stars,text:r.text,tone:r.tone,myDelta,pri});
  });
  rows.sort((a,b)=>a.pri-b.pri||b.stars-a.stars||Math.abs(b.myDelta)-Math.abs(a.myDelta));
  S.recruiting.report={week,reactions:rows.slice(0,10),note:note||null};
}
// Phase 44: recruiting autopilot — your staff works the board when you don't. Each week it maintains a
// slate of good-fit pursuits (auto-offering to fill it) and pushes them like a rival program, so a
// hands-off program still lands a real, below-average class instead of an empty one. Deliberately MODEST
// (staff-level budget, no coach mods) — an engaged coach who targets manually still out-recruits it. It
// works directly on `iv` (behind the scenes, no board clutter) and mirrors the AI brain it competes with.
function autoRecruitWeek(week){
  const R=S.recruiting; if(!R||R.autopilot===false||R.signed)return;
  const me=controlled(), meId=S.teamId, pool=R.pool;
  const isFin=rec=>!rec.finalists||rec.finalists.indexOf(meId)>=0;
  const mine=pool.filter(rec=>!rec.signed&&rec.iv[meId]!=null&&(!rec.committedTo||rec.committedTo===meId)&&isFin(rec));
  const TARGET=22;   // keep roughly a class-worth of active pursuits alive
  if(mine.length<TARGET){
    const cand=pool.filter(rec=>!rec.signed&&!rec.committedTo&&rec.iv[meId]==null&&(!rec.finalists||rec.finalists.indexOf(meId)>=0))
      .map(rec=>({rec,fit:recruitFit(me,rec)})).sort((a,b)=>b.fit-a.fit);
    for(const {rec,fit} of cand){ if(mine.length>=TARGET)break;
      rec.iv[meId]=Math.max(rec.iv[meId]||0,clamp(Math.round(14+fit*22),8,60)); mine.push(rec); }
  }
  let budget=aiBudget(me)*0.85;   // slightly under a focused rival — hands-off is viable, not optimal
  const targets=mine.filter(rec=>rec.committedTo!==meId).map(rec=>({rec,pr:aiPriority(me,rec)})).sort((a,b)=>b.pr-a.pr);
  const rr=rng((S.seed^hashStr('auto'+week+meId))>>>0);
  for(const {rec} of targets){ if(budget<REC.AI_COST)break; budget-=REC.AI_COST;
    rec.iv[meId]=clamp((rec.iv[meId]||0)+aiActionGain(me,rec,rr)*recScoutMult(rec),0,100); }
}
function resolveRecruitingWeek(week){
  if(!S.recruiting||S.recruiting.signed)return [];
  const snaps=recruitPreSnaps();   // Phase 34: capture pre-resolution state for the weekly report
  const actedOn=new Set();for(const id in (S.recruiting.intents||{}))actedOn.add(id);   // who you worked this week
  (visitPlan()[week]||[]).forEach(id=>actedOn.add(id));   // Phase 38: a recruit you hosted for a visit isn't "neglected"
  const visitNote=applyWeekendVisits(week);   // Phase 38: resolve official visits booked for this home weekend
  applyPlayerIntents();   // Phase 33: your queued actions land first, then the AI brain's, then commitments
  autoRecruitWeek(week);  // Phase 44: your staff fills out the class on the recruits you didn't personally work
  decayNeglect(actedOn);            // Phase 35: board recruits you ignored cool on you (upkeep matters)
  const rippleNote=applyLeagueRipple(week); // Phase 35/37: every team's Saturday result moves its board (note=yours)
  applyAINil(week);                 // Phase 37: AI programs place NIL bids on the recruits they're chasing
  // in-season: verbal commitments only (finalize=false) — binding signatures wait for the offseason
  const out=advanceRecruiting(S.recruiting.pool,S.world.teams,week,S.schedule.weeks,S.seed,false,undefined,undefined,S.teamId);
  const note=[visitNote,rippleNote].filter(Boolean).join(' · ')||null;   // Phase 38 visit + Phase 35/37 ripple
  buildRecruitReport(snaps,week,note);   // Phase 34/35: diff into a readable board report

  const me=S.teamId;
  // Phase 16: a verbal you held can flip away; you can flip one from a rival. Toast the swings.
  const lost=out.filter(r=>r._flipped&&r._flipped.from===me);
  const flippedToMe=out.filter(r=>r._flipped&&r._flipped.to===me);
  const fresh=out.filter(r=>!r._flipped&&r.committedTo===me);   // brand-new verbals to me (not flips)
  let d=300;
  if(fresh.length)setTimeout(()=>toast(fresh.length+' recruit'+(fresh.length===1?'':'s')+' verbally committed to you! 🎉'),d),d+=400;
  if(flippedToMe.length)setTimeout(()=>toast('Flipped '+flippedToMe.length+' commit'+(flippedToMe.length===1?'':'s')+' to you! 🔁'),d),d+=400;
  if(lost.length)setTimeout(()=>toast('⚠️ '+lost.length+' verbal'+(lost.length===1?'':'s')+' decommitted from you'),d);
  return out;
}
/* ---- lookups ---- */
function recById(id){return S.recruiting?S.recruiting.pool.find(r=>r.id===id):null;}
function onBoard(rec){return S.recruiting&&S.recruiting.board.includes(rec.id);}
function myInterest(rec){return Math.round(rec.iv[S.teamId]||0);}
function suitorList(rec){return Object.entries(rec.iv).map(([id,v])=>({id,v,team:teamById(id)}))
  .filter(s=>s.team).sort((a,b)=>b.v-a.v);}
function leaderOf(rec){const s=suitorList(rec);return s.length?s[0]:null;}
function myRank(rec){if(rec.iv[S.teamId]==null)return null;const s=suitorList(rec);return s.findIndex(x=>x.id===S.teamId)+1;}
function myClass(){return S.recruiting?S.recruiting.pool.filter(r=>r.committedTo===S.teamId):[];}
function myClassRank(){const me=controlled();const pool=S.recruiting.pool;
  const score=t=>classScore(t,pool);const my=score(me);
  return S.world.teams.filter(t=>score(t)>my).length+1;}
/* ---- weekly intent queue (Phase 33, arrays + scarcity in Phase 35) ----
   Each week the player SETS queued actions per recruit — ONE by default, or TWO via a weekly DOUBLE-DOWN
   token (`R.doubles`). `R.intents[recId]` is an ARRAY of ≤2 intent objects; setting reserves the point cost
   up front. All intents resolve together at the week change (applyPlayerIntents). The action's effect
   (game-day visit bonus + coach mods + the Phase 35 diminishing-returns falloff) is captured at SET time. */
function recIntents(){const R=S.recruiting;return R.intents||(R.intents={});}
function intentsFor(rec){return recIntents()[rec.id]||[];}             // read-only array (may be empty)
function intentCount(){return Object.values(recIntents()).reduce((n,a)=>n+a.length,0);}
function hasIntent(rec,action){return intentsFor(rec).some(x=>x.action===action);}
// Remove one queued action (refund its points + give back a double-down if it was the stacked 2nd action).
function removeIntentAt(rec,idx){const I=recIntents(),arr=I[rec.id];if(!arr||!arr[idx])return;
  const it=arr[idx];S.recruiting.points+=it.cost;if(it.isDouble)S.recruiting.doubles=(S.recruiting.doubles||0)+1;
  if(it.nilSpend)controlled().budget=(controlled().budget||0)+it.nilSpend;   // Phase 37: refund a reserved NIL bid
  arr.splice(idx,1);if(!arr.length)delete I[rec.id];autosave();}
function clearRecIntent(rec){const arr=intentsFor(rec).slice();
  for(let i=arr.length-1;i>=0;i--)removeIntentAt(rec,i);}
// Build the intent object (cost + captured effect) for an action, or null (with a toast) if it can't be set.
function buildIntent(rec,action,opt){
  const m=myMods(), sm=recScoutMult(rec), it={action,cost:RECRUIT_COSTS[action]||0,label:''};   // sm = scouting payoff
  if(action==='scout'){it.scoutDelta=Math.round(30*m.scout);it.label='Scout';}
  else if(action==='pitch'){const angle=opt.angle;
    let mult=rec.prefs[0]===angle?1.6:rec.prefs[1]===angle?1.2:0.7;
    if(angle==='nil')mult*=m.nil; if(angle==='development')mult*=m.devPitch;
    const dr=repeatFalloff(rec.hits&&rec.hits.pitch||0);            // Phase 35: spamming the same pitch pays less
    let gain=8*mult*m.pitch*sm*dr; if(m.homeState&&rec.st===m.homeState)gain*=m.homeBonus;
    it.angle=angle;it.gain=gain;it.label='Pitch · '+prefLabel(angle);}
  else if(action==='promise'){let gain=22*m.visit*sm; if(m.homeState&&rec.st===m.homeState)gain*=m.homeBonus;
    it.gain=gain;it.promiseType=opt.type||'playingTime';it.label='Promise';}
  else if(action==='alumni'){const lg=opt.legend; if(!lg||(lg.app||0)<=0){toast('No appearances left for that alum');return null;}
    it.legendId=lg.id;it.gain=alumniBoost(lg,rec,alumniCoachMod(lg))*sm;it.label='Alumni · '+lg.name.split(' ').slice(-1);}

// Toggle an action on a recruit. Clicking a queued action removes it. A new action: slot 1 is free; a 2nd
// needs a DOUBLE-DOWN token (else it replaces the first). (Visits are a separate weekend calendar — Phase 38.)
function setRecIntent(rec,action,opt){
  opt=opt||{};const R=S.recruiting;
  if(R.signed||rec.signed){toast('Already signed — can’t recruit him');return false;}
  if(rec.committedTo===S.teamId){toast('Already committed to you');return false;}
  if(rec.finalists&&!rec.committedTo&&rec.finalists.indexOf(S.teamId)<0){toast('✂️ You’ve been cut from his finalists');return false;}   // Phase 36 (open race only)
  if(!onBoard(rec)){toast('Offer a scholarship first');return false;}
  const arr=intentsFor(rec), exIdx=arr.findIndex(x=>x.action===action);
  if(exIdx>=0){removeIntentAt(rec,exIdx);return true;}                 // toggle OFF a queued action
  if(action==='promise'&&rec.promise){toast('Already made a promise');return false;}
  if(action==='alumni'&&rec.alumni){toast('An alum already hosted this recruit');return false;}
  // Phase 37: a NIL bid pays from team.budget (not recruiting points).
  let nilAmt=0;
  if(action==='nil'){const tier=NIL_TIERS.find(t=>t[0]===opt.tier)||NIL_TIERS[0];nilAmt=tier[2];
    if((controlled().budget||0)<nilAmt){toast('Not enough budget for that NIL offer');return false;}}
  let isDouble=false, replaceIdx=-1;
  if(arr.length>=2){toast('Two actions max on one recruit — clear one first');return false;}
  if(arr.length===1){ if((R.doubles||0)>0)isDouble=true; else replaceIdx=0; }   // 2nd action needs a double, else swap
  const cost=RECRUIT_COSTS[action]||0, refund=replaceIdx>=0?arr[replaceIdx].cost:0;
  if(cost>R.points+refund){toast('Not enough recruiting points');return false;}

// Resolve every queued action (in-season week change + National Signing Day), then clear the queue.
function applyPlayerIntents(){
  const R=S.recruiting; if(!R||!R.intents)return;
  for(const rid in R.intents){const arr=R.intents[rid],rec=recById(rid);if(!rec||!arr)continue;
    arr.forEach(it=>{
      if(it.action==='alumni'){const lg=(controlled().legends||[]).find(l=>l.id===it.legendId);
        if(lg&&(lg.app||0)>0){lg.app--;rec.alumni=lg.id;bumpInterest(rec,it.gain);}}
      else{
        if(it.scoutDelta!=null)rec.scout=clamp(rec.scout+it.scoutDelta,0,100);
        if(it.gain)bumpInterest(rec,it.gain);
        if(it.action==='promise')rec.promise={type:it.promiseType};
      }

// Phase 35 — decay-on-neglect: a board recruit you DIDN'T work this week cools on you a little (you have to
// maintain relationships). Player-only (your interest), so the engine envelope is untouched. Skips recruits
// committed elsewhere (not your relationship to keep) — but your own verbals DO decay (neglect risks a flip).
function decayNeglect(actedOn){
  const me=S.teamId, R=S.recruiting;
  R.board.forEach(id=>{ if(actedOn.has(id))return; const rec=recById(id);
    if(!rec||rec.signed||rec.iv[me]==null)return;
    if(rec.committedTo&&rec.committedTo!==me)return;
    rec.iv[me]=clamp(rec.iv[me]-REC.NEGLECT_DECAY,0,100);
  });
}
// Phase 35/37 — season ripple, now LEAGUE-WIDE: every team's Saturday result energizes (or cools) the recruits
// it's chasing, in-state most (Phase 37 — the AI reacts to its own results like the player). App-layer (the
// engine has no game data); respects finalists + skips recruits committed elsewhere. Returns the player's note.
function applyLeagueRipple(week){
  const me=S.teamId;
  // each team's game vibe this week
  const vibe={};
  S.world.teams.forEach(t=>{const g=teamGame(t.id,week);if(!g||!g.played)return;
    const home=g.home===t.id, my=home?g.hs:g.as, opp=home?g.as:g.hs, oppT=teamById(home?g.away:g.home);
    const v=gameRecruitVibe(my,opp,t.natRank,oppT&&oppT.natRank,!!rivalryFor(g.home,g.away));   // Phase 40: rivalry result echoes louder
    if(v)vibe[t.id]={v,oppAbbr:oppT?oppT.abbr:'them',win:my>opp};});
  // apply to each suitor's interest on the recruits they chase
  S.recruiting.pool.forEach(rec=>{if(rec.signed)return;
    for(const tid in rec.iv){const vb=vibe[tid];if(!vb)continue;
      if(rec.committedTo&&rec.committedTo!==tid)continue;
      if(rec.finalists&&rec.finalists.indexOf(tid)<0)continue;
      if((rec.iv[tid]||0)<30&&tid!==me)continue;   // only ripple genuine battles (protect the marginal tail → convergence)
      const t=teamById(tid), inState=t&&t.homeState&&rec.st===t.homeState, isMe=tid===me;
      // A win ENERGIZES the board (in-state most). For the player, a loss also COOLS (his drama, the Phase 35
      // feel). League-wide (AI teams), the ripple is POSITIVE-ONLY — a loss just gives no boost rather than
      // cooling — so it never compounds negatively across the league and drops the tail below the sign bar.
      const scale=vb.v>0?(inState?0.5:0.25):(isMe?(inState?0.4:0.2):0);
      if(scale)rec.iv[tid]=clamp((rec.iv[tid]||0)+vb.v*scale,0,100);}
  });
  const mv=vibe[me];
  if(!mv||!S.recruiting.board.length)return null;
  return (mv.win?'📈 ':'📉 ')+'Your '+(mv.win?'win over ':'loss to ')+mv.oppAbbr+' '+(mv.v>=4?'energized':mv.v>0?'helped':'cooled')+' your board';
}
// Phase 37 — AI NIL bids: rival programs spend real budget on the recruits who VALUE NIL, so the player must
// out-bid them on those kids. App-layer (so the engine/reclab is untouched); a bid is a small, bounded slice of
// the team's budget (rich collectives bid more), seeded by week. Skips the player + budget-less lab teams.
function applyAINil(week){
  const me=S.teamId, r=rng((S.seed^hashStr('ainil'+week))>>>0);
  S.recruiting.pool.forEach(rec=>{
    if(rec.signed||nilWeightOf(rec)<1)return;              // only recruits whose TOP priority is NIL
    if(r()>0.2)return;                                     // not every NIL recruit, every week
    let best=null,bestV=-1;                                // the strongest non-player suitor bids
    for(const tid in rec.iv){if(tid===me)continue;
      if(rec.finalists&&rec.finalists.indexOf(tid)<0)continue;
      if(rec.committedTo&&rec.committedTo!==tid)continue;
      if(rec.iv[tid]>bestV){bestV=rec.iv[tid];best=tid;}}
    if(!best)return;
    const t=teamById(best); if(!t||(t.budget||0)<0.5e6)return;
    const amt=Math.min((t.budget||0)*0.04,2.5e6)*(0.7+r()*0.6);
    t.budget-=amt;
    rec.iv[best]=clamp((rec.iv[best]||0)+nilGain(amt/1e6,nilWeightOf(rec))*nilFacMult(t),0,100);
  });
}

function offerRecruit(rec){

  if(rec.finalists&&!rec.committedTo&&rec.finalists.indexOf(S.teamId)<0){toast('✂️ He’s set his finalists — you’re not on the list');return;}   // Phase 36 (open race only)
  if(rec.committedTo&&rec.committedTo!==S.teamId)toast('Committed elsewhere — recruit him to flip it');   // verbal: you can still chase
  if(S.recruiting.board.length>=boardSlots()){toast('Board full — drop a target first');return;}
  const m=myMods(),me=controlled();

  let fit=recruitFit(eff,rec);

let gameTimer=null;
// Find a game by id in the regular-season schedule OR the postseason (bracket + bowls).

/* ============================================================
   PLAY-CALLING — the interactive field (Phase 22)
   The classic viewer animates a pre-baked log; here the COACH calls plays. The pure simEngine is
   RE-RUN from scratch after each decision (sub-ms), feeding back the recorded calls so it advances
   to the next decision (or the final). The recorded calls bank onto g.calls at commit, so simGame

   ============================================================ */
// Each quarter is 15:00. The engine's `clock` is total-game seconds remaining (900 per quarter); this
// converts it to the on-field quarter clock (Phase 46). Overtime carries its own label + a running clock.
function quarterClock(q,clock){
  if((''+q).startsWith('OT'))return {label:''+q,clk:'',rem:0};
  const qn=+q, rem=clock-900*(4-qn);                  // seconds left in THIS quarter
  const s=clamp(Math.round(rem),0,900);
  return {label:'Q'+qn,clk:Math.floor(s/60)+':'+('0'+(s%60)).slice(-2),rem};
}
function shouldPromptCtx(ctx,mode){
  if(mode==='full')return true;                       // call every snap
  if(mode!=='key')return false;                       // 'auto' — let the OC run it
  if(ctx.phase==='fourth')return true;                // every 4th-down decision
  if(ctx.los>=80)return true;                         // red zone
  if(ctx.togo>=100-ctx.los)return true;               // goal-to-go
  if(ctx.down>=3&&ctx.togo>=7)return true;            // 3rd/4th & long
  const q=ctx.q;
  if((''+q).startsWith('OT'))return true;             // every overtime snap
  const rem=ctx.clock-900*(4-(+q));                   // seconds left in this quarter
  if((+q===2||+q===4)&&rem<=120)return true;          // 2-minute drill — and Phase 46: rem can hit 0/below, so
  return false;                                       // you keep calling plays PAST 0:00 (the drive plays out)
}
// Re-run the pure engine, feeding back the coach's recorded calls; pause (throw) at the first

function runInteractive(){

function playDiagram(art){

  s+=`<line x1="5" y1="${los}" x2="${W-5}" y2="${los}" stroke="rgba(255,255,255,.5)" stroke-width="0.7"/>`;

  [50,59,68,77,86].forEach(x=>s+=_pdot(x,los+3,'#c7d2ca'));                 // offensive line

function offTendHint(dt){
  if(!dt)return '';
  const tot=(dt.base||0)+(dt.blitz||0)+(dt.cover||0)+(dt.run||0);
  if(tot<3)return 'Still reading the defense — mix it up early.';
  const rows=[['run','stacking the box','▶ Play Action & quick game punish this'],['blitz','bringing pressure','▶ Screens & the draw beat the blitz'],['cover','sitting in coverage','▶ Run it — the box is light'],['base','in their base look','▶ Take what’s there']];
  const top=rows.slice().sort((a,b)=>(dt[b[0]]||0)-(dt[a[0]]||0))[0];
  return `Defense has been ${top[1]} (${Math.round((dt[top[0]]||0)/tot*100)}%). ${top[2]}`;
}
function defTendHint(ot){
  if(!ot)return '';
  const tot=(ot.run||0)+(ot.pass||0); if(tot<3)return 'Feeling out their tendencies — play it straight.';
  const rr=Math.round((ot.run||0)/tot*100);

      v.append(cr);
    }else{                                                  // normal down — call the play (buttons open the playbook)
      v.append(el('div','meta',`<b>${offTendHint(ctx.defTend)}</b>`));
      v.append(el('div','meta dim',`Your ball, ${ctx.down} &amp; ${ddist} at the ${fpos}. OC likes a <b>${ctx.ocCall.toUpperCase()}</b>.`));

  const mp=matchupPanel(G); if(mp){mp.style.marginTop='12px';v.append(mp);}
  const feed=el('div');feed.id='g-feed';feed.style.cssText='max-height:'+((ctx&&!half)?'26vh':'40vh')+';overflow-y:auto;margin-top:12px';
  G.log.forEach(e=>{const ln=gameEventEl(e);if(ln)feed.append(ln);});

  }else if(half){
    const go=el('button','btn','Start 2nd half →');go.dataset.tid='half-continue';go.onclick=resumeHalf;ctr.append(go);
  }else{

  requestAnimationFrame(()=>{const f=$('#g-feed');if(f)f.scrollTop=f.scrollHeight;});

function finishGame(){
  if(gameTimer){clearTimeout(gameTimer);gameTimer=null;}
  const G=UI.game; if(!G)return; const replay=G.replay, gid=G.gameId, post=G.post, champ=G.champ, interactive=G.interactive, calls=G.decisions, adjusts=G.adjusts; UI.game=null;
  if(replay){ UI.view='season'; render(); return; }
  if(interactive){const g=findAnyGame(gid); if(g){g.calls=(calls||[]).slice(); if(adjusts&&adjusts.length)g.adjusts=adjusts.slice();}}   // bank calls + adjustments → commit reproduces the coached game
  UI.view='home';
  if(champ)advanceChampWeek(); else if(post)advancePostseason(); else advanceWeek();   // commit (re-sims deterministically, with g.calls)
  const g=findAnyGame(gid); render();
  if(g){const gv=gameView(g,controlled().id);toast((gv.cls==='good'?'Won ':'Lost ')+gv.res.slice(2)+(gv.home?' vs ':' @ ')+gv.opp.abbr);}

function installSchemeSheet(t){
  const draft={off:t.offScheme,def:t.defScheme};
  const rebuild=()=>{
    const co=S.coach||{}, body=el('div');
    body.append(el('div','hint','A scheme fits only as well as your players’ instincts do — installing one is a multi-season project you recruit and develop into. Matching your preferred scheme adds a buy-in edge.'));
    const group=(label,list,sideKey,idxFn,pref)=>{
      body.append(el('h2','sec',label));
      const ch=el('div','choice');
      list.forEach(s=>{const fit=rosterSchemeFit(t.roster,sideKey,idxFn(s));
        ch.append(optEl(s,schemeFitLabel(fit)+(pref===s?' · your scheme':''),draft[sideKey==='off'?'off':'def']===s,()=>{draft[sideKey==='off'?'off':'def']=s;rebuild();}));});
      body.append(ch);
    };
    group('Offense',OFF_SCHEMES,'off',offSchemeIdx,co.offScheme);
    group('Defense',DEF_SCHEMES,'def',defSchemeIdx,co.defScheme);
    const apply=el('button','btn','Install schemes');apply.style.marginTop='14px';
    apply.onclick=()=>{
      const was=t.ratings.ovr;
      t.offScheme=draft.off;t.defScheme=draft.def;
      // Phase 51: OVERALL is scheme-weighted, so installing a system genuinely re-rates the roster —
      // the players who fit it play up and the ones who don't play down, visibly, right here.
      reRateRoster(t);recomputeRanks(S.world);
      const d=t.ratings.ovr-was;
      closeSheet();render();
      toast('Schemes installed'+(d?' — team OVR '+(d>0?'+':'')+d:''));
    };
    body.append(apply);
    openSheet('Install schemes',body);
  };
  rebuild();
}
// Phase 21: the weekly scheme matchup preview — your offense vs their defense, your defense vs their
// offense. Reads the same mean-zero SCHEME_EDGE the sim folds in, so the chip matches what happens.
function schemeMatchupHTML(me,opp){
  const oEdge=schemeEdge(me.offScheme,opp.defScheme);   // + = your offense has the edge
  const dEdge=schemeEdge(opp.offScheme,me.defScheme);   // + = their offense has the edge (bad for your D)
  const word=e=>e>=2?'big edge ▲':e>0?'edge ▲':e<=-2?'tough ▼':e<0?'slight ▼':'even';
  const cls=e=>e>0?'good':e<0?'bad':'dim';
  return `<div class="meta" style="margin-top:10px;border-top:1px solid rgba(255,255,255,.08);padding-top:8px">
    <div class="row spread" style="margin:2px 0"><span class="dim">Your ${me.offScheme} vs ${opp.defScheme}</span><span class="${cls(oEdge)}">${word(oEdge)}</span></div>
    <div class="row spread" style="margin:2px 0"><span class="dim">Your ${me.defScheme} vs ${opp.offScheme}</span><span class="${cls(-dEdge)}">${word(-dEdge)}</span></div></div>`;
}

// Curated highlight reel: the season's most notable results, each replayable. Tag + score by
// upset (underdog won), shootout (high total), nailbiter (≤3 / OT), and your signature wins.
function greatestGames(limit){
  const scored=S.schedule.games.filter(g=>g.played).map(g=>{
    const home=teamById(g.home),away=teamById(g.away),homeWon=g.hs>g.as;
    const win=homeWon?home:away,lose=homeWon?away:home;
    const margin=Math.abs(g.hs-g.as),total=g.hs+g.as,upset=lose.ratings.ovr-win.ratings.ovr;
    const iWon=(win.id===S.teamId);
    let tag='',score=0;
    [['Upset',upset>=8?upset*2.0:0],['Shootout',total>=80?(total-60)*0.7:0],
     ['Nailbiter',margin<=3?(8-margin)*2.5:0],['Signature win',iWon&&upset>=4?upset*1.5+12:0]]
      .forEach(([tg,sc])=>{if(sc>score){score=sc;tag=tg;}});
    return {g,win,lose,winScore:Math.max(g.hs,g.as),loseScore:Math.min(g.hs,g.as),tag,score};
  }).filter(x=>x.tag);
  scored.sort((a,b)=>b.score-a.score);
  return scored.slice(0,limit||6);
}

function recruitProspects(v){

  const starSel=el('select');[['','All ★'],['5','5★'],['4','4★ +'],['3','3★ +'],['2','2★ +']].forEach(([val,l])=>{const o=el('option');o.value=val;o.textContent=l;starSel.append(o);});

  const availSel=el('select');availSel.dataset.tid='rec-avail';

  fbar.append(posSel,starSel,stSel,availSel);
  const list=el('div');list.dataset.tid='rec-list';
  const cnt=el('div','hint center');
  const PAGE=80; let shown=PAGE;
  const moreBtn=el('button','btn line','Load more');moreBtn.style.marginTop='10px';
  moreBtn.onclick=()=>{shown+=PAGE;draw();};
  function avail(r){
    const v=availSel.value, mine=r.committedTo===S.teamId;
    if(v==='open')return !r.committedTo;
    if(v==='verbal')return r.committedTo&&!r.signed&&!mine;

    if(posSel.value)arr=arr.filter(r=>r.pos===posSel.value);
    if(starSel.value)arr=arr.filter(r=>r.stars>=+starSel.value);

  }
  const reset=()=>{shown=PAGE;draw();};
  search.oninput=reset;posSel.onchange=reset;starSel.onchange=reset;stSel.onchange=reset;availSel.onchange=reset;

/* ---------- player progression: scouted ceiling + development stage ---------- */
// Ceiling tiers by potential (high → low). index 0 = best. "Superstar" upside lives here.
const CEILINGS=[[95,'Generational'],[89,'Superstar'],[83,'Star'],[77,'Starter'],[70,'Rotational'],[0,'Depth']];
function ceilingIndex(pot){return CEILINGS.findIndex(([m])=>pot>=m);}
function hashStr(s){let h=2166136261;for(let i=0;i<String(s).length;i++){h^=String(s).charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
// Scouting confidence: older/experienced players have a track record; freshmen are projections.
function scoutConfidence(p){if(p.age>=22||/SR/.test(p.yr))return 'high';if(p.age>=20||/JR/.test(p.yr))return 'med';return 'low';}
// Coach-responsive scouting sharpness (Phase 7): an Analyst head coach and a strong coordinator
// room sharpen the roster reads, tightening the ceiling band beyond the base age/class fog.
function scoutSharpen(){
  let s=0;
  if(S&&S.coach&&S.coach.history==='Analyst')s+=2;
  const t=(S&&S.teamId)?controlled():null;
  if(t&&t.staff){const co=t.staff.filter(c=>c.tier==='coord');
    if(co.length){const a=co.reduce((x,c)=>x+c.rating,0)/co.length;if(a>=85)s+=2;else if(a>=78)s+=1;}}
  return s;
}
// Fuzzy ceiling read: a tier (or band) with uncertainty. Exact potential stays hidden; the noise
// is deterministic per player (so it's stable) and now SHRINKS with coaching (scoutSharpen).
function scoutedCeiling(p){
  const conf=scoutConfidence(p), base=conf==='high'?0:conf==='med'?3:7;
  const spread=Math.max(0,base-scoutSharpen());
  const noise=base?(hashStr(p.id)%(2*base+1))-base:0;     // noise tied to the base fog (stable per player)
  const est=clamp(p.pot+noise,40,99);
  const li=ceilingIndex(clamp(est-spread,40,99)), hi=ceilingIndex(clamp(est+spread,40,99));
  const text=li===hi?CEILINGS[hi][1]+(spread?' ?':''):CEILINGS[li][1]+'–'+CEILINGS[hi][1]+' ?';
  return {text, best:hi, hot:hi<=2, uncertain:spread>0};   // hot = upside reaches Star or better
}
// Growth chip: surfaces last offseason's OVR gain on returning players (Phase 7 development).
function growthChip(p){return p.dev>0?` <span class="tag accent" style="font-size:10px">▲ +${p.dev}</span>`:'';}
// Development stage from growth remaining (ov→pot gap). Qualitative; exact gap not shown.
function devStage(p){const gap=p.pot-p.ov;return gap<=2?'Maxed':gap<=7?'Polished':gap<=13?'Developing':'Raw';}
function ceilingChip(p){const sc=scoutedCeiling(p);return `<span class="tag ${sc.hot?'accent':''}" style="font-size:10px">${sc.text}</span>`;}
// ---- Phase 10: fogged temperament reads (UI). The raw trait number is never shown — only a
// banded tier whose width shrinks as you get to KNOW the player (tenure + a sharp coaching eye for
// your roster; scouting confidence for recruits). Hidden as '???' until you know them at all.
const TRAIT_TIERS={
  mot:['Lazy','Inconsistent','Steady','Hard Worker','Relentless'],          // work ethic
  comp:['Volatile','Streaky','Even-Keel','Composed','Ice-Veined'],          // composure / poise
  ego:['Unflappable','Grounded','Tuned-In','Spotlight','Diva']              // ego / media-receptiveness (Phase 20)
};
function traitTier(v){return v>=82?4:v>=64?3:v>=46?2:v>=30?1:0;}
function traitRead(kind,id,value,conf){
  if(conf<34)return {text:'???',revealed:false,hot:false};                  // you don't know them yet
  const spread=Math.round(clamp(36-conf*0.36,0,36));                        // band tightens with confidence
  const noise=spread?(hashStr(id+kind)%(2*spread+1))-spread:0;              // stable per (player,trait)
  const est=clamp(value+noise,0,100);
  const lo=traitTier(clamp(est-spread,0,100)), hi=traitTier(clamp(est+spread,0,100)), L=TRAIT_TIERS[kind];
  return {text:lo===hi?L[hi]+(spread?' ?':''):L[lo]+'–'+L[hi]+' ?', revealed:true, hot:hi>=4&&lo>=3};
}
// How well you know one of YOUR players' makeup: longer in your program + a sharp room sharpen it.
function rosterTraitConf(p){
  const tenure={'FR':18,'RS-FR':30,'SO':46,'RS-SO':54,'JR':66,'RS-JR':72,'SR':85,'RS-SR':90}[p.yr];
  return clamp((tenure!=null?tenure:50)+scoutSharpen()*7,0,100);
}
// Compact fogged trait chips for the roster row / sheet (Motor, Poise, Ego).
function traitChips(p){
  const conf=rosterTraitConf(p);
  const m=traitRead('mot',p.id,motVal(p),conf), c=traitRead('comp',p.id,compVal(p),conf), e=traitRead('ego',p.id,egoVal(p),conf);
  return `<span class="tag ${m.hot?'accent':''}" style="font-size:10px">Motor: ${m.text}</span> `
        +`<span class="tag ${c.hot?'accent':''}" style="font-size:10px">Poise: ${c.text}</span> `
        +`<span class="tag ${e.hot?'accent':''}" style="font-size:10px">Ego: ${e.text}</span>`;
}
// Phase 20: morale shows OPENLY (your locker room, not scouted) — a mood chip, only when it's moved off
// neutral. Absent (AI players / a fresh season) → no chip, so rows stay clean.
function moraleMood(m){return m>=66?'😀':m>=58?'🙂':m>=42?'😐':m>=34?'😕':'😟';}
function moraleChip(p){
  if(p.morale==null)return '';
  const m=p.morale, lbl=m>=60?'buzzing':m>=46?'good':m>=34?'low':'unhappy';
  const acc=m>=60||m<34;
  return ` <span class="tag ${acc?'accent':''}" style="font-size:10px">${moraleMood(m)} ${lbl}</span>`;
}
// ---- Phase 21: a player's preferred SCHEME (innate, per-id), read through the same fog as traits —
// hidden until you know him, "likely X" while you're learning, the name once you've got a read.
function playerSchemeName(p){const side=sideOfPos(p.pos);if(side!=='off'&&side!=='def')return null;return (side==='off'?OFF_SCHEMES:DEF_SCHEMES)[playerSchemeIdx(p)];}
function schemeRead(name,conf){
  if(!name)return {text:'—',revealed:false};
  if(conf<40)return {text:'???',revealed:false};
  if(conf<66)return {text:'likely '+name,revealed:false};
  return {text:name,revealed:true};
}
function schemeFitLabel(f){return f>=0.5?'great fit':f>=0.15?'good fit':f>=-0.05?'neutral':f>=-0.18?'poor fit':'bad fit';}
// Roster-row chip: a player's (fogged) scheme + a ✓/✗ once revealed, vs YOUR current scheme on his side.
function schemeChip(p,t){
  const name=playerSchemeName(p); if(!name)return '';
  const rd=schemeRead(name,rosterTraitConf(p)); let fit='',acc=false;
  if(rd.revealed&&t){const teamS=sideOfPos(p.pos)==='off'?t.offScheme:t.defScheme;acc=name===teamS;fit=acc?' ✓':' ✗';}
  return ` <span class="tag ${acc?'accent':''}" style="font-size:10px">Scheme: ${rd.text}${fit}</span>`;
}
// Player-sheet KV: the fogged scheme + how it sits against your installed scheme (once revealed).
function schemeKV(name,conf,teamScheme){
  if(!name)return '';
  const rd=schemeRead(name,conf);
  const fit=rd.revealed?(name===teamScheme?` · fits your ${teamScheme}`:` · off your ${teamScheme}`):'';
  return `<div class="kv"><span class="k">Scheme</span><span>${rd.text}${fit}</span></div>`;
}
// Recruit ceiling fog: like scoutedCeiling, but the band is driven by YOUR scouting confidence
// (rec.scout 0→100) instead of age/class. Prefs unlock once you've scouted past halfway.
function recScouted(rec){
  const spread=Math.round(clamp(9-rec.scout*0.09,0,9));
  const noise=spread?(hashStr(rec.id)%(2*spread+1))-spread:0;
  const est=clamp(rec.pot+noise,40,99);
  const li=ceilingIndex(clamp(est-spread,40,99)),hi=ceilingIndex(clamp(est+spread,40,99));
  const text=li===hi?CEILINGS[hi][1]+(spread?' ?':''):CEILINGS[li][1]+'–'+CEILINGS[hi][1]+' ?';
  return {text,hot:hi<=2,spread,revealed:rec.scout>=50};
}
// Letter grade for a recruiting class from its national rank (1..134).
function classGrade(rank){return rank<=4?'A+':rank<=12?'A':rank<=25?'A-':rank<=40?'B+':rank<=60?'B':rank<=85?'C+':rank<=110?'C':'D';}
// Season box for a player, grouped by what they actually did (only nonzero categories show).
// Returns {gp, lines:[[label,value]]} or null if the player has logged nothing yet.
function statLines(p){
  const s=p.gs; if(!s) return null;
  const L=[];
  if(s.pAtt) L.push(['Passing', `${s.pCmp||0}/${s.pAtt} · ${s.pYds||0} yds · ${s.pTD||0} TD · ${s.pInt||0} INT`]);
  if(s.rAtt) L.push(['Rushing', `${s.rAtt} car · ${s.rYds||0} yds · ${s.rTD||0} TD`]);
  if(s.rec)  L.push(['Receiving', `${s.rec} rec · ${s.reYds||0} yds · ${s.reTD||0} TD`]);
  if(s.tkl||s.sk||s.dInt){const d=[];if(s.tkl)d.push(s.tkl+' tkl');if(s.sk)d.push(s.sk+' sk');if(s.dInt)d.push(s.dInt+' INT');L.push(['Defense',d.join(' · ')]);}
  if(s.fga||s.xpa){const d=[];if(s.fga)d.push(`${s.fgm||0}/${s.fga} FG`);if(s.xpa)d.push(`${s.xpm||0}/${s.xpa} XP`);L.push(['Kicking',d.join(' · ')]);}
  // Phase 49: his flags. Shown for anyone who's been called for one — it's the stat that makes a
  // low-composure starter a visible, benchable problem instead of an invisible team-wide tax.
  if(s.pen) L.push(['Penalties',`${s.pen} for ${s.penYds||0} yds${(s.gp&&s.pen/s.gp>=1.2)?' ⚠':''}`]);
  // Phase 50: what he did when the game was on the line — conversions and scores under real pressure.
  if(s.cl) L.push(['In the clutch',`${s.cl} play${s.cl===1?'':'s'} in big moments`]);
  return L.length?{gp:s.gp||0,lines:L}:null;
}
// "Stats (this year)" block for the player sheet: preseason → placeholder; in-season → the
// player's box, or "did not play" if a body has logged nothing.
function statBlock(p){
  const preseason=!S.schedule||S.phase==='Preseason';
  const sl=statLines(p);
  if(preseason||!sl) return `<div class="kv"><span class="k">Stats (this year)</span><span class="dim">${preseason?'— preseason —':'— did not play —'}</span></div>`;
  const rows=sl.lines.map(([k,v])=>`<div class="kv"><span class="k">${k}</span><span>${v}</span></div>`).join('');
  return `<div class="kv"><span class="k">Stats (this year)</span><span class="dim">${sl.gp} game${sl.gp===1?'':'s'}</span></div>${rows}`;
}
// Phase 49: a repeat-offender tag on the roster row. Only for a real habit (3+ flags AND ~one a
// game), so it marks the guy who is actually costing you drives rather than anyone unlucky once.
// Phase 51: the attribute readout. These six ARE the player now — `ov` is just their weighted mean
// for the system he plays in — so they get a real block instead of the old inert
// "Speed / Strength / Awareness" line that no formula ever read. Each is shown against the weighting
// his position (and scheme) puts on it, because a 92 Speed means something very different at corner
// than at guard, and that weighting is exactly what decides his OVERALL.
function attrRowsHTML(p,scheme){
  const w=scheme?schemeAttrW(p.pos,scheme):posAttrW(p.pos);
  const keys=posAttrs(p.pos).filter(k=>k!=='adp');   // adaptability is about playing ELSEWHERE (posFit)
  const top=Math.max(...keys.map(k=>w[k]));
  return keys.sort((a,b)=>w[b]-w[a]).map(k=>{
    const v=attrVal(p,k), key=w[k]>=top-0.001, pct=clamp(Math.round((v-40)/59*100),0,100);
    return `<div class="row spread" style="margin:3px 0;gap:8px;align-items:center">
      <span class="meta ${key?'accent':'dim'}" style="min-width:88px;font-weight:${key?700:400}">${ATTR_LABEL[k]}</span>
      <span style="flex:1;height:5px;background:rgba(255,255,255,.10);border-radius:3px;overflow:hidden">
        <span style="display:block;width:${pct}%;height:100%;background:${key?'var(--accent)':'rgba(255,255,255,.34)'}"></span></span>
      <span class="cond" style="min-width:26px;text-align:right;font-weight:700">${v}</span>
      <span class="meta dim" style="min-width:34px;text-align:right">${Math.round(w[k]*100)}%</span></div>`;
  }).join('');
}
function penFlag(p){
  const s=p.gs; if(!s||!s.pen||s.pen<3||!(s.pen/(s.gp||1)>=0.9))return '';
  return ` <span class="tag" style="font-size:9px;background:#6b2020;color:#fff">🚩 ${s.pen} PEN</span>`;
}

// Phase 45c: all-time records this player currently holds (scans the record book by pid).
function recordsHeldBy(pid){
  const R=S.records; if(!R||!pid)return [];
  const out=[];['game','season','career'].forEach(bucket=>{const b=R[bucket]||{};
    for(const key in b){const rec=b[key];if(rec&&rec.pid===pid){const def=(RECORD_DEFS[bucket]||[]).find(d=>d.key===key);
      out.push({label:(def?def.label:key),value:rec.value,unit:def?def.unit:'',scope:bucket});}}});
  return out;}
// Phase 45c: a "Career & legacy" section on the player sheet — who he's becoming, not just his rating:
// career totals (to date), all-time records he holds, and his signature moments.
function playerLegacy(body,p,t){
  const c=careerToDate(p), lines=[];
  if(c.pYds)lines.push(c.pYds+' career pass yds'+(c.pTD?', '+c.pTD+' TD':''));
  if(c.rYds)lines.push(c.rYds+' career rush yds'+(c.rTD?', '+c.rTD+' TD':''));
  if(c.reYds)lines.push((c.rec||0)+' rec, '+c.reYds+' career yds'+(c.reTD?', '+c.reTD+' TD':''));
  if(c.tkl)lines.push(c.tkl+' career tackles');
  if(c.sk)lines.push(c.sk+' career sacks');
  if(c.dInt)lines.push(c.dInt+' career INTs');
  const held=recordsHeldBy(p.id), moments=(p.moments||[]);
  if(!lines.length&&!held.length&&!moments.length)return;   // a young player with no story yet
  const card=el('div','card');card.style.marginTop='10px';card.dataset.tid='player-legacy';
  let html='<div class="meta dim" style="margin-bottom:4px">Career & legacy</div>';
  if(lines.length)html+=lines.map(x=>'<div class="meta">'+x+'</div>').join('');
  if(held.length)html+='<div style="margin-top:6px">'+held.map(h=>`<div class="meta accent">🏆 All-time ${h.scope} record — ${h.label} (${h.value}${h.unit?' '+h.unit:''})</div>`).join('')+'</div>';
  if(moments.length)html+='<div style="margin-top:6px">'+moments.slice().reverse().map(m=>'<div class="meta">⭐ '+m+'</div>').join('')+'</div>';
  card.innerHTML=html;body.append(card);
}

  playerLegacy(body,p,t);   // Phase 45c: career totals · records held · signature moments

  starter.onclick=()=>{makeStarter(p,t);closeSheet();render();toast(p.ln+' moved to starter');};
  const capb=el('button','btn sm '+(p.cap?'danger':'ghost'),p.cap?'Remove captain':'Make captain');
  capb.onclick=()=>{p.cap=!p.cap;autosave();closeSheet();render();toast(p.cap?'Captain named':'Captain removed');};
  r1.append(starter,capb);

  r2.append(up,dn);

  if(t.id===S.teamId){

      note.style.cssText='font-size:12px;margin-top:9px';

      body.append(note,rsb);
    } else if(target&&played>4){

function makeStarter(p,t){
  const grp=t.roster.filter(x=>x.pos===p.pos).sort((a,b)=>a.so-b.so);
  grp.splice(grp.indexOf(p),1);grp.unshift(p);grp.forEach((x,i)=>x.so=i);autosave();
}
function swapDepth(p,t,dir){
  const grp=t.roster.filter(x=>x.pos===p.pos).sort((a,b)=>a.so-b.so);
  const i=grp.indexOf(p),j=i+dir;if(j<0||j>=grp.length)return;
  [grp[i].so,grp[j].so]=[grp[j].so,grp[i].so];autosave();
}
function editPlayerSheet(p,t){
  const body=el('div');

  body.append(fld('First',inputEl(p.fn,x=>f.fn=x)),fld('Last',inputEl(p.ln,x=>f.ln=x)),
    fld('Class',selectEl(CLASSES,p.yr,x=>f.yr=x)),
    fld('Overall (40-99)',inputEl(p.ov,x=>f.ov=x,'','number')),
    fld('Potential',inputEl(p.pot,x=>f.pot=x,'','number')));
  const save=el('button','btn','Save player');
  save.onclick=()=>{p.fn=f.fn??p.fn;p.ln=f.ln??p.ln;p.yr=f.yr??p.yr;
    if(f.ov)p.ov=clamp(+f.ov,40,99);if(f.pot)p.pot=clamp(+f.pot,p.ov,99);
    t.ratings=teamRatings(t.roster,t.staff);recomputeRanks(S.world);autosave();closeSheet();render();toast('Player updated');};
  body.append(save);
  openSheet('Edit '+p.ln,body);
}

    const fire=el('button','btn danger','Fire · buyout '+money(bo));fire.style.marginTop='9px';fire.dataset.tid='fire-coach';
    fire.onclick=()=>confirmSheet('Fire '+c.name+'?',
      (c.tier==='coord'?'Opens a coordinator vacancy you must refill before kickoff. ':'You lose this group’s boost. ')+'Buyout: '+money(bo)+'.',
      ()=>{if(fireCoach(t,c)){render();toast(c.name+' let go');}else render();});
    body.append(fire);
  }else{
    const hint=el('div','hint');hint.style.marginTop='12px';hint.textContent='Fire/replace in the preseason or offseason.';body.append(hint);
  }
  openSheet(c.name,body);
}
// The free-agent coach market. If `slotRole` is given, pre-filter to candidates for that slot.
function carouselSheet(t,slotRole){
  ensureCoachMarket();
  const body=el('div');body.dataset.tid='carousel-sheet';
  body.append(el('div','hint','Free agents on the market. Hiring pays a signing fee from your budget and adds salary to payroll.'));
  body.append(el('div','card',`<div class="kv"><span class="k">Budget</span><span class="cond ${t.budget<0?'bad':''}" style="font-size:16px">${money(t.budget)}</span></div>
    <div class="kv"><span class="k">Payroll</span><span class="cond" style="font-size:16px">${money(t.payroll)}</span></div>`));
  // filter chips
  let filter=slotRole?(COORD_ROLES.find(c=>c[0]===slotRole)?'coord':'pos'):'all';
  const listWrap=el('div');
  function draw(){
    listWrap.innerHTML='';
    let cands=[...S.coachMarket];
    if(slotRole){
      const isCoord=!!COORD_ROLES.find(c=>c[0]===slotRole);
      cands=cands.filter(c=>isCoord?(c.tier==='coord'):(c.role===slotRole));
    }else if(filter!=='all')cands=cands.filter(c=>filter==='coord'?c.tier==='coord':c.tier==='pos');
    cands.sort((a,b)=>b.rating-a.rating);
    if(!cands.length){listWrap.append(el('div','empty','No matching free agents right now.'));return;}
    cands.slice(0,40).forEach(c=>{
      const fee=hireCost(c);
      const alum=c.fromLegend&&c.legendOf===t.id;   // Phase 11: a returning program legend
      const row=el('button','lrow');row.style.width='100%';row.style.textAlign='left';row.dataset.id=c.id;
      row.innerHTML=`<div class="ovr ${c.rating>=80?'elite':''}">${c.rating}</div>
        <div style="flex:1"><div class="nm">${c.name} ${alum?'<span class="cap">ALUM</span>':''}</div>
        <div class="meta">${c.title} · ${money(c.salary)}/yr · +${c.boost} boost</div></div>
        <div class="tag accent" style="flex:none">Hire ${money(fee)}</div>`;
      row.onclick=()=>{
        const role=c.tier==='coord'?(slotRole&&COORD_ROLES.find(x=>x[0]===slotRole)?slotRole:c.role):c.role;
        if(hireCoach(t,c,role)){closeSheet();render();toast('Hired '+c.name);}
      };
      listWrap.append(row);
    });
  }
  if(!slotRole){
    const tabs=el('div','tabs');tabs.style.marginBottom='10px';
    [['all','All'],['coord','Coordinators'],['pos','Position']].forEach(([k,l])=>{
      const b=el('button',filter===k?'on':'',l);b.onclick=()=>{filter=k;[...tabs.children].forEach(x=>x.classList.remove('on'));b.classList.add('on');draw();};
      tabs.append(b);
    });
    body.append(tabs);
  }
  body.append(listWrap);draw();
  openSheet(slotRole?('Hire — '+(COORD_ROLES.find(c=>c[0]===slotRole)||POS_COACHES.find(c=>c[0]===slotRole)||['',''])[1]):'Coaching Carousel',body);
}

/* ============================================================
   TEAM BROWSER (ratings + facilities for every team)
   ============================================================ */
function renderBrowse(app,picking){
  applyAccent(picking?null:controlled());
  const v=el('div','view');
  const back=picking?()=>{ if(UI._editMode){UI._editMode=false;UI.view='newgame';} else {UI.view='newgame';} render();}
                    :null;
  if(picking)v.append(headerBar(UI._editMode?'Edit Rosters':'Every Program','Ratings & facilities',back));
  else{const t=controlled();v.append(scoreboard(t));v.append(el('h2','sec','Every Program'));}
  const world=picking?UI.newgame.world:S.world;
  v.append(buildTeamList(world.teams,t=>{
    if(UI._editMode){openTeamEditor(t);}
    else if(picking){UI.newgame.teamId=t.id;finishNewGame(UI.newgame);}
    else teamInfoSheet(t);
  },'browse'));
  app.append(v);
}
function buildTeamList(teams,onTap,mode){
  const wrap=el('div');
  const search=el('input','search');search.placeholder='Search teams…';search.style.marginBottom='11px';
  const list=el('div');
  const sortSel=el('select');sortSel.style.marginBottom='11px';
  [['ovr','Sort: Overall'],['name','Sort: A–Z'],['conf','Sort: Conference'],['prestige','Sort: Prestige']]
    .forEach(([v2,l])=>{const o=el('option');o.value=v2;o.textContent=l;sortSel.append(o);});
  function draw(){
    list.innerHTML='';
    let arr=[...teams];
    const q=search.value.toLowerCase().trim();
    if(q)arr=arr.filter(t=>(t.name+' '+t.nick+' '+t.conf).toLowerCase().includes(q));
    const s=sortSel.value;
    arr.sort((a,b)=> s==='name'?a.name.localeCompare(b.name):
      s==='conf'?(a.conf.localeCompare(b.conf)||b.ratings.ovr-a.ratings.ovr):
      s==='prestige'?b.prestige-a.prestige:b.ratings.ovr-a.ratings.ovr);
    arr.slice(0,200).forEach(t=>{
      const row=el('button','team-pick');row.style.width='100%';row.style.textAlign='left';row.dataset.id=t.id;
      row.innerHTML=`<span class="dot" style="background:${t.color}"></span>
        <div style="flex:1"><div class="nm">${t.name} <span class="dim" style="font-weight:400">${t.nick}</span></div>
        <div class="meta">${t.conf}${t.div?' · '+t.div:''} · #${t.natRank} nat'l · Prestige ${t.prestige}</div></div>
        <div class="ovr ${t.ratings.ovr>=85?'elite':''}">${t.ratings.ovr}</div>`;
      row.onclick=()=>onTap(t);
      list.append(row);
    });
    if(!arr.length)list.append(el('div','empty','No teams match that search.'));
  }
  search.oninput=draw;sortSel.onchange=draw;draw();
  wrap.append(search,sortSel,list);return wrap;
}
function teamInfoSheet(t){
  const body=el('div');
  body.innerHTML=`<div class="row spread" style="margin-bottom:10px">
    <span class="tag" style="background:${t.color};color:${textOn(t.color)}">${t.conf}${t.div?' · '+t.div:''}</span>
    <span class="meta">#${t.natRank} nationally · #${t.confRank} in conf</span></div>`;
  const r=el('div','ranks');
  r.append(rankPill(t.ratings.ovr,'Overall'),rankPill(t.ratings.off,'Offense'),rankPill(t.ratings.def,'Defense'));
  body.append(r,el('h2','sec','Facilities'));
  const fc=el('div','card');
  [['Stadium','stadium'],['Strength','strength'],['Training','training'],['Academics','academics'],['NIL','nil'],['Scouting','scouting']]
    .forEach(([l,k])=>fc.append(facBar(l,t.fac[k])));
  body.append(fc);
  openSheet(t.name+' '+t.nick,body);
}
function openTeamEditor(t){
  const body=el('div');const f={};
  body.append(el('div','hint','Quick edits. Use roster import for bulk player changes.'),el('hr','div'));
  body.append(fld('Prestige (20-98)',inputEl(t.prestige,x=>f.pr=x,'','number')),
    fld('Stadium (1-10)',inputEl(t.fac.stadium,x=>f.st=x,'','number')),
    fld('Strength (1-10)',inputEl(t.fac.strength,x=>f.str=x,'','number')),
    fld('NIL (1-10)',inputEl(t.fac.nil,x=>f.nil=x,'','number')));
  const save=el('button','btn','Save changes');
  save.onclick=()=>{if(f.pr)t.prestige=clamp(+f.pr,20,98);if(f.st)t.fac.stadium=clamp(+f.st,1,10);
    if(f.str)t.fac.strength=clamp(+f.str,1,10);if(f.nil)t.fac.nil=clamp(+f.nil,1,10);
    closeSheet();render();toast(t.abbr+' updated');};
  body.append(save);
  openSheet('Edit '+t.name,body);
}

/* ============================================================
   bottom nav
   ============================================================ */
function renderNav(app){
  if(!['home','team','recruit','portal','media','records','season','browse','program'].includes(UI.view))return;
  const nav=el('div','nav');
  const items=[
    ['home','Home','M3 11l9-8 9 8M5 10v10h14V10'],
    ['team','Team','M16 7a4 4 0 11-8 0 4 4 0 018 0zM4 21v-1a6 6 0 0112 0v1'],
    ['recruit','Recruit','M13 7a3 3 0 11-6 0 3 3 0 016 0zM4 20v-1a6 6 0 0112 0v1M18 9v6M15 12h6'],
    ['season','Season','M4 6h16v14H4zM4 10h16M8 3v4M16 3v4'],
    ['browse','League','M4 6h16M4 12h16M4 18h16'],
    ['menu','Menu','M4 6h16M4 12h16M4 18h16']];
  items.forEach(([v,l,d])=>{
    const b=el('button',(UI.view===v||(v==='menu'&&false))?'on':'');b.dataset.tid='nav-'+v;
    b.innerHTML=`<svg viewBox="0 0 24 24"><path d="${d}" stroke-linecap="round" stroke-linejoin="round"/></svg><span>${l}</span>`;
    b.onclick=()=>{
      if(v==='menu')return menuSheet();
      UI.view=v;if(v==='team')UI.tab=UI.tab||'roster';render();
    };
    nav.append(b);
  });
  app.append(nav);
}
function menuSheet(){
  const body=el('div');
  const save=el('button','btn','Save game');
  save.onclick=()=>{const slot=findSlotFor(S);if(slot){writeSlot(slot,S);toast('Saved to slot '+slot);}else chooseSlotSheet();closeSheet();};
  const saveAs=el('button','btn ghost','Save to a slot…');saveAs.style.marginTop='9px';
  saveAs.onclick=()=>{closeSheet();chooseSlotSheet();};
  const cloud=el('button','btn ghost','Cloud saves'+cloudStatusSuffix());
  cloud.style.marginTop='9px';cloud.dataset.tid='menu-cloud';
  cloud.onclick=()=>{closeSheet();UI.cloudBack='home';UI.view='cloud';render();};
  const quit=el('button','btn line','Quit to main menu');quit.style.marginTop='9px';
  quit.onclick=()=>{closeSheet();cloudFlush();confirmSheet('Quit to menu?','Unsaved progress is lost.',()=>{S=null;UI.view='menu';render();});};
  body.append(save,saveAs,cloud,quit);
  openSheet('Menu',body);
}
function findSlotFor(state){for(const n of SLOTS){const s=readSlot(n);if(s&&s.state&&s.state.createdAt===state.createdAt)return n;}return null;}
function autosave(){const n=findSlotFor(S);if(n)writeSlot(n,S);}

/* ============================================================
   shared UI bits
   ============================================================ */
function headerBar(title,sub,back){
  const c=el('div','topbar');c.style.paddingLeft='0';c.style.paddingRight='0';
  if(back){const b=el('button');b.style.cssText='width:38px;height:38px;border-radius:9px;background:var(--panel2);border:1px solid var(--line);font-size:20px;flex:none';b.innerHTML='&#8249;';b.onclick=back;c.append(b);}
  c.append(el('div',null,`<h1>${title}</h1>${sub?'<div class="sub">'+sub+'</div>':''}`));
  return c;
}
function stat(k,v){return el('div','stat',`<div class="k">${k}</div><div class="v">${v}</div>`);}
function rankPill(n,l){return el('div','rankpill',`<div class="n">${n}</div><div class="l">${l}</div>`);}
function facBar(label,val){
  const d=el('div');d.style.marginBottom='11px';
  d.innerHTML=`<div class="row spread"><span style="font-size:13px">${label}</span><span class="cond" style="font-weight:700">${val}/10</span></div>
    <div class="bar"><i style="width:${val*10}%"></i></div>`;
  return d;
}
function fld(label,node){const l=el('label','fld');l.append(el('span',null,label),node);return l;}
function inputEl(val,on,ph,type){const i=el('input');i.type=type||'text';if(ph)i.placeholder=ph;i.value=val==null?'':val;i.oninput=()=>on(i.value);return i;}
function selectEl(opts,val,on){const s=el('select');opts.forEach(o=>{const op=el('option');op.value=o;op.textContent=o;if(o===val)op.selected=true;s.append(op);});s.onchange=()=>on(s.value);return s;}
function optEl(t,d,on,cb){const b=el('button','opt'+(on?' on':''));b.innerHTML=`<div class="t">${t}</div><div class="d">${d}</div>`;b.onclick=cb;return b;}
function posName(c){return {QB:'Quarterback',RB:'Running Back',WR:'Wide Receiver',TE:'Tight End',OT:'Offensive Tackle',OG:'Offensive Guard',C:'Center',DE:'Defensive End',DT:'Defensive Tackle',LB:'Linebacker',CB:'Cornerback',S:'Safety',K:'Kicker',P:'Punter'}[c]||c;}
function timeAgo(ts){const s=(Date.now()-ts)/1000;if(s<60)return'just now';if(s<3600)return Math.floor(s/60)+'m ago';if(s<86400)return Math.floor(s/3600)+'h ago';return Math.floor(s/86400)+'d ago';}

/* sheets */
function openSheet(title,bodyNode){
  const bg=el('div','sheet-bg');const sh=el('div','sheet');bg.dataset.tid='sheet-bg';sh.dataset.tid='sheet';
  sh.append(el('div','grab'),el('h3',null,title),bodyNode);
  bg.append(sh);bg.onclick=e=>{if(e.target===bg)closeSheet();};
  $('#sheet').innerHTML='';$('#sheet').append(bg);
}
function closeSheet(){$('#sheet').innerHTML='';}
function confirmSheet(title,sub,onYes){
  const body=el('div');body.append(el('div','hint',sub));
  const yes=el('button','btn danger','Yes, continue');yes.style.marginTop='14px';
  yes.onclick=()=>{closeSheet();onYes();};
  const no=el('button','btn line','Cancel');no.style.marginTop='9px';no.onclick=closeSheet;
  body.append(yes,no);openSheet(title,body);
}

/* ---------- boot ---------- */
render();
/* Phase 47: cloud sync is opt-in and never blocks boot. Flush a queued push when the tab
   goes away (the 5s debounce is the only exposure), retry when the network comes back, and
   warm the career list once so the Load screen can badge slots the moment it opens. */
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')cloudFlush();});
window.addEventListener('online',()=>{if(CLOUD_STATUS.state==='offline'||CLOUD_STATUS.state==='error')cloudFlush();});
if(cloudLinked())cloudRefresh().then(()=>{if(UI.view==='load'||UI.view==='cloud')render();});
