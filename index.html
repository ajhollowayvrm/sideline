<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0d0f12">
<title>Sideline — CFB Coach Sim</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0d0f12; --panel:#15181d; --panel2:#1c2026; --line:#2a2f37;
  --ink:#e9ecf1; --ink2:#aab3c0; --ink3:#6b7480;
  --accent:#c9a227; --accent-ink:#0d0f12;
  --good:#3ea66b; --warn:#d8a24a; --bad:#d35450;
  --r:12px;
  --safe-b: env(safe-area-inset-bottom, 0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  background:var(--bg); color:var(--ink);
  font-family:'Inter',system-ui,-apple-system,sans-serif;
  font-size:15px; line-height:1.45;
  overscroll-behavior-y:none;
}
.cond{font-family:'Saira Condensed','Inter',sans-serif;letter-spacing:.01em}
button{font-family:inherit;color:inherit;cursor:pointer;border:none;background:none}
input,select{font-family:inherit;font-size:16px;color:var(--ink);background:var(--panel2);
  border:1px solid var(--line);border-radius:10px;padding:11px 12px;width:100%}
input:focus,select:focus{outline:2px solid var(--accent);outline-offset:1px}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--ink2) 50%),linear-gradient(135deg,var(--ink2) 50%,transparent 50%);
  background-position:calc(100% - 18px) 19px,calc(100% - 13px) 19px;background-size:5px 5px;background-repeat:no-repeat;padding-right:34px}
label.fld{display:block;margin-bottom:14px}
label.fld>span{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--ink3);margin-bottom:5px;font-weight:600}

#app{max-width:560px;margin:0 auto;min-height:100%;padding-bottom:calc(76px + var(--safe-b))}
.view{padding:18px 16px 8px}
.noscroll{padding-bottom:0}

/* header / scoreboard */
.topbar{position:sticky;top:0;z-index:20;background:linear-gradient(180deg,var(--bg) 70%,transparent);
  padding:12px 16px 10px;display:flex;align-items:center;gap:12px}
.crest{width:42px;height:42px;border-radius:10px;display:grid;place-items:center;
  font-family:'Saira Condensed';font-weight:800;font-size:18px;color:#fff;
  background:var(--accent);box-shadow:inset 0 0 0 1px rgba(255,255,255,.18)}
.topbar h1{font-family:'Saira Condensed';font-weight:700;font-size:21px;line-height:1;letter-spacing:.01em}
.topbar .sub{font-size:11.5px;color:var(--ink2);margin-top:2px}

h2.sec{font-family:'Saira Condensed';font-weight:700;font-size:13px;text-transform:uppercase;
  letter-spacing:.13em;color:var(--ink3);margin:22px 2px 9px}
h2.sec:first-child{margin-top:6px}

.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.card+.card{margin-top:10px}
.row{display:flex;align-items:center;gap:12px}
.spread{justify-content:space-between}
.muted{color:var(--ink2)}
.dim{color:var(--ink3)}
.big-num{font-family:'Saira Condensed';font-weight:800;font-size:30px;line-height:1}
.tag{display:inline-block;font-family:'Saira Condensed';font-weight:700;font-size:11px;letter-spacing:.06em;
  text-transform:uppercase;padding:3px 8px;border-radius:6px;background:var(--panel2);color:var(--ink2);border:1px solid var(--line)}
.tag.accent{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.tag.good{color:var(--good);border-color:color-mix(in srgb,var(--good) 40%,transparent)}
.tag.bad{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,transparent)}

.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;
  padding:14px;border-radius:11px;font-family:'Saira Condensed';font-weight:700;font-size:16px;
  letter-spacing:.04em;text-transform:uppercase;background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:var(--panel2);color:var(--ink);border:1px solid var(--line)}
.btn.line{background:transparent;border:1px solid var(--line);color:var(--ink2)}
.btn.danger{background:transparent;border:1px solid color-mix(in srgb,var(--bad) 50%,transparent);color:var(--bad)}
.btn.sm{padding:9px 12px;font-size:13px;width:auto}
.btn:disabled{opacity:.4}
.btn-row{display:flex;gap:9px;margin-top:10px}

.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px 13px}
.stat .k{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink3);font-weight:600}
.stat .v{font-family:'Saira Condensed';font-weight:800;font-size:23px;margin-top:3px}

/* rank pills */
.ranks{display:flex;gap:8px}
.rankpill{flex:1;text-align:center;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:11px 6px}
.rankpill .n{font-family:'Saira Condensed';font-weight:800;font-size:26px;line-height:1}
.rankpill .l{font-size:10px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink3);margin-top:4px;font-weight:600}

/* list rows */
.lrow{display:flex;align-items:center;gap:11px;padding:11px 13px;background:var(--panel);
  border:1px solid var(--line);border-radius:var(--r)}
.lrow+.lrow{margin-top:7px}
.ovr{font-family:'Saira Condensed';font-weight:800;font-size:19px;width:34px;text-align:center;
  border-radius:8px;padding:3px 0;background:var(--panel2)}
.ovr.elite{color:var(--accent)}
.pos{font-family:'Saira Condensed';font-weight:700;font-size:12px;color:var(--ink3);width:30px}
.nm{font-weight:600;font-size:14.5px}
.meta{font-size:11.5px;color:var(--ink3)}
.cap{color:var(--accent);font-weight:700;font-size:11px}

/* tabs */
.tabs{display:flex;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:4px;margin-bottom:14px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:1 0 auto;white-space:nowrap;padding:9px;border-radius:9px;font-family:'Saira Condensed';font-weight:700;
  font-size:14px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink3)}
.tabs button.on{background:var(--accent);color:var(--accent-ink)}

/* bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(13,15,18,.92);
  backdrop-filter:blur(12px);border-top:1px solid var(--line);
  padding:8px 0 calc(8px + var(--safe-b));display:flex;max-width:560px;margin:0 auto}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--ink3);font-size:10px;font-weight:600;letter-spacing:.04em}
.nav button.on{color:var(--accent)}
.nav svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9}

/* menu hero */
.hero{min-height:100svh;display:flex;flex-direction:column;justify-content:center;padding:24px 22px calc(40px + var(--safe-b))}
.hero .kick{font-family:'Saira Condensed';font-weight:600;font-size:13px;letter-spacing:.32em;text-transform:uppercase;color:var(--accent)}
.hero h1{font-family:'Saira Condensed';font-weight:800;font-size:62px;line-height:.92;margin:8px 0 4px;letter-spacing:.005em}
.hero .by{color:var(--ink3);font-size:13px;margin-bottom:38px}
.hero .btn{margin-top:11px}

.steps{display:flex;gap:6px;margin-bottom:18px}
.steps span{flex:1;height:3px;border-radius:3px;background:var(--line)}
.steps span.on{background:var(--accent)}

.choice{display:flex;flex-direction:column;gap:8px}
.opt{text-align:left;padding:13px 14px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r)}
.opt.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.opt .t{font-family:'Saira Condensed';font-weight:700;font-size:16px}
.opt .d{font-size:12.5px;color:var(--ink2);margin-top:3px}

.team-pick{display:flex;align-items:center;gap:11px;padding:11px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r)}
.team-pick.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.dot{width:14px;height:14px;border-radius:4px;flex:none}

.search{margin-bottom:11px}
.fac{display:flex;gap:5px;margin-top:8px;flex-wrap:wrap}
.fac .f{font-size:10.5px;color:var(--ink2);background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:3px 7px}
.bar{height:6px;border-radius:6px;background:var(--panel2);overflow:hidden;margin-top:7px}
.bar i{display:block;height:100%;background:var(--accent)}

.toast{position:fixed;left:50%;bottom:calc(86px + var(--safe-b));transform:translateX(-50%);
  background:var(--ink);color:var(--bg);font-weight:600;font-size:13px;padding:10px 16px;border-radius:99px;
  z-index:50;opacity:0;transition:opacity .2s, transform .2s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(-4px)}

.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:560px;background:var(--panel);border-top-left-radius:18px;border-top-right-radius:18px;
  border:1px solid var(--line);padding:18px 16px calc(18px + var(--safe-b));max-height:88vh;overflow:auto}
.sheet h3{font-family:'Saira Condensed';font-weight:700;font-size:20px;margin-bottom:4px}
.grab{width:38px;height:4px;border-radius:4px;background:var(--line);margin:0 auto 14px}
.kv{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.kv:last-child{border-bottom:none}
.kv .k{color:var(--ink2)}
hr.div{border:none;border-top:1px solid var(--line);margin:14px 0}
.hint{font-size:12px;color:var(--ink3);line-height:1.5}
.center{text-align:center}
.empty{text-align:center;color:var(--ink3);padding:40px 20px;font-size:14px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

// === TRAIT ENGINE (Phase 10) START ===
// Per-player temperament. Two fogged traits that mesh with coach identity, designed to be
// MEAN-NEUTRAL so they add texture without skewing the validated dev/sim envelopes. Pure:
// depends only on rng/ri/clamp. Values are 0..100, centered ~50 (average); absent reads as 50.
//   mot  (Motor / work ethic) → biases OFFSEASON DEVELOPMENT   via motorMult()
//   comp (Composure)          → biases IN-GAME yardage variance via compExp()/compDraw() + clutch
// The UI never shows the raw number — it renders a fogged band (see traitBand, Phase 10 UI).
const TRAIT_DEF=50;                                       // an absent trait reads as league-average
// A fresh pair, gently bell-shaped (mean of two rolls) so most players are average and the tails
// — true grinders / head-cases, ice-veined / streaky — stay rare. Deterministic from `r`.
function genTraits(r){const bell=()=>clamp(Math.round((ri(r,0,100)+ri(r,0,100))/2),0,100);return {mot:bell(),comp:bell()};}
function motVal(p){return (p&&p.mot!=null)?p.mot:TRAIT_DEF;}
function compVal(p){return (p&&p.comp!=null)?p.comp:TRAIT_DEF;}
// Motor → offseason development multiplier (~0.85..1.15, average 1.0). A grinder squeezes more
// ov→pot out of every offseason; a coaster leaves growth on the table. Folded into devRateFor.
function motorMult(p){return clamp(1+(motVal(p)-50)/333,0.85,1.15);}
// Composure → a mean-PRESERVING reshape exponent for per-play yardage draws. The reshape is
// symmetric about 0.5, so E[draw] is unchanged — only the SPREAD moves. comp>50 pulls draws to
// their middle (consistent); comp<50 pushes them to the extremes (boom/bust). At comp==50 the
// exponent is 1 and compReshape is the identity, so a trait-less player is byte-identical to the
// pre-Phase-10 sim (keeps simlab envelopes + determinism intact).
function compExp(p){return clamp(1+(compVal(p)-50)/100,0.5,1.5);}     // comp0→0.5 streaky … comp100→1.5 steady
function compReshape(x,g){const d=2*x-1;return 0.5+0.5*(d<0?-1:1)*Math.pow(Math.abs(d),g);}
function compDraw(r,p){return compReshape(r(),compExp(p));}           // one rng draw, reshaped by comp
// Clutch: a tiny rating nudge applied to the OFFENSE's key man only when the game is "late &
// close". High composure tightens up, low composure wobbles. Small by design (±~1.6 pts) so it
// sways tight games without moving the season-long favorite/home win envelopes.
function compClutch(p){return (compVal(p)-50)/31;}                    // ≈ -1.6 .. +1.6 rating pts
// === TRAIT ENGINE (Phase 10) END ===

/* ---------- world generation ---------- */
function genPlayer(r,prestige,posCode){
  const cls=pick(r,CLASSES);
  const ageBase={"FR":18,"RS-FR":19,"SO":19,"RS-SO":20,"JR":20,"RS-JR":21,"SR":21,"RS-SR":22}[cls];
  const seniorPush=cls.includes("SR")?6:cls.includes("JR")?3:cls.includes("SO")?1:-1;
  const base=prestige*0.55 + ri(r,-9,9) + seniorPush + 30;
  const ov=clamp(Math.round(base),48,99);
  const pot=clamp(ov+ri(r,-3,16),ov,99);
  const stars=ov>=90?5:ov>=82?4:ov>=72?3:ov>=62?2:1;
  const tr=genTraits(r);
  return {id:'p'+Math.floor(r()*1e9).toString(36),
    fn:pick(r,FN),ln:pick(r,LN),pos:posCode,yr:cls,age:ageBase+ri(r,0,1),
    st:pick(r,STATES),stars,ov,pot,cap:false,
    spd:clamp(ov+ri(r,-12,12),40,99),str:clamp(ov+ri(r,-12,12),40,99),awr:clamp(ov+ri(r,-14,10),40,99),
    mot:tr.mot,comp:tr.comp};
}
function genRoster(r,prestige){
  const out=[];
  POS.forEach(([code,,n])=>{for(let i=0;i<n;i++)out.push(genPlayer(r,prestige,code));});
  // depth order: sort each position by OVR, mark order; one captain overall (best non-K/P)
  const byPos={};out.forEach(p=>{(byPos[p.pos]=byPos[p.pos]||[]).push(p);});
  Object.values(byPos).forEach(arr=>{
    arr.sort((a,b)=>b.ov-a.ov);
    arr.forEach((p,i)=>{
      // realistic depth taper: past the two-deep, backups & walk-ons fall off steeply.
      // Starters (so 0-1) are untouched, so team ratings (top-11/side) are unaffected.
      if(i>=2){
        const pen=Math.min(2+(i-2)*2.6,26);
        p.ov=clamp(Math.round(p.ov-pen),44,99);
        p.pot=clamp(Math.round(p.pot-pen*0.4),p.ov,99);
        p.stars=p.ov>=90?5:p.ov>=82?4:p.ov>=72?3:p.ov>=62?2:1;
      }
      p.so=i;
    });
  });
  const field=out.filter(p=>p.pos!=='K'&&p.pos!=='P').sort((a,b)=>b.ov-a.ov);
  if(field[0])field[0].cap=true; if(field[1])field[1].cap=true;
  return out;
}
// Per-position OVR boost the staff confers (coordinators buff a whole side; position
// coaches buff their group). Returns { posCode: points }.
function staffBoosts(staff){
  const m={};
  (staff||[]).forEach(c=>{if(!c.boost||!c.groups)return;c.groups.forEach(code=>{m[code]=(m[code]||0)+c.boost;});});
  return m;
}
function teamRatings(roster,staff){
  const boost=staffBoosts(staff);
  const eff=p=>clamp(p.ov+(boost[p.pos]||0),40,99);
  const grp=s=>roster.filter(p=>POS.find(x=>x[0]===p.pos)[1]===s);
  const avgTop=(arr,k)=>{const s=[...arr].sort((a,b)=>eff(b)-eff(a)).slice(0,k);return s.length?Math.round(s.reduce((t,p)=>t+eff(p),0)/s.length):60;};
  const off=avgTop(grp('off'),11), def=avgTop(grp('def'),11);
  return {off,def,ovr:Math.round((off+def)/2)};
}
// boost = small, derived from rating. Coordinators 0..2 (side-wide); position coaches 0..3.
function coachBoost(tier,rating){return tier==='coord'?clamp(Math.round((rating-55)/20),0,2):clamp(Math.round((rating-50)/15),0,3);}
function genStaff(r,prestige){
  const mk=(code,title,tier,scope,groups,mult)=>{
    const rt=clamp(Math.round(prestige*0.5+ri(r,-8,12)+35),45,95);
    const sal=Math.round((prestige*9000 + rt*7000 + ri(r,-40,40)*1000) * mult);
    return {role:code,title,name:pick(r,FN)+' '+pick(r,LN),rating:rt,salary:Math.max(90000,sal),
      years:ri(r,1,4),tier,scope,groups,boost:coachBoost(tier,rt)};
  };
  const out=[];
  COORD_ROLES.forEach(([code,title,side])=>{
    const groups=POS.filter(p=>p[1]===side).map(p=>p[0]);
    const scope={off:'OFF',def:'DEF',st:'ST'}[side];
    out.push(mk(code,title,'coord',scope,groups,code==='STC'?1.3:2.4));
  });
  POS_COACHES.forEach(([code,title,scope,groups])=>out.push(mk(code,title,'pos',scope,groups,1)));
  return out;
}
// Backfill structural fields on staff loaded from an older save (v1 had no tier/groups/boost).
function normalizeStaff(staff){
  if(!Array.isArray(staff))return staff;
  staff.forEach(c=>{
    if(c.tier)return;
    const co=COORD_ROLES.find(x=>x[0]===c.role);
    if(co){c.tier='coord';c.scope={off:'OFF',def:'DEF',st:'ST'}[co[2]];c.groups=POS.filter(p=>p[1]===co[2]).map(p=>p[0]);}
    else{const pc=POS_COACHES.find(x=>x[0]===c.role)||['','','',[]];c.tier='pos';c.scope=pc[2]||c.role;c.groups=pc[3]||[];}
    c.boost=coachBoost(c.tier,c.rating);
  });
  return staff;
}
function genWorld(seed){
  const r=rng(seed);
  const teams=TEAMS.map(([name,nick,abbr,conf,div,color])=>{
    const prestige=clamp(Math.round((CONF_BASE[conf]||45)+(BUMP[name]||0)+ri(r,-7,7)),20,98);
    const roster=genRoster(r,prestige);
    const staff=genStaff(r,prestige);
    const ratings=teamRatings(roster,staff);
    const p4=["SEC","Big Ten","ACC","Big 12"].includes(conf);
    const fac={stadium:clamp(Math.round(prestige/11)+ri(r,-1,1),1,10),
      strength:clamp(Math.round(prestige/11)+ri(r,-1,1),1,10),
      training:clamp(Math.round(prestige/12)+ri(r,-1,1),1,10),
      academics:clamp(ri(r,3,9),1,10),
      nil:clamp(Math.round(prestige/10)+ri(r,-2,1),1,10)};
    const revenue=Math.round((p4?55:18)*1e6 + prestige*420000 + ri(r,-6,6)*1e6);
    const payroll=staff.reduce((t,s)=>t+s.salary,0);
    const budget=Math.round(revenue*0.18 + ri(r,-3,4)*1e6);
    return {id:abbr.toLowerCase().replace(/[^a-z0-9]/g,''),name,nick,abbr,conf,div,color,
      homeState:TEAM_STATE[abbr]||pick(r,STATES),
      prestige,roster,ratings,fac,revenue,budget,staff,payroll,legends:[],
      facilityDebt:Math.round(ri(r,0,prestige>70?40:12)*1e6)};
  });
  // rankings
  const sorted=[...teams].sort((a,b)=>b.ratings.ovr-a.ratings.ovr);
  sorted.forEach((t,i)=>t.natRank=i+1);
  const byConf={},byDiv={};
  teams.forEach(t=>{(byConf[t.conf]=byConf[t.conf]||[]).push(t);
    const dk=t.conf+'|'+(t.div||'');(byDiv[dk]=byDiv[dk]||[]).push(t);});
  Object.values(byConf).forEach(a=>{a.sort((x,y)=>y.ratings.ovr-x.ratings.ovr);a.forEach((t,i)=>t.confRank=i+1);});
  Object.values(byDiv).forEach(a=>{a.sort((x,y)=>y.ratings.ovr-x.ratings.ovr);a.forEach((t,i)=>t.divRank=i+1);});
  return {teams};
}

/* ---------- save system (localStorage, 3 slots) ----------
   Phase 9 storage codec: rosters (98% of a ~2 MB save) are stored COLUMNAR — the 15 core player
   fields become a flat tuple instead of repeating field names 11k times, with any sparse extras
   (gs/dev/honors/promise/fromRecruit) kept in a side object. Pure serialization (no seed/genWorld
   dependency, so it's deploy-safe and correct-by-construction); decode is the exact inverse. Old
   saves (no `_sv` tag) decode as themselves. Cuts a fresh save ~40%. */
const SLOTS=[1,2,3];
const slotKey=n=>'sideline_slot_'+n;
const SAVE_PKEYS=['id','fn','ln','pos','yr','age','st','stars','ov','pot','cap','spd','str','awr','so','mot','comp'];
function encRoster(roster){
  return roster.map(p=>{
    const core=SAVE_PKEYS.map(k=>p[k]);
    let ext=null;for(const k in p)if(SAVE_PKEYS.indexOf(k)<0){(ext=ext||{})[k]=p[k];}
    return ext?[core,ext]:[core];
  });
}
function decRoster(enc){
  return (enc||[]).map(e=>{const p={};SAVE_PKEYS.forEach((k,i)=>p[k]=e[0][i]);if(e[1])Object.assign(p,e[1]);return p;});
}
// Phase 17: the recruit pool is now the full national class (~3,400), so it serializes columnar too —
// scalar fields become a flat tuple, the sparse extras (prefs[], iv{}, promise, alumni) ride in a side
// object (the transient _flipped tag is dropped). Mirrors encRoster/decRoster exactly.
const RECRUIT_PKEYS=['id','fn','ln','pos','st','stars','ov','pot','spd','str','awr','mot','comp','rebel','scout','committedTo','signed','offered','visited'];
function encPool(pool){
  return pool.map(p=>{
    const core=RECRUIT_PKEYS.map(k=>p[k]);
    let ext=null;for(const k in p){if(k==='_flipped')continue;if(RECRUIT_PKEYS.indexOf(k)<0){(ext=ext||{})[k]=p[k];}}
    return ext?[core,ext]:[core];
  });
}
function decPool(enc){
  return (enc||[]).map(e=>{const p={};RECRUIT_PKEYS.forEach((k,i)=>p[k]=e[0][i]);if(e[1])Object.assign(p,e[1]);return p;});
}
// Encode a live state for storage (compact). Never mutates the live state (shallow copies + new
// arrays). Falls back to the full state if anything unexpected happens, so a save is never lost.
function encodeState(state){
  try{
    const teams=state.world.teams.map(t=>{const o=Object.assign({},t);o._cr=encRoster(t.roster);delete o.roster;return o;});
    const out=Object.assign({},state,{world:{teams},_sv:1});
    if(state.recruiting&&state.recruiting.pool){      // Phase 17: columnar-encode the (large) recruit pool
      out.recruiting=Object.assign({},state.recruiting,{_cp:encPool(state.recruiting.pool)});
      delete out.recruiting.pool;
    }
    return out;
  }catch(e){return state;}
}
function decodeState(s){
  if(!s||!s._sv)return s;            // old/full save → use as-is
  const teams=s.world.teams.map(t=>{const o=Object.assign({},t);o.roster=decRoster(t._cr);delete o._cr;return o;});
  const out=Object.assign({},s,{world:{teams}});delete out._sv;
  if(out.recruiting&&out.recruiting._cp){             // decode the columnar recruit pool (older saves stored pool plainly)
    out.recruiting=Object.assign({},out.recruiting,{pool:decPool(out.recruiting._cp)});
    delete out.recruiting._cp;
  }
  return out;
}
function readSlot(n){try{const raw=localStorage.getItem(slotKey(n));return raw?JSON.parse(raw):null;}catch(e){return null;}}
function writeSlot(n,state){
  state.lastSaved=Date.now();
  const team=state.world.teams.find(t=>t.id===state.teamId);
  const meta={coach:state.coach.first+' '+state.coach.last,team:team?team.name:'—',
    teamAbbr:team?team.abbr:'',color:team?team.color:'#c9a227',
    week:state.week,phase:state.phase,savedAt:state.lastSaved};
  try{localStorage.setItem(slotKey(n),JSON.stringify({meta,state:encodeState(state)}));return true;}
  catch(e){toast('Save failed — storage full');return false;}
}
function deleteSlot(n){localStorage.removeItem(slotKey(n));}

/* ---------- test hooks: deterministic seed / slot reset via URL ----------
   ?seed=N  → New Game uses seed N (reproducible world for screenshots/assertions)
   ?reset=1 → clear all save slots on load (clean state)

   #app carries data-screen / data-tab. S, UI, controlled() are global for evaluate(). */
const _QS=new URLSearchParams(location.search);
const TEST_SEED=_QS.has('seed')?((parseInt(_QS.get('seed'),10)||0)>>>0):null;

/* ---------- live game state ---------- */
let S=null;            // current state
let UI={view:'menu',tab:'roster',newgame:null};

function controlled(){return S.world.teams.find(t=>t.id===S.teamId);}
function applyAccent(team){
  const root=document.documentElement.style;
  if(team){root.setProperty('--accent',team.color);root.setProperty('--accent-ink',textOn(team.color));
    document.querySelector('meta[name=theme-color]').setAttribute('content','#0d0f12');}
  else{root.setProperty('--accent','#c9a227');root.setProperty('--accent-ink','#0d0f12');}

/* ============================================================
   RENDER
   ============================================================ */
function render(){
  const app=$('#app');app.innerHTML='';
  app.dataset.screen=UI.view; app.dataset.tab=UI.tab||'';   // test hooks
  if(UI.view==='menu')         return renderMenu(app);
  if(UI.view==='load')         return renderLoad(app);
  if(UI.view==='newgame')      return renderNewGame(app);
  if(UI.view==='browse_pick')  return renderBrowse(app,true);
  // in-game views
  applyAccent(controlled());
  if(S.phase==='Retired') return renderRetired(app);   // Phase 19c: career over → the retrospective
  if(UI.view==='game') return renderGame(app);   // full-screen, no bottom nav (commit to exit)
  if(UI.view==='home') renderHome(app);
  if(UI.view==='team') renderTeam(app);
  if(UI.view==='recruit') renderRecruiting(app);
  if(UI.view==='portal') renderPortal(app);
  if(UI.view==='media') renderMedia(app);
  if(UI.view==='season') renderSeason(app);
  if(UI.view==='browse') renderBrowse(app,false);
  if(UI.view==='program') renderProgram(app);
  renderNav(app);
}

/* ---------- main menu ---------- */
function renderMenu(app){
  applyAccent(null);

  hero.innerHTML=`<div class="kick">College Football</div>
    <h1>SIDELINE</h1>
    <div class="by">A head-coach career sim</div>`;

  nw.onclick=()=>{UI.newgame=freshNewGame();UI.view='newgame';render();};
  const ld=el('button','btn ghost','Load Game');

  if(!any){const h=el('div','hint center');h.style.marginTop='22px';h.textContent='No saved careers yet. Start a new game to take over a program.';hero.append(h);}
  app.append(hero);
}

/* ---------- load / slot manager ---------- */
function renderLoad(app){
  applyAccent(null);
  const v=el('div','view');
  v.append(headerBar('Save Slots','Load, overwrite, or delete',()=>{UI.view='menu';render();}));
  SLOTS.forEach(n=>{
    const slot=readSlot(n);
    const c=el('div','card');
    if(slot){
      const m=slot.meta;
      c.innerHTML=`<div class="row spread">
        <div class="row">
          <div class="crest" style="background:${m.color};color:${textOn(m.color)}">${m.teamAbbr}</div>
          <div><div class="cond" style="font-size:18px;font-weight:700">${m.team}</div>
          <div class="meta">${m.coach} · ${m.phase} · Wk ${m.week}</div>
          <div class="meta dim">Saved ${timeAgo(m.savedAt)}</div></div>
        </div></div>`;
      const br=el('div','btn-row');
      const load=el('button','btn sm','Load');
      load.onclick=()=>{S=migrateState(decodeState(slot.state));UI.view='home';render();};
      const del=el('button','btn sm danger','Delete');
      del.onclick=()=>confirmSheet('Delete this career?',m.team+' — '+m.coach,()=>{deleteSlot(n);toast('Slot deleted');render();});
      br.append(load,del);c.append(br);
    }else{
      c.innerHTML=`<div class="empty" style="padding:18px">Slot ${n} — empty</div>`;
    }
    v.append(el('h2','sec','Slot '+n),c);
  });
  app.append(v);
}

/* ============================================================
   NEW GAME WIZARD
   ============================================================ */
function freshNewGame(){return {step:0,coach:{first:'',last:'',homeState:'TX',archetype:'Recruiter',history:'Former Player'},
  seed:(TEST_SEED!=null?TEST_SEED:((Date.now()^(Math.random()*1e9))>>>0)),world:null,teamId:null};}

function renderNewGame(app){
  applyAccent(null);
  const ng=UI.newgame;
  const v=el('div','view');
  const steps=el('div','steps');[0,1,2,3].forEach(i=>steps.append(el('span',i<=ng.step?'on':'')));
  v.append(headerBar(['Your Identity','Coaching Style','Rosters','Pick a Program'][ng.step],
    'Step '+(ng.step+1)+' of 4',()=>{if(ng.step===0){UI.view='menu';}else{ng.step--;}render();}));
  v.append(steps);

  if(ng.step===0){ // identity
    const f=ng.coach;
    v.append(fld('First name',inputEl(f.first,x=>f.first=x,'Coach')),
             fld('Last name',inputEl(f.last,x=>f.last=x,'Surname')),
             fld('Home state',selectEl(STATES,f.homeState,x=>f.homeState=x)));
    const next=el('button','btn','Continue');
    next.onclick=()=>{if(!f.first.trim()||!f.last.trim()){toast('Enter your name');return;}ng.step=1;render();};
    v.append(next);

  }else if(ng.step===1){ // archetype + history
    v.append(el('h2','sec','Archetype'));
    const a=el('div','choice');
    ARCHETYPES.forEach(([t,d])=>a.append(optEl(t,d,ng.coach.archetype===t,()=>{ng.coach.archetype=t;render();})));
    v.append(a,el('h2','sec','History'));
    const h=el('div','choice');
    HISTORIES.forEach(([t,d])=>h.append(optEl(t,d,ng.coach.history===t,()=>{ng.coach.history=t;render();})));
    v.append(h);
    const next=el('button','btn','Continue');next.style.marginTop='14px';
    next.onclick=()=>{ensureWorld(ng);ng.step=2;render();};
    v.append(next);

  }else if(ng.step===2){ // rosters
    ensureWorld(ng);
    v.append(el('div','card','<div class="hint">A full league of all '+TEAMS.length+
      ' FBS teams has been generated. You can play with these, or import your own custom rosters (real teams, edited ratings — your call).</div>'));
    const imp=el('button','btn ghost','Import custom rosters (.json)');
    imp.onclick=()=>importRosters(ng);
    const edit=el('button','btn line','Edit a team\u2019s roster');
    edit.style.marginTop='9px';
    edit.onclick=()=>{UI._editReturn='newgame';UI.view='browse_pick';UI._editMode=true;render();};
    const dl=el('button','btn line','Download blank roster template');
    dl.style.marginTop='9px';dl.onclick=downloadTemplate;
    v.append(imp,edit,dl);
    const next=el('button','btn','Continue to team select');next.style.marginTop='16px';
    next.onclick=()=>{ng.step=3;render();};
    v.append(next);

  }else if(ng.step===3){ // pick team
    ensureWorld(ng);
    const rand=el('button','btn ghost','Surprise me — assign a random program');
    rand.onclick=()=>{const t=ng.world.teams[Math.floor(Math.random()*ng.world.teams.length)];ng.teamId=t.id;finishNewGame(ng);};
    v.append(rand);
    v.append(el('div','hint center','— or pick one below —'));
    v.append(buildTeamList(ng.world.teams,t=>{ng.teamId=t.id;finishNewGame(ng);},'pick'));
  }
  app.append(v);
}
function ensureWorld(ng){if(!ng.world)ng.world=genWorld(ng.seed);}
function finishNewGame(ng){
  S={version:23,seed:ng.seed,createdAt:Date.now(),coach:ng.coach,teamId:ng.teamId,
     year:2026,week:0,phase:'Preseason',world:ng.world,schedule:null,lastPlayedWeek:0,weeklyHonors:[],
     recruiting:null,coachMarket:null,awards:[],series:[],seriesOffers:null,postseason:null,draft:null,
     task:{type:'Media Day',label:'Preseason Media Day',note:'Set the tone with the press, then kick off the season.'}};
  // Phase 19b: coach approval + tenure + a per-job career résumé (persist across seasons, not in S.media).
  S.coach.approval=55; S.coach.tenure=0; S.coach.approvalHistory=[]; S.coach.career=[];
  // choose a save slot
  chooseSlotSheet();
}
function chooseSlotSheet(){
  const body=el('div');
  body.append(el('div','hint','Choose a slot to save this career to. Saving over a slot replaces what\u2019s there.'));
  SLOTS.forEach(n=>{
    const ex=readSlot(n);
    const b=el('button','btn '+(ex?'line':'ghost'),'Slot '+n+(ex?' — replace '+ex.meta.team:' — empty'));
    b.style.marginTop='9px';
    b.onclick=()=>{
      const go=()=>{writeSlot(n,S);closeSheet();UI.view='home';UI.newgame=null;render();toast('Career started');};
      if(ex)confirmSheet('Overwrite Slot '+n+'?',ex.meta.team+' — '+ex.meta.coach,go);else go();
    };
    body.append(b);
  });
  openSheet('Save your career',body);
}

/* ---------- roster import / template ---------- */
const TEMPLATE={format:"sideline-roster",version:1,teams:[{
  name:"Example State",nickname:"Mockingbirds",abbr:"EXST",conference:"SEC",division:"",color:"#1b5e20",
  prestige:74,facilities:{stadium:8,strength:7,training:7,academics:6,nil:7},
  players:[{first:"John",last:"Smith",pos:"QB",year:"JR",age:21,homeState:"TX",stars:4,overall:88,potential:92,
    spd:80,str:70,awr:86,captain:true}]}]};
function downloadTemplate(){
  const blob=new Blob([JSON.stringify(TEMPLATE,null,2)],{type:'application/json'});
  const a=el('a');a.href=URL.createObjectURL(blob);a.download='sideline-roster-template.json';a.click();
  toast('Template downloaded');
}
function importRosters(ng){
  const inp=el('input');inp.type='file';inp.accept='.json,application/json';
  inp.onchange=()=>{const f=inp.files[0];if(!f)return;const rd=new FileReader();
    rd.onload=()=>{try{const data=JSON.parse(rd.result);const n=mergeRosters(ng,data);
      toast('Imported '+n+' team'+(n===1?'':'s'));render();}catch(e){toast('Invalid file: '+e.message);}};
    rd.readAsText(f);};
  inp.click();
}
function mergeRosters(ng,data){
  if(!data||!Array.isArray(data.teams))throw new Error('missing teams[]');
  ensureWorld(ng);let count=0;
  data.teams.forEach(td=>{
    const id=(td.abbr||td.name||'').toLowerCase().replace(/[^a-z0-9]/g,'');if(!id)return;
    let t=ng.world.teams.find(x=>x.id===id||x.name.toLowerCase()===String(td.name||'').toLowerCase());
    const roster=(td.players||[]).map(p=>normPlayer(p));
    if(roster.length){const byPos={};roster.forEach(p=>(byPos[p.pos]=byPos[p.pos]||[]).push(p));
      Object.values(byPos).forEach(a=>{a.sort((x,y)=>y.ov-x.ov);a.forEach((p,i)=>p.so=i);});}
    if(t){ // override existing
      if(roster.length){t.roster=roster;t.ratings=teamRatings(roster,t.staff);}
      if(td.facilities)Object.assign(t.fac,td.facilities);
      if(td.prestige!=null)t.prestige=td.prestige;
      if(td.color)t.color=td.color;
    }else{ // brand new team
      const staff=genStaff(rng(id.length*7+1),td.prestige||60);
      t={id,name:td.name||id,nick:td.nickname||'',abbr:(td.abbr||id.slice(0,4)).toUpperCase(),
         conf:td.conference||'Independent',div:td.division||'',color:td.color||'#888',
         homeState:td.homeState||TEAM_STATE[(td.abbr||'').toUpperCase()]||'TX',
         prestige:td.prestige||60,roster,ratings:teamRatings(roster,staff),
         fac:Object.assign({stadium:5,strength:5,training:5,academics:5,nil:5},td.facilities||{}),
         revenue:30e6,budget:6e6,staff,payroll:0,facilityDebt:0,legends:[]};
      t.payroll=t.staff.reduce((s,x)=>s+x.salary,0);
      ng.world.teams.push(t);
    }
    count++;
  });
  recomputeRanks(ng.world);
  return count;
}
function normPlayer(p){
  const ov=clamp(+p.overall||60,40,99);
  return {id:'p'+Math.random().toString(36).slice(2,9),fn:p.first||'New',ln:p.last||'Player',
    pos:p.pos||'WR',yr:p.year||'FR',age:+p.age||18,st:p.homeState||'TX',
    stars:+p.stars||(ov>=88?4:ov>=78?3:2),ov,pot:clamp(+p.potential||ov,ov,99),
    cap:!!p.captain,spd:+p.spd||ov,str:+p.str||ov,awr:+p.awr||ov,so:0};
}
// Bring an older save up to the current schema. v1 staff lacked coordinator/position
// tiers and group boosts; backfill them, re-derive ratings (now coach-aware), re-rank.
function migrateState(state){
  if(!state||!state.world)return state;
  if((state.version||1)<2){
    state.world.teams.forEach(t=>{normalizeStaff(t.staff);t.ratings=teamRatings(t.roster,t.staff);});
    recomputeRanks(state.world);
    state.version=2;
  }
  if((state.version||1)<3){            // Phase 2: season fields. Schedule is created at kickoff.
    if(!('schedule' in state))state.schedule=null;
    if(state.lastPlayedWeek==null)state.lastPlayedWeek=0;
    state.world.teams.forEach(t=>{if(!t.rec)t.rec=emptyRec();});
    recomputeRanks(state.world);
    state.version=3;
  }
  if((state.version||1)<4){            // Phase 3: per-player season stats (p.gs). Absence of
    state.version=4;                   // p.gs reads as "no stats yet", so no backfill needed.
  }
  if((state.version||1)<5){            // Phase 3.5: weekly Player of the Week honors.
    if(!Array.isArray(state.weeklyHonors))state.weeklyHonors=[];
    state.version=5;
  }
  if((state.version||1)<6){            // Phase 4: recruiting. Created at kickoff (like the
    if(!('recruiting' in state))state.recruiting=null;   // schedule), so a null backfill is enough.
    state.version=6;
  }
  if((state.version||1)<7){            // Phase 5: season rollover adds a calendar-year counter.
    if(state.year==null)state.year=2026;
    state.version=7;
  }
  if((state.version||1)<8){            // Phase 6: coaching carousel market + per-team finances.
    if(!('coachMarket' in state))state.coachMarket=null;   // created at the first offseason
    state.world.teams.forEach(t=>{if(!('lastFinances' in t))t.lastFinances=null;});
    state.version=8;
  }
  if((state.version||1)<9){            // Phase 7: per-player offseason growth (p.dev). Absence
    state.version=9;                   // reads as "no growth recorded yet" → no backfill needed.
  }
  if((state.version||1)<10){           // Phase 8: AI geography + season awards + non-conf series.
    if(!Array.isArray(state.awards))state.awards=[];
    if(!Array.isArray(state.series))state.series=[];
    state.world.teams.forEach(t=>{if(!t.homeState)t.homeState=TEAM_STATE[t.abbr]||'TX';});
    state.version=10;                  // p.honors stays optional (absence reads as no honors)
  }
  if((state.version||1)<11){           // Phase 8+: AI-initiated series offers (created when managing).
    if(!('seriesOffers' in state))state.seriesOffers=null;
    state.version=11;
  }
  if((state.version||1)<12){           // Phase 10: per-player traits (p.mot/p.comp). Structural
    state.version=12;                  // no-op — absence reads as average (TRAIT_DEF) until set.
  }
  if((state.version||1)<13){           // Phase 11: program legacy. Backfill an empty Ring of Honor
    state.world.teams.forEach(t=>{if(!Array.isArray(t.legends))t.legends=[];});  // (career/peakOv
    state.version=13;                  // absent → zero/none; honors already persist; aura reads 0).
  }
  if((state.version||1)<14){           // Phase 12: postseason (bowls + 12-team playoff). Created at
    if(!('postseason' in state))state.postseason=null;   // the end of the regular season, like the schedule.
    state.version=14;                  // postseasonBoost/lastPostseason/titles absent → no effect yet.
  }
  if((state.version||1)<15){           // Phase 13: NFL draft + position factories. Draft class is created
    if(!('draft' in state))state.draft=null;   // at the first rollover; team.factory builds from picks (absent → none).
    state.version=15;
  }
  if((state.version||1)<16){           // Phase 14: recruiting calendar (signing moved to the offseason).
    if(state.recruiting&&!state.recruiting.stage)   // derive a stage for an in-progress class
      state.recruiting.stage=state.recruiting.signed?'closed':'open';
    state.version=16;
  }
  if((state.version||1)<17){           // Phase 15: conference championships + CFP auto-bid seeding.
    if(!('champWeek' in state))state.champWeek=null;   // Championship Week is created after the regular season, like the postseason.
    state.world.teams.forEach(t=>{if(!Array.isArray(t.confTitles))t.confTitles=[];});
    state.version=17;
  }
  if((state.version||1)<18){           // Phase 16: decommits (verbal flips). Behaviour-only — a transient
    state.version=18;                  // rec._flipped is recomputed each week, so there is nothing to backfill.
  }
  if((state.version||1)<19){           // Phase 17: full national recruit board (~3,400) + columnar pool codec.
    state.version=19;                  // Structural no-op — the pool is recreated at the next kickoff; the codec
  }                                    // decodes both the old plain pool and the new columnar (_cp) form.
  if((state.version||1)<20){           // Phase 18: transfer portal. Created in the offseason after Signing Day,
    if(!('portal' in state))state.portal=null;   // nulled at rollover (like the postseason/champ week).
    state.version=20;
  }
  if((state.version||1)<21){           // Phase 19a: media suite (AP poll + news feed). Created at kickoff
    if(!('media' in state))state.media=null;   // (like the schedule/recruiting), nulled at rollover.
    state.version=21;
  }
  if((state.version||1)<22){           // Phase 19b: coach approval + the hot seat + a career résumé.
    if(state.coach){if(state.coach.approval==null)state.coach.approval=55;
      if(state.coach.tenure==null)state.coach.tenure=0;
      if(!Array.isArray(state.coach.approvalHistory))state.coach.approvalHistory=[];
      if(!Array.isArray(state.coach.career))state.coach.career=[];}   // team.mediaBuzz / media.pressDev absent → no effect
    state.version=22;
  }
  if((state.version||1)<23){           // Phase 19c: coaching search (fired → job carousel or retire).
    if(!('coachSearch' in state))state.coachSearch=null;   // created on firing, cleared on taking a job / retiring
    state.version=23;
  }
  return state;
}
// Ranking score: preseason (no games) is pure OVR; once games are played it blends in
// record and point margin so winners climb and undefeated underdogs can crack the polls.
function rankScore(t){
  const ovr=t.ratings.ovr, rec=t.rec;
  if(!rec||(rec.w+rec.l)===0)return ovr;
  const g=rec.w+rec.l, margin=(rec.pf-rec.pa)/g;
  return ovr + (rec.w-rec.l)*5 + clamp(margin,-28,28)*0.4;
}
function recomputeRanks(world){
  const ts=world.teams;
  [...ts].sort((a,b)=>rankScore(b)-rankScore(a)).forEach((t,i)=>t.natRank=i+1);
  const c={},d={};ts.forEach(t=>{(c[t.conf]=c[t.conf]||[]).push(t);const k=t.conf+'|'+(t.div||'');(d[k]=d[k]||[]).push(t);});
  Object.values(c).forEach(a=>{a.sort((x,y)=>rankScore(y)-rankScore(x));a.forEach((t,i)=>t.confRank=i+1);});
  Object.values(d).forEach(a=>{a.sort((x,y)=>rankScore(y)-rankScore(x));a.forEach((t,i)=>t.divRank=i+1);});
}

/* ============================================================
   SEASON ENGINE — schedule, game sim, records, standings  (Phase 2)
   ============================================================ */
const SEASON_WEEKS=15;       // 12 games + ~3 byes, mirrors a real CFB regular season
function emptyRec(){return {w:0,l:0,cw:0,cl:0,pf:0,pa:0,streak:0};}

// Build a full-league schedule: each team ~12 games (conference-weighted), one game per
// week, packed into SEASON_WEEKS. Deterministic from the world seed. (Validated standalone:
// ~11.9 games/team avg, 0 same-week conflicts, no duplicate matchups.)
//
// Phase 8 two-phase: `locked` = this year's non-conference series legs ({home,away,neutral}). They
// are seeded as fixed edges (forced host) FIRST, then the conference/auto slate fills around them and
// both are edge-colored into weeks together. With no series the path is byte-identical to before.
function genSchedule(world,seed,locked){
  const ids=world.teams.map(t=>t.id);
  const confOf={};world.teams.forEach(t=>confOf[t.id]=t.conf);
  const r=rng((seed^0x5ca1ab1e)>>>0);
  const TARGET=12;
  const pri=new Map(ids.map(id=>[id,r()]));          // random per-team key → seed-varied slate
  const adj=new Map(ids.map(id=>[id,new Set()]));
  const deg=id=>adj.get(id).size;
  // 0) lock series legs as fixed edges (forced host) before the auto-fill
  const lockMap=new Map();
  (locked||[]).forEach(L=>{if(!adj.has(L.home)||!adj.has(L.away)||L.home===L.away)return;
    if(adj.get(L.home).has(L.away))return;
    const k=L.home<L.away?L.home+'|'+L.away:L.away+'|'+L.home;
    adj.get(L.home).add(L.away);adj.get(L.away).add(L.home);lockMap.set(k,L);});
  // 1) pick matchups: repeatedly connect the neediest team to a same-conference (then any)
  //    opponent it hasn't played, until everyone has ~12 games.
  let guard=ids.length*TARGET*6;
  while(guard-->0){
    const need=ids.filter(id=>deg(id)<TARGET);
    if(need.length<2)break;
    need.sort((a,b)=>deg(a)-deg(b)||pri.get(a)-pri.get(b));
    const A=need[0],an=adj.get(A);
    let cands=need.filter(B=>B!==A&&!an.has(B));
    if(!cands.length){cands=ids.filter(B=>B!==A&&!an.has(B)&&deg(B)<TARGET);if(!cands.length)break;}
    const sameConf=cands.filter(B=>confOf[B]===confOf[A]);
    const pool=sameConf.length?sameConf:cands;
    pool.sort((a,b)=>deg(a)-deg(b)||pri.get(a)-pri.get(b));
    const B=pool[0];adj.get(A).add(B);adj.get(B).add(A);
  }
  // 2) assign each matchup to the lowest week free for both teams (greedy edge-coloring).
  const matchups=[];const seen=new Set();
  ids.forEach(A=>adj.get(A).forEach(B=>{const k=A<B?A+'|'+B:B+'|'+A;
    if(!seen.has(k)){seen.add(k);matchups.push({A,B,d:deg(A)+deg(B),key:r(),ha:r(),lock:lockMap.get(k)||null});}}));
  matchups.sort((m,n)=>(n.lock?1:0)-(m.lock?1:0)||n.d-m.d||m.key-n.key);   // locked first, then hardest
  const busy=new Map(ids.map(id=>[id,new Set()]));
  const games=[];let gi=0;
  matchups.forEach(m=>{
    let wk=-1;
    for(let w=0;w<SEASON_WEEKS;w++){if(!busy.get(m.A).has(w)&&!busy.get(m.B).has(w)){wk=w;break;}}
    if(wk<0)return;                              // couldn't place → mutual bye (rare)
    busy.get(m.A).add(wk);busy.get(m.B).add(wk);
    const home=m.lock?m.lock.home:(m.ha<0.5?m.A:m.B),away=m.lock?m.lock.away:(m.ha<0.5?m.B:m.A);
    const g={id:'g'+(gi++).toString(36),week:wk+1,home,away,played:false,hs:null,as:null};
    if(m.lock){g.series=true;if(m.lock.neutral)g.neutral=true;}
    games.push(g);
  });
  return {weeks:SEASON_WEEKS,games};
}
// This year's series legs (Phase 8), as locked schedule edges for genSchedule.
function seriesLegsForYear(year){
  const out=[];(S.series||[]).forEach(s=>(s.legs||[]).forEach(l=>{
    if(l.year===year&&teamById(l.home)&&teamById(l.away))out.push({home:l.home,away:l.away,neutral:!!l.neutralSite});}));
  return out;
}

function teamById(id){return S.world.teams.find(t=>t.id===id);}
function teamGame(teamId,week){return S.schedule?S.schedule.games.find(g=>g.week===week&&(g.home===teamId||g.away===teamId)):null;}
function teamGames(teamId){return S.schedule?S.schedule.games.filter(g=>g.home===teamId||g.away===teamId).sort((a,b)=>a.week-b.week):[];}
function lastGameFor(teamId){const gs=teamGames(teamId).filter(g=>g.played);return gs.length?gs[gs.length-1]:null;}

function startSeason(){
  S.schedule=genSchedule(S.world,S.seed,seriesLegsForYear(S.year||2026));
  S.world.teams.forEach(t=>t.rec=emptyRec());
  S.weeklyHonors=[];
  S.phase='Regular Season';S.week=1;S.lastPlayedWeek=0;
  S.world.teams.forEach(t=>(t.legends||[]).forEach(l=>l.app=LEGEND_APPS));   // refresh alumni appearances
  initRecruiting();
  S.world.teams.forEach(t=>{t.mediaBuzz=0;});   // Phase 19b: press-conference recruiting buzz resets each year
  recomputeRanks(S.world);
  initMedia();                 // Phase 19: a fresh preseason AP poll + an empty news feed
  setWeeklyTask();
  autosave();
}

// === SIM ENGINE (Phase 3) START ===
// Drive/play state machine. Pure + deterministic from `seed`: simEngine(home,away,seed)
// returns { hs, as, box } and never mutates its inputs, so re-running reproduces the same
// score AND the same per-player box. `box` maps playerId -> stat deltas for ONE game; the
// season layer folds it into each player's season totals (see applyResult). Depends only on
// rng/clamp/ri (no DOM, no globals) so test/simlab.js can extract + validate it offline.
//
// Coordinate: `los` = offense's own yard line, 0..100, scoring end at 100. Possession flips
// by mirroring (opp los = 100 - los). Efficiency is driven by (offense.off - defense.def)
// in rating points, plus a small home-field bump to the home offense.

// Depth-weighted usage pools for one team-game (starters get the lion's share of touches).
function gamePools(team){
  const byPos={}; team.roster.forEach(p=>{(byPos[p.pos]=byPos[p.pos]||[]).push(p);});
  for(const k in byPos) byPos[k].sort((a,b)=>a.so-b.so);
  const dep=p=>1/Math.pow((p.so||0)+1,1.35);              // so 0 ≫ so 1 ≫ deep backups
  const W=(codes,base)=>{const out=[];codes.forEach(([c,m])=>(byPos[c]||[]).forEach(p=>out.push([p,base*m*dep(p)])));return out;};
  return {
    qb:(byPos.QB||[])[0]||null,
    k:(byPos.K||[])[0]||(byPos.QB||[])[0]||null,
    rush:W([['RB',1.0]],1),                                // designed runs go to RBs
    recv:W([['WR',1.15],['TE',0.75],['RB',0.55]],1),       // targets: WR > TE > checkdown RB
    tkl:W([['LB',1.0],['S',0.8],['CB',0.7],['DE',0.55],['DT',0.45]],1),
    rush4:W([['DE',1.0],['DT',0.7],['LB',0.5]],1),         // pass rush (sacks)
    hawk:W([['CB',1.0],['S',0.85],['LB',0.4]],1)           // ball-hawks (INTs)
  };
}
function wpick(pool,r){ let tot=0;for(const e of pool)tot+=e[1]; if(tot<=0)return null;
  let x=r()*tot; for(const e of pool){x-=e[1];if(x<0)return e[0];} return pool[pool.length-1][0]; }

// opts.log → also return res.log, a flat list of {q,team,kind,text,dd,hs,as,big} events for the
// watchable viewer. Logging pushes strings only (no rng), so the score + box are identical with
// it on or off — a "watch" is a faithful replay of the committed result, never a re-roll.
function simEngine(home,away,seed,opts){
  const r=rng(seed>>>0);
  const box={};
  const log=opts&&opts.log?[]:null;
  const add=(id,k,v)=>{ if(!id)return; (box[id]=box[id]||{gp:1})[k]=(box[id][k]||0)+(v==null?1:v); };
  const pools={[home.id]:gamePools(home),[away.id]:gamePools(away)};
  const score={[home.id]:0,[away.id]:0};
  const HFA=2.3;                                           // home-field, in rating points
  // per-game "form": each team runs a little hot or cold tonight (std ≈ 4 pts), which lets
  // underdogs steal games and keeps the favorite from winning ~every time.
  const form={[home.id]:(r()+r()+r()-1.5)*8, [away.id]:(r()+r()+r()-1.5)*8};
  const flipTo=spot=>100-clamp(spot,1,99);                 // mirror a spot for the opponent
  const nm=p=>p?((p.fn?p.fn[0]+'. ':'')+(p.ln||p.pos||'')).trim():'';
  const fpos=l=>l===50?'midfield':(l<50?'own ':'opp ')+(l<50?l:100-l);
  const L=(team,kind,text,dd,big)=>{ if(log)log.push({q:L._q,team:team?team.id:null,kind,text,dd:dd||'',hs:score[home.id],as:score[away.id],big:!!big}); };
  L._q=1;

  // One possession, start at `startLos` (offense's own yard line). Returns the spot the
  // opponent takes over (mutates `score` + `box`); ~drive time charged to the caller's clock.
  function playDrive(off,def,startLos,clutch){
    const oP=pools[off.id], dP=pools[def.id];
    let adv=(off.ratings.off-def.ratings.def)+(off===home?HFA:0)+form[off.id]-form[def.id];
    if(clutch)adv+=compClutch(oP.qb);                   // late & close: the QB's composure shows (Phase 10)
    let los=startLos, down=1, togo=10, time=0;
    L(off,'drive',off.abbr?off.abbr+' ball at '+fpos(los):'Ball at '+fpos(los));
    while(true){
      const dd=(down)+' & '+(togo>=(100-los)?'goal':togo);
      // ---- 4th down: kick or go ----
      if(down===4){
        const fgDist=(100-los)+17, inFgRange=fgDist<=57, shortPlus=los>=58&&togo<=2;
        if(inFgRange && !(shortPlus && r()<0.45)){          // field-goal attempt
          time+=8; add(oP.k&&oP.k.id,'fga');
          if(r()<clamp(0.965-(fgDist-20)*0.013,0.40,0.985)){ add(oP.k&&oP.k.id,'fgm'); score[off.id]+=3; L(off,'score',nm(oP.k)+' '+fgDist+'-yd field goal is GOOD',dd,true); return {nextLos:25,time}; }
          L(off,'play',nm(oP.k)+' '+fgDist+'-yd field goal MISSED',dd); return {nextLos:flipTo(los),time};
        } else if(!(shortPlus && r()<0.55)){                // punt (net ~42; into EZ → touchback @20)
          time+=10; L(off,'play','Punt',dd); return {nextLos:clamp(flipTo(los+ri(r,38,46)),20,99),time};
        } // else: go for it → fall through and run a normal play
      }

      // ---- run / pass ----
      const passProb=clamp(0.45+(togo>7?0.18:togo<3?-0.18:0)+(down>=3?0.17:0)+adv*0.003,0.12,0.92);
      let gain=0, turnover=false, scored=false, tackled=true, txt='';

      if(r()<passProb){                                     // dropback (sacks aren't pass attempts)
        if(r()<clamp(0.062-adv*0.0012,0.02,0.11)){          // sack
          gain=-ri(r,4,9); time+=36; const s=wpick(dP.rush4,r); add(s&&s.id,'sk'); txt=nm(oP.qb)+' sacked by '+nm(s)+' for '+gain;
        } else if(r()<clamp(0.615+adv*0.007,0.32,0.83)){    // completion
          const rec=wpick(oP.recv,r);
          gain=Math.max(-3,Math.round((2.2+compDraw(r,rec)*7.5)+(r()<0.18?compDraw(r,rec)*42:0)+adv*0.06));
          add(oP.qb&&oP.qb.id,'pAtt'); add(oP.qb&&oP.qb.id,'pCmp'); add(oP.qb&&oP.qb.id,'pYds',gain);
          add(rec&&rec.id,'rec'); add(rec&&rec.id,'reYds',gain);
          time+=(r()<0.28?14:34); txt=nm(oP.qb)+' pass to '+nm(rec)+' for '+gain;
          if(los+gain>=100){ scored=true; add(oP.qb&&oP.qb.id,'pTD'); add(rec&&rec.id,'reTD'); }
        } else {                                            // incomplete (maybe picked)
          time+=6; tackled=false; add(oP.qb&&oP.qb.id,'pAtt'); txt=nm(oP.qb)+' incomplete';
          if(r()<clamp(0.030-adv*0.0008,0.008,0.06)){ turnover=true; add(oP.qb&&oP.qb.id,'pInt'); const h=wpick(dP.hawk,r); add(h&&h.id,'dInt'); txt=nm(oP.qb)+' INTERCEPTED by '+nm(h); }
        }
      } else {                                              // run
        const rb=wpick(oP.rush,r)||oP.qb;
        gain=Math.max(-4,Math.round((2.7+compDraw(r,rb)*4.1)+(r()<0.11?compDraw(r,rb)*30:0)+adv*0.035));
        time+=36; add(rb&&rb.id,'rAtt'); add(rb&&rb.id,'rYds',gain); txt=nm(rb)+' run for '+gain;
        if(los+gain>=100){ scored=true; add(rb&&rb.id,'rTD'); }
        if(!scored && r()<0.011){ turnover=true; txt=nm(rb)+' FUMBLES — lost'; }
      }

      // ---- resolve the play ----
      if(scored){
        score[off.id]+=6;
        add(oP.k&&oP.k.id,'xpa'); const xp=r()<0.965; if(xp){ add(oP.k&&oP.k.id,'xpm'); score[off.id]+=1; }
        L(off,'score','TOUCHDOWN — '+txt+(xp?' (XP good)':' (XP no good)'),dd,true);
        return {nextLos:25,time};
      }
      if(tackled){ const t=wpick(dP.tkl,r); add(t&&t.id,'tkl'); }
      if(turnover){ L(off,'play',txt,dd,true); return {nextLos:flipTo(clamp(los+gain,1,99)),time}; }

      const wasFirst=togo-gain<=0;
      los=clamp(los+gain,1,99); togo-=gain;
      L(off,'play',txt+(wasFirst?' — 1ST DOWN':''),dd);
      if(togo<=0){ down=1; togo=10; }                       // first down
      else if(++down>4){ L(off,'play','Turnover on downs',dd); return {nextLos:flipTo(los),time}; }
    }
  }

  // regulation: alternate possessions until the clock runs out (a drive may overrun the
  // final seconds — symmetric, and the scoreboard impact is negligible).
  let clock=3600, off=r()<0.5?home:away, def=off===home?away:home, startLos=25;
  while(clock>0){
    L._q=clamp(Math.floor((3600-clock)/900)+1,1,4);
    const clutch=clock<600&&Math.abs(score[home.id]-score[away.id])<=8;   // late & close (Phase 10)
    const d=playDrive(off,def,startLos,clutch);
    clock-=Math.max(d.time,12); startLos=d.nextLos;
    const swap=off; off=def; def=swap;
  }
  // overtime: each team a possession from the opponent's 25 (los 75) until someone leads.
  let ot=0;
  while(score[home.id]===score[away.id] && ot++<25){
    L._q='OT'+ot;
    playDrive(home,away,75,true); playDrive(away,home,75,true);   // OT is always late & close
  }
  L(null,'final','Final',null,true);

  return { hs:score[home.id], as:score[away.id], box, log };
}
// === SIM ENGINE (Phase 3) END ===

// === RECRUIT ENGINE (Phase 4) START ===
// Pure, deterministic recruiting model. Depends only on rng/ri/clamp/pick/hashStr and the data
// arrays FN/LN/STATES/POS (no DOM, no S, no globals beyond those), so test/reclab.js can extract
// + validate this block offline. The "team" shape it reads is just { id, prestige, needs? }.
//
// A prospect (recruit) carries `iv` = interest keyed by suitor team id (a handful of suitors).
// Each week every suitor's interest grows by a fit-based increment; a prospect commits to its
// leading suitor once interest clears a threshold with a margin, gated by a readiness ramp +
// star "patience". The player team is just another suitor for *passive* growth — actions are the
// lever on top (applied outside this block). Landing = a prospect commits to you.

const PREFS=['playingTime','nil','winning','development','home','academics'];
// Pitch angles map 1:1 to prefs. [key, label, blurb]
const PITCH_ANGLES=[
  ['playingTime','Playing Time','Early reps — a path to start.'],
  ['nil','NIL Money','Top collective, real brand deals.'],
  ['winning','Win Now','Compete for titles immediately.'],
  ['development','Development','We send talent to the next level.'],
  ['home','Stay Home','Play close to family and friends.'],
  ['academics','Academics','A degree that sets up life after ball.']];
// Tuning — tweaked in test/reclab.js.
const REC={POOL:3400,COMMIT_THRESH:68,LEAD_GAP:7,CLASS_CAP:25,BASE_POINTS:12,SLOTS:16,DECOMMIT_GAP:18};

// Coach archetype/history effects — Phase 4 is the first system to apply them. Returns a bag of
// multipliers/bonuses used by the weekly economy + the player's recruiting actions.
function coachMods(coach){
  const m={points:0,slots:0,scout:1,pitch:1,visit:1,prestige:0,homeBonus:1,nil:1,devPitch:1,
    homeState:(coach&&coach.homeState)||null};
  const A=coach&&coach.archetype, H=coach&&coach.history;
  if(A==='Recruiter'){m.points+=6;m.slots+=6;m.pitch*=1.25;m.visit*=1.15;}
  else if(A==='Motivator'){m.visit*=1.25;m.pitch*=1.1;}
  else if(A==='Manager'){m.points+=2;m.nil*=1.35;}
  else if(A==='Offensive Genius'||A==='Defensive Genius'){m.devPitch*=1.3;}
  if(H==='Former Player'){m.visit*=1.2;m.pitch*=1.1;}
  else if(H==='NFL Transplant'){m.prestige+=10;m.slots-=3;}
  else if(H==='High School Legend'){m.homeBonus*=1.8;}
  else if(H==='Analyst'){m.scout*=1.6;m.pitch*=0.92;}
  else if(H==='Lifer'){m.points+=2;}
  else if(H==='Coordinator'){m.pitch*=1.05;}
  return m;
}
// How well a team fits a prospect (0..~1.1): prestige proximity to the recruit's tier, with a
// floor for programs above the tier (they can always take down-tier talent), plus a needs nudge.
function recruitFit(team,rec){
  const target=rec.stars>=5?88:rec.stars===4?70:rec.stars===3?50:32;
  let prox=clamp(1-Math.abs(team.prestige-target)/50,0,1);
  if(team.prestige>=target)prox=Math.max(prox,0.72+Math.min(team.prestige-target,22)/110);
  const need=(team.needs&&team.needs[rec.pos])?0.12:0;
  // Facilities nudge fit (Phase 6 wiring): a strong NIL collective helps everywhere; academics
  // matters to recruits who value it. Guarded so fac-less teams (the recruit lab) are unaffected.
  let fac=0;
  if(team.fac){
    fac+=((team.fac.nil||5)-5)*0.012;
    if(rec.prefs&&rec.prefs.indexOf('academics')>=0)fac+=((team.fac.academics||5)-5)*0.014;
  }
  // AI geography (Phase 8): an in-state program is a stronger fit. Guarded so home-state-less
  // teams (the recruit lab) are unaffected. The player also feels this via coach.homeState.
  if(team.homeState&&rec.st&&team.homeState===rec.st)fac+=0.10;
  // Program legacy (Phase 11): a storied Ring of Honor draws talent on name alone. Small + clamped
  // so it complements prestige, never replaces it. Guarded so legend-less teams (recruit lab) unaffected.
  if(team.legends&&team.legends.length)fac+=legacyAura(team);
  // Postseason momentum (Phase 12): a deep playoff run / bowl win lifts next year's recruiting.
  if(team.postseasonBoost)fac+=team.postseasonBoost;
  // Draft factory (Phase 13): a program that produces high picks at this position pulls recruits there
  // (a rebel is repelled). Guarded so factory-less teams (the recruit lab) are unaffected.
  if(team.factory)fac+=factoryPull(team,rec);
  // Media buzz (Phase 19b): press-conference hype is a small standing recruiting nudge. Guarded.
  if(team.mediaBuzz)fac+=clamp(team.mediaBuzz,0,0.1);
  return clamp(prox+need+fac,0,1.2);
}
// Class-ranking value of a landed prospect, and a team's total class score. Phase 17: the whole national
// class is now modeled, so the score is the real sum of landed value (a small prestige term is kept only
// as a tiebreaker so equal classes order deterministically — it no longer stands in for a faked tail).
function recruitValue(rec){return rec.stars*rec.stars*2+Math.max(0,rec.ov-70);}
function classScore(team,pool){
  let s=(team.prestige||50)*0.1;
  for(const r of pool)if(r.committedTo===team.id)s+=recruitValue(r);
  return Math.round(s);
}
// Build the FULL national recruiting class (~3,400 — roughly 134 teams × a 25-man class), deterministic
// from the world seed (Phase 17). Star mix is top-heavy: a handful of 5★, a few hundred 4★, then a long
// 3★/2★ tail that fills out every program's board.
function genRecruits(seed,teams){
  const r=rng((seed^0x2ec54172)>>>0);
  const posPool=[];POS.forEach(([c,,n])=>{for(let i=0;i<n;i++)posPool.push(c);});
  const pool=[];
  for(let i=0;i<REC.POOL;i++){
    const stars=i<30?5:i<380?4:i<1900?3:2;
    const ovBase=stars===5?92:stars===4?85:stars===3?77:68;
    const ov=clamp(ovBase+ri(r,-4,5),58,99);
    const pot=clamp(ov+ri(r,3,13),ov,99);
    const pos=pick(r,posPool), st=pick(r,STATES);
    const p1=pick(r,PREFS); let p2=pick(r,PREFS),guard=0; while(p2===p1&&guard++<6)p2=pick(r,PREFS);
    const target=stars===5?88:stars===4?70:stars===3?50:32;
    const nSuit=stars===5?ri(r,4,6):stars===4?ri(r,4,6):ri(r,4,6);
    // Spread suitors across the prestige band (more noise) so no tier of programs is wildly over- or
    // under-subscribed — every program needs a reachable pool to fill its ~25-man class (Phase 17).
    const ranked=teams.map(t=>({t,s:(1-Math.abs(t.prestige-target)/50)+r()*1.1+((t.homeState&&t.homeState===st)?0.3:0)}))
      .sort((a,b)=>b.s-a.s).slice(0,nSuit);
    const iv={};
    ranked.forEach((e,k)=>{const fit=recruitFit(e.t,{stars,pos,st});
      iv[e.t.id]=clamp(Math.round(20+fit*26+ri(r,-4,6)-k*2),8,70);});
    // Traits come from a per-recruit rng keyed on the id (not the pool stream), so the prospect
    // board is byte-identical to pre-Phase-10 — the trait is just along for the ride, and carries
    // onto the freshman in recruitToFreshman.
    const rid='r'+i.toString(36)+(seed>>>0).toString(36).slice(-2);
    const tr=genTraits(rng(hashStr(rid)));
    // ~12% of prospects are "rebels" — they want to make their own name, not join a position factory
    // (Phase 13). Keyed on a per-recruit rng (NOT the pool stream), so the board stays byte-identical.
    const rebel=rng((hashStr(rid+'reb'))>>>0)()<0.12;
    pool.push({id:rid,
      fn:pick(r,FN),ln:pick(r,LN),pos,st,stars,ov,pot,
      spd:clamp(ov+ri(r,-10,12),40,99),str:clamp(ov+ri(r,-10,12),40,99),awr:clamp(ov+ri(r,-12,10),40,99),
      mot:tr.mot,comp:tr.comp,rebel,
      scout:0,prefs:[p1,p2],iv,committedTo:null,signed:false,offered:false,visited:false,promise:null});
  }
  return pool;
}
// Advance one recruiting week: grow every suitor's interest, resolve DECOMMITS (verbal flips), then
// resolve new commitments. Seeded per (seed, week) so a cycle reproduces. During the season a commitment
// is a VERBAL (`committedTo` set, `signed` stays false); only the `finalize` pass (National Signing Day,
// in the offseason) forces the remaining undecided to pick their leader AND turns every verbal into a
// binding signature. Respects a per-team class cap. Mutates `pool`; returns the week's new commits (incl.
// flips, each tagged with a transient `rec._flipped={from,to}` so the app can toast).
function advanceRecruiting(pool,teams,week,weeks,seed,finalize,signBar,gapBar){
  const byId={};teams.forEach(t=>byId[t.id]=t);
  const r=rng((seed^hashStr('rec'+week))>>>0);
  const bar=signBar==null?35:signBar;   // interest a leader needs to lock a signature on a finalize pass
  const gap=gapBar==null?0:gapBar;      // lead margin over #2 required to sign (Early Period wants a firm lead)
  const counts={};pool.forEach(p=>{if(p.committedTo)counts[p.committedTo]=(counts[p.committedTo]||0)+1;
    if(p._flipped)delete p._flipped;});
  const full=id=>(counts[id]||0)>=REC.CLASS_CAP;
  // 1) passive interest growth — for uncommitted prospects AND verbal (unsigned) commits, so rival
  //    programs keep pushing on a verbal pledge. Signed prospects are locked (no more movement).
  pool.forEach(rec=>{
    if(rec.signed)return;
    for(const tid in rec.iv){const t=byId[tid];if(!t)continue;
      const fit=recruitFit(t,rec);
      rec.iv[tid]=clamp(rec.iv[tid]+(1.0+fit*3.2)*(0.6+r()*0.9),0,100);}
  });
  const out=[];
  // 2) decommits — a VERBAL commitment can FLIP to a rival who has pulled clearly ahead. In-season only:
  //    firm verbals lock at the Early Signing Period, so a finalize pass never flips. Signed never flip.
  if(!finalize){
    pool.forEach(rec=>{
      if(!rec.committedTo||rec.signed)return;
      const cur=rec.iv[rec.committedTo]||0;
      let best=null,bestV=-1;
      for(const tid in rec.iv){if(tid===rec.committedTo)continue;const t=byId[tid];if(!t||full(tid))continue;
        if(rec.iv[tid]>bestV){bestV=rec.iv[tid];best=tid;}}
      if(best&&(bestV-cur)>=REC.DECOMMIT_GAP){
        const prob=clamp((bestV-cur-REC.DECOMMIT_GAP)/40,0.04,0.5);   // the further ahead, the likelier the flip
        if(r()<prob){
          counts[rec.committedTo]=(counts[rec.committedTo]||1)-1;
          rec._flipped={from:rec.committedTo,to:best};
          rec.committedTo=best;counts[best]=(counts[best]||0)+1;
          out.push(rec);
        }
      }
    });
  }
  // 3) commitments — verbal during the season; binding only on the finalize (Signing Day) pass
  const readiness=clamp((week-2)/(weeks-3),0,1), last=!!finalize;
  pool.forEach(rec=>{
    if(rec.committedTo)return;
    let entries=Object.entries(rec.iv).filter(([tid])=>byId[tid]&&!full(tid)).sort((a,b)=>b[1]-a[1]);
    if(!entries.length)return;
    const [leadId,lead]=entries[0], second=entries[1]?entries[1][1]:0;
    const commit=()=>{rec.committedTo=leadId;if(last)rec.signed=true;counts[leadId]=(counts[leadId]||0)+1;out.push(rec);};
    if(last){if(lead>=bar&&(lead-second)>=gap)commit();return;}   // toss-ups (small gap) wait for the next pass
    const patience=rec.stars===5?0.55:rec.stars===4?0.35:0.18;
    if(readiness<patience)return;
    if(lead>=REC.COMMIT_THRESH&&(lead-second)>=REC.LEAD_GAP){
      const prob=readiness*clamp((lead-REC.COMMIT_THRESH)/28,0.05,1);
      if(r()<prob)commit();
    }
  });
  if(last)pool.forEach(rec=>{if(rec.committedTo)rec.signed=true;});   // every verbal becomes a signature
  return out;
}
// === RECRUIT ENGINE (Phase 4) END ===

// === ROLLOVER ENGINE (Phase 5) START ===
// Pure, deterministic season-rollover model. Depends only on rng/ri/clamp/pick + the data arrays
// FN/LN/STATES/POS/CLASSES (no DOM, no S, no globals beyond those), so test/rolllab.js can extract
// + validate it offline. It graduates seniors, ages + DEVELOPS (ov→pot) the returning roster,
// converts recruiting signees into true-freshman Players, and backfills each position with
// generated 2–3★ depth so a roster holds at ~84. It never re-tapers returning players' ratings
// (the depth taper is a one-time generation artifact), so a developed backup can climb the chart.

// Class ladder: each step advances one year; SR / RS-SR graduate (→ null = off the roster).
const NEXT_CLASS={"FR":"SO","RS-FR":"RS-SO","SO":"JR","RS-SO":"RS-JR","JR":"SR","RS-JR":"RS-SR","SR":null,"RS-SR":null};
// Phase 11: the milestone-relevant box keys we accumulate into p.career (so a graduate can be
// measured by a whole career, not one season). Summed from p.gs at each rollover before gs is wiped.
const CAREER_KEYS=["gp","pYds","pTD","rYds","rTD","reYds","reTD","tkl","sk","dInt"];
// Fold one season's box (gs) into a running career total. Pure; returns the new career object.
function addCareer(career,gs){const c=Object.assign({},career||{});
  for(const k of CAREER_KEYS)if(gs[k])c[k]=(c[k]||0)+gs[k];return c;}
// How fast a class develops toward its ceiling — youth grows fastest, upperclassmen plateau.
const DEV_YOUTH={"FR":1,"RS-FR":1,"SO":0.85,"RS-SO":0.85,"JR":0.6,"RS-JR":0.6,"SR":0.35,"RS-SR":0.35};
// Grow one player's ov toward pot over an offseason. `rate` (~0.8–1.2) folds in facilities/coach.
// Mutates p (ov, attrs, stars); returns the OVR gained. Pot is a true ceiling and never moves.
function developPlayer(p,r,rate){
  const gap=(p.pot||p.ov)-p.ov;
  if(gap<=0)return 0;
  const youth=DEV_YOUTH[p.yr]!=null?DEV_YOUTH[p.yr]:0.5;
  const rt=(rate==null)?1:rate;
  const portion=clamp((0.16+0.20*youth)*rt,0,0.8);
  // random nudge scales with rate too, so a 0-rate (frozen) side genuinely doesn't grow.
  const delta=clamp(Math.round(gap*portion+r()*1.4*clamp(rt,0,2.5)),0,gap);
  if(!delta)return 0;
  p.ov=clamp(p.ov+delta,40,99);
  const ab=Math.round(delta*0.6);
  p.spd=clamp(p.spd+ab,40,99);p.str=clamp(p.str+ab,40,99);p.awr=clamp(p.awr+ab,40,99);
  p.stars=p.ov>=90?5:p.ov>=82?4:p.ov>=72?3:p.ov>=62?2:1;
  return delta;
}
// Generated 2–3★ depth freshman — the unmodeled signees every program lands. Low floor, real
// ceiling so a few develop. Used to backfill positions thinned by graduation back toward target.
function genFreshman(r,prestige,posCode){
  const ov=clamp(Math.round(prestige*0.40+ri(r,-8,7)+20),44,80);
  const pot=clamp(ov+ri(r,5,20),ov,95);
  const tr=genTraits(r);
  return {id:'p'+Math.floor(r()*1e9).toString(36),fn:pick(r,FN),ln:pick(r,LN),pos:posCode,
    yr:'FR',age:18+ri(r,0,1),st:pick(r,STATES),stars:ov>=82?4:ov>=72?3:ov>=62?2:1,
    ov,pot,cap:false,spd:clamp(ov+ri(r,-12,12),40,99),str:clamp(ov+ri(r,-12,12),40,99),
    awr:clamp(ov+ri(r,-14,10),40,99),so:0,mot:tr.mot,comp:tr.comp};
}
// Convert a signed recruit into a true-freshman Player. Blue-chips enter "raw" (ov discounted by
// pedigree) with the recruit's pot as their ceiling, so development carries them up over a career —
// elite recruits can contribute early, most sit and grow. Carries `promise` for Phase 5 honoring.
function recruitToFreshman(rec,r){
  const disc=rec.stars===5?6:rec.stars===4?10:rec.stars===3?14:16;
  const ov=clamp(rec.ov-disc+ri(r,-2,2),44,96);
  const pot=clamp(Math.max(rec.pot||rec.ov,rec.ov),ov,99);
  // Carry the temperament you scouted on the trail (else generate) so the fogged read pays off.
  const tr=(rec.mot!=null&&rec.comp!=null)?{mot:rec.mot,comp:rec.comp}:genTraits(r);
  return {id:'p'+Math.floor(r()*1e9).toString(36),fn:rec.fn,ln:rec.ln,pos:rec.pos,
    yr:'FR',age:18,st:rec.st,stars:rec.stars,ov,pot,cap:false,
    spd:clamp(rec.spd||ov,40,99),str:clamp(rec.str||ov,40,99),awr:clamp(rec.awr||ov,40,99),
    so:0,promise:rec.promise||null,fromRecruit:true,mot:tr.mot,comp:tr.comp};
}
// Roll one team's roster into the next season. `signees` = the prospects that committed to this
// team. Returns the rebuilt roster + a summary (graduated/developed/freshmen). Mutates nothing it
// is given (works on copies); clears p.gs so last season's stats never carry into the new season.
function rolloverRoster(roster,signees,prestige,r,opts){
  opts=opts||{};
  // `rateFor(player)` (Phase 7) gives a per-player dev rate (side/coach specific); else flat opts.rate.
  const rateOf=p=>opts.rateFor?opts.rateFor(p):(opts.rate||1);
  const graduated=[],cont=[];
  roster.forEach(src=>{
    const p=Object.assign({},src);
    // Phase 11: accumulate career milestone totals + peak OVR for EVERY player (incl. graduates),
    // from last season's box, BEFORE it's wiped — so legends carry real lifetime résumés.
    if(p.gs)p.career=addCareer(p.career,p.gs);
    p.peakOv=Math.max(p.peakOv||0,p.ov||0);
    const nx=(p.yr in NEXT_CLASS)?NEXT_CLASS[p.yr]:p.yr;
    if(nx===null){graduated.push(p);return;}        // graduate keeps p.gs as its final-season box
    p.yr=nx;p.age=(p.age||18)+1;
    if('gs' in p)delete p.gs;                       // fresh slate — no season-stat carryover
    p.dev=developPlayer(p,r,rateOf(p));             // record this offseason's OVR gain (UI surfaces it)
    p.peakOv=Math.max(p.peakOv,p.ov);               // peak reflects post-development OVR too
    cont.push(p);
  });
  const freshmen=(signees||[]).map(s=>recruitToFreshman(s,r));
  let out=cont.concat(freshmen);
  // backfill each position toward its target depth with generated 2–3★ freshmen
  POS.forEach(([code,,n])=>{
    let have=out.filter(p=>p.pos===code).length;
    while(have<n){out.push(genFreshman(r,prestige,code));have++;}
  });
  // Scholarship cap (Phase 17): a full national recruiting class can push a roster well past the limit,
  // so trim the weakest DEPTH — only players beyond their position's target (lowest ov first), never a
  // captain — down toward ROSTER_CAP. Every position stays at least target-deep.
  const ROSTER_CAP=85;
  if(out.length>ROSTER_CAP){
    const byPosX={};out.forEach(p=>(byPosX[p.pos]=byPosX[p.pos]||[]).push(p));
    const excess=[];
    POS.forEach(([code,,n])=>{const a=(byPosX[code]||[]).slice().sort((x,y)=>y.ov-x.ov);
      for(let i=n;i<a.length;i++)excess.push(a[i]);});   // depth beyond this position's target
    excess.sort((a,b)=>a.ov-b.ov);                        // cut the weakest first
    const cut=new Set();let over=out.length-ROSTER_CAP;
    for(const p of excess){if(over<=0)break;if(p.cap)continue;cut.add(p);over--;}
    if(cut.size)out=out.filter(p=>!cut.has(p));
  }
  // depth order: best-by-ov per position gets so=0 (no rating taper — returning ratings stand)
  const byPos={};out.forEach(p=>{(byPos[p.pos]=byPos[p.pos]||[]).push(p);});
  Object.values(byPos).forEach(arr=>{arr.sort((a,b)=>b.ov-a.ov);arr.forEach((p,i)=>p.so=i);});
  out.forEach(p=>p.cap=false);
  const field=out.filter(p=>p.pos!=='K'&&p.pos!=='P').sort((a,b)=>b.ov-a.ov);
  if(field[0])field[0].cap=true; if(field[1])field[1].cap=true;
  return {roster:out,graduated,freshmen,trackedCount:freshmen.length};
}
