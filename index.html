      // rather than assert one, which is exactly the case classifyArch was built for.
      const a=classifyArch(o); if(a){o.arch=a.n;o.pur=gen.pur;}
    };
    // S -> FS/SS. Assigned by depth INSIDE each team and alternating, so a roster that had eight
    // safeties still fields both kinds rather than drawing eight of one at random.
    const splitS=roster=>{
      const saf=(roster||[]).filter(p=>p.pos==='S').sort((a,b)=>(a.so||0)-(b.so||0)||String(a.id).localeCompare(String(b.id)));
      saf.forEach((p,i)=>{p.pos=i%2===0?'SS':'FS';});
    };
    (state.world.teams||[]).forEach(t=>{
      splitS(t.roster);
      (t.roster||[]).forEach(fill);
      reRateRoster(t);                 // OVERALL is scheme-weighted, over the new vocabulary
    });
    const poolSplit=pool=>(pool||[]).forEach(p=>{if(p.pos==='S')p.pos=(hashStr('sf|'+(p.id||''))%2)?'FS':'SS';});
    if(state.recruiting&&state.recruiting.pool){poolSplit(state.recruiting.pool);state.recruiting.pool.forEach(fill);}
    if(state.portal&&state.portal.pool){poolSplit(state.portal.pool);state.portal.pool.forEach(fill);}
    recomputeRanks(state.world);
    state.version=48;                  // SIM_MODEL is 7, so pre-Phase-52 games decline replay rather
  }                                    // than re-simming: every channel now reads a different stat.
  return state;
}
// Ranking score: preseason (no games) is pure OVR; once games are played it blends in
// record and point margin so winners climb and undefeated underdogs can crack the polls.
function rankScore(t){
  const ovr=t.ratings.ovr, rec=t.rec;
  if(!rec||(rec.w+rec.l)===0)return ovr;
  const g=rec.w+rec.l, margin=(rec.pf-rec.pa)/g;
  return ovr + (rec.w-rec.l)*5 + clamp(margin,-28,28)*0.4;
}
function recomputeRanks(world){
  const ts=world.teams;
  [...ts].sort((a,b)=>rankScore(b)-rankScore(a)).forEach((t,i)=>t.natRank=i+1);
  const c={},d={};ts.forEach(t=>{(c[t.conf]=c[t.conf]||[]).push(t);const k=t.conf+'|'+(t.div||'');(d[k]=d[k]||[]).push(t);});
  Object.values(c).forEach(a=>{a.sort((x,y)=>rankScore(y)-rankScore(x));a.forEach((t,i)=>t.confRank=i+1);});
  Object.values(d).forEach(a=>{a.sort((x,y)=>rankScore(y)-rankScore(x));a.forEach((t,i)=>t.divRank=i+1);});
}

/* ============================================================
   SEASON ENGINE — schedule, game sim, records, standings  (Phase 2)
   ============================================================ */
const SEASON_WEEKS=15;       // 12 games + ~3 byes, mirrors a real CFB regular season
function emptyRec(){return {w:0,l:0,cw:0,cl:0,pf:0,pa:0,streak:0};}

// Build a full-league schedule: each team ~12 games (conference-weighted), one game per
// week, packed into SEASON_WEEKS. Deterministic from the world seed. (Validated standalone:
// ~11.9 games/team avg, 0 same-week conflicts, no duplicate matchups.)
//
// Phase 8 two-phase: `locked` = this year's non-conference series legs ({home,away,neutral}). They
// are seeded as fixed edges (forced host) FIRST, then the conference/auto slate fills around them and
// both are edge-colored into weeks together. With no series the path is byte-identical to before.
function genSchedule(world,seed,locked){
  const ids=world.teams.map(t=>t.id);
  const confOf={};world.teams.forEach(t=>confOf[t.id]=t.conf);
  const r=rng((seed^0x5ca1ab1e)>>>0);
  const TARGET=12;
  const pri=new Map(ids.map(id=>[id,r()]));          // random per-team key → seed-varied slate
  const adj=new Map(ids.map(id=>[id,new Set()]));
  const deg=id=>adj.get(id).size;
  // 0) lock series legs as fixed edges (forced host) before the auto-fill
  const lockMap=new Map();
  (locked||[]).forEach(L=>{if(!adj.has(L.home)||!adj.has(L.away)||L.home===L.away)return;
    if(adj.get(L.home).has(L.away))return;
    const k=L.home<L.away?L.home+'|'+L.away:L.away+'|'+L.home;
    adj.get(L.home).add(L.away);adj.get(L.away).add(L.home);lockMap.set(k,L);});
  // 1) pick matchups: repeatedly connect the neediest team to a same-conference (then any)
  //    opponent it hasn't played, until everyone has ~12 games.
  let guard=ids.length*TARGET*6;
  while(guard-->0){
    const need=ids.filter(id=>deg(id)<TARGET);
    if(need.length<2)break;
    need.sort((a,b)=>deg(a)-deg(b)||pri.get(a)-pri.get(b));
    const A=need[0],an=adj.get(A);
    let cands=need.filter(B=>B!==A&&!an.has(B));
    if(!cands.length){cands=ids.filter(B=>B!==A&&!an.has(B)&&deg(B)<TARGET);if(!cands.length)break;}
    const sameConf=cands.filter(B=>confOf[B]===confOf[A]);
    const pool=sameConf.length?sameConf:cands;
    pool.sort((a,b)=>deg(a)-deg(b)||pri.get(a)-pri.get(b));
    const B=pool[0];adj.get(A).add(B);adj.get(B).add(A);
  }
  // 2) assign each matchup to the lowest week free for both teams (greedy edge-coloring).
  const matchups=[];const seen=new Set();
  ids.forEach(A=>adj.get(A).forEach(B=>{const k=A<B?A+'|'+B:B+'|'+A;
    if(!seen.has(k)){seen.add(k);matchups.push({A,B,d:deg(A)+deg(B),key:r(),ha:r(),lock:lockMap.get(k)||null});}}));
  matchups.sort((m,n)=>(n.lock?1:0)-(m.lock?1:0)||n.d-m.d||m.key-n.key);   // locked first, then hardest
  const busy=new Map(ids.map(id=>[id,new Set()]));
  const games=[];let gi=0;
  matchups.forEach(m=>{
    let wk=-1;
    for(let w=0;w<SEASON_WEEKS;w++){if(!busy.get(m.A).has(w)&&!busy.get(m.B).has(w)){wk=w;break;}}
    if(wk<0)return;                              // couldn't place → mutual bye (rare)
    busy.get(m.A).add(wk);busy.get(m.B).add(wk);
    const home=m.lock?m.lock.home:(m.ha<0.5?m.A:m.B),away=m.lock?m.lock.away:(m.ha<0.5?m.B:m.A);
    const g={id:'g'+(gi++).toString(36),week:wk+1,home,away,played:false,hs:null,as:null};
    if(m.lock){if(m.lock.rivalry)g.rivalry=true;else{g.series=true;if(m.lock.neutral)g.neutral=true;}}   // Phase 40: rivalry locks aren't series
    games.push(g);
  });
  return {weeks:SEASON_WEEKS,games};
}
// This year's series legs (Phase 8), as locked schedule edges for genSchedule.
function seriesLegsForYear(year){
  const out=[];(S.series||[]).forEach(s=>(s.legs||[]).forEach(l=>{
    if(l.year===year&&teamById(l.home)&&teamById(l.away))out.push({home:l.home,away:l.away,neutral:!!l.neutralSite});}));
  return out;
}

function teamById(id){return S.world.teams.find(t=>t.id===id);}
function teamGame(teamId,week){return S.schedule?S.schedule.games.find(g=>g.week===week&&(g.home===teamId||g.away===teamId)):null;}
function teamGames(teamId){return S.schedule?S.schedule.games.filter(g=>g.home===teamId||g.away===teamId).sort((a,b)=>a.week-b.week):[];}
function lastGameFor(teamId){const gs=teamGames(teamId).filter(g=>g.played);return gs.length?gs[gs.length-1]:null;}

function startSeason(){
  S.schedule=genSchedule(S.world,S.seed,seriesLegsForYear(S.year||2026).concat(rivalLegsForYear(S.year||2026)));
  S.world.teams.forEach(t=>t.rec=emptyRec());
  S.weeklyHonors=[];
  S.phase='Regular Season';S.week=1;S.lastPlayedWeek=0;
  S.world.teams.forEach(t=>(t.legends||[]).forEach(l=>l.app=LEGEND_APPS));   // refresh alumni appearances
  initRecruiting();
  S.world.teams.forEach(t=>{t.mediaBuzz=0;});   // Phase 19b: press-conference recruiting buzz resets each year
  controlled().roster.forEach(p=>{delete p.morale;});   // Phase 20: a fresh, neutral locker room each season
  // Phase 32: a training camp leaves a mark on the opening-week mood — a light camp opens fresh, a
  // grueling one opens worn down (decays back to neutral over a few weeks). Then the camp is spent.
  if(S.camp){const seed=campMoraleSeed(S.camp.plan);
    if(seed)controlled().roster.forEach(p=>{p.morale=clamp(MORALE_DEF+seed,0,100);});
    S.camp=null;}
  recomputeRanks(S.world);
  initMedia();                 // Phase 19: a fresh preseason AP poll + an empty news feed
  if(S.coach)S.coach.mandate=seasonMandate(controlled().prestige,S.coach.tenure||0);   // Phase 42: the AD's goal for the year
  if(S.coach)S.coach.jobOffers=null;   // Phase 44: any un-taken poach-up offers lapse once you kick off
  setWeeklyTask();
  autosave();
}

// === SIM ENGINE (Phase 3) START ===
// Drive/play state machine. Pure + deterministic from `seed`: simEngine(home,away,seed)
// returns { hs, as, box } and never mutates its inputs, so re-running reproduces the same
// score AND the same per-player box. `box` maps playerId -> stat deltas for ONE game; the
// season layer folds it into each player's season totals (see applyResult). Depends only on
// rng/clamp/ri (no DOM, no globals) so test/simlab.js can extract + validate it offline.
//
// Coordinate: `los` = offense's own yard line, 0..100, scoring end at 100. Possession flips
// by mirroring (opp los = 100 - los). Efficiency is driven by (offense.off - defense.def)
// in rating points, plus a small home-field bump to the home offense.

// === Phase 51 — the attribute channels. `ov` is a derived readout of six attributes, so the Phase 23
// matchEdge already carries "who is better" in aggregate. These channels do NOT restate that; each one
// targets a part of a play that had NO per-matchup term at all before, so nothing is counted twice:
//
//   SPEED      the TAIL of the gain draw — it never raises the average gain, it lengthens the good
//              ones — plus separation on deep routes. Speed does not make you gain more often; it
//              makes the ones you do gain hurt.
//   AGILITY    the short area: separation underneath, mirroring in coverage, elusiveness.
//   STRENGTH   the FLOOR (stuffs, short yardage, power through contact) and pass PROTECTION — before
//              this the offensive line touched no run or pass outcome at all, only penalties.
//   AWARENESS  mistakes ONLY, never yardage: interceptions, sacks taken, fumbles — and it blunts the
//              Phase 46 play-concept bonuses, so a sharp defender is not fooled by play action.
//   BALL SKILLS the catch point and the takeaway.
//   DURABILITY injury resistance and how late fatigue bites — both were flat for every player.
//
// Deliberately NOT wired: penalties. Phase 49 keys foul propensity off composure ALONE because
// measured discipline is flat across team quality (top-10 5.87 flags, unranked 5.99). Awareness
// correlates with quality, so letting it in would recreate "good teams are clean teams" — which the
// measurement forbids. See docs/reference/cfb-penalties.md.
//
// Self-contained (its own attribute list + accessor) so the SIM block keeps its "depends only on
// rng/clamp/ri" property and the node labs can still extract it standalone.
const SIM_ATTRS=['spd','acc','agi','str','awr','iq','dur','thp','tha','tor','elu','btk','car','cth','rte',
                 'rbk','pbk','prs','rst','mcv','zcv','tkl','kpw','kac'];
// The subset the depth-weighted POOL means are computed over — every attribute a channel below reads

//   1. THE SITUATION IS REAL. Late and within one score, offense gets measurably harder — and it

// Pure, deterministic recruiting model. Depends only on rng/ri/clamp/pick/hashStr and the data
// arrays FN/LN/STATES/POS (no DOM, no S, no globals beyond those), so test/reclab.js can extract
// + validate this block offline. The "team" shape it reads is just { id, prestige, needs? }.
//
// A prospect (recruit) carries `iv` = interest keyed by suitor team id (a handful of suitors).
// Each week every suitor's interest grows by a fit-based increment; a prospect commits to its
// leading suitor once interest clears a threshold with a margin, gated by a readiness ramp +
// star "patience". The player team is just another suitor for *passive* growth — actions are the
// lever on top (applied outside this block). Landing = a prospect commits to you.

const PREFS=['playingTime','nil','winning','development','home','academics'];
// Pitch angles map 1:1 to prefs. [key, label, blurb]
const PITCH_ANGLES=[
  ['playingTime','Playing Time','Early reps — a path to start.'],
  ['nil','NIL Money','Top collective, real brand deals.'],
  ['winning','Win Now','Compete for titles immediately.'],
  ['development','Development','We send talent to the next level.'],
  ['home','Stay Home','Play close to family and friends.'],
  ['academics','Academics','A degree that sets up life after ball.']];
// Tuning — tweaked in test/reclab.js.
// Phase 33: BASE_POINTS is now a small floor; the weekly budget is dominated by the scouting facility
// (see weeklyPoints / aiBudget). AI_* drive the AI recruiting brain's concentrated weekly effort.
const REC={POOL:3400,COMMIT_THRESH:68,LEAD_GAP:7,CLASS_CAP:25,BASE_POINTS:6,SLOTS:16,DECOMMIT_GAP:18,
  AI_BASE:6,AI_PER:1.4,AI_COST:4,AI_SCOUT_TGT:50,AI_SCOUT_GAIN:22,AI_SCOUT_P:0.3,NEGLECT_DECAY:3.5,
  AI_VISIT_P:0.25,FINALISTS:4,FINAL_READY:0.55,FINAL_BAR:58};

// Coach archetype/history effects — Phase 4 is the first system to apply them. Returns a bag of
// multipliers/bonuses used by the weekly economy + the player's recruiting actions.
function coachMods(coach){
  const m={points:0,slots:0,scout:1,pitch:1,visit:1,prestige:0,homeBonus:1,nil:1,devPitch:1,
    homeState:(coach&&coach.homeState)||null};
  const A=coach&&coach.archetype, H=coach&&coach.history;
  if(A==='Recruiter'){m.points+=6;m.slots+=6;m.pitch*=1.25;m.visit*=1.15;}
  else if(A==='Motivator'){m.visit*=1.25;m.pitch*=1.1;}
  else if(A==='Manager'){m.points+=2;m.nil*=1.35;}
  else if(A==='Offensive Genius'||A==='Defensive Genius'){m.devPitch*=1.3;}
  if(H==='Former Player'){m.visit*=1.2;m.pitch*=1.1;}
  else if(H==='NFL Transplant'){m.prestige+=10;m.slots-=3;}
  else if(H==='High School Legend'){m.homeBonus*=1.8;}
  else if(H==='Analyst'){m.scout*=1.6;m.pitch*=0.92;}
  else if(H==='Lifer'){m.points+=2;}
  else if(H==='Coordinator'){m.pitch*=1.05;}

// How well a team fits a prospect (0..~1.1): prestige proximity to the recruit's tier, with a
// floor for programs above the tier (they can always take down-tier talent), plus a needs nudge.
function recruitFit(team,rec){
  const target=rec.stars>=5?88:rec.stars===4?70:rec.stars===3?50:32;
  let prox=clamp(1-Math.abs(team.prestige-target)/50,0,1);
  if(team.prestige>=target)prox=Math.max(prox,0.72+Math.min(team.prestige-target,22)/110);
  const need=(team.needs&&team.needs[rec.pos])?0.12:0;
  // Facilities nudge fit (Phase 6 wiring): a strong NIL collective helps everywhere; academics
  // matters to recruits who value it. Guarded so fac-less teams (the recruit lab) are unaffected.
  let fac=0;
  if(team.fac){
    fac+=((team.fac.nil||5)-5)*0.012;
    if(rec.prefs&&rec.prefs.indexOf('academics')>=0)fac+=((team.fac.academics||5)-5)*0.014;
  }
  // AI geography (Phase 8): an in-state program is a stronger fit. Guarded so home-state-less
  // teams (the recruit lab) are unaffected. The player also feels this via coach.homeState.
  if(team.homeState&&rec.st&&team.homeState===rec.st)fac+=0.10;
  // Program legacy (Phase 11): a storied Ring of Honor draws talent on name alone. Small + clamped
  // so it complements prestige, never replaces it. Guarded so legend-less teams (recruit lab) unaffected.
  if(team.legends&&team.legends.length)fac+=legacyAura(team);
  // Postseason momentum (Phase 12): a deep playoff run / bowl win lifts next year's recruiting.
  if(team.postseasonBoost)fac+=team.postseasonBoost;
  // Draft factory (Phase 13): a program that produces high picks at this position pulls recruits there
  // (a rebel is repelled). Guarded so factory-less teams (the recruit lab) are unaffected.
  if(team.factory)fac+=factoryPull(team,rec);
  // Media buzz (Phase 19b): press-conference hype is a small standing recruiting nudge. Guarded.
  if(team.mediaBuzz)fac+=clamp(team.mediaBuzz,0,0.1);
  return clamp(prox+need+fac,0,1.2);
}
// Class-ranking value of a landed prospect, and a team's total class score. Phase 17: the whole national
// class is now modeled, so the score is the real sum of landed value (a small prestige term is kept only
// as a tiebreaker so equal classes order deterministically — it no longer stands in for a faked tail).
function recruitValue(rec){return rec.stars*rec.stars*2+Math.max(0,rec.ov-70);}
function classScore(team,pool){
  let s=(team.prestige||50)*0.1;
  for(const r of pool)if(r.committedTo===team.id)s+=recruitValue(r);
  return Math.round(s);
}
// Build the FULL national recruiting class (~3,400 — roughly 134 teams × a 25-man class), deterministic
// from the world seed (Phase 17). Star mix is top-heavy: a handful of 5★, a few hundred 4★, then a long
// 3★/2★ tail that fills out every program's board.
function genRecruits(seed,teams){

    // (commitment windows are a blue-chip behaviour, interest targets key off the tier), and a
    // service ranking that moved those would not be a ranking any more — it would be ability. `svc`
    // is what the board shows you; `stars` remains what he actually is.

    const rid='r'+i.toString(36)+(seed>>>0).toString(36).slice(-2);

    // (Phase 13). Keyed on a per-recruit rng (NOT the pool stream), so the board stays byte-identical.
    const rebel=rng((hashStr(rid+'reb'))>>>0)()<0.12;

      scout:0,prefs:[p1,p2],iv,committedTo:null,signed:false,offered:false,visited:false,promise:null},

      // are — so the profile adds no draws and every prospect's stars/ov/pot/suitors are decided
      // independently of it. The three inline `ri(r,…)` draws the old spd/str/awr consumed are gone

      genProfile(rng(hashStr(rid+'attr')),ov,pos)));

// Phase 33: the AI recruiting brain. Each AI program gets a weekly point budget scaled by its SCOUTING
// facility (aiBudget), then spends it on a few PRIORITY targets — discrete, concentrated weekly effort
// (a real "push" on the recruits it most wants + can win), rather than only flat passive growth. So a
// rival pouring resources into a kid shows up as a visible interest spike, and a strong scouting program
// recruits harder. Pure + deterministic from the week's rng. Guarded for fac-less lab teams (default 5).
function aiBudget(team){const sc=(team&&team.fac&&team.fac.scouting)||5;let b=REC.AI_BASE+sc*REC.AI_PER;

  // Centered at .500 (neutral), bounded; guarded for rec-less lab teams so the convergence cycle is unchanged.
  if(team&&team.rec){const g=(team.rec.w||0)+(team.rec.l||0);if(g>=3)b*=clamp(0.8+(team.rec.w/g)*0.4,0.8,1.2);}

// (or the field) know well lands more than blind recruiting. Pure upside (×1.0 unscouted → ×1.3 fully
// scouted), so the scout=0 baseline is byte-identical to the pre-scout-payoff envelope. Shared `rec.scout`
// is raised by ANYONE scouting (player intent or the AI brain), so heavily-recruited blue-chips become
// well-known to everyone while the deep tail stays foggy (the player's scouting edge).
function recScoutMult(rec){return 1+0.3*((rec.scout||0)/100);}

// base interest nudge from the controlled team's game (a ranked win is huge; a blowout loss stings). The app
// scales it by proximity (in-state recruits feel it more) and applies it to your board. Bounded.
function gameRecruitVibe(my,opp,myRank,oppRank,rivalry){

  if(rivalry)v+=win?3:-2;                                                       // Phase 40: a rivalry result echoes on the trail

// Phase 35 — diminishing returns: repeating the SAME action on the same recruit pays less, so it's better to
// vary your approach than to spam one pitch. Pure: a falloff multiplier for the (n)th prior use of an action.
function repeatFalloff(n){return clamp(1/(1+0.35*(n||0)),0.4,1);}
// Phase 37 — NIL bid: money buys interest, more for a recruit who values NIL. Pure money→interest curve;
// the app applies the recruit's NIL preference (nilWeight) and the program's collective facility. amountM = $M.
function nilGain(amountM,nilWeight){return clamp(amountM,0,8)*3.2*clamp(nilWeight,0.2,1.6);}

function aiPriority(team,rec){const need=(team.needs&&team.needs[rec.pos])?6:0;

// Advance one recruiting week: grow every suitor's interest, run the AI recruiting brain's concentrated

// cycle reproduces. During the season a commitment is a VERBAL (`committedTo` set, `signed` stays false);
// only the `finalize` pass (National Signing Day, in the offseason) forces the remaining undecided to pick
// their leader AND turns every verbal into a binding signature. Respects a per-team class cap. The player's
// own team (`playerTeamId`, Phase 33) is SKIPPED by the AI brain — his actions are applied by the app
// before this runs. Mutates `pool`; returns the week's new commits (incl. flips, each tagged with a

  const byId={};teams.forEach(t=>byId[t.id]=t);

  const counts={};pool.forEach(p=>{if(p.committedTo)counts[p.committedTo]=(counts[p.committedTo]||0)+1;

      const fit=recruitFit(t,rec);

  });
  // 1.5) AI concentrated effort (Phase 33): each AI team spends a scouting-facility budget on its top
  //      priority targets — the discrete weekly actions the player also takes (applied app-side, before
  //      this). Skips the player's team + any prospect the team has already committed (it chases the
  //      uncommitted + rivals' flippable verbals). No-op on the finalize (Signing Day) resolution pass.
  if(!finalize){

      // (two actions' budget for ~2.2× the gain), a visible swing that mirrors the player's visit.
      if(targets.length&&r()<REC.AI_VISIT_P&&budget>=REC.AI_COST*2&&(targets[0].rec.scout||0)>=REC.AI_SCOUT_TGT){
        const rec=targets.shift().rec;budget-=REC.AI_COST*2;
        rec.iv[tid]=clamp((rec.iv[tid]||0)+aiActionGain(t,rec,r)*recScoutMult(rec)*2.2,0,100);
      }
      for(const {rec} of targets){
        if(budget<REC.AI_COST)break;budget-=REC.AI_COST;
        // One action per target this week: SCOUT an under-evaluated recruit (a minority of the time — raises
        // the shared read + makes later pitches land harder), else PITCH, amplified by how well he's scouted.
        // Probabilistic so a team spreads scouting across its targets without spending its whole budget on it
        // — the budget stays mostly on pitches, so a strong scouting program still out-recruits, while
        // contested recruits accumulate evaluation from their many suitors over the cycle.
        if((rec.scout||0)<REC.AI_SCOUT_TGT&&r()<REC.AI_SCOUT_P)rec.scout=clamp((rec.scout||0)+REC.AI_SCOUT_GAIN,0,100);
        else rec.iv[tid]=clamp((rec.iv[tid]||0)+aiActionGain(t,rec,r)*recScoutMult(rec),0,100);
      }
    }
  }
  const out=[];
  // 2) decommits — a VERBAL commitment can FLIP to a rival who has pulled clearly ahead. In-season only:
  //    firm verbals lock at the Early Signing Period, so a finalize pass never flips. Signed never flip.
  if(!finalize){
    pool.forEach(rec=>{
      if(!rec.committedTo||rec.signed)return;
      const cur=rec.iv[rec.committedTo]||0;
      let best=null,bestV=-1;
      for(const tid in rec.iv){if(tid===rec.committedTo||!isFinalist(rec,tid))continue;const t=byId[tid];if(!t||full(tid))continue;
        if(rec.iv[tid]>bestV){bestV=rec.iv[tid];best=tid;}}
      if(best&&(bestV-cur)>=REC.DECOMMIT_GAP){
        const prob=clamp((bestV-cur-REC.DECOMMIT_GAP)/40,0.04,0.5);   // the further ahead, the likelier the flip
        if(r()<prob){
          counts[rec.committedTo]=(counts[rec.committedTo]||1)-1;
          rec._flipped={from:rec.committedTo,to:best};
          rec.committedTo=best;counts[best]=(counts[best]||0)+1;
          out.push(rec);
        }
      }

  }
  // 3) commitments — verbal during the season; binding only on the finalize (Signing Day) pass. Only a
  //    FINALIST can land him (Phase 36) — cut suitors are out of the running.
  const last=!!finalize;
  pool.forEach(rec=>{

    // (rec.decideWeek). When the window elapses he commits to whoever LEADS then — so a rival (or you) can
    // still make a final push during the window. The finalize pass commits any pending window immediately.
    if(rec.decideWeek!=null){if(last||week>=rec.decideWeek)commit();return;}
    if(last){if(lead>=bar&&(lead-second)>=gap)commit();return;}   // toss-ups (small gap) wait for the next pass

// Phase 34 (legibility): turn a board recruit's week — what you did + how interest moved + who's pushing —
// into a readable one-line reaction. Pure + deterministic (no rng, no DOM, no S): the app computes the diff
// `c` and this returns `{text, tone}` (tone ∈ 'good'|'bad'|'warn'|'neutral'). The headline ladder puts the
// urgent/decisive events (commits, decommits, a rival pulling ahead) above your action's result.
function recruitReaction(c){
  if(c.committedMine)return {text:'💚 Committed to you!',tone:'good'};
  if(c.flippedToMe)return {text:'🔁 Flipped his commitment to you!',tone:'good'};
  if(c.flippedAway)return {text:'💔 Decommitted — flipped to '+(c.rivalAbbr||'a rival'),tone:'bad'};
  // a rival making a hard push and sitting ahead of you is the key "cooling" signal
  if(c.rivalDelta>=10&&c.rivalLeads&&c.myDelta<c.rivalDelta)
    return {text:'⚠️ Cooling — '+(c.rivalAbbr||'a rival')+' is pushing hard',tone:'warn'};
  // your action this week landed (or didn't)
  if(c.action==='visit')return c.myDelta>=14?{text:'🔥 The official visit made a big impression',tone:'good'}:{text:'The visit went all right',tone:'neutral'};
  if(c.action==='promise')return {text:'🤝 Your promise resonated',tone:'good'};
  if(c.action==='alumni')return {text:'⭐ The alumni visit landed',tone:'good'};
  if(c.action==='pitch'){
    const a=c.angleLabel||'pitch';
    if(c.prefMatch===0)return c.myDelta>=9?{text:'🔥 Loved your '+a+' pitch — exactly what he wants',tone:'good'}:{text:'Your '+a+' pitch landed',tone:'good'};
    if(c.prefMatch===1)return {text:'Your '+a+' pitch got through',tone:'good'};
    return {text:'The '+a+' pitch didn’t move the needle — not his priority',tone:'neutral'};

// Pure, deterministic official-visit weekend model. Depends only on clamp (no rng/DOM/S) so
// test/visitlab.js extracts + evals it. Official visits are tied to HOME-game weekends; a weekend's
// QUALITY (the billing/atmosphere) scales the interest boost — a marquee top-10 clash sways a recruit
// far more than a cupcake. weekendQuality is a multiplier CENTERED ≈ 1.0 over a representative slate
// (the neutral case — unranked opp, mid prestige, unranked me — is ≈ 1.0), so it REPLACES the old flat
// ×1.5 game-day bonus without moving the visit-interest envelope; the app multiplies VISIT_BASE × q.
const VISIT_TIERS=['Quiet','Solid','Big','Marquee'];   // label ladder by quality
// rankPull(rank): a ranked team (1..25) contributes a saturating bump; #1 fullest, fading out past ~25.
function rankPull(rank){if(!rank||rank>25)return 0;return clamp((26-rank)/25,0,1);}   // 1.0 at #1 → 0.04 at #25 → 0 unranked

function weekendQuality(o){o=o||{};

  const prestige=clamp(((o.oppPrestige==null?60:o.oppPrestige)-60)/30,-1,1)*0.15;   // a blueblood draws even unranked

// Tier label from the quality multiplier (thresholds picked so the neutral ~1.0 reads "Solid").
function weekendTier(q){return q>=1.45?VISIT_TIERS[3]:q>=1.18?VISIT_TIERS[2]:q>=0.92?VISIT_TIERS[1]:VISIT_TIERS[0];}

// The sim wipes p.gs every rollover, so — like the Ring of Honor — records must be CAPTURED as games and
// seasons resolve into a persistent ledger (S.records). This block owns the CATEGORY REGISTRY + the
// "keep the max" primitive; the app captures values into it at each advance / at rollover.

// Each def: {key, label, stat, unit}. `stat` = the box/career key it reads. Buckets: game / season / career / team.
const RECORD_DEFS={
  game:[
    {key:'g_pyds',label:'Passing yards',stat:'pYds',unit:'yds'},{key:'g_ptd',label:'Passing TDs',stat:'pTD',unit:'TD'},
    {key:'g_ryds',label:'Rushing yards',stat:'rYds',unit:'yds'},{key:'g_rtd',label:'Rushing TDs',stat:'rTD',unit:'TD'},
    {key:'g_reyds',label:'Receiving yards',stat:'reYds',unit:'yds'},{key:'g_retd',label:'Receiving TDs',stat:'reTD',unit:'TD'},
    {key:'g_tkl',label:'Tackles',stat:'tkl',unit:'tkl'},{key:'g_sk',label:'Sacks',stat:'sk',unit:'sk'},
    {key:'g_int',label:'Interceptions',stat:'dInt',unit:'INT'}
  ],
  season:[
    {key:'s_pyds',label:'Passing yards',stat:'pYds',unit:'yds'},{key:'s_ptd',label:'Passing TDs',stat:'pTD',unit:'TD'},
    {key:'s_ryds',label:'Rushing yards',stat:'rYds',unit:'yds'},{key:'s_rtd',label:'Rushing TDs',stat:'rTD',unit:'TD'},
    {key:'s_reyds',label:'Receiving yards',stat:'reYds',unit:'yds'},{key:'s_retd',label:'Receiving TDs',stat:'reTD',unit:'TD'},
    {key:'s_tkl',label:'Tackles',stat:'tkl',unit:'tkl'},{key:'s_sk',label:'Sacks',stat:'sk',unit:'sk'},
    {key:'s_int',label:'Interceptions',stat:'dInt',unit:'INT'}
  ],
  career:[
    {key:'c_pyds',label:'Career passing yards',stat:'pYds',unit:'yds'},{key:'c_ptd',label:'Career passing TDs',stat:'pTD',unit:'TD'},
    {key:'c_ryds',label:'Career rushing yards',stat:'rYds',unit:'yds'},{key:'c_reyds',label:'Career receiving yards',stat:'reYds',unit:'yds'},
    {key:'c_tkl',label:'Career tackles',stat:'tkl',unit:'tkl'},{key:'c_sk',label:'Career sacks',stat:'sk',unit:'sk'}
  ],
  team:[
    {key:'t_gpts',label:'Points in a game',unit:'pts'},{key:'t_gmargin',label:'Largest margin of victory',unit:'pts'},
    {key:'t_spts',label:'Points in a season',unit:'pts'},{key:'t_swins',label:'Wins in a season',unit:'wins'}
  ]
};
const RECORD_BUCKETS=['game','season','career','team'];
function emptyRecords(){const o={};RECORD_BUCKETS.forEach(b=>o[b]={});return o;}
// Keep the max. Returns {broke, prev} — broke true when `value` sets a NEW record (STRICTLY beats, and >0),
// so a tie keeps the original holder. `meta` is the holder snapshot ({value} is added).
function applyRecord(records,bucket,key,value,meta){
  if(!records[bucket])records[bucket]={};
  const prev=records[bucket][key];
  if(value>0&&(!prev||value>prev.value)){records[bucket][key]=Object.assign({value},meta);return {broke:true,prev};}
  return {broke:false,prev};
}
// === RECORD ENGINE (Phase 41) END ===

// === CONTRACT ENGINE (Phase 42) START ===
// AD expectations + the coach's contract. Pure (depends only on clamp), so test/contractlab.js validates
// it offline. Each preseason the AD sets a prestige-scaled MANDATE (make a bowl, win the conference, reach
// the playoff…); meeting or missing it feeds the existing approval / hot-seat machinery (Phase 19) and
// governs contract extensions vs. non-renewal. The contract (years / salary / buyout) is a real GM number —
// the salary is folded into the controlled team's finances (resolveFinances), so a big deal costs the program.

// Mandate tiers, easiest → hardest. Each maps to what "met" means (a win threshold, or a postseason result).
const MANDATE_TIERS=['progress','winning','bowl','conf','playoff'];
const MANDATE_DEFS={
  progress:{kind:'wins',label:'Show progress'},
  winning:{kind:'wins',label:'Post a winning season'},
  bowl:{kind:'bowl',label:'Reach a bowl game'},
  conf:{kind:'conf',label:'Win the conference'},
  playoff:{kind:'playoff',label:'Make the College Football Playoff'}
};
// Which tier a program of this prestige demands. The FIRST TWO years are a honeymoon — one notch easier —
// so early variance (or a rebuild) doesn't spiral a coach out the door. Baseline tiers are deliberately
// modest: most good programs are asked to reach a bowl, not to win it all every year (only true bluebloods
// carry conf/playoff mandates), so a solid-but-not-elite season isn't an automatic failure.
function mandateTier(prestige,tenure){
  const p=prestige||50; let i=p>=90?4:p>=87?3:p>=52?2:p>=42?1:0;
  if((tenure||0)<2&&i>0)i--;
  return MANDATE_TIERS[i];
}
// Win threshold for the wins-based tiers. Kept monotonic with difficulty (progress ≤ winning) so the
// honeymoon expiring never RAISES the win bar — the old "6→7 after a bad year" ratchet is gone.
function mandateWins(tier,prestige){
  if(tier==='progress')return clamp(Math.round((prestige||40)/12)+1,3,5);
  if(tier==='winning')return 6;
  return 0;
}
function seasonMandate(prestige,tenure){
  const tier=mandateTier(prestige,tenure),def=MANDATE_DEFS[tier],wins=mandateWins(tier,prestige);
  const label=def.kind==='wins'?(tier==='progress'?'Win at least '+wins+' games':'Post a winning season ('+wins+'+ wins)'):def.label;
  return {tier,kind:def.kind,wins,label};
}
// Grade the season against the mandate. ctx: {w, l, bowl, confTitle, playoff, natTitle}. Higher goals
// subsume lower. Returns {met, grade:'met'|'near'|'miss', detail}: a MISS that still cleared a respectable
// bar (bowl-eligible, or within 2 wins of a wins goal) is graded 'near' — a small sting, not a full failure,
// so a good-not-great season no longer tanks the seat.
function evaluateMandate(m,ctx){
  if(!m)return {met:true,grade:'met',detail:''};
  ctx=ctx||{};let met=false;
  if(m.kind==='playoff')met=!!(ctx.playoff||ctx.natTitle);
  else if(m.kind==='conf')met=!!(ctx.confTitle||ctx.playoff||ctx.natTitle);
  else if(m.kind==='bowl')met=!!(ctx.bowl||ctx.confTitle||ctx.playoff||(ctx.w||0)>=6);
  else met=(ctx.w||0)>=(m.wins||0);
  let grade;
  if(met)grade='met';
  else{
    const respectable=!!(ctx.bowl||ctx.confTitle||ctx.playoff||(ctx.w||0)>=6||(m.kind==='wins'&&(ctx.w||0)>=(m.wins||0)-2));
    grade=respectable?'near':'miss';
  }
  return {met,grade,detail:(met?'Delivered':grade==='near'?'Just short':'Fell short')+' ('+(ctx.w||0)+'–'+(ctx.l||0)+')'};
}
// The approval swing from the mandate (folded into the season-end settle). Accepts a grade
// ('met'|'near'|'miss') — or a boolean for back-compat (true='met', false='miss'). A clean MISS stings
// (a tougher mandate more); a 'near' is only a light sting; meeting it rewards. Bounded.
function mandateApprovalDelta(grade,tier){
  const w={progress:4,winning:4,bowl:5,conf:6,playoff:8}[tier]||4;
  const g=grade===true?'met':grade===false?'miss':grade;
  if(g==='met')return w;
  if(g==='near')return -Math.max(2,Math.round(w*0.4));
  return -(w+2);
}
// The contract you're handed at a job. A blueblood job is longer + better paid. salary in $.
function initialContract(prestige){
  const p=prestige||50,years=p>=80?5:p>=62?4:3;
  return {years,yearsLeft:years,salary:Math.round((1.4+(p/100)*6)*1e6)};
}
// What the school owes to fire you now (~60% of the money left on the deal).
function buyoutOf(c){return Math.round(((c&&c.salary)||0)*((c&&c.yearsLeft)||0)*0.6);}
// An extension offer, or null. Offered when you've MET the mandate and are at least secure — and either the
// deal is running down (≤2 yrs) or you had a standout year (approval ≥72, a bigger bump).
function contractExtension(prestige,approval,met,yearsLeft){
  if(!met||approval<50)return null;
  const big=approval>=72;
  if((yearsLeft||0)>2&&!big)return null;
  return {addYears:big?3:2,raise:big?1.25:1.12,big};
}
// === CONTRACT ENGINE (Phase 42) END ===

// === REALIGN ENGINE (Phase 43) START ===
// Conference realignment. Pure + deterministic from (seed, year) (depends on rng/hashStr), so
// test/realignlab.js validates it offline. Realignment comes in WAVES (a seeded per-year chance, not every
// year); in a wave the strongest conferences (the "power" tier, by average member prestige) POACH the best
// available risers from weaker leagues — a program that has climbed the prestige ladder gets invited up.
// Bounded (a handful of moves per wave, a size cap on the poachers, a size floor on the sources) so the
// league reaches equilibrium (super-conferences fill, then stop) rather than collapsing. App layer mutates
// team.conf at rollover; everything downstream (scheduling, championships, revenue, awards) reads it live.
const REALIGN={CHANCE:0.30, POWER_CONFS:4, POWER_CAP:20, MIN_CONF:6, MAX_MOVES:4, POACH_BAR:72};
// Is `year` a realignment year? Deterministic per (seed, year). ~CHANCE of the time.
function isRealignYear(seed,year){return rng((seed^hashStr('realign'+year))>>>0)()<REALIGN.CHANCE;}
// The wave's moves. `teams` = [{id, conf, prestige}]. Returns [{id, from, to}] (empty off-wave). Pure.
// The power conferences take turns (strongest first) grabbing the top remaining riser from a weaker league.
function realignMoves(teams,seed,year){
  if(!isRealignYear(seed,year))return [];
  const byConf={};teams.forEach(t=>(byConf[t.conf]=byConf[t.conf]||[]).push(t));
  const confs=Object.keys(byConf).map(c=>({name:c,size:byConf[c].length,power:byConf[c].reduce((s,t)=>s+(t.prestige||50),0)/byConf[c].length}));
  confs.sort((a,b)=>b.power-a.power||(a.name<b.name?-1:1));
  // The power tier = the top conferences by average prestige — but only REAL leagues (≥ MIN_CONF members;
  // a tiny 2-team conf with a high average isn't a super-conference). Independent (Notre Dame's own deal) is
  // never a poacher or a destination, but a strong independent CAN be poached up.
  const powerNames=confs.filter(c=>c.name!=='Independent'&&c.size>=REALIGN.MIN_CONF).slice(0,REALIGN.POWER_CONFS).map(c=>c.name);
  const powerSet=new Set(powerNames);
  const sizeOf={};Object.keys(byConf).forEach(c=>sizeOf[c]=byConf[c].length);
  const moves=[],moved=new Set();
  let progress=true;
  while(moves.length<REALIGN.MAX_MOVES&&progress){
    progress=false;
    for(const name of powerNames){
      if(moves.length>=REALIGN.MAX_MOVES)break;
      if(sizeOf[name]>=REALIGN.POWER_CAP)continue;
      // candidates: not already in a power conf, not already moved, a real riser, and leaving keeps the
      // source at/above the floor (Independent has no floor — it can always be raided).
      const cand=teams.filter(t=>!powerSet.has(t.conf)&&!moved.has(t.id)&&(t.prestige||50)>=REALIGN.POACH_BAR
        &&(t.conf==='Independent'||sizeOf[t.conf]>REALIGN.MIN_CONF))
        .sort((a,b)=>(b.prestige||50)-(a.prestige||50)||(a.id<b.id?-1:1));
      if(!cand.length)continue;
      const p=cand[0];
      moves.push({id:p.id,from:p.conf,to:name});moved.add(p.id);
      sizeOf[p.conf]--;sizeOf[name]++;progress=true;
    }
  }
  return moves;
}
// === REALIGN ENGINE (Phase 43) END ===

// === ROLLOVER ENGINE (Phase 5) START ===
// Pure, deterministic season-rollover model. Depends only on rng/ri/clamp/pick + the data arrays
// FN/LN/STATES/POS/CLASSES (no DOM, no S, no globals beyond those), so test/rolllab.js can extract
// + validate it offline. It graduates seniors, ages + DEVELOPS (ov→pot) the returning roster,
// converts recruiting signees into true-freshman Players, and backfills each position with
// generated 2–3★ depth so a roster holds at ~84. It never re-tapers returning players' ratings
// (the depth taper is a one-time generation artifact), so a developed backup can climb the chart.

// Class ladder: each step advances one year; SR / RS-SR graduate (→ null = off the roster).
const NEXT_CLASS={"FR":"SO","RS-FR":"RS-SO","SO":"JR","RS-SO":"RS-JR","JR":"SR","RS-JR":"RS-SR","SR":null,"RS-SR":null};
// Phase 39: REDSHIRT track. A redshirt preserves a year of eligibility — instead of advancing to the
// next class, the player moves onto the RS version of his CURRENT level (FR→RS-FR), so he spends one
// more season on the roster (5 years to play 4). Only the four non-RS classes can redshirt, once.
const REDSHIRT_TO={"FR":"RS-FR","SO":"RS-SO","JR":"RS-JR","SR":"RS-SR"};
// The class a player would redshirt INTO, or null if ineligible (already on the RS track, or used).
function redshirtClass(p){return (p.rs!=='used'&&(p.yr in REDSHIRT_TO))?REDSHIRT_TO[p.yr]:null;}
// Phase 11: the milestone-relevant box keys we accumulate into p.career (so a graduate can be
// measured by a whole career, not one season). Summed from p.gs at each rollover before gs is wiped.
const CAREER_KEYS=["gp","pYds","pTD","rYds","rTD","reYds","reTD","tkl","sk","dInt"];
// Fold one season's box (gs) into a running career total. Pure; returns the new career object.
function addCareer(career,gs){const c=Object.assign({},career||{});
  for(const k of CAREER_KEYS)if(gs[k])c[k]=(c[k]||0)+gs[k];return c;}
// How fast a class develops toward its ceiling — youth grows fastest, upperclassmen plateau.
const DEV_YOUTH={"FR":1,"RS-FR":1,"SO":0.85,"RS-SO":0.85,"JR":0.6,"RS-JR":0.6,"SR":0.35,"RS-SR":0.35};
// Grow one player's ov toward pot over an offseason. `rate` (~0.8–1.2) folds in facilities/coach.
// Mutates p (ov, attrs, stars); returns the OVR gained. Pot is a true ceiling and never moves.
function developPlayer(p,r,rate){
  const gap=(p.pot||p.ov)-p.ov;
  if(gap<=0)return 0;
  const youth=DEV_YOUTH[p.yr]!=null?DEV_YOUTH[p.yr]:0.5;
  const rt=(rate==null)?1:rate;
  const portion=clamp((0.16+0.20*youth)*rt,0,0.8);
  // random nudge scales with rate too, so a 0-rate (frozen) side genuinely doesn't grow.
  const delta=clamp(Math.round(gap*portion+r()*1.4*clamp(rt,0,2.5)),0,gap);
  if(!delta)return 0;
  // Phase 51: growth lands on the ATTRIBUTES and `ov` is read back off them, so development can no
  // longer drift the two apart — the old `+0.6*delta` attribute bump left every long-career player
  // rated above what his attributes actually said. reRateRoster re-applies his team's scheme after.
  shiftAttrs(p,delta);
  // The six attributes round independently, so the weighted mean can land ~0.5 either side of the
  // growth we actually granted and tip a maxed player one point past his ceiling. `pot` is a TRUE
  // ceiling, so cap the readout rather than let rounding leak through it.
  p.ov=clamp(ovrBase(p),40,Math.min(99,p.pot||99));
  p.stars=p.ov>=90?5:p.ov>=82?4:p.ov>=72?3:p.ov>=62?2:1;
  return delta;
}
// Generated 2–3★ depth freshman — the unmodeled signees every program lands. Low floor, real
// ceiling so a few develop. Used to backfill positions thinned by graduation back toward target.
function genFreshman(r,prestige,posCode){
  const ov=clamp(Math.round(prestige*0.40+ri(r,-8,7)+20),44,80);
  const pot=clamp(ov+ri(r,5,20),ov,95);
  const tr=genTraits(r);
  return Object.assign({id:'p'+Math.floor(r()*1e9).toString(36),fn:pick(r,FN),ln:pick(r,LN),pos:posCode,
    yr:'FR',age:18+ri(r,0,1),st:pick(r,STATES),stars:ov>=82?4:ov>=72?3:ov>=62?2:1,
    ov,pot,cap:false,so:0,mot:tr.mot,comp:tr.comp,ego:tr.ego},genProfile(r,ov,posCode));
}
// Convert a signed recruit into a true-freshman Player. Blue-chips enter "raw" (ov discounted by
// pedigree) with the recruit's pot as their ceiling, so development carries them up over a career —
// elite recruits can contribute early, most sit and grow. Carries `promise` for Phase 5 honoring.
function recruitToFreshman(rec,r){
  const disc=rec.stars===5?6:rec.stars===4?10:rec.stars===3?14:16;
  const ov=clamp(rec.ov-disc+ri(r,-2,2),44,96);
  const pot=clamp(Math.max(rec.pot||rec.ov,rec.ov),ov,99);
  // Carry the temperament you scouted on the trail (else generate) so the fogged read pays off.
  const tr=(rec.mot!=null&&rec.comp!=null)?{mot:rec.mot,comp:rec.comp,ego:rec.ego}:genTraits(r);
  // Phase 51: the pedigree discount lands on the ATTRIBUTES — carry the profile you scouted on the
  // trail, re-centred onto his (raw) freshman overall. Previously the discount hit `ov` alone, so a
  // blue-chip arrived rated 6–16 points below attributes that still insisted he was already elite.
  const at=centerAttrs(attrProfile(rec),ov,rec.pos);
  return Object.assign({id:'p'+Math.floor(r()*1e9).toString(36),fn:rec.fn,ln:rec.ln,pos:rec.pos,
    yr:'FR',age:18,st:rec.st,stars:rec.stars,ov,pot,cap:false},at,{
    // Phase 52: carry the SHAPE he was scouted as, not just the numbers. attrProfile returns the
    // attribute values alone, so without this a signee arrives on campus with no archetype at all —
    // he stops being a Deep Threat the moment he enrols.
    arch:rec.arch!=null?rec.arch:(classifyArch(rec)||{}).n,pur:rec.pur,
    so:0,promise:rec.promise||null,fromRecruit:true,mot:tr.mot,comp:tr.comp,ego:tr.ego});
}
// Roll one team's roster into the next season. `signees` = the prospects that committed to this
// team. Returns the rebuilt roster + a summary (graduated/developed/freshmen). Mutates nothing it
// is given (works on copies); clears p.gs so last season's stats never carry into the new season.
function rolloverRoster(roster,signees,prestige,r,opts){
  opts=opts||{};
  // `rateFor(player)` (Phase 7) gives a per-player dev rate (side/coach specific); else flat opts.rate.
  const rateOf=p=>opts.rateFor?opts.rateFor(p):(opts.rate||1);
  const graduated=[],cont=[],redshirted=[];
  roster.forEach(src=>{
    const p=Object.assign({},src);
    // Phase 11: accumulate career milestone totals + peak OVR for EVERY player (incl. graduates),
    // from last season's box, BEFORE it's wiped — so legends carry real lifetime résumés.
    if(p.gs)p.career=addCareer(p.career,p.gs);
    p.peakOv=Math.max(p.peakOv||0,p.ov||0);
    // Phase 39: resolve a redshirt designation. A designated player who's eligible AND genuinely sat
    // (≤4 games — the 4-game rule) advances onto the RS track at the same level (preserving the year)
    // instead of to the next class; he's stamped rs:'used' so he can't redshirt again. A wasted/stale
    // designation (ineligible, or he ended up playing >4 games) is just cleared and he advances normally.
    let nx,didRS=false;
    const rsTo=(p.rs==='on')?redshirtClass(p):null;
    if(rsTo&&!(p.gs&&p.gs.gp>4)){nx=rsTo;didRS=true;}
    else{if('rs' in p&&p.rs!=='used')delete p.rs;nx=(p.yr in NEXT_CLASS)?NEXT_CLASS[p.yr]:p.yr;}
    if(nx===null){graduated.push(p);return;}        // graduate keeps p.gs as its final-season box
    p.yr=nx;if(didRS)p.rs='used';p.age=(p.age||18)+1;
    if('gs' in p)delete p.gs;                       // fresh slate — no season-stat carryover
    p.dev=developPlayer(p,r,rateOf(p));             // record this offseason's OVR gain (UI surfaces it)
    p.peakOv=Math.max(p.peakOv,p.ov);               // peak reflects post-development OVR too
    if(didRS)redshirted.push(p);
    cont.push(p);
  });
  const freshmen=(signees||[]).map(s=>recruitToFreshman(s,r));
  let out=cont.concat(freshmen);
  // backfill each position toward its target depth with generated 2–3★ freshmen
  POS.forEach(([code,,n])=>{
    let have=out.filter(p=>p.pos===code).length;
    while(have<n){out.push(genFreshman(r,prestige,code));have++;}
  });
  // Scholarship cap (Phase 17): a full national recruiting class can push a roster well past the limit,
  // so trim the weakest DEPTH — only players beyond their position's target (lowest ov first), never a
  // captain — down toward ROSTER_CAP. Every position stays at least target-deep.
  const ROSTER_CAP=85;
  if(out.length>ROSTER_CAP){
    const byPosX={};out.forEach(p=>(byPosX[p.pos]=byPosX[p.pos]||[]).push(p));
    const excess=[];
    POS.forEach(([code,,n])=>{const a=(byPosX[code]||[]).slice().sort((x,y)=>y.ov-x.ov);
      for(let i=n;i<a.length;i++)excess.push(a[i]);});   // depth beyond this position's target
    excess.sort((a,b)=>a.ov-b.ov);                        // cut the weakest first
    const cut=new Set();let over=out.length-ROSTER_CAP;
    for(const p of excess){if(over<=0)break;if(p.cap)continue;cut.add(p);over--;}
    if(cut.size)out=out.filter(p=>!cut.has(p));
  }
  // depth order: best-by-ov per position gets so=0 (no rating taper — returning ratings stand)
  const byPos={};out.forEach(p=>{(byPos[p.pos]=byPos[p.pos]||[]).push(p);});
  Object.values(byPos).forEach(arr=>{arr.sort((a,b)=>b.ov-a.ov);arr.forEach((p,i)=>p.so=i);});
  out.forEach(p=>p.cap=false);
  const field=out.filter(p=>p.pos!=='K'&&p.pos!=='P').sort((a,b)=>b.ov-a.ov);
  if(field[0])field[0].cap=true; if(field[1])field[1].cap=true;
  return {roster:out,graduated,freshmen,redshirted,trackedCount:freshmen.length};
}
// === ROLLOVER ENGINE (Phase 5) END ===

// === CAMP ENGINE (Phase 32) START ===
// Offseason TRAINING CAMP — a once-a-year, CONTROLLED-TEAM-ONLY lever to kickstart the year's
// development, traded against injury + burnout risk. An intensity dial: light (safe, modest, a
// fresh room) · normal (balanced) · grueling (the biggest growth, but bodies break down + the room
// wears thin). Pure: depends only on rng/clamp + injDur (defined in the SIM block) — no DOM, no S —
// so test/camplab.js extracts + validates it offline. The app consumes it at rollover (dev boost via
// devRateFor + camp injuries onto the new roster) and at kickoff (the starting-morale seed).
const CAMP_PLANS=[
  {key:'light',   name:'Light Camp',    devMult:1.06, injRate:0.000, moraleSeed:8,
    desc:'Easy reps, keep everyone healthy. A small developmental bump and no injury risk — and a fresh, motivated locker room to open the year.'},
  {key:'normal',  name:'Standard Camp', devMult:1.16, injRate:0.013, moraleSeed:0,
    desc:'A normal grind. Solid across-the-board development with only the occasional camp tweak.'},
  {key:'grueling',name:'Grueling Camp', devMult:1.30, injRate:0.048, moraleSeed:-10,
    desc:'Hammer them in the heat. The biggest jump in development — but more bodies break down and the room comes out of camp worn thin.'}
];
function campPlan(key){return CAMP_PLANS.find(p=>p.key===key)||CAMP_PLANS[1];}
// The development multiplier the plan confers (folded into devRateFor for the controlled team only).
function campDevMult(key){return campPlan(key).devMult;}
// The morale the controlled room carries into Week 1 (seeded at kickoff; decays toward neutral over a
// few weeks). A grind soured start vs a light fresh start; 0 (Standard) leaves a neutral room.
function campMoraleSeed(key){return campPlan(key).moraleSeed;}
// Roll camp injuries over a roster: each player has plan.injRate odds of getting dinged, with severity
// from injDur (weeks out — mostly day-to-day, a small multi-week tail). Deterministic from r. Returns
// [{id,pos,name,weeks}] (weeks>0 only — a 0-week tweak heals before Week 1 and isn't reported).
function campInjuries(roster,key,r){
  const rate=campPlan(key).injRate, out=[];
  (roster||[]).forEach(p=>{
    if(r()<rate){ const w=injDur(r); if(w>0)out.push({id:p.id,pos:p.pos,name:((p.fn||'')+' '+(p.ln||'')).trim(),weeks:w}); }
  });
  return out;
}
// === CAMP ENGINE (Phase 32) END ===

// === ECONOMY ENGINE (Phase 6) START ===
// Pure, deterministic program-management model: finances, facility upgrades, and the coaching
// carousel. Depends only on rng/ri/clamp/pick/hashStr + the data arrays (COORD_ROLES/POS_COACHES/
// POS/FN/LN) + coachBoost — no DOM, no S — so test/econlab.js can extract + validate it offline.
// The "team" shape it reads is { id, conf, prestige, fac, payroll, budget, facilityDebt, rec,
// natRank, staff }. The app layer (rolloverSeason + renderProgram/renderCoaches) drives it.

// Annual base revenue by conference, in $M (media + distribution tier). Performance + stadium
// gate stack on top. Independent sits with the power conferences (Notre Dame's own deal).
const ECON_CONF_BASE={"SEC":48,"Big Ten":46,"ACC":31,"Big 12":31,"Pac-12":20,"American":14,
  "Mountain West":11,"Sun Belt":9,"MAC":8,"C-USA":8,"Independent":26};
// Base cost to take a facility from level 1→2 (escalates steeply with level). Stadium is dearest.
const FAC_BASE={stadium:6e6,strength:2.2e6,training:2.4e6,academics:1.9e6,nil:2.7e6,scouting:2.3e6};

// Resolve one team's annual finances (run at rollover, before records reset). MUTATES the team:
// budget += net (cash carries over, can go negative → constrains spending), pays down debt
// (interest + principal), and stores a lean team.lastFinances for the Program UI / recap.
// Deterministic: a light seeded jitter keys off (seed, year, team id). Returns lastFinances.
function resolveFinances(team,year,seed,mult,hcSalary){
  const fac=team.fac||{}, prestige=team.prestige||50, rec=team.rec||{w:0,l:0};
  const games=(rec.w||0)+(rec.l||0), winPct=games?rec.w/games:0;
  const confBase=(ECON_CONF_BASE[team.conf]||16)*1e6;
  const stadiumTerm=(fac.stadium||5)*1.15e6;          // bigger house → more gate revenue
  const perfBonus=(rec.w||0)*1.1e6
    + (winPct>0.5?(winPct-0.5)*18e6:0)                 // winning seasons pay (bowls/playoff)
    + (team.natRank&&team.natRank<=25?(26-team.natRank)*0.5e6:0);
  const psRev=(team.lastPostseason&&team.lastPostseason.revenue)||0;   // playoff/bowl payout (Phase 12)
  const jit=(rng((seed^hashStr('fin'+year+(team.id||'')))>>>0)()-0.5)*4e6;
  const revenue=Math.round((confBase + prestige*450000 + stadiumTerm + perfBonus + psRev + jit)*(mult||1));
  const debt=team.facilityDebt||0;
  const interest=debt*0.08, principal=Math.min(debt, debt*0.18);
  const debtService=interest+principal;
  // Phase 44: operating costs scale with program SIZE (a big program has big overhead — facilities,
  // travel, support staff), so revenue doesn't all fall to idle surplus. A real recurring sink.
  const facSum=(fac.stadium||5)+(fac.strength||5)+(fac.training||5)+(fac.academics||5)+(fac.nil||5)+(fac.scouting||5);
  const ops=Math.round(prestige*130000 + facSum*300000);
  const expenses=Math.round((team.payroll||0)+debtService+ops+(hcSalary||0));   // Phase 42: the head coach's salary is a real program cost
  const net=revenue-expenses;
  let bud=Math.round((team.budget||0)+net);
  // Phase 44: soft anti-hoard — cash far above a season's revenue is reinvested (the excess decays),
  // so a long dynasty can't pile up meaningless nine-figure budgets with nothing to spend on.
  const cap=revenue*1.5;
  if(bud>cap)bud=Math.round(cap+(bud-cap)*0.3);
  team.budget=bud;
  team.facilityDebt=Math.max(0,Math.round(debt-principal));
  team.lastFinances={revenue,expenses,net,ops,debtService:Math.round(debtService)};
  return team.lastFinances;
}
// Phase 44: season prestige drift — a program's standing drifts toward its results (two-way mobility:
// a winner climbs, a chronic loser slips). Bounded + self-limiting (climbing raises the win expectation,
// so it plateaus). Local win-expectation formula keeps the ECONOMY block self-contained for econlab.
function seasonPrestigeDrift(prestige,w,l){
  const games=(w||0)+(l||0); if(games<6)return 0;
  const exp=clamp(((prestige||50)-25)/65,0.15,0.85)*games;   // = winExpectation*games
  return clamp(((w||0)-exp)*0.18,-1.6,1.6);
}
// Escalating cost to raise a facility from `level` → `level+1`. Caps at 10 (Infinity past it).
function facilityUpgradeCost(key,level){
  if(level>=10)return Infinity;
  return Math.round((FAC_BASE[key]||2e6)*Math.pow(level+1,1.6));
}
// Build a deterministic free-agent coach market (~24–40 candidates, top-heavy on rating) for a
// given year. Each candidate is a full coach object (role/tier/scope/groups/boost) ready to slot in.
function genCoachMarket(seed,year,world){
  const r=rng((seed^hashStr('market'+year))>>>0);
  const roles=[...COORD_ROLES.map(c=>({code:c[0],title:c[1],tier:'coord',side:c[2]})),
               ...POS_COACHES.map(c=>({code:c[0],title:c[1],tier:'pos',scope:c[2],groups:c[3]}))];
  const n=ri(r,24,40), out=[];
  for(let i=0;i<n;i++){
    const role=pick(r,roles);
    const rating=clamp(Math.round(48+Math.pow(r(),1.8)*48+ri(r,-3,3)),45,97);  // top-heavy: few elite
    const groups=role.tier==='coord'?POS.filter(p=>p[1]===role.side).map(p=>p[0]):role.groups;
    const scope=role.tier==='coord'?{off:'OFF',def:'DEF',st:'ST'}[role.side]:role.scope;
    const mult=role.tier==='coord'?(role.code==='STC'?1.3:2.4):1;
    const salary=Math.max(90000,Math.round((rating*8500+120000)*mult));
    out.push({id:'fa'+year.toString(36)+i.toString(36),role:role.code,title:role.title,
      name:pick(r,FN)+' '+pick(r,LN),rating,salary,years:ri(r,2,4),
      tier:role.tier,scope,groups,boost:coachBoost(role.tier,rating)});
  }
  out.sort((a,b)=>b.rating-a.rating);
  // Phase 11: fold in any legend-coach candidates (retired greats returning to their alma mater).
  const legs=legendCoachCandidates(world,year,r);
  if(legs.length){legs.forEach(c=>out.push(c));out.sort((a,b)=>b.rating-a.rating);}
  return out;
}
// Phase 11: occasionally a program's retired great re-enters the market as a candidate FOR their alma
// mater (flagged fromLegend/legendOf for the UI). Coordinator candidate matching the side they played;
// rating is influenced by stature (a great player is a plausible — not sure-thing — coach). Guarded so
// legend-less worlds (the econ lab) consume no rng and stay byte-identical. Deterministic by (seed,year).
function legendCoachCandidates(world,year,r){
  const out=[];
  ((world&&world.teams)||[]).forEach(t=>{
    const ring=(t.legends||[]).filter(l=>(l.stature||0)>=40);   // only real greats consider coaching
    if(!ring.length||r()>0.12)return;
    const l=ring.slice().sort((a,b)=>(b.stature||0)-(a.stature||0))[0];
    const side=(POS.find(p=>p[0]===l.pos)||['','off'])[1];
    const role=COORD_ROLES.find(c=>c[2]===side)||COORD_ROLES[0];
    const rating=clamp(Math.round(50+(l.stature||0)*0.32+ri(r,-12,12)),45,92);
    out.push({id:'leg'+year.toString(36)+(l.id||t.id),role:role[0],title:role[1],
      name:l.name,rating,salary:Math.max(120000,Math.round(rating*8500+150000)),years:ri(r,2,4),
      tier:'coord',scope:{off:'OFF',def:'DEF',st:'ST'}[role[2]],
      groups:POS.filter(p=>p[1]===role[2]).map(p=>p[0]),boost:coachBoost('coord',rating),
      fromLegend:true,legendOf:t.id});
  });
  return out;
}
// Buyout to fire a coach early (≈ half the remaining contract). Hire fee = a small signing bonus.
function buyoutCost(coach){return Math.round((coach.salary||0)*Math.max(1,coach.years||1)*0.5);}
function hireCost(coach){return Math.round((coach.salary||0)*0.25);}
// Slot a market candidate into a coordinator vacancy/slot, preserving the slot's role/scope/groups.
function fitCoachToSlot(cand,role,title,scope,groups,tier,r){
  return Object.assign({},cand,{role,title,scope,groups,tier,
    boost:coachBoost(tier,cand.rating),years:ri(r,2,4)});
}
// The AI churn at rollover (pure-ish: mutates world staff + market, deterministic by (seed,year)).
// Better programs (acting first, prestige-weighted) upgrade their weakest coordinator from the
// market; displaced coaches re-enter the pool; a strong player coordinator can be poached by a
// higher-prestige suitor (resisted by loyal histories), opening a vacancy. Market then refreshes.
// Returns { poached:[{coach,fromId,toId}] } so the app can notify + flag the vacancy.
function advanceCoachCarousel(world,market,seed,year,opts){
  opts=opts||{};
  const meId=opts.controlledId||null, poached=[];
  const r=rng((seed^hashStr('carousel'+year))>>>0);
  market.sort((a,b)=>b.rating-a.rating);
  const ai=world.teams.filter(t=>t.id!==meId).sort((a,b)=>b.prestige-a.prestige);
  // 1) AI upgrades its weakest coordinator from the market (high prestige acts more + grabs best)
  ai.forEach(t=>{
    if(r()>0.30+(t.prestige||50)/250)return;
    const coords=(t.staff||[]).filter(c=>c.tier==='coord');
    if(!coords.length)return;
    const weak=coords.reduce((a,b)=>a.rating<b.rating?a:b);
    const ci=market.findIndex(c=>c.tier==='coord'&&c.rating>weak.rating+4);
    if(ci<0)return;
    const cand=market[ci];
    const hired=fitCoachToSlot(cand,weak.role,weak.title,weak.scope,weak.groups,'coord',r);
    t.staff=t.staff.map(c=>c===weak?hired:c);
    market.splice(ci,1);
    market.push(Object.assign({},weak,{id:'fa'+Math.floor(r()*1e9).toString(36),years:ri(r,1,3)}));
  });
  // 2) a higher-prestige suitor may poach the player's best coordinator (loyal histories resist)
  if(meId){
    const me=world.teams.find(t=>t.id===meId);
    const resist=opts.coach&&(opts.coach.history==='NFL Transplant'||opts.coach.history==='Lifer'||opts.coach.archetype==='Manager')?0.5:1;
    if(me&&me.staff){
      const star=me.staff.filter(c=>c.tier==='coord'&&c.rating>=82).sort((a,b)=>b.rating-a.rating)[0];
      const suitor=ai.find(t=>(t.prestige||50)>((me.prestige||50)+6));
      if(star&&suitor&&r()<0.18*resist){
        me.staff=me.staff.filter(c=>c!==star);
        poached.push({coach:star,fromId:meId,toId:suitor.id});
      }
    }
  }
  // 3) refresh the market back toward target size with a fresh wave of free agents
  const fresh=genCoachMarket((seed^0x9e3779b1)>>>0,year,world);
  while(market.length<28&&fresh.length)market.push(fresh.shift());
  market.sort((a,b)=>b.rating-a.rating);
  return {poached};
}
// === ECONOMY ENGINE (Phase 6) END ===

// === AWARDS ENGINE (Phase 8) START ===
// Pure, deterministic season-awards model (no rng — a pure function of season stats + records).
// Depends only on POS (data array), so test/awardlab.js can extract + validate it offline. Reads a
// teams array (each { id, name, abbr, color, conf, prestige, rec, roster:[{...,gs}] }) where gs is a
// player's accumulated season box, and returns the year's honors: national Heisman (offense-of-the-
// year, weighted by team success), Defensive POY, Freshman of the Year, per-conference POY (off+def),
// an All-America team (best at each position), Coach of the Year (record vs prestige expectation), and
// (Phase 11) the real named **position trophies** — Davey O'Brien (QB), Doak Walker (RB), Biletnikoff
// (WR), John Mackey (TE), Outland (interior DL → best DT, since OL aren't box-scored), Butkus (LB), Jim
// Thorpe (DB), Lou Groza (K, by FG/PAT), Ray Guy (P, by rating — punting isn't box-scored). The
// Defensive POY is surfaced as the Bednarik. Each trophy is the best eligible season by the side score.
function awardOff(s){return (s.pYds||0)*0.04+(s.pTD||0)*4+(s.rYds||0)*0.1+(s.rTD||0)*6+(s.reYds||0)*0.1+(s.reTD||0)*6-(s.pInt||0)*2;}
function awardDef(s){return (s.tkl||0)+(s.sk||0)*4+(s.dInt||0)*6;}
function awardK(s){const acc=(s.fga||0)?((s.fgm||0)/s.fga):0;return (s.fgm||0)*3+(s.xpm||0)+acc*8;}
// Position-trophy slate (real named hardware). Each is the best eligible season by the side's score.
// Outland → best DT (interior linemen aren't box-scored; the DL approximates it). K/P handled specially.
const TROPHY_DEFS=[["obrien","Davey O'Brien",["QB"],"off"],["doak","Doak Walker",["RB"],"off"],
  ["biletnikoff","Biletnikoff",["WR"],"off"],["mackey","John Mackey",["TE"],"off"],
  ["outland","Outland",["DT"],"def"],["butkus","Butkus",["LB"],"def"],["thorpe","Jim Thorpe",["CB","FS","SS"],"def"]];
function awardLine(s,side){
  if(side==='k'){const d=[];if(s.fga)d.push((s.fgm||0)+'/'+s.fga+' FG');if(s.xpm)d.push((s.xpm||0)+' XP');return d.join(', ')||'—';}
  if(side==='def'){const d=[];if(s.tkl)d.push(s.tkl+' tkl');if(s.sk)d.push(s.sk+' sk');if(s.dInt)d.push(s.dInt+' INT');return d.join(', ')||'—';}
  const p=[];
  if(s.pYds||s.pTD)p.push(`${s.pYds||0} pass yd${s.pTD?', '+s.pTD+' TD':''}${s.pInt?', '+s.pInt+' INT':''}`);
  if(s.rYds||s.rTD)p.push(`${s.rYds||0} rush yd${s.rTD?', '+s.rTD+' TD':''}`);
  if(s.reYds||s.reTD)p.push(`${s.rec||0} rec, ${s.reYds||0} yd${s.reTD?', '+s.reTD+' TD':''}`);
  return p.join(' · ')||'—';
}
function computeAwards(teams,year){
  const cand=[];
  teams.forEach(t=>{
    const g=t.rec?(t.rec.w+t.rec.l):0, winPct=g?t.rec.w/g:0;
    t.roster.forEach(p=>{if(!p.gs||!p.gs.gp)return;
      cand.push({p,t,off:awardOff(p.gs),def:awardDef(p.gs),winPct,fr:p.yr==='FR'||p.yr==='RS-FR'});});
  });
  const empty={year,heisman:null,poyDef:null,freshman:null,coy:null,byConf:{},allAmerican:[],allConference:{},trophies:{}};
  if(!cand.length)return empty;
  const snap=(c,side)=>c?{pid:c.p.id,teamId:c.t.id,name:c.p.fn+' '+c.p.ln,pos:c.p.pos,abbr:c.t.abbr,
    color:c.t.color,line:awardLine(c.p.gs,side),
    score:Math.round(side==='def'?c.def:side==='k'?awardK(c.p.gs):c.off)}:null;
  const bestOff=arr=>arr.reduce((b,c)=>(!b||c.off>b.off)?c:b,null);
  const bestDef=arr=>arr.reduce((b,c)=>(!b||c.def>b.def)?c:b,null);
  // Heisman: best offensive season, weighted by team success (narrative bump for winners)
  const heis=cand.reduce((b,c)=>{const v=c.off*(1+c.winPct*0.4);return(!b||v>b._v)?Object.assign({_v:v},c):b;},null);
  const defPoy=bestDef(cand);
  const frs=cand.filter(c=>c.fr);
  const frPoy=frs.length?frs.reduce((b,c)=>{const v=Math.max(c.off,c.def*1.2);return(!b||v>b._v)?Object.assign({_v:v},c):b;},null):null;
  const byConf={};[...new Set(cand.map(c=>c.t.conf))].forEach(cf=>{const cc=cand.filter(c=>c.t.conf===cf);
    byConf[cf]={off:snap(bestOff(cc),'off'),def:snap(bestDef(cc),'def')};});
  // first-team at each position: All-America (national) + All-Conference (per league)
  const bestAt=arr=>POS.map(([code])=>{const cc=arr.filter(c=>c.p.pos===code);if(!cc.length)return null;
    const best=cc.reduce((b,c)=>{const v=Math.max(c.off,c.def);return(!b||v>b._v)?Object.assign({_v:v},c):b;},null);
    return Object.assign({pos:code},snap(best,best.def>best.off?'def':'off'));}).filter(Boolean);
  const allAmerican=bestAt(cand);
  const allConference={};[...new Set(cand.map(c=>c.t.conf))].forEach(cf=>{allConference[cf]=bestAt(cand.filter(c=>c.t.conf===cf));});
  const coyT=teams.reduce((b,t)=>{if(!t.rec||(t.rec.w+t.rec.l)===0)return b;const over=t.rec.w-(t.prestige||50)/10;
    return(!b||over>b._o)?{_o:over,t}:b;},null);
  const coy=coyT?{teamId:coyT.t.id,abbr:coyT.t.abbr,color:coyT.t.color,name:coyT.t.name,
    rec:coyT.t.rec.w+'–'+coyT.t.rec.l,over:Math.round(coyT._o*10)/10}:null;
  // Position trophies: the best eligible season at each, by the side's score (one national winner each).
  const trophies={};
  TROPHY_DEFS.forEach(([key,name,poss,side])=>{
    const cc=cand.filter(c=>poss.indexOf(c.p.pos)>=0);
    const best=cc.length?(side==='def'?bestDef(cc):bestOff(cc)):null;
    trophies[key]=best?Object.assign({trophy:name},snap(best,side)):null;
  });
  // Lou Groza (best kicker) — ranked on field-goal + PAT production.
  const ks=cand.filter(c=>c.p.pos==='K'&&awardK(c.p.gs)>0);
  const groza=ks.length?ks.reduce((b,c)=>{const v=awardK(c.p.gs);return(!b||v>b._k)?Object.assign({_k:v},c):b;},null):null;
  trophies.groza=groza?Object.assign({trophy:'Lou Groza'},snap(groza,'k')):null;
  // Ray Guy (best punter) — punting isn't box-scored, so rank punters by rating on a contending team.
  let pun=null;
  teams.forEach(t=>{const g=t.rec?(t.rec.w+t.rec.l):0,wp=g?t.rec.w/g:0;
    t.roster.forEach(p=>{if(p.pos!=='P')return;const v=(p.ov||0)+wp*3;if(!pun||v>pun._v)pun={_v:v,p,t};});});
  trophies.rayguy=pun?{trophy:'Ray Guy',pid:pun.p.id,teamId:pun.t.id,name:pun.p.fn+' '+pun.p.ln,pos:'P',
    abbr:pun.t.abbr,color:pun.t.color,line:(pun.p.ov||0)+' OVR',score:pun.p.ov||0}:null;
  return {year,heisman:snap(heis,'off'),poyDef:snap(defPoy,'def'),
    freshman:frPoy?snap(frPoy,frPoy.def>frPoy.off?'def':'off'):null,coy,byConf,allAmerican,allConference,trophies};
}
// === AWARDS ENGINE (Phase 8) END ===

// === LEGACY ENGINE (Phase 11) START ===
// Pure, deterministic program-legacy model: how big a graduate's legend is, the standing recruiting
// aura a deep Ring of Honor confers, and the interest math behind an alumni visit. Depends only on
// data arrays (POS) + clamp — no rng, no DOM, no S — so test/legacylab.js can extract + validate it
// offline. The "snapshot" it scores is { honors:[{year,award}], career:{…totals}, peakOv } — the lean
// shape stored in team.legends, built from a graduating Player by the app layer (enshrineLegends).
//
// Stature blends three saturating components so no single axis runs away: trophies (honorWeight),
// career stat milestones (a compiler with no trophies can still be a great), and peak OVR (a 99 in a
// down era still reads as a legend). History is EARNED — there is no seeding; a fresh dynasty's ring
// is empty and fills as your stars graduate.

// National position-trophy weights (real named hardware). Keyed by the exact label stampHonors writes.
const TROPHY_WEIGHTS={"Davey O'Brien":60,"Doak Walker":60,"Biletnikoff":60,"John Mackey":60,
  "Outland":60,"Butkus":60,"Jim Thorpe":60,"Lou Groza":35,"Ray Guy":35};
// Points per honor (matched against the labels stampHonors writes). National hardware ranks highest.
function honorWeight(award){
  if(!award)return 0;
  if(award.indexOf('Heisman')>=0)return 100;            // National POY
  if(award.indexOf('Bednarik')>=0)return 80;            // best defender (was 'National Defensive POY')
  if(award.indexOf('National Defensive POY')>=0)return 80;   // legacy saves stamped pre-rename
  if(TROPHY_WEIGHTS[award])return TROPHY_WEIGHTS[award]; // national position trophy
  if(award==='All-American')return 55;
  if(award.indexOf('Freshman of the Year')>=0)return 20;
  if(award.indexOf('POY')>=0)return 45;                 // conference Offensive/Defensive POY
  if(award.indexOf('All-')===0)return 25;               // first-team All-Conference
  return 10;
}
// Raw career-milestone score from accumulated box totals — rewards compilers (no trophies needed).
function careerScore(career){const c=career||{};
  return (c.pYds||0)*0.004+(c.pTD||0)*1.2+(c.rYds||0)*0.012+(c.rTD||0)*1.5
    +(c.reYds||0)*0.012+(c.reTD||0)*1.5+(c.tkl||0)*0.12+(c.sk||0)*1.5+(c.dInt||0)*2.5;}
const LEGEND_TIERS=[[75,'Immortal'],[55,'All-Time Great'],[35,'Program Great'],[0,'Cult Hero']];
function legendTier(score){for(const [bar,name] of LEGEND_TIERS)if(score>=bar)return name;return 'Cult Hero';}
// 0..100 stature score for a lean legend snapshot. Each component saturates toward its own ceiling.
function legendStature(snap){
  snap=snap||{};
  const honorSum=(snap.honors||[]).reduce((s,h)=>s+honorWeight(h.award||h),0);
  const honorComp=55*(honorSum/(honorSum+90));                 // trophies, soft-capped ~55
  const cs=careerScore(snap.career);
  const careerComp=30*(cs/(cs+30));                            // milestones, soft-capped ~30
  const peakComp=clamp(((snap.peakOv||0)-70)/29,0,1)*25;       // peak OVR, 70..99 → 0..25
  const score=Math.round(clamp(honorComp+careerComp+peakComp,0,100));
  return {score,tier:legendTier(score)};
}
// Worthy of the Ring of Honor: at least one real honor, OR a stature past a bar (keeps it notable).
function isLegendWorthy(snap){
  if(snap&&snap.honors&&snap.honors.length)return true;
  return legendStature(snap).score>=32;
}
// Merge new inductees into a ring and keep only the top `cap` by stature (all-time best survive).
function enshrineInto(legends,snaps,cap){
  const out=(legends||[]).concat(snaps||[]);
  out.sort((a,b)=>(b.stature||0)-(a.stature||0));
  return out.slice(0,cap||12);
}
// Standing recruiting aura from the depth+quality of a program's ring (small, complements prestige).
function legacyAura(team){
  const ls=(team&&team.legends)||[];
  if(!ls.length)return 0;
  const sum=ls.slice().sort((a,b)=>(b.stature||0)-(a.stature||0)).slice(0,6)
    .reduce((s,l)=>s+(l.stature||0),0);
  return clamp(sum/600,0,0.12);                               // ≤ +0.12 recruitFit, never replaces prestige
}
function legSide(code){const p=POS.find(x=>x[0]===code);return p?p[1]:'off';}
// How relevant a legend is to a given recruit: position match + same-side partial + home-state tie.
function alumniRelevance(legend,rec){
  let rel=legend.pos===rec.pos?1:(legSide(legend.pos)===legSide(rec.pos)?0.6:0.35);
  if(legend.st&&rec.st&&legend.st===rec.st)rel+=0.3;
  return clamp(rel,0,1.4);
}
// Interest boost from deploying a legend on a recruit: stature × relevance × coach amplifier (pure).
function alumniBoost(legend,rec,coachMod){

// === IDENTITY ENGINE (Phase 45) START ===
// Player individualism, DERIVED (not stored): a jersey number + nickname + one-line "known for" and
// backstory, computed from the player's id hash + traits + résumé (honors/career/gs). Deterministic, so
// it's free across 11k players and permanent per career. Depends only on hashStr/clamp + the TRAIT reads
// (motVal/compVal/egoVal) + data on the player — no DOM, no S — so test/identitylab.js validates it offline.
// Earned/fogged like the traits: a freshman shows no nickname; it surfaces once he's played (established),
// and a real résumé milestone earns a nickname that supersedes the flavor one.

// Career-to-date = banked career totals (summed at rollover) + this season's live box, so a monster season
// earns its identity NOW, not a year late.
function careerToDate(p){const c=Object.assign({},(p&&p.career)||{});const g=(p&&p.gs)||{};for(const k in g)c[k]=(c[k]||0)+g[k];return c;}

const JERSEY_BANDS={QB:[1,18],RB:[1,49],WR:[1,19],TE:[80,89],OT:[70,79],OG:[60,79],C:[50,79],DE:[40,99],DT:[90,99],LB:[1,59],CB:[1,39],S:[1,49],K:[1,49],P:[1,49]};
function jerseyNo(p){const b=JERSEY_BANDS[(p&&p.pos)]||[1,99];return b[0]+(hashStr(((p&&p.id)||'')+'jsy')%(b[1]-b[0]+1));}
// Positions that live in the trenches — they get grit nicknames + line-appropriate descriptors, never
// "playmaker"/speed flavor (an offensive tackle isn't "The Blur").
const TRENCH_POS={OT:1,OG:1,C:1,DT:1};
function isTrench(p){return !!TRENCH_POS[(p&&p.pos)];}
// Flavor nickname pools, chosen by the player's dominant trait; the id picks within a pool.
const NICK_FLAVOR={
  motor:['The Motor','Tank','Relentless','Workhorse','Bulldozer'],
  cool:['Ice','The General','Cool Hand','Smooth','Silk'],
  boom:['Boom','Jets','Lightning','The Blur','Highlight'],
  swagger:['Prime','Money','Showtime','The Show','Neon'],
  trench:['Tank','Mauler','Hoss','Anchor','Pancake','The Wall','Big Country'],
  gen:['Sarge','Mad Dog','Buckets','Truck','Flash','Country','Boogie','Juice','Radio','Ghost']};
function nickFlavor(p){

  else if(mot>=66)pool=NICK_FLAVOR.motor;
  else if(comp>=66)pool=NICK_FLAVOR.cool;
  else if(comp<=38)pool=NICK_FLAVOR.boom;
  else if(ego>=70)pool=NICK_FLAVOR.swagger;

}
// Earned nickname from the résumé (supersedes flavor once a milestone is real). Reads honors + career-to-date.
function nickEarned(p){
  const h=((p&&p.honors)||[]).map(x=>x.award);
  if(h.some(a=>/Heisman/i.test(a)))return 'The Franchise';
  if(h.some(a=>/Bednarik/i.test(a)))return 'The Enforcer';
  const c=careerToDate(p);
  if((c.pYds||0)>=8000)return 'The General';
  if((c.rYds||0)>=3500)return 'The Workhorse';
  if((c.reYds||0)>=2800)return 'Hands';
  if((c.sk||0)>=25)return 'The Closer';
  if((c.dInt||0)>=12)return 'The Ballhawk';

// How "established" a player is (drives the nickname unlock): real snaps, or an honor, or an upperclassman.
function isEstablished(p){

}
// The display nickname (or '' when not yet earned). Earned overlay beats flavor.
function nickname(p){

  if(!isEstablished(p))return '';

}
// "Known for" — one earned descriptor from honors → career milestones → traits (a person, not a rating).
function knownFor(p){

  const heis=H.filter(x=>/Heisman/i.test(x.award)).length; if(heis)return heis>1?heis+'× Heisman winner':'Heisman winner';
  const aa=H.filter(x=>/All-America/i.test(x.award)).length; if(aa)return (aa>1?aa+'× ':'')+'All-America '+p.pos;
  const cp=H.filter(x=>/POY|Player of the Year/i.test(x.award)).length; if(cp)return 'Conference Player of the Year';
  const c=careerToDate(p);
  if((c.pYds||0)>=6000)return (c.pYds)+'-yard career passer';
  if((c.rYds||0)>=2500)return (c.rYds)+'-yard career rusher';
  if((c.reYds||0)>=2200)return (c.reYds)+'-yard receiver';
  if((c.sk||0)>=18)return (c.sk)+'-sack pass rusher';
  if((c.dInt||0)>=8)return 'ball-hawking '+p.pos+' ('+c.dInt+' career INT)';
  if(isTrench(p))return motVal(p)>=70?'A relentless grinder up front':compVal(p)>=66?'A steady anchor up front':(p.stars||3)+'★ '+p.pos;
  if(motVal(p)>=70)return 'A relentless worker';
  if(compVal(p)>=70)return 'Ice in his veins';
  if(compVal(p)<=36)return 'Boom-or-bust playmaker';
  if(egoVal(p)>=72)return 'Plays with swagger';

}
// Backstory — one flavor line from home state + recruiting stars + a trait tag.
function backstory(p){

  let head = s>=5?'Five-star out of '+st : s>=4?'Blue-chip from '+st : s<=2?'Under-recruited out of '+st : st+' native';
  let tag = motVal(p)>=70?'outworks everyone' : egoVal(p)>=72?'plays with swagger' : compVal(p)>=70?'unflappable' : (compVal(p)<=36&&!isTrench(p))?'a boom-or-bust gamer' : null;
  return tag?head+' — '+tag:head;
}
// Emergent status — a fan-favorite label (or null), DERIVED from over-performance / roots. A contributor
// (starter or two-deep) who's beating his recruiting billing, or a local kid who made good. Pass his team's
// home state for the hometown-hero read. Pure — used for a controlled-team badge, no storage.
function fanFavorite(p,homeState){
  if(!p)return null;
  const starter=(p.so==null?9:p.so)<=1, s=p.stars||3, ov=p.ov||0;
  if(!starter)return null;
  if(homeState&&p.st===homeState&&ov>=80)return 'Hometown Hero';
  if(s<=2&&ov>=78)return 'Overachiever';
