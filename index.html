    postseason:(myPost&&myPost.label)||null,
    draft:{count:myPicks.length,top:myPicks[0]?myPicks[0].pick:null,names:myPicks.slice(0,3).map(p=>p.name+' ('+p.pos+', #'+p.pick+')')},
    inducted:myInducted.map(l=>({name:l.name,pos:l.pos,tier:l.tier,stature:l.stature}))};
  if(S.coach&&S.coach.pendingFire)triggerCoachingSearch();   // Phase 19c: you were let go — find a new job or retire
  autosave();
}
/* ============================================================
   COACHING SEARCH — fired → take a new job, or retire (Phase 19c)
   ============================================================ */
function triggerCoachingSearch(){
  const me=controlled();
  const others=S.world.teams.filter(t=>t.id!==me.id).map(t=>({id:t.id,prestige:t.prestige}));
  const ids=coachOpenings(others,me.prestige,(S.seed^hashStr('search'+(S.year||2026)))>>>0);
  S.coachSearch={firedFrom:me.id,firedFromName:me.name,openings:ids,year:S.year};
  S.coach.pendingFire=false;
  S.task={type:'Fired',label:'Relieved of duty',
    note:me.name+' has moved on from you after a rough stretch. Choose your next job — or retire and review your career.'};
}
// Record the just-ended stint on the coach's résumé (titles snapshotted from the old program).
function recordStint(){const old=controlled();
  S.coach.career=(S.coach.career||[]).concat({team:old.name,abbr:old.abbr,
    seasons:S.coach.tenure||0,titles:(old.titles||[]).length,confTitles:(old.confTitles||[]).length});}
// Take one of the open jobs: bank the old stint, switch programs, reset approval/tenure, fresh start.
function takeJob(teamId){
  if(!S.coachSearch)return;
  const nu=teamById(teamId); if(!nu)return;
  recordStint();
  S.teamId=teamId;
  S.coach.approval=52; S.coach.tenure=0; S.coach.approvalHistory=[];
  S.coachSearch=null;
  applyAccent(nu);recomputeRanks(S.world);
  S.task={type:'Media Day',label:S.year+' Media Day',
    note:'A new chapter at '+nu.name+'. Settle in, then kick off the season when you’re ready.'};
  autosave();
}
// Retire: bank the final stint and show a career retrospective.
function retireCoach(){
  if(S.coach.career==null)S.coach.career=[];
  recordStint();
  S.phase='Retired';S.coachSearch=null;
  autosave();
}
function careerTotals(){
  const c=S.coach.career||[];
  return {stops:c.length,seasons:c.reduce((n,s)=>n+(s.seasons||0),0),
    titles:c.reduce((n,s)=>n+(s.titles||0),0),confTitles:c.reduce((n,s)=>n+(s.confTitles||0),0)};
}

/* ============================================================
   PROGRAM MANAGEMENT — finances, facility upgrades, coaching carousel (Phase 6)
   The pure engine (resolveFinances/facilityUpgradeCost/genCoachMarket/advanceCoachCarousel/…)
   lives in the ECONOMY ENGINE block above; this layer owns S.coachMarket + the player actions.
   ============================================================ */
function ensureCoachMarket(){
  if(!S.coachMarket)S.coachMarket=genCoachMarket(S.seed,S.year||2026,S.world);
  return S.coachMarket;
}
// Spending is only allowed when the season isn't live (no in-season roster/staff churn).
function canManage(){return S.phase==='Preseason'||S.phase==='Offseason';}
// Coach-identity GM effects (Phase 7 flavor, completed): a Manager runs the program like a CEO
// (more revenue, cheaper facility projects, stickier staff); a Lifer's loyal network comes cheap.
function mgrFinanceMult(){return (S.coach&&S.coach.archetype==='Manager')?1.06:1;}
function facilityDiscount(){return (S.coach&&S.coach.archetype==='Manager')?0.90:1;}
function staffCostMult(){return (S.coach&&S.coach.history==='Lifer')?0.85:1;}
// Buy a facility upgrade. `credit` finances it onto facilityDebt instead of paying cash.
function applyFacilityUpgrade(team,key,credit){
  const lvl=team.fac[key]||1;
  if(lvl>=10){toast('Already maxed');return false;}
  const cost=Math.round(facilityUpgradeCost(key,lvl)*(team.id===S.teamId?facilityDiscount():1));
  if(credit){team.facilityDebt=(team.facilityDebt||0)+cost;}
  else{if((team.budget||0)<cost){toast('Not enough budget — finance it or earn more');return false;}
    team.budget-=cost;}
  team.fac[key]=lvl+1;
  team.ratings=teamRatings(team.roster,team.staff);
  recomputeRanks(S.world);
  autosave();return true;
}
// Fire a coach: pay the buyout from budget. Coordinators open a vacancy you must refill before
// kickoff; position coaches may sit vacant (you simply lose their group boost).
function fireCoach(team,coach){
  const cost=Math.round(buyoutCost(coach)*(team.id===S.teamId?staffCostMult():1));
  if((team.budget||0)<cost){toast('Can’t afford the buyout');return false;}
  team.budget-=cost;
  team.staff=team.staff.filter(c=>c!==coach);
  team.payroll=team.staff.reduce((s,x)=>s+(x.salary||0),0);
  team.ratings=teamRatings(team.roster,team.staff);
  recomputeRanks(S.world);autosave();return true;
}
// Hire a market candidate into a slot. Coordinators take the matching OC/DC/STC slot (must be
// vacant); position coaches fill/replace their group's slot. Pays a signing fee from budget.
function hireCoach(team,cand,slotRole){
  ensureCoachMarket();
  const fee=Math.round(hireCost(cand)*(team.id===S.teamId?staffCostMult():1));
  if((team.budget||0)<fee){toast('Can’t afford the signing fee');return false;}
  const r=rng((S.seed^hashStr('hire'+cand.id+(S.year||2026)))>>>0);
  let hired;
  if(cand.tier==='coord'){
    const slot=COORD_ROLES.find(x=>x[0]===slotRole)||COORD_ROLES.find(x=>x[2]===({OFF:'off',DEF:'def',ST:'st'}[cand.scope]));
    if(!slot){toast('No matching coordinator slot');return false;}
    if(team.staff.find(c=>c.role===slot[0]&&c.tier==='coord')){toast('That slot is filled — fire first');return false;}
    const groups=POS.filter(p=>p[1]===slot[2]).map(p=>p[0]);
    const scope={off:'OFF',def:'DEF',st:'ST'}[slot[2]];
    hired=fitCoachToSlot(cand,slot[0],slot[1],scope,groups,'coord',r);
  }else{
    const pc=POS_COACHES.find(x=>x[0]===cand.role);
    if(!pc){toast('Unknown role');return false;}
    if(team.staff.find(c=>c.role===pc[0]&&c.tier==='pos')){toast('Replace from that coach’s card');return false;}
    hired=fitCoachToSlot(cand,pc[0],pc[1],pc[2],pc[3],'pos',r);
  }
  team.budget-=fee;
  team.staff.push(hired);
  team.payroll=team.staff.reduce((s,x)=>s+(x.salary||0),0);
  team.ratings=teamRatings(team.roster,team.staff);
  S.coachMarket=S.coachMarket.filter(c=>c.id!==cand.id);
  recomputeRanks(S.world);autosave();return true;
}
// Coordinator slots that are currently empty on the controlled team (must be filled before kickoff).
function vacantCoordSlots(team){return COORD_ROLES.filter(([code])=>!team.staff.find(c=>c.role===code&&c.tier==='coord'));}

/* ============================================================
   NON-CONFERENCE SERIES — multi-year scheduling agreements (Phase 8)
   Conference games stay auto-assigned; only non-conf openings are player-fillable. A series is
   pulled into the slate at kickoff via seriesLegsForYear (locked edges in genSchedule).
   ============================================================ */
const SERIES_TYPES=[['home-home','Home-and-Home','Two games, alternating hosts, across two seasons.'],
  ['2-for-1','2-for-1','You host twice, they host once — three games over three seasons (for a smaller opponent).'],
  ['neutral','Neutral-Site','One game at a neutral venue (a season-opening showcase).'],
  ['buy','Guarantee (Buy) Game','Pay a smaller program a guarantee to visit for one game.']];
// The season the first leg lands: the upcoming one (this Preseason if not yet kicked off, else next).
function nextSeriesYear(){return (!S.schedule)?(S.year||2026):((S.year||2026)+1);}
// A smaller program's asking guarantee for a buy game (scales with its prestige).
function seriesAsk(to){return Math.round(to.prestige*150000+1.0e6);}
// Will `to` accept a series of `type` from `from`? Buy games hinge on the guarantee; a 2-for-1
// needs `from` to be the bigger draw (the smaller side trades two road trips for a marquee + payday);
// home-and-homes on prestige proximity (a smaller school gladly hosts a marquee opponent).
function seriesWillingness(from,to,type,guarantee){
  if(from.conf===to.conf)return false;               // conference games are auto-scheduled
  const dp=Math.abs(from.prestige-to.prestige);
  if(type==='buy'){if(from.prestige<=to.prestige+8)return false;return (guarantee||0)>=seriesAsk(to);}
  if(type==='2-for-1')return from.prestige>to.prestige+6 && to.prestige>=from.prestige-45;
  return dp<=24 || (from.prestige>to.prestige && to.prestige>=from.prestige-40);
}
// Build the leg schedule for a series of `type` from host-perspective `aId` vs `bId`, starting year Y.
function seriesLegs(type,aId,bId,Y){
  if(type==='home-home')return [{year:Y,home:aId,away:bId},{year:Y+1,home:bId,away:aId}];
  if(type==='2-for-1')return [{year:Y,home:aId,away:bId},{year:Y+1,home:aId,away:bId},{year:Y+2,home:bId,away:aId}];
  if(type==='neutral')return [{year:Y,home:aId,away:bId,neutralSite:true}];
  return [{year:Y,home:aId,away:bId}];               // buy game: bId visits aId once
}
function mySeries(){return (S.series||[]).filter(s=>s.a===S.teamId||s.b===S.teamId);}
function seriesExistsWith(toId){return (S.series||[]).some(s=>(s.a===S.teamId&&s.b===toId)||(s.b===S.teamId&&s.a===toId));}
// Propose (and, if accepted, book) a series from the controlled team to `toId`.
function proposeSeries(toId,type,guarantee){
  const from=controlled(),to=teamById(toId);
  if(!to)return {ok:false,msg:'Unknown program'};
  if(to.id===from.id)return {ok:false,msg:'Pick another program'};
  if(from.conf===to.conf)return {ok:false,msg:'Conference games are auto-scheduled'};
  if(seriesExistsWith(toId))return {ok:false,msg:'You already have a series with them'};
  if(!seriesWillingness(from,to,type,guarantee))
    return {ok:false,msg:type==='buy'?('They want at least '+money(seriesAsk(to))):type==='2-for-1'?'Only a smaller program takes a 2-for-1':'They declined — prestige mismatch'};
  const Y=nextSeriesYear();
  const s={id:'s'+(S.series.length).toString(36)+Y,type,a:from.id,b:to.id,legs:seriesLegs(type,from.id,to.id,Y)};
  if(type==='buy'){s.guarantee=guarantee;from.budget-=guarantee;}   // pay the guarantee on booking
  S.series.push(s);autosave();
  return {ok:true,msg:'Series booked with '+to.name,series:s};
}

/* ---- AI-initiated series offers (the other half of "either side can initiate") ---- */
// A deterministic handful of non-conference programs that want to schedule YOU, refreshed each
// offseason (like the coach market). Bigger schools offer a 2-for-1 or a buy game (they pay YOU);
// near-peers offer a home-and-home. Stored in S.seriesOffers; accept/decline from the series card.
function genSeriesOffers(seed,year,meId){
  const me=teamById(meId);if(!me)return [];
  const r=rng((seed^hashStr('seriesoffers'+year))>>>0);
  const pool=S.world.teams.filter(t=>t.id!==meId&&t.conf!==me.conf&&!seriesExistsWith(t.id));
  const ranked=pool.map(t=>({t,k:r()+(1-Math.abs(t.prestige-me.prestige)/60)})).sort((a,b)=>b.k-a.k);
  const out=[], n=ri(r,2,4);
  for(let i=0;i<ranked.length&&out.length<n;i++){
    const o=ranked[i].t, dp=o.prestige-me.prestige; let type='home-home', guarantee=0;
    if(dp>12){ if(r()<0.5){type='2-for-1';} else {type='buy';guarantee=seriesAsk(me);} }  // they pay you to visit
    out.push({id:'so'+year.toString(36)+i.toString(36),fromId:o.id,type,guarantee});
  }
  return out;
}
function ensureSeriesOffers(){if(!S.seriesOffers)S.seriesOffers=genSeriesOffers(S.seed,S.year||2026,S.teamId);return S.seriesOffers;}
function acceptSeriesOffer(offerId){
  const o=(S.seriesOffers||[]).find(x=>x.id===offerId);if(!o)return false;
  const me=controlled(),from=teamById(o.fromId);if(!from){declineSeriesOffer(offerId);return false;}
  if(seriesExistsWith(from.id)){declineSeriesOffer(offerId);return false;}
  const Y=nextSeriesYear();
  // AI is the initiator/host of record: home-home → you host first; 2-for-1 → they host twice; buy → you visit, they pay you
  let legs;
  if(o.type==='home-home')legs=[{year:Y,home:me.id,away:from.id},{year:Y+1,home:from.id,away:me.id}];
  else legs=seriesLegs(o.type,from.id,me.id,Y);       // 2-for-1 / buy: `from` hosts
  const s={id:'s'+S.series.length.toString(36)+Y,type:o.type,a:from.id,b:me.id,legs};
  if(o.type==='buy'){s.guarantee=o.guarantee;me.budget+=o.guarantee;}   // you're bought → you receive
  S.series.push(s);S.seriesOffers=S.seriesOffers.filter(x=>x.id!==offerId);autosave();
  return true;
}
function declineSeriesOffer(offerId){S.seriesOffers=(S.seriesOffers||[]).filter(x=>x.id!==offerId);autosave();}

/* ============================================================
   RECRUITING — weekly economy + player actions (Phase 4)
   The pure engine (genRecruits/advanceRecruiting/coachMods/…) lives in the RECRUIT ENGINE
   block above; this layer owns S.recruiting, the points economy, and the five player actions.
   ============================================================ */
const RECRUIT_COSTS={scout:2,pitch:3,visit:5,promise:4,alumni:4};   // offer is free (uses a board slot)
function myMods(){return coachMods(S.coach);}
function weeklyPoints(){const t=controlled(),m=myMods();
  return Math.max(4,Math.round(REC.BASE_POINTS+m.points+t.prestige/20));}
function boardSlots(){return Math.max(6,REC.SLOTS+myMods().slots);}
function initRecruiting(){
  // stage: 'open' (in-season, taking verbals) → 'national' (offseason, ESP done, NSD pending) → 'closed'
  S.recruiting={cycle:1,points:weeklyPoints(),pool:genRecruits(S.seed,S.world.teams),board:[],signed:false,stage:'open'};
}
function grantRecruitPoints(){if(S.recruiting&&!S.recruiting.signed)S.recruiting.points=weeklyPoints();}
function resolveRecruitingWeek(week){
  if(!S.recruiting||S.recruiting.signed)return [];
  // in-season: verbal commitments only (finalize=false) — binding signatures wait for the offseason
  const out=advanceRecruiting(S.recruiting.pool,S.world.teams,week,S.schedule.weeks,S.seed,false);
  const me=S.teamId;
  // Phase 16: a verbal you held can flip away; you can flip one from a rival. Toast the swings.
  const lost=out.filter(r=>r._flipped&&r._flipped.from===me);
  const flippedToMe=out.filter(r=>r._flipped&&r._flipped.to===me);
  const fresh=out.filter(r=>!r._flipped&&r.committedTo===me);   // brand-new verbals to me (not flips)
  let d=300;
  if(fresh.length)setTimeout(()=>toast(fresh.length+' recruit'+(fresh.length===1?'':'s')+' verbally committed to you! 🎉'),d),d+=400;
  if(flippedToMe.length)setTimeout(()=>toast('Flipped '+flippedToMe.length+' commit'+(flippedToMe.length===1?'':'s')+' to you! 🔁'),d),d+=400;
  if(lost.length)setTimeout(()=>toast('⚠️ '+lost.length+' verbal'+(lost.length===1?'':'s')+' decommitted from you'),d);
  return out;
}
/* ---- lookups ---- */
function recById(id){return S.recruiting?S.recruiting.pool.find(r=>r.id===id):null;}
function onBoard(rec){return S.recruiting&&S.recruiting.board.includes(rec.id);}
function myInterest(rec){return Math.round(rec.iv[S.teamId]||0);}
function suitorList(rec){return Object.entries(rec.iv).map(([id,v])=>({id,v,team:teamById(id)}))
  .filter(s=>s.team).sort((a,b)=>b.v-a.v);}
function leaderOf(rec){const s=suitorList(rec);return s.length?s[0]:null;}
function myRank(rec){if(rec.iv[S.teamId]==null)return null;const s=suitorList(rec);return s.findIndex(x=>x.id===S.teamId)+1;}
function myClass(){return S.recruiting?S.recruiting.pool.filter(r=>r.committedTo===S.teamId):[];}
function myClassRank(){const me=controlled();const pool=S.recruiting.pool;
  const score=t=>classScore(t,pool);const my=score(me);
  return S.world.teams.filter(t=>score(t)>my).length+1;}
/* ---- spend helper ---- */
function spend(cost){if(S.recruiting.points<cost){toast('Not enough recruiting points');return false;}
  S.recruiting.points-=cost;return true;}
/* ---- actions ---- */
function offerRecruit(rec){
  if(onBoard(rec))return;
  if(rec.signed){toast('Already signed — can’t recruit him');return;}   // signed = locked (Phase 16)
  if(rec.committedTo&&rec.committedTo!==S.teamId)toast('Committed elsewhere — recruit him to flip it');   // verbal: you can still chase
  if(S.recruiting.board.length>=boardSlots()){toast('Board full — drop a target first');return;}
  const m=myMods(),me=controlled();
  const eff={prestige:clamp(me.prestige+m.prestige,20,99),needs:me.needs,fac:me.fac,homeState:me.homeState};
  let fit=recruitFit(eff,rec);
  if(m.homeState&&rec.st===m.homeState)fit*=m.homeBonus;
  const start=clamp(Math.round(16+fit*24),8,72);
  rec.iv[S.teamId]=Math.max(rec.iv[S.teamId]||0,start);
  rec.offered=true;S.recruiting.board.push(rec.id);
  autosave();
}
function dropRecruit(rec){
  S.recruiting.board=S.recruiting.board.filter(id=>id!==rec.id);
  delete rec.iv[S.teamId];autosave();
}
function scoutRecruit(rec){if(!spend(RECRUIT_COSTS.scout))return false;
  rec.scout=clamp(rec.scout+Math.round(30*myMods().scout),0,100);autosave();return true;}
function pitchRecruit(rec,angle){if(!spend(RECRUIT_COSTS.pitch))return false;
  const m=myMods();
  let mult=rec.prefs[0]===angle?1.6:rec.prefs[1]===angle?1.2:0.7;
  if(angle==='nil')mult*=m.nil; if(angle==='development')mult*=m.devPitch;
  let gain=8*mult*m.pitch;
  if(m.homeState&&rec.st===m.homeState)gain*=m.homeBonus;
  bumpInterest(rec,gain);autosave();return true;}
function visitRecruit(rec){if(rec.visited){toast('Already visited');return false;}
  if(!spend(RECRUIT_COSTS.visit))return false;
  const m=myMods();let gain=18*m.visit;
  if(isGameDayVisit())gain*=1.5;
  if(m.homeState&&rec.st===m.homeState)gain*=m.homeBonus;
  bumpInterest(rec,gain);rec.visited=true;autosave();return true;}
function promiseRecruit(rec,type){if(rec.promise){toast('Already made a promise');return false;}
  if(!spend(RECRUIT_COSTS.promise))return false;
  const m=myMods();let gain=22*m.visit;
  if(m.homeState&&rec.st===m.homeState)gain*=m.homeBonus;
  bumpInterest(rec,gain);rec.promise={type};autosave();return true;}
function bumpInterest(rec,gain){rec.iv[S.teamId]=clamp((rec.iv[S.teamId]||0)+gain,0,100);}
/* ---- alumni visit (Phase 11): deploy a program legend to recruit a prospect ---- */
// Coach amplifier: Former Player owns the alumni network; High School Legend pulls home-state alumni.
function alumniCoachMod(legend){const c=S.coach||{};let m=1;
  if(c.history==='Former Player')m*=1.4;
  if(c.history==='High School Legend'&&legend.st&&legend.st===c.homeState)m*=1.5;
  return m;}
function myLegends(){return controlled().legends||[];}
// Legends with appearances left, most relevant to this recruit first (the picker's source list).
function availableLegends(rec){
  return myLegends().filter(l=>(l.app||0)>0)
    .map(l=>({l,rel:alumniRelevance(l,rec)})).sort((a,b)=>b.rel-a.rel).map(x=>x.l);}
function alumniVisit(rec,legend){
  if(rec.alumni){toast('An alum already hosted this recruit');return false;}
  if(!legend||(legend.app||0)<=0){toast('No appearances left for that alum');return false;}
  if(!spend(RECRUIT_COSTS.alumni))return false;
  bumpInterest(rec,alumniBoost(legend,rec,alumniCoachMod(legend)));
  legend.app=(legend.app||0)-1;            // spend one appearance
  rec.alumni=legend.id;                    // one alumni visit per recruit (no stacking)
  autosave();return true;}
// A "game-day visit" lands more: the controlled team has a home game this week.
function isGameDayVisit(){const g=teamGame(S.teamId,S.week);return !!(g&&g.home===S.teamId&&!g.played);}
// Result of a game from one team's perspective, formatted for the UI.
function gameView(g,teamId){
  const home=g.home===teamId,opp=teamById(home?g.away:g.home);
  let res='',cls='',my=null,th=null;
  if(g.played){my=home?g.hs:g.as;th=home?g.as:g.hs;const win=my>th;
    res=(win?'W ':'L ')+my+'–'+th;cls=win?'good':'bad';}
  return {opp,home,res,cls,my,th,week:g.week,played:g.played};
}
function recStr(t){return t.rec?t.rec.w+'–'+t.rec.l:'';}
// One Player-of-the-Week row (handles a null honoree gracefully).
function honorRowHTML(label,h){
  if(!h)return `<div class="row spread" style="margin:6px 0"><span class="meta dim">${label}</span><span class="meta dim">—</span></div>`;
  return `<div class="row spread" style="margin:6px 0;gap:8px">
    <div class="row" style="gap:8px;min-width:0"><span class="dot" style="background:${h.color};flex:none"></span>
      <div style="min-width:0"><div class="nm" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${h.name} <span class="dim" style="font-weight:400">${h.pos} · ${h.abbr}</span></div>
      <div class="meta dim">${h.line}</div></div></div>

/* ============================================================
   WATCHABLE GAME — animate simEngine's play log, then commit.
   Two entry points: openGameViewer (your week → watch-then-commit) and openGameReplay
   (a decided game → replay only). Both animate the SAME deterministic log, so the watched
   score always equals the committed/recorded score.
   ============================================================ */
let gameTimer=null;
// Find a game by id in the regular-season schedule OR the postseason (bracket + bowls).
function findAnyGame(id){
  if(S.schedule){const g=S.schedule.games.find(x=>x.id===id);if(g)return g;}
  if(S.postseason){const g=S.postseason.playoff.rounds.flat().concat(S.postseason.bowls).find(x=>x.id===id);if(g)return g;}
  if(S.champWeek){const g=S.champWeek.games.find(x=>x.id===id);if(g)return g;}
  return null;
}
function buildGameLog(gameId){
  const g=findAnyGame(gameId); if(!g)return null;
  const {home,away}=simSides(g);
  const res=simEngine(home,away,(hashStr(g.id)^(S.seed>>>0))>>>0,{log:true});
  return {gameId,home:g.home,away:g.away,log:res.log,hs:res.hs,as:res.as,idx:0,fast:false,done:false};
}
function openGameViewer(g){ UI.game=Object.assign(buildGameLog(g.id)||{},{replay:false,post:!!g.kind,champ:g.kind==='champ'}); UI.view='game'; render(); scheduleGameTick(); }
function openGameReplay(gameId){ const G=buildGameLog(gameId); if(!G)return; G.replay=true; UI.game=G; UI.view='game'; render(); scheduleGameTick(); }
function curGameScore(G){const e=G.idx>0?G.log[G.idx-1]:null;return e?{hs:e.hs,as:e.as,q:e.q}:{hs:0,as:0,q:1};}
function qLabel(q){return (''+q).startsWith('OT')?q:'Q'+q;}
function gameEventEl(e){
  if(e.kind==='final')return null;
  const line=el('div');
  if(e.kind==='drive'){line.className='meta dim';line.style.cssText='margin:11px 2px 3px;font-weight:700;letter-spacing:.04em';line.textContent=e.text;}
  else if(e.kind==='score'){line.className='lrow';line.style.cssText='box-shadow:inset 0 0 0 1px var(--accent);font-weight:700;margin:4px 0';line.innerHTML=`<div style="flex:1;font-size:13px">${e.text}</div>`;}
  else{line.className='row';line.style.cssText='gap:8px;margin:3px 2px';line.innerHTML=`<span class="meta dim" style="flex:none;width:46px">${e.dd||''}</span><span style="flex:1;font-size:13px">${e.text}</span>`;}
  return line;
}
function applyGameEvent(e){
  const hs=$('#g-hs'),as=$('#g-as'),q=$('#g-q');
  if(hs)hs.textContent=e.hs; if(as)as.textContent=e.as; if(q&&e.q)q.textContent=qLabel(e.q);
  const ln=gameEventEl(e),feed=$('#g-feed'); if(ln&&feed){feed.append(ln);feed.scrollTop=feed.scrollHeight;}
}
function scheduleGameTick(){
  const G=UI.game; if(!G||G.done)return;
  if(G.idx>=G.log.length){gameDone();return;}
  const e=G.log[G.idx];
  const base=e.kind==='score'?760:e.kind==='drive'?260:e.kind==='final'?10:230;
  gameTimer=setTimeout(()=>{ if(UI.view!=='game'||!UI.game){gameTimer=null;return;} applyGameEvent(e); UI.game.idx++; scheduleGameTick(); }, G.fast?Math.max(35,base/4):base);
}
function gameDone(){ if(gameTimer){clearTimeout(gameTimer);gameTimer=null;} if(UI.game){UI.game.done=true;render();} }
function skipGame(){ const G=UI.game; if(!G)return; if(gameTimer){clearTimeout(gameTimer);gameTimer=null;} G.idx=G.log.length; G.done=true; render(); }
function finishGame(){
  if(gameTimer){clearTimeout(gameTimer);gameTimer=null;}
  const G=UI.game; if(!G)return; const replay=G.replay, gid=G.gameId, post=G.post, champ=G.champ; UI.game=null;
  if(replay){ UI.view='season'; render(); return; }
  UI.view='home';
  if(champ)advanceChampWeek(); else if(post)advancePostseason(); else advanceWeek();   // commit the watched game (re-sims deterministically)
  const g=findAnyGame(gid); render();
  if(g){const gv=gameView(g,controlled().id);toast((gv.cls==='good'?'Won ':'Lost ')+gv.res.slice(2)+(gv.home?' vs ':' @ ')+gv.opp.abbr);}
}
function renderGame(app){
  const G=UI.game; if(!G){UI.view='home';return renderHome(app);}
  const home=teamById(G.home),away=teamById(G.away),t=controlled(),cs=curGameScore(G);
  const v=el('div','view');v.style.paddingBottom='10px';
  const sb=el('div','card');sb.dataset.tid='game-board';sb.style.cssText='position:sticky;top:0;z-index:5';
  sb.innerHTML=`<div class="row spread" style="align-items:center">
      <div class="row" style="gap:8px;min-width:0"><span class="dot" style="background:${home.color};flex:none"></span><div class="nm">${home.abbr}${home.id===t.id?' <span class="cap">YOU</span>':''}</div></div>
      <div class="cond" style="font-size:30px;font-weight:800;white-space:nowrap"><span id="g-hs">${cs.hs}</span> – <span id="g-as">${cs.as}</span></div>
      <div class="row" style="gap:8px;min-width:0;justify-content:flex-end"><div class="nm">${away.abbr}${away.id===t.id?' <span class="cap">YOU</span>':''}</div><span class="dot" style="background:${away.color};flex:none"></span></div></div>
    <div class="meta dim" style="text-align:center;margin-top:6px"><span id="g-q">${qLabel(cs.q)}</span> · ${G.replay?'Replay':'Live'} · ${home.name} vs ${away.name}</div>`;
  v.append(sb);
  const feed=el('div');feed.id='g-feed';feed.style.cssText='max-height:46vh;overflow-y:auto;margin-top:12px';
  for(let i=0;i<G.idx;i++){const ln=gameEventEl(G.log[i]);if(ln)feed.append(ln);}
  v.append(feed);
  const ctr=el('div','btn-row');ctr.style.marginTop='14px';
  if(G.done){
    const cont=el('button','btn',G.replay?'Done':'Continue → commit week');cont.dataset.tid='game-continue';
    cont.onclick=finishGame;ctr.append(cont);
  }else{
    const skip=el('button','btn line','Skip to result');skip.dataset.tid='game-skip';skip.onclick=skipGame;
    const fast=el('button','btn ghost',G.fast?'Fast ✓':'Fast');fast.dataset.tid='game-fast';fast.onclick=()=>{G.fast=!G.fast;render();};
    ctr.append(skip,fast);
  }
  v.append(ctr);
  app.append(v);
  requestAnimationFrame(()=>{const f=$('#g-feed');if(f)f.scrollTop=f.scrollHeight;});
}

// Curated highlight reel: the season's most notable results, each replayable. Tag + score by
// upset (underdog won), shootout (high total), nailbiter (≤3 / OT), and your signature wins.
function greatestGames(limit){
  const scored=S.schedule.games.filter(g=>g.played).map(g=>{
    const home=teamById(g.home),away=teamById(g.away),homeWon=g.hs>g.as;
    const win=homeWon?home:away,lose=homeWon?away:home;
    const margin=Math.abs(g.hs-g.as),total=g.hs+g.as,upset=lose.ratings.ovr-win.ratings.ovr;
    const iWon=(win.id===S.teamId);
    let tag='',score=0;
    [['Upset',upset>=8?upset*2.0:0],['Shootout',total>=80?(total-60)*0.7:0],
     ['Nailbiter',margin<=3?(8-margin)*2.5:0],['Signature win',iWon&&upset>=4?upset*1.5+12:0]]
      .forEach(([tg,sc])=>{if(sc>score){score=sc;tag=tg;}});
    return {g,win,lose,winScore:Math.max(g.hs,g.as),loseScore:Math.min(g.hs,g.as),tag,score};
  }).filter(x=>x.tag);
  scored.sort((a,b)=>b.score-a.score);
  return scored.slice(0,limit||6);
}

/* ============================================================
   RECRUITING VIEW (Board · Prospects · Class)  — Phase 4
   ============================================================ */
function prefLabel(k){const a=PITCH_ANGLES.find(x=>x[0]===k);return a?a[1]:k;}
function renderRecruiting(app){
  const t=controlled();
  const v=el('div','view');
  v.append(scoreboard(t));
  if(!S.recruiting){
    v.append(el('div','empty','Recruiting opens at kickoff.\nKick off the season from Home to open the prospect board.'));
    app.append(v);return;
  }
  const R=S.recruiting, cls=myClass(), rank=myClassRank(), grade=classGrade(rank);
  // Phase 14 calendar: open (in-season verbals) → national (offseason final push) → closed.
  const stage=R.stage||(R.signed?'closed':'open');
  const stageLabel={open:'refills each week',national:'final push · Signing Day pending',closed:'class locked'}[stage];
  const ptsLabel=stage==='closed'?'Signing Day':stage==='national'?'Final push':'Recruiting points';
  const ptsVal=stage==='closed'?'CLOSED':R.points+' pts';
  const signedN=cls.filter(r=>r.signed).length;
  const sum=el('div','card');
  sum.innerHTML=`<div class="row spread">
      <div><div class="meta dim">${ptsLabel}</div>
        <div class="cond" style="font-size:28px;font-weight:800">${ptsVal}</div></div>
      <div style="text-align:right"><div class="meta dim">Class rank</div>
        <div class="cond" style="font-size:28px;font-weight:800">#${rank} <span class="tag accent" style="font-size:13px;vertical-align:3px">${grade}</span></div></div></div>
    <div class="row spread" style="margin-top:8px">
      <span class="meta">Board ${R.board.length}/${boardSlots()}</span>
      <span class="meta">${stage==='open'?'Verbals':'Signed'} ${stage==='open'?cls.length:signedN}${stage!=='open'&&cls.length>signedN?'/'+cls.length:''}</span>
      <span class="meta dim">${stageLabel}</span></div>`;
  v.append(sum);
  if(stage==='national')v.append(el('div','hint center','Early Signing Period done — '+signedN+' signed. Push the holdouts, then hold National Signing Day from Home.'));
  const st=UI.recruitTab||'board';
  const tabs=el('div','tabs');tabs.style.marginTop='12px';
  [['board','Board'],['prospects','Prospects'],['class','Class']].forEach(([k,l])=>{
    const b=el('button',st===k?'on':'',l);b.dataset.tid='rtab-'+k;
    b.onclick=()=>{UI.recruitTab=k;render();};tabs.append(b);});
  v.append(tabs);
  if(st==='board')recruitBoard(v);
  else if(st==='prospects')recruitProspects(v);
  else recruitClass(v,rank,grade);
  v.style.paddingBottom='10px';
  app.append(v);
}
function recruitStarChip(rec){return `<div class="pos" style="width:auto;color:var(--accent);font-size:12.5px;letter-spacing:-1px">${'★'.repeat(rec.stars)}</div>`;}
function recruitRow(rec){
  const row=el('button','lrow');row.style.width='100%';row.style.textAlign='left';row.dataset.id=rec.id;
  const sc=recScouted(rec), mi=myInterest(rec), rank=myRank(rec), nS=suitorList(rec).length, committed=rec.committedTo, mine=committed===S.teamId;
  let status;
  if(committed)status=`<span class="tag ${mine?'good':'bad'}" style="font-size:10px">${mine?'TO YOU ✓':'→ '+teamById(committed).abbr}</span>`;
  else status=`<div class="cond ${rank===1?'good':''}" style="font-size:14px;font-weight:700">${rank?'#'+rank+'/'+nS:'—'}</div>`;
  row.innerHTML=`${recruitStarChip(rec)}
    <div style="flex:1;min-width:0">
      <div class="nm" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${rec.fn} ${rec.ln} <span class="dim" style="font-weight:400">${rec.pos} · ${rec.st}</span></div>
      <div class="meta">${sc.text}${committed?'':' · interest '+mi+'%'}</div>
      ${committed?'':'<div class="bar" style="margin-top:5px"><i style="width:'+mi+'%"></i></div>'}</div>
    <div style="text-align:right;flex:none;margin-left:8px">${status}</div>`;
  row.onclick=()=>recruitSheet(rec);
  return row;
}
function recruitBoard(v){
  const R=S.recruiting;
  if(!R.board.length){v.append(el('div','empty','No targets yet.\nOpen the Prospects tab and offer a scholarship to start a board.'));return;}
  const recs=R.board.map(recById).filter(Boolean)
    .sort((a,b)=>(b.committedTo===S.teamId)-(a.committedTo===S.teamId)||myInterest(b)-myInterest(a));
  recs.forEach(rec=>v.append(recruitRow(rec)));
}
function recruitProspects(v){
  const R=S.recruiting, t=controlled();
  const wrap=el('div');
  const search=el('input','search');search.placeholder='Search prospects…';search.dataset.tid='rec-search';
  const fbar=el('div','row');fbar.style.cssText='gap:8px;margin-bottom:10px;flex-wrap:wrap';
  const posSel=el('select');posSel.dataset.tid='rec-pos';
  [['','All pos'],...POS.map(([c])=>[c,c])].forEach(([val,l])=>{const o=el('option');o.value=val;o.textContent=l+((val&&t.needs&&t.needs[val])?' ●':'');o.selected=false;posSel.append(o);});
  const starSel=el('select');[['','All ★'],['5','5★'],['4','4★ +'],['3','3★ +'],['2','2★ +']].forEach(([val,l])=>{const o=el('option');o.value=val;o.textContent=l;starSel.append(o);});
  // Phase 17: with the full national class, a home-state + an availability filter keep the board usable.
  const stSel=el('select');stSel.dataset.tid='rec-state';
  [['','All states'],...STATES.map(s=>[s,s])].forEach(([val,l])=>{const o=el('option');o.value=val;o.textContent=l;stSel.append(o);});
  const availSel=el('select');availSel.dataset.tid='rec-avail';
  [['','Available + mine'],['open','Uncommitted only'],['verbal','Verbals (flippable)'],['mine','My commits'],['board','My board']].forEach(([val,l])=>{const o=el('option');o.value=val;o.textContent=l;availSel.append(o);});
  fbar.append(posSel,starSel,stSel,availSel);
  const list=el('div');list.dataset.tid='rec-list';
  const cnt=el('div','hint center');
  const PAGE=80; let shown=PAGE;
  const moreBtn=el('button','btn line','Load more');moreBtn.style.marginTop='10px';
  moreBtn.onclick=()=>{shown+=PAGE;draw();};
  function avail(r){
    const v=availSel.value, mine=r.committedTo===S.teamId;
    if(v==='open')return !r.committedTo;
    if(v==='verbal')return r.committedTo&&!r.signed&&!mine;
    if(v==='mine')return mine;
    if(v==='board')return onBoard(r);
    return !r.signed||mine;            // default: anything still gettable (incl. flippable verbals) + my commits
  }
  function draw(){
    list.innerHTML='';
    let arr=R.pool.filter(avail);
    const q=search.value.toLowerCase().trim();
    if(q)arr=arr.filter(r=>(r.fn+' '+r.ln+' '+r.pos+' '+r.st).toLowerCase().includes(q));
    if(posSel.value)arr=arr.filter(r=>r.pos===posSel.value);
    if(starSel.value)arr=arr.filter(r=>r.stars>=+starSel.value);
    if(stSel.value)arr=arr.filter(r=>r.st===stSel.value);
    arr.sort((a,b)=>b.stars-a.stars||myInterest(b)-myInterest(a)||a.ln.localeCompare(b.ln));
    arr.slice(0,shown).forEach(r=>list.append(recruitRow(r)));
    if(!arr.length)list.append(el('div','empty','No prospects match.'));
    moreBtn.style.display=arr.length>shown?'':'none';
    cnt.textContent=Math.min(shown,arr.length)+' of '+arr.length+' prospects';
  }
  const reset=()=>{shown=PAGE;draw();};
  search.oninput=reset;posSel.onchange=reset;starSel.onchange=reset;stSel.onchange=reset;availSel.onchange=reset;
  wrap.append(search,fbar,list,moreBtn,cnt);v.append(wrap);draw();
}
function recruitClass(v,rank,grade){
  const cls=myClass();
  const head=el('div','card');
  head.innerHTML=`<div class="row spread">
      <div><div class="meta dim">National class rank</div><div class="cond" style="font-size:30px;font-weight:800">#${rank}</div></div>
      <div class="ovr elite" style="width:auto;padding:8px 14px;font-size:26px">${grade}</div></div>`;
  v.append(head);
  const stage=(S.recruiting&&S.recruiting.stage)||'open', signedN=cls.filter(r=>r.signed).length;

  if(!cls.length){v.append(el('div','empty','No commits yet.\nWork your board to land verbal commitments — they sign in the offseason.'));}
  else POS.forEach(([code])=>{
    const g=cls.filter(r=>r.pos===code);if(!g.length)return;

    g.sort((a,b)=>b.stars-a.stars).forEach(r=>v.append(recruitRow(r)));
  });
  v.append(el('div','hint center',cls.length+' of '+REC.CLASS_CAP+' class spots filled (the full national board is modeled now).\nSignees become freshmen at the offseason rollover.'));
}
function recruitSheet(rec){
  const body=el('div'), R=S.recruiting, sc=recScouted(rec), mi=myInterest(rec), rank=myRank(rec), suit=suitorList(rec);
  // Phase 16: a VERBAL commit elsewhere is now flippable — you can recruit him until he signs.

      <span class="tag accent">${'★'.repeat(rec.stars)} ${rec.stars}-STAR</span>

    <div class="kv"><span class="k">Ceiling</span><span>${sc.text}</span></div>

  }else{
    ib.innerHTML=`<div class="row spread" style="margin:2px 0 4px"><span class="meta">Your interest ${onB?'· #'+rank+' of '+suit.length:'(not offered)'}</span><span class="cond" style="font-weight:700">${mi}%</span></div>
      <div class="bar"><i style="width:${mi}%"></i></div>
      <div class="meta dim" style="margin:10px 0 4px">Top suitors</div>`;

    suit.slice(0,4).forEach(s=>{const me=s.id===S.teamId;
      sl.append(el('div','row spread',`<span class="row" style="gap:7px"><span class="dot" style="background:${s.team.color}"></span><span class="${me?'cap':''}" style="font-size:13px">${s.team.abbr}${me?' (YOU)':''}</span></span><span class="meta">${Math.round(s.v)}%</span>`));});

/* ---------- player progression: scouted ceiling + development stage ---------- */
// Ceiling tiers by potential (high → low). index 0 = best. "Superstar" upside lives here.
const CEILINGS=[[95,'Generational'],[89,'Superstar'],[83,'Star'],[77,'Starter'],[70,'Rotational'],[0,'Depth']];
function ceilingIndex(pot){return CEILINGS.findIndex(([m])=>pot>=m);}
function hashStr(s){let h=2166136261;for(let i=0;i<String(s).length;i++){h^=String(s).charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
// Scouting confidence: older/experienced players have a track record; freshmen are projections.
function scoutConfidence(p){if(p.age>=22||/SR/.test(p.yr))return 'high';if(p.age>=20||/JR/.test(p.yr))return 'med';return 'low';}
// Coach-responsive scouting sharpness (Phase 7): an Analyst head coach and a strong coordinator
// room sharpen the roster reads, tightening the ceiling band beyond the base age/class fog.
function scoutSharpen(){
  let s=0;
  if(S&&S.coach&&S.coach.history==='Analyst')s+=2;
  const t=(S&&S.teamId)?controlled():null;
  if(t&&t.staff){const co=t.staff.filter(c=>c.tier==='coord');
    if(co.length){const a=co.reduce((x,c)=>x+c.rating,0)/co.length;if(a>=85)s+=2;else if(a>=78)s+=1;}}
  return s;
}
// Fuzzy ceiling read: a tier (or band) with uncertainty. Exact potential stays hidden; the noise
// is deterministic per player (so it's stable) and now SHRINKS with coaching (scoutSharpen).
function scoutedCeiling(p){
  const conf=scoutConfidence(p), base=conf==='high'?0:conf==='med'?3:7;
  const spread=Math.max(0,base-scoutSharpen());
  const noise=base?(hashStr(p.id)%(2*base+1))-base:0;     // noise tied to the base fog (stable per player)
  const est=clamp(p.pot+noise,40,99);
  const li=ceilingIndex(clamp(est-spread,40,99)), hi=ceilingIndex(clamp(est+spread,40,99));
  const text=li===hi?CEILINGS[hi][1]+(spread?' ?':''):CEILINGS[li][1]+'–'+CEILINGS[hi][1]+' ?';
  return {text, best:hi, hot:hi<=2, uncertain:spread>0};   // hot = upside reaches Star or better
}
// Growth chip: surfaces last offseason's OVR gain on returning players (Phase 7 development).
function growthChip(p){return p.dev>0?` <span class="tag accent" style="font-size:10px">▲ +${p.dev}</span>`:'';}
// Development stage from growth remaining (ov→pot gap). Qualitative; exact gap not shown.
function devStage(p){const gap=p.pot-p.ov;return gap<=2?'Maxed':gap<=7?'Polished':gap<=13?'Developing':'Raw';}
function ceilingChip(p){const sc=scoutedCeiling(p);return `<span class="tag ${sc.hot?'accent':''}" style="font-size:10px">${sc.text}</span>`;}
// ---- Phase 10: fogged temperament reads (UI). The raw trait number is never shown — only a
// banded tier whose width shrinks as you get to KNOW the player (tenure + a sharp coaching eye for
// your roster; scouting confidence for recruits). Hidden as '???' until you know them at all.
const TRAIT_TIERS={
  mot:['Lazy','Inconsistent','Steady','Hard Worker','Relentless'],          // work ethic
  comp:['Volatile','Streaky','Even-Keel','Composed','Ice-Veined']           // composure / poise
};
function traitTier(v){return v>=82?4:v>=64?3:v>=46?2:v>=30?1:0;}
function traitRead(kind,id,value,conf){
  if(conf<34)return {text:'???',revealed:false,hot:false};                  // you don't know them yet
  const spread=Math.round(clamp(36-conf*0.36,0,36));                        // band tightens with confidence
  const noise=spread?(hashStr(id+kind)%(2*spread+1))-spread:0;              // stable per (player,trait)
  const est=clamp(value+noise,0,100);
  const lo=traitTier(clamp(est-spread,0,100)), hi=traitTier(clamp(est+spread,0,100)), L=TRAIT_TIERS[kind];
  return {text:lo===hi?L[hi]+(spread?' ?':''):L[lo]+'–'+L[hi]+' ?', revealed:true, hot:hi>=4&&lo>=3};
}
// How well you know one of YOUR players' makeup: longer in your program + a sharp room sharpen it.
function rosterTraitConf(p){
  const tenure={'FR':18,'RS-FR':30,'SO':46,'RS-SO':54,'JR':66,'RS-JR':72,'SR':85,'RS-SR':90}[p.yr];
  return clamp((tenure!=null?tenure:50)+scoutSharpen()*7,0,100);
}
// Two compact chips for the roster row / sheet (Motor = work ethic, Poise = composure).
function traitChips(p){
  const conf=rosterTraitConf(p);
  const m=traitRead('mot',p.id,motVal(p),conf), c=traitRead('comp',p.id,compVal(p),conf);
  return `<span class="tag ${m.hot?'accent':''}" style="font-size:10px">Motor: ${m.text}</span> `
        +`<span class="tag ${c.hot?'accent':''}" style="font-size:10px">Poise: ${c.text}</span>`;
}
// Recruit ceiling fog: like scoutedCeiling, but the band is driven by YOUR scouting confidence
// (rec.scout 0→100) instead of age/class. Prefs unlock once you've scouted past halfway.
function recScouted(rec){
  const spread=Math.round(clamp(9-rec.scout*0.09,0,9));
  const noise=spread?(hashStr(rec.id)%(2*spread+1))-spread:0;
  const est=clamp(rec.pot+noise,40,99);
  const li=ceilingIndex(clamp(est-spread,40,99)),hi=ceilingIndex(clamp(est+spread,40,99));
  const text=li===hi?CEILINGS[hi][1]+(spread?' ?':''):CEILINGS[li][1]+'–'+CEILINGS[hi][1]+' ?';
  return {text,hot:hi<=2,spread,revealed:rec.scout>=50};
}
// Letter grade for a recruiting class from its national rank (1..134).
function classGrade(rank){return rank<=4?'A+':rank<=12?'A':rank<=25?'A-':rank<=40?'B+':rank<=60?'B':rank<=85?'C+':rank<=110?'C':'D';}
// Season box for a player, grouped by what they actually did (only nonzero categories show).
// Returns {gp, lines:[[label,value]]} or null if the player has logged nothing yet.
function statLines(p){
  const s=p.gs; if(!s) return null;
  const L=[];
  if(s.pAtt) L.push(['Passing', `${s.pCmp||0}/${s.pAtt} · ${s.pYds||0} yds · ${s.pTD||0} TD · ${s.pInt||0} INT`]);
  if(s.rAtt) L.push(['Rushing', `${s.rAtt} car · ${s.rYds||0} yds · ${s.rTD||0} TD`]);
  if(s.rec)  L.push(['Receiving', `${s.rec} rec · ${s.reYds||0} yds · ${s.reTD||0} TD`]);
  if(s.tkl||s.sk||s.dInt){const d=[];if(s.tkl)d.push(s.tkl+' tkl');if(s.sk)d.push(s.sk+' sk');if(s.dInt)d.push(s.dInt+' INT');L.push(['Defense',d.join(' · ')]);}
  if(s.fga||s.xpa){const d=[];if(s.fga)d.push(`${s.fgm||0}/${s.fga} FG`);if(s.xpa)d.push(`${s.xpm||0}/${s.xpa} XP`);L.push(['Kicking',d.join(' · ')]);}
  return L.length?{gp:s.gp||0,lines:L}:null;
}
// "Stats (this year)" block for the player sheet: preseason → placeholder; in-season → the
// player's box, or "did not play" if a body has logged nothing.
function statBlock(p){
  const preseason=!S.schedule||S.phase==='Preseason';
  const sl=statLines(p);
  if(preseason||!sl) return `<div class="kv"><span class="k">Stats (this year)</span><span class="dim">${preseason?'— preseason —':'— did not play —'}</span></div>`;
  const rows=sl.lines.map(([k,v])=>`<div class="kv"><span class="k">${k}</span><span>${v}</span></div>`).join('');
  return `<div class="kv"><span class="k">Stats (this year)</span><span class="dim">${sl.gp} game${sl.gp===1?'':'s'}</span></div>${rows}`;
}

function makeStarter(p,t){
  const grp=t.roster.filter(x=>x.pos===p.pos).sort((a,b)=>a.so-b.so);
  grp.splice(grp.indexOf(p),1);grp.unshift(p);grp.forEach((x,i)=>x.so=i);autosave();
}
function swapDepth(p,t,dir){
  const grp=t.roster.filter(x=>x.pos===p.pos).sort((a,b)=>a.so-b.so);
  const i=grp.indexOf(p),j=i+dir;if(j<0||j>=grp.length)return;
  [grp[i].so,grp[j].so]=[grp[j].so,grp[i].so];autosave();
}

// The free-agent coach market. If `slotRole` is given, pre-filter to candidates for that slot.

  if(!slotRole){
    const tabs=el('div','tabs');tabs.style.marginBottom='10px';
    [['all','All'],['coord','Coordinators'],['pos','Position']].forEach(([k,l])=>{
      const b=el('button',filter===k?'on':'',l);b.onclick=()=>{filter=k;[...tabs.children].forEach(x=>x.classList.remove('on'));b.classList.add('on');draw();};
      tabs.append(b);
    });
    body.append(tabs);
  }
  body.append(listWrap);draw();
  openSheet(slotRole?('Hire — '+(COORD_ROLES.find(c=>c[0]===slotRole)||POS_COACHES.find(c=>c[0]===slotRole)||['',''])[1]):'Coaching Carousel',body);
}

/* ============================================================
   TEAM BROWSER (ratings + facilities for every team)
   ============================================================ */
function renderBrowse(app,picking){
  applyAccent(picking?null:controlled());
  const v=el('div','view');
  const back=picking?()=>{ if(UI._editMode){UI._editMode=false;UI.view='newgame';} else {UI.view='newgame';} render();}
                    :null;
  if(picking)v.append(headerBar(UI._editMode?'Edit Rosters':'Every Program','Ratings & facilities',back));
  else{const t=controlled();v.append(scoreboard(t));v.append(el('h2','sec','Every Program'));}
  const world=picking?UI.newgame.world:S.world;
  v.append(buildTeamList(world.teams,t=>{
    if(UI._editMode){openTeamEditor(t);}
    else if(picking){UI.newgame.teamId=t.id;finishNewGame(UI.newgame);}
    else teamInfoSheet(t);
  },'browse'));
  app.append(v);
}
function buildTeamList(teams,onTap,mode){
  const wrap=el('div');
  const search=el('input','search');search.placeholder='Search teams…';search.style.marginBottom='11px';
  const list=el('div');
  const sortSel=el('select');sortSel.style.marginBottom='11px';
  [['ovr','Sort: Overall'],['name','Sort: A–Z'],['conf','Sort: Conference'],['prestige','Sort: Prestige']]
    .forEach(([v2,l])=>{const o=el('option');o.value=v2;o.textContent=l;sortSel.append(o);});
  function draw(){
    list.innerHTML='';
    let arr=[...teams];
    const q=search.value.toLowerCase().trim();
    if(q)arr=arr.filter(t=>(t.name+' '+t.nick+' '+t.conf).toLowerCase().includes(q));
    const s=sortSel.value;
    arr.sort((a,b)=> s==='name'?a.name.localeCompare(b.name):
      s==='conf'?(a.conf.localeCompare(b.conf)||b.ratings.ovr-a.ratings.ovr):
      s==='prestige'?b.prestige-a.prestige:b.ratings.ovr-a.ratings.ovr);
    arr.slice(0,200).forEach(t=>{
      const row=el('button','team-pick');row.style.width='100%';row.style.textAlign='left';row.dataset.id=t.id;
      row.innerHTML=`<span class="dot" style="background:${t.color}"></span>
        <div style="flex:1"><div class="nm">${t.name} <span class="dim" style="font-weight:400">${t.nick}</span></div>
        <div class="meta">${t.conf}${t.div?' · '+t.div:''} · #${t.natRank} nat'l · Prestige ${t.prestige}</div></div>
        <div class="ovr ${t.ratings.ovr>=85?'elite':''}">${t.ratings.ovr}</div>`;
      row.onclick=()=>onTap(t);
      list.append(row);
    });
    if(!arr.length)list.append(el('div','empty','No teams match that search.'));
  }
  search.oninput=draw;sortSel.onchange=draw;draw();
  wrap.append(search,sortSel,list);return wrap;
}
function teamInfoSheet(t){
  const body=el('div');
  body.innerHTML=`<div class="row spread" style="margin-bottom:10px">
    <span class="tag" style="background:${t.color};color:${textOn(t.color)}">${t.conf}${t.div?' · '+t.div:''}</span>
    <span class="meta">#${t.natRank} nationally · #${t.confRank} in conf</span></div>`;
  const r=el('div','ranks');
  r.append(rankPill(t.ratings.ovr,'Overall'),rankPill(t.ratings.off,'Offense'),rankPill(t.ratings.def,'Defense'));
  body.append(r,el('h2','sec','Facilities'));
  const fc=el('div','card');
  [['Stadium','stadium'],['Strength','strength'],['Training','training'],['Academics','academics'],['NIL','nil']]
    .forEach(([l,k])=>fc.append(facBar(l,t.fac[k])));
  body.append(fc);
  openSheet(t.name+' '+t.nick,body);
}
function openTeamEditor(t){
  const body=el('div');const f={};
  body.append(el('div','hint','Quick edits. Use roster import for bulk player changes.'),el('hr','div'));
  body.append(fld('Prestige (20-98)',inputEl(t.prestige,x=>f.pr=x,'','number')),
    fld('Stadium (1-10)',inputEl(t.fac.stadium,x=>f.st=x,'','number')),
    fld('Strength (1-10)',inputEl(t.fac.strength,x=>f.str=x,'','number')),
    fld('NIL (1-10)',inputEl(t.fac.nil,x=>f.nil=x,'','number')));
  const save=el('button','btn','Save changes');
  save.onclick=()=>{if(f.pr)t.prestige=clamp(+f.pr,20,98);if(f.st)t.fac.stadium=clamp(+f.st,1,10);
    if(f.str)t.fac.strength=clamp(+f.str,1,10);if(f.nil)t.fac.nil=clamp(+f.nil,1,10);
    closeSheet();render();toast(t.abbr+' updated');};
  body.append(save);
  openSheet('Edit '+t.name,body);
}

/* ============================================================
   bottom nav
   ============================================================ */
function renderNav(app){
  if(!['home','team','recruit','portal','media','season','browse','program'].includes(UI.view))return;
  const nav=el('div','nav');
  const items=[
    ['home','Home','M3 11l9-8 9 8M5 10v10h14V10'],
    ['team','Team','M16 7a4 4 0 11-8 0 4 4 0 018 0zM4 21v-1a6 6 0 0112 0v1'],
    ['recruit','Recruit','M13 7a3 3 0 11-6 0 3 3 0 016 0zM4 20v-1a6 6 0 0112 0v1M18 9v6M15 12h6'],
    ['season','Season','M4 6h16v14H4zM4 10h16M8 3v4M16 3v4'],
    ['browse','League','M4 6h16M4 12h16M4 18h16'],
    ['menu','Menu','M4 6h16M4 12h16M4 18h16']];
  items.forEach(([v,l,d])=>{
    const b=el('button',(UI.view===v||(v==='menu'&&false))?'on':'');b.dataset.tid='nav-'+v;
    b.innerHTML=`<svg viewBox="0 0 24 24"><path d="${d}" stroke-linecap="round" stroke-linejoin="round"/></svg><span>${l}</span>`;
    b.onclick=()=>{
      if(v==='menu')return menuSheet();
      UI.view=v;if(v==='team')UI.tab=UI.tab||'roster';render();
    };
    nav.append(b);
  });
  app.append(nav);
}
function menuSheet(){
  const body=el('div');
  const save=el('button','btn','Save game');
  save.onclick=()=>{const slot=findSlotFor(S);if(slot){writeSlot(slot,S);toast('Saved to slot '+slot);}else chooseSlotSheet();closeSheet();};
  const saveAs=el('button','btn ghost','Save to a slot…');saveAs.style.marginTop='9px';
  saveAs.onclick=()=>{closeSheet();chooseSlotSheet();};
  const quit=el('button','btn line','Quit to main menu');quit.style.marginTop='9px';
  quit.onclick=()=>{closeSheet();confirmSheet('Quit to menu?','Unsaved progress is lost.',()=>{S=null;UI.view='menu';render();});};
  body.append(save,saveAs,quit);
  openSheet('Menu',body);
}
function findSlotFor(state){for(const n of SLOTS){const s=readSlot(n);if(s&&s.state&&s.state.createdAt===state.createdAt)return n;}return null;}
function autosave(){const n=findSlotFor(S);if(n)writeSlot(n,S);}

/* ============================================================
   shared UI bits
   ============================================================ */
function headerBar(title,sub,back){
  const c=el('div','topbar');c.style.paddingLeft='0';c.style.paddingRight='0';
  if(back){const b=el('button');b.style.cssText='width:38px;height:38px;border-radius:9px;background:var(--panel2);border:1px solid var(--line);font-size:20px;flex:none';b.innerHTML='&#8249;';b.onclick=back;c.append(b);}
  c.append(el('div',null,`<h1>${title}</h1>${sub?'<div class="sub">'+sub+'</div>':''}`));
  return c;
}
function stat(k,v){return el('div','stat',`<div class="k">${k}</div><div class="v">${v}</div>`);}
function rankPill(n,l){return el('div','rankpill',`<div class="n">${n}</div><div class="l">${l}</div>`);}
function facBar(label,val){
  const d=el('div');d.style.marginBottom='11px';
  d.innerHTML=`<div class="row spread"><span style="font-size:13px">${label}</span><span class="cond" style="font-weight:700">${val}/10</span></div>
    <div class="bar"><i style="width:${val*10}%"></i></div>`;
  return d;
}
function fld(label,node){const l=el('label','fld');l.append(el('span',null,label),node);return l;}
function inputEl(val,on,ph,type){const i=el('input');i.type=type||'text';if(ph)i.placeholder=ph;i.value=val==null?'':val;i.oninput=()=>on(i.value);return i;}
function selectEl(opts,val,on){const s=el('select');opts.forEach(o=>{const op=el('option');op.value=o;op.textContent=o;if(o===val)op.selected=true;s.append(op);});s.onchange=()=>on(s.value);return s;}
function optEl(t,d,on,cb){const b=el('button','opt'+(on?' on':''));b.innerHTML=`<div class="t">${t}</div><div class="d">${d}</div>`;b.onclick=cb;return b;}
function posName(c){return {QB:'Quarterback',RB:'Running Back',WR:'Wide Receiver',TE:'Tight End',OT:'Offensive Tackle',OG:'Offensive Guard',C:'Center',DE:'Defensive End',DT:'Defensive Tackle',LB:'Linebacker',CB:'Cornerback',S:'Safety',K:'Kicker',P:'Punter'}[c]||c;}
function timeAgo(ts){const s=(Date.now()-ts)/1000;if(s<60)return'just now';if(s<3600)return Math.floor(s/60)+'m ago';if(s<86400)return Math.floor(s/3600)+'h ago';return Math.floor(s/86400)+'d ago';}

/* sheets */
function openSheet(title,bodyNode){
  const bg=el('div','sheet-bg');const sh=el('div','sheet');bg.dataset.tid='sheet-bg';sh.dataset.tid='sheet';
  sh.append(el('div','grab'),el('h3',null,title),bodyNode);
  bg.append(sh);bg.onclick=e=>{if(e.target===bg)closeSheet();};
  $('#sheet').innerHTML='';$('#sheet').append(bg);
}
function closeSheet(){$('#sheet').innerHTML='';}
function confirmSheet(title,sub,onYes){
  const body=el('div');body.append(el('div','hint',sub));
  const yes=el('button','btn danger','Yes, continue');yes.style.marginTop='14px';
  yes.onclick=()=>{closeSheet();onYes();};
  const no=el('button','btn line','Cancel');no.style.marginTop='9px';no.onclick=closeSheet;
  body.append(yes,no);openSheet(title,body);
}

/* ---------- boot ---------- */
render();
</script>
