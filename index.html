// === ECONOMY ENGINE (Phase 6) START ===
// Pure, deterministic program-management model: finances, facility upgrades, and the coaching
// carousel. Depends only on rng/ri/clamp/pick/hashStr + the data arrays (COORD_ROLES/POS_COACHES/
// POS/FN/LN) + coachBoost — no DOM, no S — so test/econlab.js can extract + validate it offline.
// The "team" shape it reads is { id, conf, prestige, fac, payroll, budget, facilityDebt, rec,
// natRank, staff }. The app layer (rolloverSeason + renderProgram/renderCoaches) drives it.

// Annual base revenue by conference, in $M (media + distribution tier). Performance + stadium
// gate stack on top. Independent sits with the power conferences (Notre Dame's own deal).
const ECON_CONF_BASE={"SEC":48,"Big Ten":46,"ACC":31,"Big 12":31,"Pac-12":20,"American":14,
  "Mountain West":11,"Sun Belt":9,"MAC":8,"C-USA":8,"Independent":26};
// Base cost to take a facility from level 1→2 (escalates steeply with level). Stadium is dearest.
const FAC_BASE={stadium:6e6,strength:2.2e6,training:2.4e6,academics:1.9e6,nil:2.7e6};

// Resolve one team's annual finances (run at rollover, before records reset). MUTATES the team:
// budget += net (cash carries over, can go negative → constrains spending), pays down debt
// (interest + principal), and stores a lean team.lastFinances for the Program UI / recap.
// Deterministic: a light seeded jitter keys off (seed, year, team id). Returns lastFinances.
function resolveFinances(team,year,seed,mult){
  const fac=team.fac||{}, prestige=team.prestige||50, rec=team.rec||{w:0,l:0};
  const games=(rec.w||0)+(rec.l||0), winPct=games?rec.w/games:0;
  const confBase=(ECON_CONF_BASE[team.conf]||16)*1e6;
  const stadiumTerm=(fac.stadium||5)*1.15e6;          // bigger house → more gate revenue
  const perfBonus=(rec.w||0)*1.1e6
    + (winPct>0.5?(winPct-0.5)*18e6:0)                 // winning seasons pay (bowls/playoff)
    + (team.natRank&&team.natRank<=25?(26-team.natRank)*0.5e6:0);
  const psRev=(team.lastPostseason&&team.lastPostseason.revenue)||0;   // playoff/bowl payout (Phase 12)
  const jit=(rng((seed^hashStr('fin'+year+(team.id||'')))>>>0)()-0.5)*4e6;
  const revenue=Math.round((confBase + prestige*450000 + stadiumTerm + perfBonus + psRev + jit)*(mult||1));
  const debt=team.facilityDebt||0;
  const interest=debt*0.08, principal=Math.min(debt, debt*0.18);
  const debtService=interest+principal;
  const expenses=Math.round((team.payroll||0)+debtService);
  const net=revenue-expenses;
  team.budget=Math.round((team.budget||0)+net);
  team.facilityDebt=Math.max(0,Math.round(debt-principal));
  team.lastFinances={revenue,expenses,net,debtService:Math.round(debtService)};
  return team.lastFinances;
}
// Escalating cost to raise a facility from `level` → `level+1`. Caps at 10 (Infinity past it).
function facilityUpgradeCost(key,level){
  if(level>=10)return Infinity;
  return Math.round((FAC_BASE[key]||2e6)*Math.pow(level+1,1.6));
}
// Build a deterministic free-agent coach market (~24–40 candidates, top-heavy on rating) for a
// given year. Each candidate is a full coach object (role/tier/scope/groups/boost) ready to slot in.
function genCoachMarket(seed,year,world){
  const r=rng((seed^hashStr('market'+year))>>>0);
  const roles=[...COORD_ROLES.map(c=>({code:c[0],title:c[1],tier:'coord',side:c[2]})),
               ...POS_COACHES.map(c=>({code:c[0],title:c[1],tier:'pos',scope:c[2],groups:c[3]}))];
  const n=ri(r,24,40), out=[];
  for(let i=0;i<n;i++){
    const role=pick(r,roles);
    const rating=clamp(Math.round(48+Math.pow(r(),1.8)*48+ri(r,-3,3)),45,97);  // top-heavy: few elite
    const groups=role.tier==='coord'?POS.filter(p=>p[1]===role.side).map(p=>p[0]):role.groups;
    const scope=role.tier==='coord'?{off:'OFF',def:'DEF',st:'ST'}[role.side]:role.scope;
    const mult=role.tier==='coord'?(role.code==='STC'?1.3:2.4):1;
    const salary=Math.max(90000,Math.round((rating*8500+120000)*mult));
    out.push({id:'fa'+year.toString(36)+i.toString(36),role:role.code,title:role.title,
      name:pick(r,FN)+' '+pick(r,LN),rating,salary,years:ri(r,2,4),
      tier:role.tier,scope,groups,boost:coachBoost(role.tier,rating)});
  }
  out.sort((a,b)=>b.rating-a.rating);
  // Phase 11: fold in any legend-coach candidates (retired greats returning to their alma mater).
  const legs=legendCoachCandidates(world,year,r);
  if(legs.length){legs.forEach(c=>out.push(c));out.sort((a,b)=>b.rating-a.rating);}
  return out;
}
// Phase 11: occasionally a program's retired great re-enters the market as a candidate FOR their alma
// mater (flagged fromLegend/legendOf for the UI). Coordinator candidate matching the side they played;
// rating is influenced by stature (a great player is a plausible — not sure-thing — coach). Guarded so
// legend-less worlds (the econ lab) consume no rng and stay byte-identical. Deterministic by (seed,year).
function legendCoachCandidates(world,year,r){
  const out=[];
  ((world&&world.teams)||[]).forEach(t=>{
    const ring=(t.legends||[]).filter(l=>(l.stature||0)>=40);   // only real greats consider coaching
    if(!ring.length||r()>0.12)return;
    const l=ring.slice().sort((a,b)=>(b.stature||0)-(a.stature||0))[0];
    const side=(POS.find(p=>p[0]===l.pos)||['','off'])[1];
    const role=COORD_ROLES.find(c=>c[2]===side)||COORD_ROLES[0];
    const rating=clamp(Math.round(50+(l.stature||0)*0.32+ri(r,-12,12)),45,92);
    out.push({id:'leg'+year.toString(36)+(l.id||t.id),role:role[0],title:role[1],
      name:l.name,rating,salary:Math.max(120000,Math.round(rating*8500+150000)),years:ri(r,2,4),
      tier:'coord',scope:{off:'OFF',def:'DEF',st:'ST'}[role[2]],
      groups:POS.filter(p=>p[1]===role[2]).map(p=>p[0]),boost:coachBoost('coord',rating),
      fromLegend:true,legendOf:t.id});
  });
  return out;
}
// Buyout to fire a coach early (≈ half the remaining contract). Hire fee = a small signing bonus.
function buyoutCost(coach){return Math.round((coach.salary||0)*Math.max(1,coach.years||1)*0.5);}
function hireCost(coach){return Math.round((coach.salary||0)*0.25);}
// Slot a market candidate into a coordinator vacancy/slot, preserving the slot's role/scope/groups.
function fitCoachToSlot(cand,role,title,scope,groups,tier,r){
  return Object.assign({},cand,{role,title,scope,groups,tier,
    boost:coachBoost(tier,cand.rating),years:ri(r,2,4)});
}
// The AI churn at rollover (pure-ish: mutates world staff + market, deterministic by (seed,year)).
// Better programs (acting first, prestige-weighted) upgrade their weakest coordinator from the
// market; displaced coaches re-enter the pool; a strong player coordinator can be poached by a
// higher-prestige suitor (resisted by loyal histories), opening a vacancy. Market then refreshes.
// Returns { poached:[{coach,fromId,toId}] } so the app can notify + flag the vacancy.
function advanceCoachCarousel(world,market,seed,year,opts){
  opts=opts||{};
  const meId=opts.controlledId||null, poached=[];
  const r=rng((seed^hashStr('carousel'+year))>>>0);
  market.sort((a,b)=>b.rating-a.rating);
  const ai=world.teams.filter(t=>t.id!==meId).sort((a,b)=>b.prestige-a.prestige);
  // 1) AI upgrades its weakest coordinator from the market (high prestige acts more + grabs best)
  ai.forEach(t=>{
    if(r()>0.30+(t.prestige||50)/250)return;
    const coords=(t.staff||[]).filter(c=>c.tier==='coord');
    if(!coords.length)return;
    const weak=coords.reduce((a,b)=>a.rating<b.rating?a:b);
    const ci=market.findIndex(c=>c.tier==='coord'&&c.rating>weak.rating+4);
    if(ci<0)return;
    const cand=market[ci];
    const hired=fitCoachToSlot(cand,weak.role,weak.title,weak.scope,weak.groups,'coord',r);
    t.staff=t.staff.map(c=>c===weak?hired:c);
    market.splice(ci,1);
    market.push(Object.assign({},weak,{id:'fa'+Math.floor(r()*1e9).toString(36),years:ri(r,1,3)}));
  });
  // 2) a higher-prestige suitor may poach the player's best coordinator (loyal histories resist)
  if(meId){
    const me=world.teams.find(t=>t.id===meId);
    const resist=opts.coach&&(opts.coach.history==='NFL Transplant'||opts.coach.history==='Lifer'||opts.coach.archetype==='Manager')?0.5:1;
    if(me&&me.staff){
      const star=me.staff.filter(c=>c.tier==='coord'&&c.rating>=82).sort((a,b)=>b.rating-a.rating)[0];
      const suitor=ai.find(t=>(t.prestige||50)>((me.prestige||50)+6));
      if(star&&suitor&&r()<0.18*resist){
        me.staff=me.staff.filter(c=>c!==star);
        poached.push({coach:star,fromId:meId,toId:suitor.id});
      }
    }
  }
  // 3) refresh the market back toward target size with a fresh wave of free agents
  const fresh=genCoachMarket((seed^0x9e3779b1)>>>0,year,world);
  while(market.length<28&&fresh.length)market.push(fresh.shift());
  market.sort((a,b)=>b.rating-a.rating);
  return {poached};
}

// === AWARDS ENGINE (Phase 8) START ===
// Pure, deterministic season-awards model (no rng — a pure function of season stats + records).
// Depends only on POS (data array), so test/awardlab.js can extract + validate it offline. Reads a
// teams array (each { id, name, abbr, color, conf, prestige, rec, roster:[{...,gs}] }) where gs is a
// player's accumulated season box, and returns the year's honors: national Heisman (offense-of-the-
// year, weighted by team success), Defensive POY, Freshman of the Year, per-conference POY (off+def),
// an All-America team (best at each position), Coach of the Year (record vs prestige expectation), and
// (Phase 11) the real named **position trophies** — Davey O'Brien (QB), Doak Walker (RB), Biletnikoff
// (WR), John Mackey (TE), Outland (interior DL → best DT, since OL aren't box-scored), Butkus (LB), Jim
// Thorpe (DB), Lou Groza (K, by FG/PAT), Ray Guy (P, by rating — punting isn't box-scored). The
// Defensive POY is surfaced as the Bednarik. Each trophy is the best eligible season by the side score.
function awardOff(s){return (s.pYds||0)*0.04+(s.pTD||0)*4+(s.rYds||0)*0.1+(s.rTD||0)*6+(s.reYds||0)*0.1+(s.reTD||0)*6-(s.pInt||0)*2;}
function awardDef(s){return (s.tkl||0)+(s.sk||0)*4+(s.dInt||0)*6;}
function awardK(s){const acc=(s.fga||0)?((s.fgm||0)/s.fga):0;return (s.fgm||0)*3+(s.xpm||0)+acc*8;}
// Position-trophy slate (real named hardware). Each is the best eligible season by the side's score.
// Outland → best DT (interior linemen aren't box-scored; the DL approximates it). K/P handled specially.
const TROPHY_DEFS=[["obrien","Davey O'Brien",["QB"],"off"],["doak","Doak Walker",["RB"],"off"],
  ["biletnikoff","Biletnikoff",["WR"],"off"],["mackey","John Mackey",["TE"],"off"],
  ["outland","Outland",["DT"],"def"],["butkus","Butkus",["LB"],"def"],["thorpe","Jim Thorpe",["CB","S"],"def"]];
function awardLine(s,side){
  if(side==='k'){const d=[];if(s.fga)d.push((s.fgm||0)+'/'+s.fga+' FG');if(s.xpm)d.push((s.xpm||0)+' XP');return d.join(', ')||'—';}
  if(side==='def'){const d=[];if(s.tkl)d.push(s.tkl+' tkl');if(s.sk)d.push(s.sk+' sk');if(s.dInt)d.push(s.dInt+' INT');return d.join(', ')||'—';}
  const p=[];
  if(s.pYds||s.pTD)p.push(`${s.pYds||0} pass yd${s.pTD?', '+s.pTD+' TD':''}${s.pInt?', '+s.pInt+' INT':''}`);
  if(s.rYds||s.rTD)p.push(`${s.rYds||0} rush yd${s.rTD?', '+s.rTD+' TD':''}`);
  if(s.reYds||s.reTD)p.push(`${s.rec||0} rec, ${s.reYds||0} yd${s.reTD?', '+s.reTD+' TD':''}`);
  return p.join(' · ')||'—';
}
function computeAwards(teams,year){
  const cand=[];

    const g=t.rec?(t.rec.w+t.rec.l):0, winPct=g?t.rec.w/g:0;
    t.roster.forEach(p=>{if(!p.gs||!p.gs.gp)return;
      cand.push({p,t,off:awardOff(p.gs),def:awardDef(p.gs),winPct,fr:p.yr==='FR'||p.yr==='RS-FR'});});

  if(!cand.length)return empty;
  const snap=(c,side)=>c?{pid:c.p.id,teamId:c.t.id,name:c.p.fn+' '+c.p.ln,pos:c.p.pos,abbr:c.t.abbr,

    score:Math.round(side==='def'?c.def:side==='k'?awardK(c.p.gs):c.off)}:null;

  const byConf={};[...new Set(cand.map(c=>c.t.conf))].forEach(cf=>{const cc=cand.filter(c=>c.t.conf===cf);
    byConf[cf]={off:snap(bestOff(cc),'off'),def:snap(bestDef(cc),'def')};});

  const bestAt=arr=>POS.map(([code])=>{const cc=arr.filter(c=>c.p.pos===code);if(!cc.length)return null;
    const best=cc.reduce((b,c)=>{const v=Math.max(c.off,c.def);return(!b||v>b._v)?Object.assign({_v:v},c):b;},null);
    return Object.assign({pos:code},snap(best,best.def>best.off?'def':'off'));}).filter(Boolean);

  const coyT=teams.reduce((b,t)=>{if(!t.rec||(t.rec.w+t.rec.l)===0)return b;const over=t.rec.w-(t.prestige||50)/10;
    return(!b||over>b._o)?{_o:over,t}:b;},null);
  const coy=coyT?{teamId:coyT.t.id,abbr:coyT.t.abbr,color:coyT.t.color,name:coyT.t.name,
    rec:coyT.t.rec.w+'–'+coyT.t.rec.l,over:Math.round(coyT._o*10)/10}:null;
  // Position trophies: the best eligible season at each, by the side's score (one national winner each).
  const trophies={};

    trophies[key]=best?Object.assign({trophy:name},snap(best,side)):null;

  // Ray Guy (best punter) — punting isn't box-scored, so rank punters by rating on a contending team.
  let pun=null;
  teams.forEach(t=>{const g=t.rec?(t.rec.w+t.rec.l):0,wp=g?t.rec.w/g:0;
    t.roster.forEach(p=>{if(p.pos!=='P')return;const v=(p.ov||0)+wp*3;if(!pun||v>pun._v)pun={_v:v,p,t};});});
  trophies.rayguy=pun?{trophy:'Ray Guy',pid:pun.p.id,teamId:pun.t.id,name:pun.p.fn+' '+pun.p.ln,pos:'P',
    abbr:pun.t.abbr,color:pun.t.color,line:(pun.p.ov||0)+' OVR',score:pun.p.ov||0}:null;
  return {year,heisman:snap(heis,'off'),poyDef:snap(defPoy,'def'),
    freshman:frPoy?snap(frPoy,frPoy.def>frPoy.off?'def':'off'):null,coy,byConf,allAmerican,allConference,trophies};
}
// === AWARDS ENGINE (Phase 8) END ===

// === LEGACY ENGINE (Phase 11) START ===
// Pure, deterministic program-legacy model: how big a graduate's legend is, the standing recruiting
// aura a deep Ring of Honor confers, and the interest math behind an alumni visit. Depends only on
// data arrays (POS) + clamp — no rng, no DOM, no S — so test/legacylab.js can extract + validate it
// offline. The "snapshot" it scores is { honors:[{year,award}], career:{…totals}, peakOv } — the lean
// shape stored in team.legends, built from a graduating Player by the app layer (enshrineLegends).
//
// Stature blends three saturating components so no single axis runs away: trophies (honorWeight),
// career stat milestones (a compiler with no trophies can still be a great), and peak OVR (a 99 in a
// down era still reads as a legend). History is EARNED — there is no seeding; a fresh dynasty's ring
// is empty and fills as your stars graduate.

// National position-trophy weights (real named hardware). Keyed by the exact label stampHonors writes.
const TROPHY_WEIGHTS={"Davey O'Brien":60,"Doak Walker":60,"Biletnikoff":60,"John Mackey":60,
  "Outland":60,"Butkus":60,"Jim Thorpe":60,"Lou Groza":35,"Ray Guy":35};
// Points per honor (matched against the labels stampHonors writes). National hardware ranks highest.
function honorWeight(award){
  if(!award)return 0;
  if(award.indexOf('Heisman')>=0)return 100;            // National POY
  if(award.indexOf('Bednarik')>=0)return 80;            // best defender (was 'National Defensive POY')
  if(award.indexOf('National Defensive POY')>=0)return 80;   // legacy saves stamped pre-rename
  if(TROPHY_WEIGHTS[award])return TROPHY_WEIGHTS[award]; // national position trophy
  if(award==='All-American')return 55;
  if(award.indexOf('Freshman of the Year')>=0)return 20;
  if(award.indexOf('POY')>=0)return 45;                 // conference Offensive/Defensive POY
  if(award.indexOf('All-')===0)return 25;               // first-team All-Conference
  return 10;
}
// Raw career-milestone score from accumulated box totals — rewards compilers (no trophies needed).
function careerScore(career){const c=career||{};
  return (c.pYds||0)*0.004+(c.pTD||0)*1.2+(c.rYds||0)*0.012+(c.rTD||0)*1.5
    +(c.reYds||0)*0.012+(c.reTD||0)*1.5+(c.tkl||0)*0.12+(c.sk||0)*1.5+(c.dInt||0)*2.5;}
const LEGEND_TIERS=[[75,'Immortal'],[55,'All-Time Great'],[35,'Program Great'],[0,'Cult Hero']];
function legendTier(score){for(const [bar,name] of LEGEND_TIERS)if(score>=bar)return name;return 'Cult Hero';}
// 0..100 stature score for a lean legend snapshot. Each component saturates toward its own ceiling.
function legendStature(snap){
  snap=snap||{};
  const honorSum=(snap.honors||[]).reduce((s,h)=>s+honorWeight(h.award||h),0);
  const honorComp=55*(honorSum/(honorSum+90));                 // trophies, soft-capped ~55
  const cs=careerScore(snap.career);
  const careerComp=30*(cs/(cs+30));                            // milestones, soft-capped ~30
  const peakComp=clamp(((snap.peakOv||0)-70)/29,0,1)*25;       // peak OVR, 70..99 → 0..25
  const score=Math.round(clamp(honorComp+careerComp+peakComp,0,100));
  return {score,tier:legendTier(score)};
}
// Worthy of the Ring of Honor: at least one real honor, OR a stature past a bar (keeps it notable).
function isLegendWorthy(snap){
  if(snap&&snap.honors&&snap.honors.length)return true;
  return legendStature(snap).score>=32;
}
// Merge new inductees into a ring and keep only the top `cap` by stature (all-time best survive).
function enshrineInto(legends,snaps,cap){
  const out=(legends||[]).concat(snaps||[]);
  out.sort((a,b)=>(b.stature||0)-(a.stature||0));
  return out.slice(0,cap||12);
}
// Standing recruiting aura from the depth+quality of a program's ring (small, complements prestige).
function legacyAura(team){
  const ls=(team&&team.legends)||[];
  if(!ls.length)return 0;
  const sum=ls.slice().sort((a,b)=>(b.stature||0)-(a.stature||0)).slice(0,6)
    .reduce((s,l)=>s+(l.stature||0),0);
  return clamp(sum/600,0,0.12);                               // ≤ +0.12 recruitFit, never replaces prestige
}
function legSide(code){const p=POS.find(x=>x[0]===code);return p?p[1]:'off';}
// How relevant a legend is to a given recruit: position match + same-side partial + home-state tie.
function alumniRelevance(legend,rec){
  let rel=legend.pos===rec.pos?1:(legSide(legend.pos)===legSide(rec.pos)?0.6:0.35);
  if(legend.st&&rec.st&&legend.st===rec.st)rel+=0.3;
  return clamp(rel,0,1.4);
}
// Interest boost from deploying a legend on a recruit: stature × relevance × coach amplifier (pure).
function alumniBoost(legend,rec,coachMod){
  const st01=clamp((legend.stature||0)/100,0,1);
  return 20*(0.4+st01)*alumniRelevance(legend,rec)*(coachMod||1);
}
// === LEGACY ENGINE (Phase 11) END ===

// === POSTSEASON ENGINE (Phase 12) START ===
// Pure, deterministic postseason model: a 12-team College Football Playoff bracket + a slate of named
// bowls for the other bowl-eligible teams, plus the prestige/recruiting/revenue payoff a finish confers.
// Depends only on rng/clamp/hashStr + data arrays (no DOM, no S, no simEngine — the actual game scores
// come from simEngine in the app layer), so test/postlab.js validates it offline. The app layer
// (startPostseason / advancePostseason / endPostseason) owns S.postseason + the watch-then-commit flow.

const PLAYOFF_ROUNDS=['First Round','Quarterfinals','Semifinals','National Championship'];
// Cosmetic named-bowl pool (the matchups are seeded by ranking; the names are just flavor).
const BOWL_NAMES=['Sun Bowl','Gator Bowl','Liberty Bowl','Holiday Bowl','Citrus Bowl','Music City Bowl',
  'Las Vegas Bowl','Texas Bowl','Pinstripe Bowl','Duke’s Mayo Bowl','Alamo Bowl','ReliaQuest Bowl',
  'Cheez-It Bowl','Birmingham Bowl','Frisco Bowl','Cure Bowl','Guaranteed Rate Bowl','Fenway Bowl'];
const MAX_BOWLS=18;   // marquee slate — the long tail of minor bowls is not modeled

// The 12 playoff seeds. Real CFP format (Phase 15): the 5 highest-ranked CONFERENCE CHAMPIONS get
// automatic bids, and the FOUR highest-ranked champions take the top-4 seeds (the first-round byes);
// the 5th champion is guaranteed a spot, slotted by its overall ranking (down to seed 12). The
// remaining places fill at-large by rank. `rankedIds` are all team ids best→worst; `champIds` are the
// conference champions, best→worst. With <4 champions (a tiny/custom world) it falls back to top-12.
function seedPlayoff(rankedIds,champIds){
  champIds=champIds||[];
  if(champIds.length<4)return rankedIds.slice(0,12);
  const rank={};rankedIds.forEach((id,i)=>rank[id]=i);
  const champ=champIds.filter(id=>id in rank).sort((a,b)=>rank[a]-rank[b]);
  if(champ.length<4)return rankedIds.slice(0,12);
  const byes=champ.slice(0,4), used=new Set(byes);   // seeds 1-4 (byes) = the 4 best champions
  const rest=[];
  if(champ[4]){rest.push(champ[4]);used.add(champ[4]);}              // the guaranteed 5th auto-bid
  for(const id of rankedIds){if(!used.has(id))rest.push(id);}        // then the at-large field
  rest.sort((a,b)=>rank[a]-rank[b]);                                 // non-bye seeds order by overall rank
  if(champ[4]){const i=rest.indexOf(champ[4]);if(i>=8){rest.splice(i,1);rest.splice(7,0,champ[4]);}}  // guarantee the 5th champ a slot (seed 12 if low-ranked)
  return byes.concat(rest).slice(0,12);
}

// Matchups for a playoff round, as [homeId, awayId] pairs (higher seed hosts). `winners` are the
// previous round's winners in bracket order (round 0 needs none). Top-4 seeds bye into the quarters.
function playoffRoundMatchups(round,seeds,winners){
  if(round===0)return [[seeds[4],seeds[11]],[seeds[5],seeds[10]],[seeds[6],seeds[9]],[seeds[7],seeds[8]]];
  if(round===1)return [[seeds[0],winners[3]],[seeds[1],winners[2]],[seeds[2],winners[1]],[seeds[3],winners[0]]];
  if(round===2)return [[winners[0],winners[3]],[winners[1],winners[2]]];
  if(round===3)return [[winners[0],winners[1]]];
  return [];
}
// Pair bowl-eligible non-playoff teams into named bowls: adjacent by rank (1v2, 3v4, …) so similar-tier
// teams meet, capped to the marquee slate. `eligibleRanked` = ids best→worst. Deterministic by seed.
function genBowls(eligibleRanked,seed){
  const list=eligibleRanked.slice(0,MAX_BOWLS*2), out=[];
  for(let i=0;i+1<list.length;i+=2)
    out.push({home:list[i],away:list[i+1],name:BOWL_NAMES[(i/2)%BOWL_NAMES.length]});
  return out;
}
// A team's postseason finish → its payoff. prestige = a small persistent bump; recruitBoost = a
// recruitFit term consumed by NEXT season's cycle; revenue = a one-time payout to the budget.
const POSTSEASON_PAYOFF={
  champion:    {prestige:2.5,recruitBoost:0.12, revenue:32e6,label:'National Champion'},
  runnerup:    {prestige:1.6,recruitBoost:0.09, revenue:24e6,label:'CFP Runner-Up'},
  semifinal:   {prestige:1.1,recruitBoost:0.07, revenue:17e6,label:'CFP Semifinalist'},
  quarterfinal:{prestige:0.7,recruitBoost:0.05, revenue:11e6,label:'CFP Quarterfinalist'},
  firstround:  {prestige:0.4,recruitBoost:0.035,revenue:7e6, label:'CFP First Round'},
  bowlwin:     {prestige:0.3,recruitBoost:0.025,revenue:3.5e6,label:'Bowl Win'},
  bowlloss:    {prestige:0.1,recruitBoost:0.012,revenue:2.5e6,label:'Bowl Game'},
  none:        {prestige:0,  recruitBoost:0,    revenue:0,   label:''}};
function postseasonPayoff(finish){return POSTSEASON_PAYOFF[finish]||POSTSEASON_PAYOFF.none;}
// === POSTSEASON ENGINE (Phase 12) END ===

// === CHAMPIONSHIP ENGINE (Phase 15) START ===
// Pure, deterministic conference-championship model: which two teams meet in each conference's title
// game (played in Championship Week, between the regular season and the playoff). Depends only on a
// caller-supplied `scoreOf(team)` ordering (no DOM, no S, no rng — title games are decided by simEngine
// in the app layer), so test/champlab.js validates it offline. Most conferences have no divisions →
// the top two by score meet; a divisioned conference (e.g. Sun Belt East/West) pits its division
// winners. The higher-scoring team hosts. Independents have no title game.
const CONF_TITLE_PAYOFF={prestige:0.8,revenue:12e6};   // a title game's persistent + one-time reward
function confChampGames(teams,scoreOf){
  const byConf={};
  teams.forEach(t=>{(byConf[t.conf]=byConf[t.conf]||[]).push(t);});
  const out=[];
  Object.keys(byConf).sort().forEach(conf=>{
    if(conf==='Independent')return;                    // independents play no conference title game
    const arr=byConf[conf];
    const divs=[...new Set(arr.map(t=>t.div||''))].filter(d=>d!=='');
    let a,b;
    if(divs.length>=2){                                // division winners meet (best two division champs)
      const winners=divs.map(d=>[...arr].filter(t=>(t.div||'')===d).sort((x,y)=>scoreOf(y)-scoreOf(x))[0])
        .filter(Boolean).sort((x,y)=>scoreOf(y)-scoreOf(x));
      a=winners[0];b=winners[1];
    }else{const s=[...arr].sort((x,y)=>scoreOf(y)-scoreOf(x));a=s[0];b=s[1];}
    if(a&&b)out.push({conf,home:a.id,away:b.id});      // higher score hosts
  });
  return out;
}
// === CHAMPIONSHIP ENGINE (Phase 15) END ===

// === DRAFT ENGINE (Phase 13) START ===
// Pure, deterministic NFL-draft model: graduating players are drafted league-wide, and a program that
// keeps producing high picks at a position becomes a "factory" there — a standing recruiting pull on
// recruits at that position (and a turn-off for the rare "rebel" who wants to make his own name). Depends
// only on rng/clamp/hashStr + honorWeight/careerScore (from the LEGACY block) — no DOM, no S — so
// test/draftlab.js validates it offline. The app layer runs the draft at rollover from the graduate lists.

const DRAFT_ROUNDS=3, DRAFT_PER_ROUND=32, DRAFT_BAR=40;   // a 96-pick board; the long undrafted tail is implicit
// NFL-readiness grade (0..100) for a graduating prospect: dominated by peak OVR (pro talent), with honors
// + career production on top. Reuses the LEGACY honorWeight ladder + careerScore so the signals are consistent.
function draftProjection(snap){
  const peak=clamp(((snap.peakOv||0)-68)/31,0,1)*70;        // peak 68..99 → 0..70 (the bulk of the grade)
  const honorSum=(snap.honors||[]).reduce((s,h)=>s+honorWeight(h.award||h),0);
  const hon=20*(honorSum/(honorSum+100));                   // decorated players climb boards (up to ~20)
  const cs=careerScore(snap.career);
  const car=10*(cs/(cs+40));                                // production matters a little (up to ~10)
  return Math.round(clamp(peak+hon+car,0,100));
}
// Run the league-wide draft on a pool of graduate snaps. The top DRAFT_ROUNDS*DRAFT_PER_ROUND by grade
// (with a small seeded jitter so it's not pure chalk) are drafted; returns ordered picks. Deterministic.
function runDraft(grads,seed){
  const scored=grads.map(g=>{const grade=draftProjection(g);
    const jit=(rng((seed^hashStr('draft'+(g.id||'')))>>>0)()-0.5)*10;   // draft surprises, but reproducible
    return {g,grade,eff:grade+jit};}).filter(x=>x.grade>=DRAFT_BAR);
  scored.sort((a,b)=>b.eff-a.eff);
  return scored.slice(0,DRAFT_ROUNDS*DRAFT_PER_ROUND).map((x,i)=>({
    pick:i+1,round:Math.floor(i/DRAFT_PER_ROUND)+1,grade:x.grade,
    pid:x.g.id,name:x.g.name,pos:x.g.pos,teamId:x.g.teamId,abbr:x.g.abbr,color:x.g.color}));
}
// Factory reputation one pick confers to its school at that position (an earlier, higher pick = more).
function pickFactoryValue(pick){return clamp((DRAFT_ROUNDS+1-pick.round)*8+((pick.grade||70)-70)*0.4,0,32);}
function factoryDecay(rep){return rep*0.7;}                 // reputation reflects RECENT production, then fades
function factoryRep(team,pos){return (team&&team.factory&&team.factory[pos])||0;}
// Recruiting pull a program's positional factory exerts on a recruit at that position (≤ +0.15 fit). A
// "rebel" recruit is REPELLED — they'd rather be THE guy somewhere that isn't already a factory there.
function factoryPull(team,rec){
  const rep=factoryRep(team,rec.pos); if(rep<=0)return 0;
  const pull=clamp(rep/420,0,0.15);
  return rec.rebel?-pull*0.8:pull;
}
// === DRAFT ENGINE (Phase 13) END ===

// === PORTAL ENGINE (Phase 18) START ===
// Pure, deterministic transfer-portal model: which players leave a program (buried depth, broken
// playing-time promises, stagnation — stars on winners rarely go), and a recruiting-like loop where
// programs with a hole at a position chase the available transfers. Depends only on rng/clamp/hashStr
// + POS (data array) — no DOM, no S — so test/portallab.js validates it offline. The app layer
// (openPortal/closePortal) owns S.portal: it removes leavers from rosters into a pool, runs this loop,
// then drops the committed transfers onto their new rosters. A "transfer" is a real Player snapshot
// (keeps yr/age/ov — NOT reset to a freshman) plus `iv` interest keyed by suitor, mirroring a Recruit.
const PORTAL={BASE:0.05,COMMIT_THRESH:60,LEAD_GAP:6,SIGN_BAR:30,POINTS:60,MAX_SUITORS:5};
// Probability a player enters the portal (0..0.8). opts: {brokenPromise, winPct, retention}.
function portalLeaveProb(p,opts){
  opts=opts||{};
  let pr=PORTAL.BASE;
  const so=p.so==null?0:p.so;
  if(so>=2)pr+=0.10+Math.min(so-2,7)*0.03;            // buried deeper on the chart → likelier to leave
  if(opts.brokenPromise)pr+=0.35;                      // a broken playing-time promise is a big push
  if((p.dev||0)===0&&so>=2)pr+=0.05;                   // stagnating depth (no growth + buried)
  if(p.cap)pr-=0.15;                                   // captains stay
  if(so<=1)pr-=0.10;                                   // starters / two-deep usually stay
  if((p.ov||0)>=85&&(opts.winPct||0)>=0.6)pr-=0.22;    // stars on winning teams rarely transfer
  pr*=(opts.retention||1);                             // coach retention (Motivator / Former Player)
  return clamp(pr,0,0.8);
}
// A transfer's "tier target" prestige from his overall, and a team's fit for him (need + proximity).
function portalTarget(tr){return clamp(Math.round(((tr.ov||70)-55)*2.2+28),25,92);}
function portalFit(team,tr){
  const target=portalTarget(tr);
  let prox=clamp(1-Math.abs((team.prestige||50)-target)/45,0,1);
  if((team.prestige||50)>=target)prox=Math.max(prox,0.70);
  const need=(team.needs&&team.needs[tr.pos])?0.18:0;   // a hole at his position is the draw
  return clamp(prox+need,0,1.2);
}
// Advance the portal: grow every suitor's interest, then commit transfers to their leader. A finalize
// pass forces every transfer with a real leader (≥ SIGN_BAR) to sign; the rest go unsigned (leave the
// modeled league). Seeded deterministically. Mutates `pool`; returns the new commitments.
function advancePortal(pool,teams,seed,finalize){
  const byId={};teams.forEach(t=>byId[t.id]=t);
  const r=rng((seed^hashStr('portal'+(finalize?'f':'r')))>>>0);
  const out=[];
  pool.forEach(tr=>{
    if(tr.committedTo)return;
    for(const tid in tr.iv){const t=byId[tid];if(!t)continue;
      tr.iv[tid]=clamp(tr.iv[tid]+(1.0+portalFit(t,tr)*3.0)*(0.6+r()*0.9),0,100);}
  });
  pool.forEach(tr=>{
    if(tr.committedTo)return;
    const entries=Object.entries(tr.iv).filter(([tid])=>byId[tid]).sort((a,b)=>b[1]-a[1]);
    if(!entries.length)return;
    const [leadId,lead]=entries[0],second=entries[1]?entries[1][1]:0;
    if(finalize){if(lead>=PORTAL.SIGN_BAR){tr.committedTo=leadId;out.push(tr);}return;}
    if(lead>=PORTAL.COMMIT_THRESH&&(lead-second)>=PORTAL.LEAD_GAP&&r()<0.5){tr.committedTo=leadId;out.push(tr);}
  });
  return out;
}
// === PORTAL ENGINE (Phase 18) END ===

// === MEDIA ENGINE (Phase 19) START ===
// Pure, deterministic media model: an AP-style Top 25 poll (with inertia, so teams lag rather than
// teleport on one result), and the classification + templating that turns the week's events into news
// stories. Depends only on clamp/rng/hashStr (no DOM, no S, no rankScore — the caller passes teams
// pre-sorted by their ranking score), so test/medialab.js validates it offline. The app layer
// (updateMedia / buildWeekStories) owns S.media + assembles the per-week context.
const MEDIA_FEED_CAP=60;          // newest-first story feed, capped
const POLL_MAX_MOVE=4;            // most a team's poll standing shifts toward its score in one week (inertia)
// Build the weekly Top 25. `ranked` = [{id, score}] best→worst (caller sorts by rankScore); `prev` = last
// week's poll ({top:[{teamId,rank}], …}) or null (preseason → straight score order). Returns {week, top:
// [{teamId, rank, prev, pts}], others:[teamId…]}. Inertia: a team's effective key eases from its previous
// rank toward its score rank, capped at POLL_MAX_MOVE per week, so a fallen #1 slides a few spots, not ten.
function computePoll(prev,ranked,week){
  const scoreRank={};ranked.forEach((e,i)=>scoreRank[e.id]=i+1);
  const prevRank={};if(prev&&prev.top)prev.top.forEach(p=>prevRank[p.teamId]=p.rank);
  const outside=Math.min(ranked.length,30);
  const adj=ranked.map(e=>{
    const sr=scoreRank[e.id];
    const pr=prevRank[e.id]||(prev?outside:sr);                 // unranked last week start just outside
    const key=prev?pr+clamp(sr-pr,-POLL_MAX_MOVE,POLL_MAX_MOVE):sr;
    return {id:e.id,key,sr,prev:prevRank[e.id]||null};
  }).sort((a,b)=>a.key-b.key||a.sr-b.sr);
  const top=adj.slice(0,25).map((e,i)=>({teamId:e.id,rank:i+1,prev:e.prev,pts:(26-(i+1))*38}));
  const others=adj.slice(25,30).map(e=>e.id);
  return {week:week||0,top,others};
}
// Is a result newsworthy, and how? w/l = {rank (poll rank or null), ovr}. Returns a tag or null.
function gameStoryTag(w,l,margin){
  if(l.rank&&l.rank<=25&&(!w.rank||w.rank>l.rank+8)&&(l.ovr-w.ovr)>=4)return 'upset';
  if(w.rank&&w.rank<=25&&l.rank&&l.rank<=25)return 'ranked';
  if(margin>=28)return 'blowout';
  return null;
}
// Turn a tagged event + its data into a {headline, body}. `r` is a seeded rng for phrasing variety. Pure.
function mkStory(tag,d,r){
  const pk=a=>a[Math.floor((r?r():0)*a.length)%a.length];
  if(tag==='upset')return {headline:pk([`${d.w} stuns ${d.lRank?'#'+d.lRank+' ':''}${d.l}`,`${d.w} shocks ${d.l}`,`${d.l} falls to ${d.w}`]),
    body:`${d.wLong} took down ${d.lRank?'#'+d.lRank+' ':''}${d.lLong} ${d.ws}–${d.ls}${d.margin<=7?' in a thriller':''}.`};
  if(tag==='ranked')return {headline:pk([`#${d.wRank} ${d.w} tops #${d.lRank} ${d.l}`,`${d.w} wins ranked clash with ${d.l}`]),
    body:`A top-25 showdown went to ${d.wLong}, ${d.ws}–${d.ls}.`};
  if(tag==='blowout')return {headline:pk([`${d.w} routs ${d.l}`,`${d.w} buries ${d.l} ${d.ws}–${d.ls}`]),
    body:`${d.wLong} dominated ${d.lLong} wire to wire.`};
  if(tag==='pow')return {headline:pk([`${d.name} headlines the Players of the Week`,`${d.name} earns Player of the Week`]),
    body:`${d.name} (${d.pos}, ${d.abbr}) — ${d.line}.`};
  if(tag==='riser')return {headline:pk([`${d.w} surges in the poll`,`${d.w} climbing fast`]),
    body:`${d.wLong} jumped ${d.delta} spot${d.delta===1?'':'s'} to #${d.rank}.`};
  if(tag==='commit')return {headline:`${d.stars}★ ${d.pos} commits to ${d.w}`,
    body:`${d.name}, a ${d.stars}-star ${d.pos}, pledged to ${d.wLong}.`};
  if(tag==='flip')return {headline:`${d.w} flips ${d.stars}★ ${d.pos} from ${d.l}`,
    body:`${d.name} decommitted from ${d.lLong} and flipped to ${d.wLong}.`};
  return {headline:d.headline||'',body:d.body||''};   // portal/award/title/milestone: app supplies copy
}

// --- Approval rating & the hot seat (Phase 19b) — pure, lab-tested ---
// Expected win rate for a program of this prestige, so approval measures over/under-performance, not raw
// record (a blue-blood is *expected* to win; a bottom program isn't).
function winExpectation(prestige){return clamp(((prestige||50)-25)/65,0.15,0.85);}
// The approval below which a coach is on the hot seat — prestige-adjusted (powers run hotter for mediocrity).
function hotSeatBar(prestige){return clamp(28+((prestige||50)-50)*0.18,18,46);}
// Per-game approval swing: winning helps, beating a better/ranked team helps more, losing to a clearly
// weaker team hurts most, losing to a better team is forgivable. Bounded.
function gameApprovalDelta(ctx){
  let d=ctx.won?2:-2;
  const gap=(ctx.oppOvr||70)-(ctx.myOvr||70);          // + = opponent was the stronger team
  if(ctx.won){if(gap>=2||ctx.oppRanked)d+=2; if(gap>=6)d+=1;}
  else{if(gap<=-3)d-=3; else if(gap>=2||ctx.oppRanked)d+=1.5;}
  return clamp(d,-5,5);
}
// Season-end approval swing: wins vs the prestige expectation, plus title bonuses. Bounded.
function seasonApprovalDelta(ctx){
  const games=(ctx.w||0)+(ctx.l||0), exp=winExpectation(ctx.prestige)*games;
  let d=((ctx.w||0)-exp)*3;
  if(ctx.confTitle)d+=6; if(ctx.natTitle)d+=12;
  return clamp(d,-25,25);
}
// Apply a season-end delta with a gentle pull toward 50 so approval can't run away in either direction.
function approvalUpdate(approval,delta){
  const reverted=approval+(50-approval)*0.08;
  return clamp(Math.round(reverted+delta),3,99);
}
// Hot-seat read. A first-year coach gets a honeymoon (never "hot"); otherwise tiers off the prestige bar.
function hotSeatTier(approval,prestige,tenure){
  const bar=hotSeatBar(prestige), warm=bar+13;
  if((tenure||0)<1)return {tier:approval<bar-8?'warm':'safe',label:'Honeymoon'};
  if(approval>=warm)return {tier:'safe',label:'Secure'};
  if(approval>=bar)return {tier:'warm',label:'Warm seat'};
  return {tier:'hot',label:'Hot seat'};
}
// Fire only on sustained failure: never after year one (unless a total meltdown), else two straight
// seasons under the hot-seat bar. `history` = per-season end-of-year approvals, oldest→newest.
function firingDecision(history,prestige,tenure){
  if((tenure||0)<1||!history.length)return false;
  const last=history[history.length-1], bar=hotSeatBar(prestige);
  if(last!=null&&last<12)return true;                  // a total meltdown ends a tenure even early
  if((tenure||0)<2)return false;
  const recent=history.slice(-2);
  return recent.length>=2&&recent.every(a=>a<bar);     // two consecutive years on the hot seat
}
// Interactive press conferences — a context-keyed question bank; each choice maps to a small effect bag.
const PRESS_BANK=[
  {when:'loss',q:'A tough loss. What’s your message to the team?',choices:[
    ['rally','“We’ll bounce back — believe in this group.”'],
    ['accountability','“That one’s on me. We’ll fix it.”'],
    ['deflect','“The calls didn’t go our way out there.”']]},
  {when:'win',q:'Big win. What’s next?',choices:[
    ['humble','“We’re 1-0 this week. Back to work.”'],
    ['hype','“Nobody in the country is playing better than us.”']]},
  {when:'marquee',q:'They’re favored. Your thoughts heading in?',choices:[
    ['respect','“They’re a great program — we respect them.”'],
    ['confident','“We’ll be ready. We belong on this stage.”'],
    ['bulletin','“We’re going in there to shock the world.”']]},
  {when:'any',q:'Recruiting is heating up. A message to prospects?',choices:[
    ['pitch','“Come build something special with us.”'],
    ['culture','“We develop players for the next level.”']]}];
const PRESS_EFFECTS={
  rally:{approval:2,buzz:0.01,dev:0}, accountability:{approval:3,buzz:0,dev:0.02}, deflect:{approval:-3,buzz:0,dev:0},
  humble:{approval:2,buzz:0,dev:0.02}, hype:{approval:1,buzz:0.03,dev:-0.01},
  respect:{approval:2,buzz:0,dev:0}, confident:{approval:1,buzz:0.02,dev:0}, bulletin:{approval:0,buzz:0.05,dev:0},
  pitch:{approval:0,buzz:0.03,dev:0}, culture:{approval:1,buzz:0.02,dev:0.02}};
function pressPrompt(ctx,seed){
  const r=rng((seed||0)>>>0);
  let pool=PRESS_BANK.filter(p=>p.when==='any'||(ctx&&ctx[p.when]));
  if(!pool.length)pool=PRESS_BANK.filter(p=>p.when==='any');
  const q=pool[Math.floor(r()*pool.length)%pool.length];
  return {q:q.q,choices:q.choices.map(([key,label])=>({key,label}))};
}
function pressEffect(key){return PRESS_EFFECTS[key]||{approval:0,buzz:0,dev:0};}
// Coaching-search openings (Phase 19c) — when fired, which programs offer you their job. `teams` = candidate
// summaries [{id, prestige}] (caller excludes your old job); returns up to `n` ids, weighted toward programs
// *below* where you were (a step down is the likeliest landing spot; a lateral is occasional; well above you
// almost never). Deterministic by seed. Pure.
function coachOpenings(teams,firedPrestige,seed,n){
  const r=rng((seed^hashStr('openings'+(firedPrestige||0)))>>>0);
  const scored=teams.map(t=>{
    const below=(firedPrestige||50)-(t.prestige||50);    // >0 = a step down from your last job
    let w;
    if(below<-6)w=0.02;                                   // well above you — almost never
    else if(below<2)w=0.35;                              // roughly lateral — occasional
    else w=clamp(0.4+below*0.025,0,1.1);                 // a step down — the most likely landing spot
    return {id:t.id,w:w*(0.5+r())};
  }).sort((a,b)=>b.w-a.w);
  return scored.slice(0,n||4).map(e=>e.id);
}

// In-game coach identity (Phase 7): a small, side-specific rating edge the controlled team plays
// with — Motivator effort + Former Player respect + Coordinator game-planning lift both sides;
// Offensive/Defensive Genius sharpen their own side. AI teams get none (z). Applied OUTSIDE the
// pure simEngine (which simlab validates untouched) by handing it edge-adjusted team copies, so the
// score stays deterministic and identical between commit (simGame) and watch (buildGameLog).
function coachGameEdges(t){
  const z={off:0,def:0};
  if(!S||!S.coach||t.id!==S.teamId)return z;
  const A=S.coach.archetype,H=S.coach.history; let both=0;
  if(A==='Motivator')both+=1.6;
  if(H==='Former Player')both+=0.8;
  if(H==='Coordinator')both+=1.0;
  z.off=both;z.def=both;
  if(A==='Offensive Genius')z.off+=1.4;
  if(A==='Defensive Genius')z.def+=1.4;
  return z;
}
function withCoachEdge(t){const e=coachGameEdges(t);if(!e.off&&!e.def)return t;
  return Object.assign({},t,{ratings:{off:clamp(t.ratings.off+e.off,40,99),def:clamp(t.ratings.def+e.def,40,99),ovr:t.ratings.ovr}});}
function simSides(g){return {home:withCoachEdge(teamById(g.home)),away:withCoachEdge(teamById(g.away))};}
// Resolve a game with the drive/play engine. Seeded per game id so outcomes are reproducible
// regardless of advance order. Sets g.hs/g.as/g.played and RETURNS the per-game box (player
// id → stat deltas) for stat folding. Pure w.r.t. players/teams — re-simming a clone is safe.
function simGame(g){
  const {home,away}=simSides(g);
  const res=simEngine(home,away,(hashStr(g.id)^(S.seed>>>0))>>>0);
  g.hs=res.hs;g.as=res.as;g.played=true;
  return res.box;
}
// Fold a game's box score into each player's season totals (p.gs). Stored only for players
// who recorded something, so the save-size hit is limited to players who saw the field.
function applyStats(g,box){
  if(!box)return;
  [g.home,g.away].forEach(tid=>{const t=teamById(tid);
    t.roster.forEach(p=>{const d=box[p.id];if(!d)return;const s=p.gs=p.gs||{};for(const k in d)s[k]=(s[k]||0)+d[k];});});
}
function applyResult(g,box){
  const home=teamById(g.home),away=teamById(g.away),homeWon=g.hs>g.as;
  home.rec.pf+=g.hs;home.rec.pa+=g.as;away.rec.pf+=g.as;away.rec.pa+=g.hs;
  const W=homeWon?home:away,L=homeWon?away:home;
  W.rec.w++;L.rec.l++;
  W.rec.streak=W.rec.streak>=0?W.rec.streak+1:1;
  L.rec.streak=L.rec.streak<=0?L.rec.streak-1:-1;
  if(!g.kind&&home.conf===away.conf){W.rec.cw++;L.rec.cl++;}   // postseason games aren't conference games
  applyStats(g,box);
}
function advanceWeek(){
  const wk=S.week;

  computeWeeklyHonors(wk,boxes);
  const recOut=resolveRecruitingWeek(wk);   // AI recruits + commitments for the week just finished
  S.lastPlayedWeek=wk;S.week++;
  recomputeRanks(S.world);
  updateMedia(wk,boxes,recOut);             // Phase 19: refresh the AP poll + push the week's news stories
  if(S.week>S.schedule.weeks)finishRegularSeason();   // → postseason (bowls + playoff), then offseason
  else{setWeeklyTask();grantRecruitPoints();}
  autosave();
}
// Player of the Week from the week's per-game boxes — Offensive & Defensive, at national scope
// and one per conference. Stored lean in S.weeklyHonors with a snapshotted stat line so the
// honor survives later roster edits / season rollover.
function honorLine(s,side){
  if(side==='def'){const d=[];if(s.tkl)d.push(s.tkl+' tkl');if(s.sk)d.push(s.sk+' sk');if(s.dInt)d.push(s.dInt+' INT');return d.join(', ')||'—';}
  const p=[];
  if(s.pYds||s.pTD)p.push(`${s.pYds||0} pass yd${s.pTD?', '+s.pTD+' TD':''}${s.pInt?', '+s.pInt+' INT':''}`);
  if(s.rYds||s.rTD)p.push(`${s.rYds||0} rush yd${s.rTD?', '+s.rTD+' TD':''}`);
  if(s.reYds||s.reTD)p.push(`${s.rec||0} rec, ${s.reYds||0} yd${s.reTD?', '+s.reTD+' TD':''}`);
  return p.join(' · ')||'—';
}
function computeWeeklyHonors(week,boxes){
  const cand=[];

    t.roster.forEach(p=>{const s=box[p.id];if(!s)return;
      const off=(s.pYds||0)*0.04+(s.pTD||0)*4+(s.rYds||0)*0.1+(s.rTD||0)*6+(s.reYds||0)*0.1+(s.reTD||0)*6-(s.pInt||0)*2;
      const def=(s.tkl||0)+(s.sk||0)*4+(s.dInt||0)*6;

}
/* ============================================================
   MEDIA SUITE — app layer over the pure MEDIA ENGINE (Phase 19)
   Owns S.media (the AP poll + the news feed); assembles the per-week context from the data the sim

   ============================================================ */
function rankedScored(){return [...S.world.teams].sort((a,b)=>rankScore(b)-rankScore(a)).map(t=>({id:t.id,score:rankScore(t)}));}
function initMedia(){S.media={poll:computePoll(null,rankedScored(),0),feed:[],pressDev:0,pressWeek:-1};}
function pollRankOf(teamId){const p=S.media&&S.media.poll;if(!p)return null;const e=p.top.find(x=>x.teamId===teamId);return e?e.rank:null;}
// A lean story record (newest-first feed). teamIds/colors snapshotted so rendering needs no lookups.
let _mediaSeq=0;
function pushStory(list,wk,tag,d,r,extra){
  const s=mkStory(tag,d,r);

// Build the week's stories from the resolved games + honors + recruiting. `prevPoll` is last week's poll
// (for ranks at game time); `poll` is the freshly computed one (for risers).
function buildWeekStories(wk,boxes,recOut,prevPoll,poll){
  const out=[], me=S.teamId;
  const rankAt=tid=>{const e=prevPoll&&prevPoll.top.find(x=>x.teamId===tid);return e?e.rank:null;};
  // game stories — upsets, ranked clashes, blowouts
  (boxes||[]).forEach(({g})=>{
    const h=teamById(g.home),a=teamById(g.away),homeWon=g.hs>g.as;
    const W=homeWon?h:a,L=homeWon?a:h,ws=Math.max(g.hs,g.as),ls=Math.min(g.hs,g.as),margin=ws-ls;
    const tag=gameStoryTag({rank:rankAt(W.id),ovr:W.ratings.ovr},{rank:rankAt(L.id),ovr:L.ratings.ovr},margin);
    if(!tag)return;
    const r=rng((S.seed^hashStr('story'+wk+g.id))>>>0);
    pushStory(out,wk,tag,{w:W.abbr,wLong:W.name,wRank:rankAt(W.id),l:L.abbr,lLong:L.name,lRank:rankAt(L.id),ws,ls,margin},r,
      {color:W.color,teams:[W.id,L.id],mine:W.id===me||L.id===me});
  });

  if(hon&&hon.national&&hon.national.off){const o=hon.national.off;
    pushStory(out,wk,'pow',{name:o.name,pos:o.pos,abbr:o.abbr,line:o.line},rng((S.seed^hashStr('pow'+wk))>>>0),{color:o.color,teams:[o.teamId]});}
  // poll risers (jumped ≥4 spots into/up the top 25)
  (poll?poll.top:[]).forEach(e=>{if(e.prev&&e.prev-e.rank>=4){const t=teamById(e.teamId);
    pushStory(out,wk,'riser',{w:t.abbr,wLong:t.name,delta:e.prev-e.rank,rank:e.rank},rng((S.seed^hashStr('rise'+wk+e.teamId))>>>0),{color:t.color,teams:[t.id]});}});

  (recOut||[]).forEach(rec=>{
    const to=teamById(rec.committedTo);if(!to)return;
    if(rec._flipped){const from=teamById(rec._flipped.from);
      if(rec.stars>=4)pushStory(out,wk,'flip',{w:to.abbr,wLong:to.name,l:from?from.abbr:'?',lLong:from?from.name:'a rival',stars:rec.stars,pos:rec.pos,name:rec.fn+' '+rec.ln},
        rng((S.seed^hashStr('flip'+wk+rec.id))>>>0),{color:to.color,teams:[to.id],mine:to.id===me});
    }else if(rec.stars>=4){
      pushStory(out,wk,'commit',{w:to.abbr,wLong:to.name,stars:rec.stars,pos:rec.pos,name:rec.fn+' '+rec.ln},
        rng((S.seed^hashStr('commit'+wk+rec.id))>>>0),{color:to.color,teams:[to.id],mine:to.id===me});
    }

}

// Stamp a year's award winners onto the winning players' p.honors (survives rollover), so a

    const p=t.roster.find(x=>x.id===snap.pid);if(!p)return;(p.honors=p.honors||[]).push({year:aw.year,award:label});};

/* ============================================================
   POSTSEASON — 12-team playoff + bowls (Phase 12)

// One postseason game (parallel to a schedule Game, tagged with `kind` so applyResult/lookup branch).
function mkPostGame(kind,round,i,home,away,name){
  return {id:'po'+(S.year||2026).toString(36)+kind[0]+round+'g'+i,kind,round,home,away,
    played:false,hs:0,as:0,name:name||PLAYOFF_ROUNDS[round]};
}
function startPostseason(champIds){
  const me=S.teamId;
  const ranked=[...S.world.teams].sort((a,b)=>rankScore(b)-rankScore(a));
  if(ranked.length<12){              // tiny custom world — no bracket, straight to the offseason
    S.postseason=null;enterOffseason();return;
  }
  const seeds=seedPlayoff(ranked.map(t=>t.id),champIds||[]), inPlayoff=new Set(seeds);
  let eligible=ranked.filter(t=>!inPlayoff.has(t.id)&&t.rec&&t.rec.w>=6).map(t=>t.id);
  // guarantee the controlled team a bowl if it's eligible but ranked below the marquee slate
  const mi=eligible.indexOf(me);
  if(mi>=MAX_BOWLS*2){eligible.splice(mi,1);eligible.splice(MAX_BOWLS*2-1,0,me);}
  const bowls=genBowls(eligible,(S.seed^(S.year||2026))>>>0).map((b,i)=>mkPostGame('bowl',0,i,b.home,b.away,b.name));
  const round0=playoffRoundMatchups(0,seeds,[]).map((pr,i)=>mkPostGame('playoff',0,i,pr[0],pr[1]));
  const inBowl=bowls.some(g=>g.home===me||g.away===me);
  S.postseason={year:S.year||2026,round:0,playoff:{seeds,rounds:[round0],champion:null},bowls,
    meDone:!inPlayoff.has(me)&&!inBowl};   // a team not in the field is "done" from the start
  S.phase='Postseason';
  setPostseasonTask();
  autosave();
}
// Games to resolve this round: the playoff round's games, plus (round 0) every bowl.
function postseasonRoundGames(round){
  const ps=S.postseason,pg=(ps.playoff.rounds[round]||[]);
  return round===0?pg.concat(ps.bowls):pg;
}
function winnerOfGame(g){return g.hs>g.as?g.home:g.away;}
// The controlled team's unplayed game in the current round (null if bye / eliminated / not in the field).
function myPostseasonGame(){const me=S.teamId;
  return postseasonRoundGames(S.postseason.round).find(g=>!g.played&&(g.home===me||g.away===me));}
// Resolve the current round (sim every unplayed game), advance the bracket, or finish the postseason.
function advancePostseason(){
  const ps=S.postseason,round=ps.round,me=S.teamId;
  const myGame=postseasonRoundGames(round).find(g=>g.home===me||g.away===me);
  postseasonRoundGames(round).forEach(g=>{if(!g.played){const box=simGame(g);applyResult(g,box);}});
  recomputeRanks(S.world);
  if(myGame){const iWon=winnerOfGame(myGame)===me;        // did the controlled team just bow out / advance?
    if(!iWon||myGame.kind==='bowl'||round===3)ps.meDone=true;}
  if(round<3){
    const winners=ps.playoff.rounds[round].map(winnerOfGame);
    ps.playoff.rounds[round+1]=playoffRoundMatchups(round+1,ps.playoff.seeds,winners)
      .map((pr,i)=>mkPostGame('playoff',round+1,i,pr[0],pr[1]));
    ps.round=round+1;setPostseasonTask();autosave();
  }else{
    ps.playoff.champion=winnerOfGame(ps.playoff.rounds[3][0]);
    endPostseason();
  }
}
// Resolve the rest of the postseason in one shot (used once the controlled team is out of it).
function simRestOfPostseason(){let guard=0;while(S.phase==='Postseason'&&guard++<12)advancePostseason();}
// Crown the champion, settle each team's finish into prestige / recruiting momentum / a revenue payout.
function endPostseason(){
  const ps=S.postseason,champ=ps.playoff.champion;
  const finish={};
  ps.playoff.seeds.forEach(id=>finish[id]='firstround');
  const lostLabel=['firstround','quarterfinal','semifinal','runnerup'];
  ps.playoff.rounds.forEach((games,round)=>games.forEach(g=>{finish[winnerOfGame(g)===g.home?g.away:g.home]=lostLabel[round];}));
  if(champ)finish[champ]='champion';
  ps.bowls.forEach(g=>{const w=winnerOfGame(g);finish[w]='bowlwin';finish[w===g.home?g.away:g.home]='bowlloss';});
  S.world.teams.forEach(t=>{
    const pay=postseasonPayoff(finish[t.id]||'none');
    t._pp=(t._pp||0)+pay.prestige;                         // accrue fractional prestige; bump on whole points
    if(t._pp>=1){const inc=Math.floor(t._pp);t.prestige=clamp((t.prestige||50)+inc,20,99);t._pp-=inc;}
    t.postseasonBoost=pay.recruitBoost;                    // consumed by NEXT season's recruitFit
    t.lastPostseason={finish:finish[t.id]||'none',label:pay.label,revenue:pay.revenue};  // revenue settles at rollover
  });
  const aw=S.awards[S.awards.length-1];
  if(aw&&champ){const ct=teamById(champ);aw.champion={teamId:ct.id,name:ct.name,abbr:ct.abbr,color:ct.color,rec:ct.rec.w+'–'+ct.rec.l};
    ct.titles=ct.titles||[];ct.titles.push(ps.year);
    mediaEvent(S.week,'title','🏆 '+ct.name+' wins the national championship',ct.name+' '+ct.nick+' are your '+ps.year+' national champions ('+ct.rec.w+'–'+ct.rec.l+').',{color:ct.color,teams:[ct.id]});}
  ps.done=true;

}

// Settle the controlled coach's approval at season's end: wins vs the prestige expectation + title bonuses,

function settleSeasonApproval(){

  const d=seasonApprovalDelta({w:t.rec.w,l:t.rec.l,prestige:t.prestige,

// Early Signing Period: every recruit already committed (a verbal) puts pen to paper now. The rest stay

function earlySigningPeriod(){

  // The still-undecided (the close two-way races) hold off for National Signing Day's drama.

// ---- TRANSFER PORTAL (Phase 18) — app layer over the pure PORTAL ENGINE ----
// Coach retention: a Motivator / Former Player keeps more of his own players from leaving.
function portalRetentionMult(){const c=S.coach||{};let m=1;
  if(c.archetype==='Motivator')m*=0.8; if(c.history==='Former Player')m*=0.85; return m;}
function portalPoints(){const c=S.coach||{};return PORTAL.POINTS+(c.archetype==='Recruiter'?20:0);}
// A team's portal needs = positions now below their target depth (a hole a transfer can fill).
function computePortalNeeds(t){const need={};POS.forEach(([code,,n])=>{if(t.roster.filter(p=>p.pos===code).length<n)need[code]=true;});return need;}
function portalTeamViews(){return S.world.teams.map(t=>({id:t.id,prestige:t.prestige,needs:computePortalNeeds(t)}));}
// Open the transfer portal (offseason, after National Signing Day): pull leavers off every roster into
// the pool, seed suitor interest, run an opening AI round, then let the player work the board.
function openPortal(){
  const me=S.teamId, yr=S.year||2026, r=rng((S.seed^hashStr('portal'+yr))>>>0);
  const pool=[], departures=[], views=portalTeamViews();
  S.world.teams.forEach(t=>{
    const g=t.rec?(t.rec.w+t.rec.l):0, winPct=g?t.rec.w/g:0, retention=t.id===me?portalRetentionMult():1;
    const leaving=t.roster.filter(p=>{
      if(NEXT_CLASS[p.yr]===null)return false;            // graduating seniors leave via graduation, not the portal
      const broken=!!(p.promise&&p.promise.type==='playingTime'&&!((p.so!=null&&p.so<=1)||(p.gs&&p.gs.gp)));
      return r()<portalLeaveProb(p,{brokenPromise:broken,winPct,retention});
    });
    if(!leaving.length)return;
    t.roster=t.roster.filter(p=>leaving.indexOf(p)<0);
    leaving.forEach(p=>{
      const ranked=views.filter(o=>o.id!==t.id).map(o=>({o,s:portalFit(o,p)+r()*0.5}))
        .sort((a,b)=>b.s-a.s).slice(0,PORTAL.MAX_SUITORS);
      const iv={};ranked.forEach((e,k)=>{iv[e.o.id]=clamp(Math.round(16+portalFit(e.o,p)*24+ri(r,-3,5)-k*2),8,68);});
      pool.push(Object.assign({},p,{fromTeam:t.id,iv,committedTo:null}));
      if(t.id===me)departures.push({name:p.fn+' '+p.ln,pos:p.pos,ov:p.ov});
    });
  });
  advancePortal(pool,views,S.seed,false);                // an opening AI round so interest builds
  S.portal={year:yr,pool,points:portalPoints(),stage:'open',departures,arrivals:null};
  S.world.teams.forEach(t=>t.ratings=teamRatings(t.roster,t.staff));   // rosters shrank
  recomputeRanks(S.world);
  setPortalTask();autosave();
}
// Pursue a transfer: spend portal points to become a suitor / raise your interest.
function pursueTransfer(tr){
  const P=S.portal; if(!P||P.stage!=='open')return false;
  if(tr.committedTo){toast('Already committed elsewhere');return false;}
  const cost=10; if(P.points<cost){toast('Not enough portal points');return false;}
  P.points-=cost;
  const meView={id:S.teamId,prestige:controlled().prestige,needs:computePortalNeeds(controlled())};
  if(tr.iv[S.teamId]==null)tr.iv[S.teamId]=clamp(Math.round(22+portalFit(meView,tr)*22),8,60);
  else tr.iv[S.teamId]=clamp(tr.iv[S.teamId]+15,0,100);
  autosave();return true;
}
// Close the portal: finalize commitments, drop each committed transfer onto his new roster, then move on.
function closePortal(){
  const P=S.portal; if(!P||P.stage==='closed')return;
  advancePortal(P.pool,portalTeamViews(),S.seed,true);
  const arrivals=[];
  P.pool.forEach(tr=>{
    if(!tr.committedTo)return;
    const t=teamById(tr.committedTo); if(!t)return;
    const player=Object.assign({},tr); delete player.iv; delete player.fromTeam; delete player.committedTo;
    player.fromTransfer=true; player.cap=false;
    t.roster.push(player);
    if(t.id===S.teamId)arrivals.push({name:player.fn+' '+player.ln,pos:player.pos,ov:player.ov});
  });
  P.stage='closed'; P.arrivals=arrivals;
  S.world.teams.forEach(t=>t.ratings=teamRatings(t.roster,t.staff));
  recomputeRanks(S.world);
  const signed=P.pool.filter(tr=>tr.committedTo).length;

}
function setPortalTask(){

// Facilities base development rate for a team's offseason (strength + training). Side/coach
// specifics layer on in devRateFor. AI teams develop off facilities + their staff alone.
function devRate(team){
  const f=((team.fac&&team.fac.strength)||5)+((team.fac&&team.fac.training)||5);
  return 0.85+(f/2)*0.03;
}
function posSide(code){const p=POS.find(x=>x[0]===code);return p?p[1]:'off';}
// Per-player offseason development rate (Phase 7): facilities base, then the side's coordinator and
// the player's position coach (better coaches grow talent faster — applies to every team), then —
// for the controlled team only — the head coach's side-specific Genius, Motivator, Analyst, and
// High-School-Legend raw-talent signals. Clamped so league strength can't run away or collapse.
function devRateFor(team,p){
  let rate=devRate(team);
  const side=posSide(p.pos), scope={off:'OFF',def:'DEF',st:'ST'}[side];
  const coord=(team.staff||[]).find(c=>c.tier==='coord'&&c.scope===scope);
  if(coord)rate*=1+clamp((coord.rating-60)/300,-0.05,0.12);
  const pc=(team.staff||[]).find(c=>c.tier==='pos'&&(c.groups||[]).indexOf(p.pos)>=0);
  if(pc)rate*=1+clamp((pc.rating-60)/400,-0.04,0.09);
  if(S&&team.id===S.teamId&&S.coach){
    const A=S.coach.archetype,H=S.coach.history;
    if(side==='off'&&A==='Offensive Genius')rate*=1.14;
    if(side==='def'&&A==='Defensive Genius')rate*=1.12;
    if(A==='Motivator')rate*=1.04;
    if(H==='Analyst')rate*=1.04;
    if(H==='High School Legend')rate*=1.05;
  }
  rate*=motorMult(p);                      // the player's own work ethic (Phase 10 trait)
  if(team.id===S.teamId&&S.media&&S.media.pressDev)rate*=1+clamp(S.media.pressDev,0,0.08);   // Phase 19b: press "culture" focus
  return clamp(rate,0.6,1.6);
}

function rolloverSeason(){

  S.world.teams.forEach(t=>{t.payroll=(t.staff||[]).reduce((s,x)=>s+(x.salary||0),0);});
  S.year=(S.year||2026)+1;
  S.world.teams.forEach(t=>{t.rec=emptyRec();t.ratings=teamRatings(t.roster,t.staff);});
  S.schedule=null;S.lastPlayedWeek=0;S.weeklyHonors=[];S.recruiting=null;S.postseason=null;S.champWeek=null;S.portal=null;S.media=null;
  S.week=0;S.phase='Preseason';
  S.seriesOffers=genSeriesOffers(S.seed,S.year,me);   // a fresh wave of scheduling offers each offseason
  recomputeRanks(S.world);
  const nf=summary?summary.freshmen.length:0;
  S.task={type:'Media Day',label:S.year+' Media Day',
    note:'New year on campus. The returning core developed and '+nf+' freshman'+(nf===1?'':'men')+
      ' arrived. Kick off the season when you’re ready.'};
  const poachedMine=(carousel.poached||[]).filter(p=>p.fromId===me)
    .map(p=>({name:p.coach.name,role:p.coach.scope||p.coach.role}));
  S.offseasonReport={year:S.year,
    graduated:summary?summary.graduated.length:0,
    tracked:summary?summary.trackedCount:0,
