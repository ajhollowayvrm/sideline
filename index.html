<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0d0f12">
<title>Sideline — CFB Coach Sim</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0d0f12; --panel:#15181d; --panel2:#1c2026; --line:#2a2f37;
  --ink:#e9ecf1; --ink2:#aab3c0; --ink3:#6b7480;
  --accent:#c9a227; --accent-ink:#0d0f12;
  --good:#3ea66b; --warn:#d8a24a; --bad:#d35450;
  --r:12px;
  --safe-b: env(safe-area-inset-bottom, 0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  background:var(--bg); color:var(--ink);
  font-family:'Inter',system-ui,-apple-system,sans-serif;
  font-size:15px; line-height:1.45;
  overscroll-behavior-y:none;
}
.cond{font-family:'Saira Condensed','Inter',sans-serif;letter-spacing:.01em}
button{font-family:inherit;color:inherit;cursor:pointer;border:none;background:none}
input,select{font-family:inherit;font-size:16px;color:var(--ink);background:var(--panel2);
  border:1px solid var(--line);border-radius:10px;padding:11px 12px;width:100%}
input:focus,select:focus{outline:2px solid var(--accent);outline-offset:1px}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--ink2) 50%),linear-gradient(135deg,var(--ink2) 50%,transparent 50%);
  background-position:calc(100% - 18px) 19px,calc(100% - 13px) 19px;background-size:5px 5px;background-repeat:no-repeat;padding-right:34px}
label.fld{display:block;margin-bottom:14px}
label.fld>span{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--ink3);margin-bottom:5px;font-weight:600}

#app{max-width:560px;margin:0 auto;min-height:100%;padding-bottom:calc(76px + var(--safe-b))}
.view{padding:18px 16px 8px}
.noscroll{padding-bottom:0}

/* header / scoreboard */
.topbar{position:sticky;top:0;z-index:20;background:linear-gradient(180deg,var(--bg) 70%,transparent);
  padding:12px 16px 10px;display:flex;align-items:center;gap:12px}
.crest{width:42px;height:42px;border-radius:10px;display:grid;place-items:center;
  font-family:'Saira Condensed';font-weight:800;font-size:18px;color:#fff;
  background:var(--accent);box-shadow:inset 0 0 0 1px rgba(255,255,255,.18)}
.topbar h1{font-family:'Saira Condensed';font-weight:700;font-size:21px;line-height:1;letter-spacing:.01em}
.topbar .sub{font-size:11.5px;color:var(--ink2);margin-top:2px}

h2.sec{font-family:'Saira Condensed';font-weight:700;font-size:13px;text-transform:uppercase;
  letter-spacing:.13em;color:var(--ink3);margin:22px 2px 9px}
h2.sec:first-child{margin-top:6px}

.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.card+.card{margin-top:10px}
.row{display:flex;align-items:center;gap:12px}
.spread{justify-content:space-between}
.muted{color:var(--ink2)}
.dim{color:var(--ink3)}
.big-num{font-family:'Saira Condensed';font-weight:800;font-size:30px;line-height:1}
.tag{display:inline-block;font-family:'Saira Condensed';font-weight:700;font-size:11px;letter-spacing:.06em;
  text-transform:uppercase;padding:3px 8px;border-radius:6px;background:var(--panel2);color:var(--ink2);border:1px solid var(--line)}
.tag.accent{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.tag.good{color:var(--good);border-color:color-mix(in srgb,var(--good) 40%,transparent)}
.tag.bad{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,transparent)}

.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;
  padding:14px;border-radius:11px;font-family:'Saira Condensed';font-weight:700;font-size:16px;
  letter-spacing:.04em;text-transform:uppercase;background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:var(--panel2);color:var(--ink);border:1px solid var(--line)}
.btn.line{background:transparent;border:1px solid var(--line);color:var(--ink2)}
.btn.danger{background:transparent;border:1px solid color-mix(in srgb,var(--bad) 50%,transparent);color:var(--bad)}
.btn.sm{padding:9px 12px;font-size:13px;width:auto}
.btn:disabled{opacity:.4}
.btn-row{display:flex;gap:9px;margin-top:10px}

.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px 13px}
.stat .k{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink3);font-weight:600}
.stat .v{font-family:'Saira Condensed';font-weight:800;font-size:23px;margin-top:3px}

/* rank pills */
.ranks{display:flex;gap:8px}
.rankpill{flex:1;text-align:center;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:11px 6px}
.rankpill .n{font-family:'Saira Condensed';font-weight:800;font-size:26px;line-height:1}
.rankpill .l{font-size:10px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink3);margin-top:4px;font-weight:600}

/* list rows */
.lrow{display:flex;align-items:center;gap:11px;padding:11px 13px;background:var(--panel);
  border:1px solid var(--line);border-radius:var(--r)}
.lrow+.lrow{margin-top:7px}
.ovr{font-family:'Saira Condensed';font-weight:800;font-size:19px;width:34px;text-align:center;
  border-radius:8px;padding:3px 0;background:var(--panel2)}
.ovr.elite{color:var(--accent)}
.pos{font-family:'Saira Condensed';font-weight:700;font-size:12px;color:var(--ink3);width:30px}
.nm{font-weight:600;font-size:14.5px}
.meta{font-size:11.5px;color:var(--ink3)}
.cap{color:var(--accent);font-weight:700;font-size:11px}

/* tabs */
.tabs{display:flex;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:4px;margin-bottom:14px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:1 0 auto;white-space:nowrap;padding:9px;border-radius:9px;font-family:'Saira Condensed';font-weight:700;
  font-size:14px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink3)}
.tabs button.on{background:var(--accent);color:var(--accent-ink)}

/* bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(13,15,18,.92);
  backdrop-filter:blur(12px);border-top:1px solid var(--line);
  padding:8px 0 calc(8px + var(--safe-b));display:flex;max-width:560px;margin:0 auto}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--ink3);font-size:10px;font-weight:600;letter-spacing:.04em}
.nav button.on{color:var(--accent)}
.nav svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9}

/* menu hero */
.hero{min-height:100svh;display:flex;flex-direction:column;justify-content:center;padding:24px 22px calc(40px + var(--safe-b))}
.hero .kick{font-family:'Saira Condensed';font-weight:600;font-size:13px;letter-spacing:.32em;text-transform:uppercase;color:var(--accent)}
.hero h1{font-family:'Saira Condensed';font-weight:800;font-size:62px;line-height:.92;margin:8px 0 4px;letter-spacing:.005em}
.hero .by{color:var(--ink3);font-size:13px;margin-bottom:38px}
.hero .btn{margin-top:11px}

.steps{display:flex;gap:6px;margin-bottom:18px}
.steps span{flex:1;height:3px;border-radius:3px;background:var(--line)}
.steps span.on{background:var(--accent)}

.choice{display:flex;flex-direction:column;gap:8px}
.opt{text-align:left;padding:13px 14px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r)}
.opt.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.opt .t{font-family:'Saira Condensed';font-weight:700;font-size:16px}
.opt .d{font-size:12.5px;color:var(--ink2);margin-top:3px}

.team-pick{display:flex;align-items:center;gap:11px;padding:11px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r)}
.team-pick.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.dot{width:14px;height:14px;border-radius:4px;flex:none}

.search{margin-bottom:11px}
.fac{display:flex;gap:5px;margin-top:8px;flex-wrap:wrap}
.fac .f{font-size:10.5px;color:var(--ink2);background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:3px 7px}
.bar{height:6px;border-radius:6px;background:var(--panel2);overflow:hidden;margin-top:7px}
.bar i{display:block;height:100%;background:var(--accent)}

.toast{position:fixed;left:50%;bottom:calc(86px + var(--safe-b));transform:translateX(-50%);
  background:var(--ink);color:var(--bg);font-weight:600;font-size:13px;padding:10px 16px;border-radius:99px;
  z-index:50;opacity:0;transition:opacity .2s, transform .2s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(-4px)}

.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:560px;background:var(--panel);border-top-left-radius:18px;border-top-right-radius:18px;
  border:1px solid var(--line);padding:18px 16px calc(18px + var(--safe-b));max-height:88vh;overflow:auto}
.sheet h3{font-family:'Saira Condensed';font-weight:700;font-size:20px;margin-bottom:4px}
.grab{width:38px;height:4px;border-radius:4px;background:var(--line);margin:0 auto 14px}
.kv{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.kv:last-child{border-bottom:none}
.kv .k{color:var(--ink2)}
hr.div{border:none;border-top:1px solid var(--line);margin:14px 0}
.hint{font-size:12px;color:var(--ink3);line-height:1.5}
.center{text-align:center}
.empty{text-align:center;color:var(--ink3);padding:40px 20px;font-size:14px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

// === TRAIT ENGINE (Phase 10) START ===
// Per-player temperament. Two fogged traits that mesh with coach identity, designed to be
// MEAN-NEUTRAL so they add texture without skewing the validated dev/sim envelopes. Pure:
// depends only on rng/ri/clamp. Values are 0..100, centered ~50 (average); absent reads as 50.
//   mot  (Motor / work ethic) → biases OFFSEASON DEVELOPMENT   via motorMult()
//   comp (Composure)          → biases IN-GAME yardage variance via compExp()/compDraw() + clutch
// The UI never shows the raw number — it renders a fogged band (see traitBand, Phase 10 UI).
const TRAIT_DEF=50;                                       // an absent trait reads as league-average
// A fresh trait set, each gently bell-shaped (mean of two rolls) so most players are average and the tails
// — true grinders / head-cases, ice-veined / streaky, divas / monks — stay rare. Deterministic from `r`.
//   ego (Phase 20) → MEDIA-receptiveness: how hard the narrative (press, results, the spotlight) hits him.
function genTraits(r){const bell=()=>clamp(Math.round((ri(r,0,100)+ri(r,0,100))/2),0,100);return {mot:bell(),comp:bell(),ego:bell()};}
function motVal(p){return (p&&p.mot!=null)?p.mot:TRAIT_DEF;}
function compVal(p){return (p&&p.comp!=null)?p.comp:TRAIT_DEF;}
function egoVal(p){return (p&&p.ego!=null)?p.ego:TRAIT_DEF;}
// Motor → offseason development multiplier (~0.85..1.15, average 1.0). A grinder squeezes more
// ov→pot out of every offseason; a coaster leaves growth on the table. Folded into devRateFor.
function motorMult(p){return clamp(1+(motVal(p)-50)/333,0.85,1.15);}
// Composure → a mean-PRESERVING reshape exponent for per-play yardage draws. The reshape is
// symmetric about 0.5, so E[draw] is unchanged — only the SPREAD moves. comp>50 pulls draws to
// their middle (consistent); comp<50 pushes them to the extremes (boom/bust). At comp==50 the
// exponent is 1 and compReshape is the identity, so a trait-less player is byte-identical to the
// pre-Phase-10 sim (keeps simlab envelopes + determinism intact).
// `amp` (Phase 50) scales how hard composure presses: 1 on a routine snap, up to 1+PC.varAmp when
// the game is on the line. The reshape is mean-PRESERVING at any amp (compReshape is symmetric
// about 0.5), so amplifying it in the clutch changes WHO wobbles, never the league's scoring mean —
// which is what the measured "one-score win% doesn't repeat (r=0.078)" finding demands.
// Absent amp === 1 → byte-identical to the pre-Phase-50 draw (the clamp never binds there).
function compExp(p,amp){return clamp(1+((compVal(p)-50)/100)*(amp==null?1:amp),0.25,1.75);}  // comp0→0.5 streaky … comp100→1.5 steady
function compReshape(x,g){const d=2*x-1;return 0.5+0.5*(d<0?-1:1)*Math.pow(Math.abs(d),g);}
function compDraw(r,p,amp){return compReshape(r(),compExp(p,amp));}   // one rng draw, reshaped by comp
// Clutch: a tiny rating nudge applied to the OFFENSE's key man only when the game is "late &
// close". High composure tightens up, low composure wobbles. Small by design (±~1.6 pts) so it
// sways tight games without moving the season-long favorite/home win envelopes.
function compClutch(p){return (compVal(p)-50)/31;}                    // ≈ -1.6 .. +1.6 rating pts

// --- Ego + persistent morale (Phase 20) — pure, lab-tested, MEAN-NEUTRAL at the average so an
// untouched roster (every ego/morale == 50) reproduces the pre-Phase-20 dev/sim/portal envelopes.
const MORALE_DEF=50;                                                  // absent morale reads as neutral
function moraleVal(p){return (p&&p.morale!=null)?p.morale:MORALE_DEF;}
// How hard the narrative hits a player (0.2 unflappable … 1.5 diva). Monotonic in ego, bounded.
function egoWeight(ego){return clamp(0.2+(ego/100)*1.3,0.2,1.5);}
// Move a player's morale by a signed event, scaled by his ego susceptibility. Bounded 0..100.
function moraleUpdate(morale,valence,ego){return clamp(morale+valence*egoWeight(ego),0,100);}
// Weekly ease back toward neutral — a bad (or great) week fades over a few weeks.
function moraleDecay(morale){return morale+(50-morale)*0.25;}
// Morale → offseason/weekly development multiplier (0.9..1.1, exactly 1.0 at 50). Folded into devRateFor.
function moraleDevMult(morale){return clamp(1+(morale-50)/250,0.9,1.1);}
// Roster's collective morale → a small ± team rating shift (≤ ~2 pts), 0 when the room is neutral. Applied
// OUTSIDE simEngine (the controlled-team edge layer), so simlab envelopes + determinism are untouched.
function moraleGameSkew(roster){
  if(!roster||!roster.length)return 0;
  let s=0,n=0;roster.forEach(p=>{if(p.so==null||p.so<=2){s+=moraleVal(p)-50;n++;}});
  if(!n)return 0;
  return clamp((s/n)/50*2,-2,2);
}
// Low morale pushes a player toward the portal (0 at neutral/high; up to +0.2 leave probability when bleak).
function moralePortalPush(morale){return clamp((50-morale)/50*0.2,0,0.2);}

// === SCHEME ENGINE (Phase 21) START ===
// Every team runs an offensive + defensive SCHEME; every player innately PREFERS one on his side
// (which may NOT be what he's rated for — that's the point). Three MEAN-ZERO effects fold into a
// small rating delta applied OUTSIDE simEngine (in simSides, like coachGameEdges) so the SIM block
// + determinism gate stay byte-identical and the validated scoring envelope holds on average:
//   (1) a rock-paper-scissors MATCHUP edge (off scheme vs def scheme),
//   (2) roster scheme-FIT (players in a scheme they love play up; the swing is small so raw OVR
//       still dominates — the best players just win),
//   (3) coach BUY-IN when the team runs the coach's own scheme — controlled-team-specific, so it
//       lives in the app layer (schemeBuyIn) alongside coachGameEdges, NOT in this pure block.
// Depends only on hashStr/ri/clamp + POS (no DOM, no S) — test/schemelab.js evals it offline.
const OFF_SCHEMES=['Air Raid','Spread','Spread-Option','Pro Style','Smashmouth','West Coast','Multiple'];
const DEF_SCHEMES=['4-3','3-4','Nickel/Cover-3','Bear','Tampa-2'];
// Matchup edge in rating points, SCHEME_EDGE[offIdx][defIdx] (7 offenses × 5 defenses). DOUBLY
// balanced — every row AND every column sums to 0 — so over uniformly-random matchups the mean
// edge is exactly 0 (the scoring envelope is preserved by construction), while any single matchup
// still tilts ±.
const SCHEME_EDGE=[
  //  4-3  3-4  Nkl  Bear Tmp2
  [    1,   1,  -2,   2,  -2 ],   // Air Raid     — pass-heavy; beats blitz (Bear), zone (Nickel/Cover-3, Tampa-2) takes the deep ball away
  [    1,   0,  -1,   1,  -1 ],   // Spread       — balanced (pistol run + RPO); few weaknesses, punishes aggression (4-3/Bear), soft vs zone
  [    1,   2,   0,  -1,  -2 ],   // Spread-Option— run-first option; gashes read-and-react 3-4/4-3, blitz blows up the mesh (Bear), Tampa-2 spies it
  [   -1,   1,   1,  -1,   0 ],   // Pro Style    — low-variance, small edges everywhere; slightly worse vs base/pressure
  [   -1,  -2,   2,  -2,   3 ],   // Smashmouth   — power run; gashes light boxes (Nickel/Tampa-2), stout fronts (3-4/Bear) stuff it
  [   -1,  -2,   0,   1,   2 ],   // West Coast   — quick timing game beats pressure (Bear) + soft zone underneath (Tampa-2); tight man disrupts it
  [    0,   0,   0,   0,   0 ],   // Multiple     — true neutral; no matchup weakness or strength, leans on talent + roster fit
];
const SCHEME_FIT_W=0.9;          // rating pts per unit of roster fit aggregate (small → OVR dominates)
// Run/pass IDENTITY (Phase 22): a bias the offense's scheme adds to the OC's pass probability. The
// values average ~0, so this shifts play SELECTION (Air Raid airs it out, Smashmouth grinds, Spread
// runs from pistol, Multiple is balanced), not the league scoring envelope; folded into passProb in
// simEngine. Unknown scheme → 0 (neutral).
const SCHEME_TENDENCY={'Air Raid':0.18,'Spread':0.04,'Spread-Option':-0.14,'Pro Style':0,'Smashmouth':-0.16,'West Coast':0.06,'Multiple':0};
function schemeTendency(s){return SCHEME_TENDENCY[s]||0;}
function schemeCount(side){return side==='def'?DEF_SCHEMES.length:OFF_SCHEMES.length;}
function offSchemeIdx(s){const i=OFF_SCHEMES.indexOf(s);return i<0?OFF_SCHEMES.length-1:i;}   // unknown → Multiple (neutral)
function defSchemeIdx(s){const i=DEF_SCHEMES.indexOf(s);return i<0?0:i;}   // unknown → 4-3 (neutral)
function schemeEdge(off,def){return SCHEME_EDGE[offSchemeIdx(off)][defSchemeIdx(def)];}
// A team's DEFAULT schemes derive from its id (stable + free → every seed's world stays
// byte-identical; the player can later install his own). Stored mutably on the team once set.
function defaultOffScheme(id){return OFF_SCHEMES[hashStr('off'+id)%OFF_SCHEMES.length];}
function defaultDefScheme(id){return DEF_SCHEMES[hashStr('def'+id)%DEF_SCHEMES.length];}
// A player's preferred scheme (index on his side: 0..6 offense, 0..4 defense) derives from his id —
// innate, never changes, no rng-stream consumption, no save column needed. (p.scm honored first if
// ever set explicitly.)
function playerSchemeIdx(p){return (p&&p.scm!=null)?p.scm:(hashStr((p&&p.id)||'')%schemeCount(sideOfPos((p&&p.pos)||'')));}
function sideOfPos(pos){const e=POS.find(x=>x[0]===pos);return e?e[1]:'off';}
// fit: +1 in his scheme, -1/(n-1) otherwise → E[fit]=0 under a uniform scheme draw (mean-neutral on
// each side; n = the side's scheme count, so offense's deeper menu doesn't tilt the average).
function schemeFit(p,schemeIdx){const n=schemeCount(sideOfPos((p&&p.pos)||''));return playerSchemeIdx(p)===schemeIdx?1:-1/(n-1);}
// Average fit over a side's top-11 (starters drive the scheme). Pure on the roster; in [-0.25, 1].
function rosterSchemeFit(roster,side,schemeIdx){
  const grp=(roster||[]).filter(p=>sideOfPos(p.pos)===side).sort((a,b)=>(a.so||0)-(b.so||0)).slice(0,11);
  if(!grp.length)return 0;
  return grp.reduce((t,p)=>t+schemeFit(p,schemeIdx),0)/grp.length;
}
// The mean-zero scheme rating delta for ONE direction (offTeam has the ball vs defTeam): the
// matchup edge + the offense's roster fit boost off.off; the defense's roster fit boosts def.def.
// Returns { off, def } rating-point adds. (Coach buy-in is layered on in the app's simSides.)
// Phase 51: the roster-FIT term is gone from here. Scheme aptitude is now expressed directly in each
// player's OVERALL (ovrIn weights his attributes by the system he plays in), so folding a team-level
// fit bonus in on top would count the same thing twice — once inside every rating the sim reads, and
// again as a rating delta. What survives is the pure rock-paper-scissors MATCHUP edge, which is
// about the two schemes meeting each other and not about who is on the roster.
// schemeFit/rosterSchemeFit/playerSchemeIdx remain: they are a player's PREFERENCE (what he likes to
// run, surfaced as a fogged chip), which is a different thing from what he is good at.
function schemeDelta(offTeam,defTeam){
  return { off: schemeEdge(offTeam.offScheme,defTeam.defScheme), def: 0 };
}

// generic ones cannot express what the directive asks for: a tackle who pass-sets against speed
// rushers is a different player from a guard who anchors against bull rushers, and both were "str".

// The rule is unchanged and still enforced by construction: attributes REDISTRIBUTE ability, they
// never add it. A profile is its owner's ability plus a tilt whose WEIGHTED mean is zero, so

    t[k]=(anchorOff(w,keys,k)+(arch?arch.off[k]*pur:0))*amp+(r()+r()-1)*s;
  }
  for(const k of keys){                                  // technique follows athleticism
    const basis=TECH_BASIS[k]; if(!basis)continue;
    const have=basis.filter(b=>t[b]!=null); if(!have.length)continue;
    const bm=have.reduce((s,b)=>s+t[b],0)/have.length;
    const off=anchorOff(w,keys,k);
    const bOff=have.reduce((s,b)=>s+anchorOff(w,keys,b),0)/have.length;
    t[k]=off+TECH_W*(bm-bOff)+(1-TECH_W)*(t[k]-off);     // blend DEVIATIONS, so it moves shape not level
  }
  // Centre so the WEIGHTED mean is exactly ov0. Iterated, because clamping at 40/99 eats part of the
  // correction — the residual is redistributed onto the attributes that still have room. But NOT
  // evenly: left alone the residual always lands on whatever has room, which is the physical
  // attributes, and that turned a 97-overall Pocket Passer into an 88-speed athlete. Elite players
  // converge on what is LEARNABLE, not on what is GENETIC, so physical attributes resist an upward
  // correction and the holes fill in on the coachable side first.
  const out={};
  for(const k of keys)out[k]=ov0+t[k];
  const sw=keys.reduce((s,k)=>s+w[k],0)||1;
  for(let pass=0;pass<8;pass++){
    let m=0; for(const k of keys)m+=w[k]*clamp(out[k],40,99);
    const err=ov0-m/sw;
    if(Math.abs(err)<1e-6)break;
    const share=k=>(err>0&&PHYSICAL[k])?PHYS_ABSORB:1;
    let room=0;
    for(const k of keys){const v=clamp(out[k],40,99);if((err>0&&v<99)||(err<0&&v>40))room+=w[k]*share(k);}
    if(!room)break;
    for(const k of keys){const v=clamp(out[k],40,99);if((err>0&&v<99)||(err<0&&v>40))out[k]=v+err*sw*share(k)/room;}
  }
  for(const k of keys)out[k]=clamp(Math.round(out[k]),40,99);
  out.adp=clamp(Math.round(50+(r()+r()-1)*22),20,99);    // weighted 0, so it never enters the centring
  return out;
}
// Generate a profile AND remember the shape it was drawn from. `p.arch` is the archetype name and
// `p.pur` its purity — both stored, because classifying back from the numbers is lossy (a 0.4-purity
// player genuinely reads as a tweener) and scouting wants to fog "prototypical" vs "hybrid".
function genProfile(r,ov0,pos,spread){
  const a=pickArch(r,pos);
  const pur=a?clamp(0.35+(r()+r()+r())/3*1.5,0.3,1.7):0;
  const prof=genAttrs(r,ov0,pos,spread,a,pur);
  if(a){prof.arch=a.n;prof.pur=Math.round(pur*100)/100;}
  return prof;
}
// A plain copy of a player's carried attributes. Other engine blocks read a profile through this
// rather than iterating ATTRS themselves — ATTRS is a `const`, so it does not survive the sloppy-mode
// eval the node labs use to extract a block, and a cross-block reference would only fail there.
function attrProfile(p){const o={};for(const k of posAttrs(p&&p.pos))o[k]=attrVal(p,k);return o;}
// Move a whole profile by `d` (the depth taper, development, a recruit's pedigree discount). Keeps
// the shape, moves the level — so a tapered backup is genuinely worse rather than merely different.
// `adp` is excluded: it is weighted 0 and describes portability, not quality.
function shiftAttrs(p,d){for(const k of posAttrs(p&&p.pos)){if(k==='adp')continue;p[k]=clamp(Math.round(attrVal(p,k)+d),40,99);}return p;}
// Re-centre an EXISTING profile onto a target OVR without losing its shape. Used by the v48
// migration (every legacy player keeps the ov he already had) and by roster import (a file handing us
// all-99s on a 75-overall player must not get the difference for free). Iterated for the same reason
// genAttrs is: clamping eats part of the correction.
function centerAttrs(p,target,pos){
  const w=posAttrW(pos||(p&&p.pos)), keys=Object.keys(w), sw=keys.reduce((s,k)=>s+w[k],0)||1;
  for(let pass=0;pass<8;pass++){
    let m=0; for(const k of keys)m+=w[k]*attrVal(p,k);
    const err=target-m/sw;
    if(Math.abs(err)<0.5)break;
    let room=0;
    for(const k of keys){const v=attrVal(p,k);if((err>0&&v<99)||(err<0&&v>40))room+=w[k];}
    if(!room)break;
    for(const k of keys){const v=attrVal(p,k);if((err>0&&v<99)||(err<0&&v>40))p[k]=clamp(Math.round(v+err*sw/room),40,99);}
  }
  return p;
}
// ADAPTABILITY (the one attribute weighted 0 everywhere): how much of himself a player keeps when he
// lines up somewhere else. Returns the OVR he would read at `to`, by re-centring his shared
// attributes onto the new row and discounting what does not carry over. A 90 `adp` moves anywhere; a
// 30 is a specialist who is exactly one thing.
function posFit(p,to){
  if(!p||!to||p.pos===to)return p?(p.ov||ovrBase(p)):0;
  const from=posAttrW(p.pos), tw=posAttrW(to);
  let shared=0,total=0;
  for(const k in tw){total+=tw[k];if(from[k]!=null)shared+=tw[k];}
  const cover=total?shared/total:0;                      // how much of the new job he has evidence for
  const adp=attrVal(p,'adp');
  // what he does not carry, he is assumed to be poor at, softened by adaptability
  const unknown=40+(adp-20)*0.35;
  let t=0,s=0;
  for(const k in tw){t+=tw[k]*(from[k]!=null?attrVal(p,k):unknown);s+=tw[k];}
  const raw=t/(s||1);
  // even a perfect attribute match costs something out of position; adaptability buys most of it back
  const penalty=(1-cover)*(1-(adp-20)/79)*8;
  return clamp(Math.round(raw-penalty),40,99);
}
// === ATTRIBUTE ENGINE (Phase 52) END ===

/* ---------- world generation ---------- */
function genPlayer(r,prestige,posCode){
  const cls=pick(r,CLASSES);
  const ageBase={"FR":18,"RS-FR":19,"SO":19,"RS-SO":20,"JR":20,"RS-JR":21,"SR":21,"RS-SR":22}[cls];
  const seniorPush=cls.includes("SR")?6:cls.includes("JR")?3:cls.includes("SO")?1:-1;
  const base=prestige*0.55 + ri(r,-9,9) + seniorPush + 30;
  const ov=clamp(Math.round(base),48,99);
  const pot=clamp(ov+ri(r,-3,16),ov,99);
  const stars=ov>=90?5:ov>=82?4:ov>=72?3:ov>=62?2:1;
  const tr=genTraits(r);
  // Phase 51: attributes are the ability model, so they are generated FROM the ability level and
  // `ov` is read back off them. genAttrs' tilt is weighted-mean-zero, so ovrBase == ov by
  // construction; the team's scheme then re-derives p.ov in reRateRoster once it is known.
  return Object.assign({id:'p'+Math.floor(r()*1e9).toString(36),
    fn:pick(r,FN),ln:pick(r,LN),pos:posCode,yr:cls,age:ageBase+ri(r,0,1),
    st:pick(r,STATES),stars,ov,pot,cap:false,
    mot:tr.mot,comp:tr.comp,ego:tr.ego},genProfile(r,ov,posCode));
}
function genRoster(r,prestige){
  const out=[];
  POS.forEach(([code,,n])=>{for(let i=0;i<n;i++)out.push(genPlayer(r,prestige,code));});
  // depth order: sort each position by OVR, mark order; one captain overall (best non-K/P)
  const byPos={};out.forEach(p=>{(byPos[p.pos]=byPos[p.pos]||[]).push(p);});
  Object.values(byPos).forEach(arr=>{
    arr.sort((a,b)=>b.ov-a.ov);
    arr.forEach((p,i)=>{
      // realistic depth taper: past the two-deep, backups & walk-ons fall off steeply.
      // Starters (so 0-1) are untouched, so team ratings (top-11/side) are unaffected.
      if(i>=2){
        const pen=Math.min(2+(i-2)*2.6,26);
        // Phase 51: taper the ATTRIBUTES, then read `ov` back off them. Tapering `ov` alone was the
        // bug that left deep backups carrying a speed rating up to 26 points above their overall —
        // harmless while nothing read the attributes, a walk-on full of burners once something did.
        shiftAttrs(p,-pen);
        p.ov=clamp(ovrBase(p),44,99);
        p.pot=clamp(Math.round(p.pot-pen*0.4),p.ov,99);
        p.stars=p.ov>=90?5:p.ov>=82?4:p.ov>=72?3:p.ov>=62?2:1;
      }
      p.so=i;
    });
  });
  const field=out.filter(p=>p.pos!=='K'&&p.pos!=='P').sort((a,b)=>b.ov-a.ov);
  if(field[0])field[0].cap=true; if(field[1])field[1].cap=true;
  return out;
}
// Per-position OVR boost the staff confers (coordinators buff a whole side; position
// coaches buff their group). Returns { posCode: points }.
function staffBoosts(staff){
  const m={};
  (staff||[]).forEach(c=>{if(!c.boost||!c.groups)return;c.groups.forEach(code=>{m[code]=(m[code]||0)+c.boost;});});
  return m;
}
function teamRatings(roster,staff){
  const boost=staffBoosts(staff);
  const eff=p=>clamp(p.ov+(boost[p.pos]||0),40,99);
  const grp=s=>roster.filter(p=>POS.find(x=>x[0]===p.pos)[1]===s);
  const avgTop=(arr,k)=>{const s=[...arr].sort((a,b)=>eff(b)-eff(a)).slice(0,k);return s.length?Math.round(s.reduce((t,p)=>t+eff(p),0)/s.length):60;};
  const off=avgTop(grp('off'),11), def=avgTop(grp('def'),11);
  return {off,def,ovr:Math.round((off+def)/2)};
}
// Phase 51: re-derive every player's OVERALL for the system his team runs, then the team rating off
// it. `ov` is now a READOUT of the attributes weighted by the scheme, not a stored fact about a
// player — it moves when the scheme does. Call after generation, after any roster/staff edit, and
// (the reason this exists) whenever a scheme is installed, so the roster visibly re-rates. Special
// teams have no scheme, so K/P fall through to the scheme-agnostic base.
function reRateRoster(t){
  if(!t||!t.roster)return t;
  t.roster.forEach(p=>{const s=sideOfPos(p.pos);p.ov=ovrIn(p,s==='off'?t.offScheme:s==='def'?t.defScheme:null);});
  t.ratings=teamRatings(t.roster,t.staff);
  return t;
}
// boost = small, derived from rating. Coordinators 0..2 (side-wide); position coaches 0..3.
function coachBoost(tier,rating){return tier==='coord'?clamp(Math.round((rating-55)/20),0,2):clamp(Math.round((rating-50)/15),0,3);}
function genStaff(r,prestige){
  const mk=(code,title,tier,scope,groups,mult)=>{
    const rt=clamp(Math.round(prestige*0.5+ri(r,-8,12)+35),45,95);
    const sal=Math.round((prestige*9000 + rt*7000 + ri(r,-40,40)*1000) * mult);
    return {role:code,title,name:pick(r,FN)+' '+pick(r,LN),rating:rt,salary:Math.max(90000,sal),
      years:ri(r,1,4),tier,scope,groups,boost:coachBoost(tier,rt)};
  };
  const out=[];
  COORD_ROLES.forEach(([code,title,side])=>{
    const groups=POS.filter(p=>p[1]===side).map(p=>p[0]);
    const scope={off:'OFF',def:'DEF',st:'ST'}[side];
    out.push(mk(code,title,'coord',scope,groups,code==='STC'?1.3:2.4));
  });
  POS_COACHES.forEach(([code,title,scope,groups])=>out.push(mk(code,title,'pos',scope,groups,1)));
  return out;
}
// Backfill structural fields on staff loaded from an older save (v1 had no tier/groups/boost).
function normalizeStaff(staff){
  if(!Array.isArray(staff))return staff;
  staff.forEach(c=>{
    if(c.tier)return;
    const co=COORD_ROLES.find(x=>x[0]===c.role);
    if(co){c.tier='coord';c.scope={off:'OFF',def:'DEF',st:'ST'}[co[2]];c.groups=POS.filter(p=>p[1]===co[2]).map(p=>p[0]);}
    else{const pc=POS_COACHES.find(x=>x[0]===c.role)||['','','',[]];c.tier='pos';c.scope=pc[2]||c.role;c.groups=pc[3]||[];}
    c.boost=coachBoost(c.tier,c.rating);
  });
  return staff;
}
function genWorld(seed){
  const r=rng(seed);
  const teams=TEAMS.map(([name,nick,abbr,conf,div,color])=>{
    const prestige=clamp(Math.round((CONF_BASE[conf]||45)+(BUMP[name]||0)+ri(r,-7,7)),20,98);
    const roster=genRoster(r,prestige);
    const staff=genStaff(r,prestige);
    const ratings=teamRatings(roster,staff);
    const p4=["SEC","Big Ten","ACC","Big 12"].includes(conf);
    const fac={stadium:clamp(Math.round(prestige/11)+ri(r,-1,1),1,10),
      strength:clamp(Math.round(prestige/11)+ri(r,-1,1),1,10),
      training:clamp(Math.round(prestige/12)+ri(r,-1,1),1,10),
      academics:clamp(ri(r,3,9),1,10),
      nil:clamp(Math.round(prestige/10)+ri(r,-2,1),1,10),
      scouting:clamp(Math.round(prestige/11)+ri(r,-1,1),1,10)};   // Phase 33: drives recruiting points/budget
    const revenue=Math.round((p4?55:18)*1e6 + prestige*420000 + ri(r,-6,6)*1e6);
    const payroll=staff.reduce((t,s)=>t+s.salary,0);
    const budget=Math.round(revenue*0.18 + ri(r,-3,4)*1e6);
    const id=abbr.toLowerCase().replace(/[^a-z0-9]/g,'');
    return {id,name,nick,abbr,conf,div,color,
      homeState:TEAM_STATE[abbr]||pick(r,STATES),
      offScheme:defaultOffScheme(id),defScheme:defaultDefScheme(id),    // Phase 21 — mutable; player can re-install
      prestige,roster,ratings,fac,revenue,budget,staff,payroll,legends:[],
      facilityDebt:Math.round(ri(r,0,prestige>70?40:12)*1e6)};
  });
  // Phase 51: OVERALL is scheme-weighted, and the scheme is only assigned inside the map above — so
  // every roster is re-rated for the system it actually runs before anything ranks on it.
  teams.forEach(reRateRoster);
  // rankings
  const sorted=[...teams].sort((a,b)=>b.ratings.ovr-a.ratings.ovr);
  sorted.forEach((t,i)=>t.natRank=i+1);
  const byConf={},byDiv={};
  teams.forEach(t=>{(byConf[t.conf]=byConf[t.conf]||[]).push(t);
    const dk=t.conf+'|'+(t.div||'');(byDiv[dk]=byDiv[dk]||[]).push(t);});
  Object.values(byConf).forEach(a=>{a.sort((x,y)=>y.ratings.ovr-x.ratings.ovr);a.forEach((t,i)=>t.confRank=i+1);});
  Object.values(byDiv).forEach(a=>{a.sort((x,y)=>y.ratings.ovr-x.ratings.ovr);a.forEach((t,i)=>t.divRank=i+1);});
  return {teams};
}

/* ---------- save system (localStorage, 3 slots) ----------
   Phase 9 storage codec: rosters (98% of a ~2 MB save) are stored COLUMNAR — the 15 core player
   fields become a flat tuple instead of repeating field names 11k times, with any sparse extras
   (gs/dev/honors/promise/fromRecruit) kept in a side object. Pure serialization (no seed/genWorld
   dependency, so it's deploy-safe and correct-by-construction); decode is the exact inverse. Old
   saves (no `_sv` tag) decode as themselves. Cuts a fresh save ~40%. */
const SLOTS=[1,2,3];
const slotKey=n=>'sideline_slot_'+n;
// Phase 52 (codec _sv:2): a player now carries ~12 attributes out of a 25-word vocabulary, and WHICH
// twelve depends on his position. Adding all 25 to a fixed column list would give every one of ~11.3k
// players thirteen mostly-null columns; leaving them out entirely would dump them in the sparse `ext`
// object, which repeats the key name per player and is far worse. So they ride in ONE packed array
// `at`, ordered by that position's own attribute list — self-describing from `p.pos`, dense, no nulls.
const SAVE_PKEYS_V1=['id','fn','ln','pos','yr','age','st','stars','ov','pot','cap','spd','str','awr','so','mot','comp','ego','agi','bal','dur'];
const SAVE_PKEYS=['id','fn','ln','pos','yr','age','st','stars','ov','pot','cap','so','mot','comp','ego','at','arch','pur'];
function encRoster(roster){
  return roster.map(p=>{
    const ak=posAttrs(p.pos), inAk={}; ak.forEach(k=>inAk[k]=1);
    const core=SAVE_PKEYS.map(k=>k==='at'?ak.map(x=>p[x]!=null?p[x]:null):p[k]);
    let ext=null;for(const k in p){if(inAk[k]||SAVE_PKEYS.indexOf(k)>=0)continue;(ext=ext||{})[k]=p[k];}
    return ext?[core,ext]:[core];
  });
}
// `sv` is the codec version the blob was written with. A v1 blob decodes on the OLD column list and
// keeps its legacy spd/str/awr — migrateState's v48 step is what turns those into a real profile.
function decRoster(enc,sv){
  const keys=(sv||1)>=2?SAVE_PKEYS:SAVE_PKEYS_V1;
  return (enc||[]).map(e=>{
    const p={};keys.forEach((k,i)=>p[k]=e[0][i]);
    if(e[1])Object.assign(p,e[1]);
    if(Array.isArray(p.at)){const ak=posAttrs(p.pos);ak.forEach((k,i)=>{if(p.at[i]!=null)p[k]=p.at[i];});}
    delete p.at;
    // `arch`/`pur` are SPARSE columns — a player who predates archetypes has neither. JSON turns an
    // undefined array slot into null, so they would decode as real null-valued keys and break the
    // exactness of the round-trip. Drop them when empty rather than inventing them.
    if(p.arch==null)delete p.arch; if(p.pur==null)delete p.pur;
    return p;
  });
}
// Phase 17: the recruit pool is now the full national class (~3,400), so it serializes columnar too —
// scalar fields become a flat tuple, the sparse extras (prefs[], iv{}, promise, alumni) ride in a side
// object (the transient _flipped tag is dropped). Mirrors encRoster/decRoster exactly.
const RECRUIT_PKEYS_V1=['id','fn','ln','pos','st','stars','ov','pot','spd','str','awr','mot','comp','rebel','scout','committedTo','signed','offered','visited','ego','agi','bal','dur','svc'];
const RECRUIT_PKEYS=['id','fn','ln','pos','st','stars','ov','pot','mot','comp','rebel','scout','committedTo','signed','offered','visited','ego','svc','at','arch','pur'];
function encPool(pool){
  return pool.map(p=>{
    const ak=posAttrs(p.pos), inAk={}; ak.forEach(k=>inAk[k]=1);
    const core=RECRUIT_PKEYS.map(k=>k==='at'?ak.map(x=>p[x]!=null?p[x]:null):p[k]);
    let ext=null;for(const k in p){if(k==='_flipped'||inAk[k]||RECRUIT_PKEYS.indexOf(k)>=0)continue;(ext=ext||{})[k]=p[k];}
    return ext?[core,ext]:[core];
  });
}
function decPool(enc,sv){
  const keys=(sv||1)>=2?RECRUIT_PKEYS:RECRUIT_PKEYS_V1;
  return (enc||[]).map(e=>{
    const p={};keys.forEach((k,i)=>p[k]=e[0][i]);
    if(e[1])Object.assign(p,e[1]);
    if(Array.isArray(p.at)){const ak=posAttrs(p.pos);ak.forEach((k,i)=>{if(p.at[i]!=null)p[k]=p.at[i];});}
    delete p.at;
    if(p.arch==null)delete p.arch; if(p.pur==null)delete p.pur;
    return p;
  });
}
// Encode a live state for storage (compact). Never mutates the live state (shallow copies + new
// arrays). Falls back to the full state if anything unexpected happens, so a save is never lost.
function encodeState(state){
  try{
    const teams=state.world.teams.map(t=>{const o=Object.assign({},t);o._cr=encRoster(t.roster);delete o.roster;return o;});
    const out=Object.assign({},state,{world:{teams},_sv:2});
    if(state.recruiting&&state.recruiting.pool){      // Phase 17: columnar-encode the (large) recruit pool
      out.recruiting=Object.assign({},state.recruiting,{_cp:encPool(state.recruiting.pool)});
      delete out.recruiting.pool;
    }
    return out;
  }catch(e){return state;}
}
function decodeState(s){
  if(!s||!s._sv)return s;            // old/full save → use as-is
  const teams=s.world.teams.map(t=>{const o=Object.assign({},t);o.roster=decRoster(t._cr,s._sv);delete o._cr;return o;});
  const out=Object.assign({},s,{world:{teams}});delete out._sv;
  if(out.recruiting&&out.recruiting._cp){             // decode the columnar recruit pool (older saves stored pool plainly)
    out.recruiting=Object.assign({},out.recruiting,{pool:decPool(out.recruiting._cp,s._sv)});
    delete out.recruiting._cp;
  }
  return out;
}
function readSlot(n){try{const raw=localStorage.getItem(slotKey(n));return raw?JSON.parse(raw):null;}catch(e){return null;}}
function writeSlot(n,state){
  state.lastSaved=Date.now();
  const team=state.world.teams.find(t=>t.id===state.teamId);
  const meta={coach:state.coach.first+' '+state.coach.last,team:team?team.name:'—',
    teamAbbr:team?team.abbr:'',color:team?team.color:'#c9a227',
    week:state.week,phase:state.phase,savedAt:state.lastSaved,
    careerId:cloudCareerId(state)};   // Phase 47: the cloud's identity for this career
  try{localStorage.setItem(slotKey(n),JSON.stringify({meta,state:encodeState(state)}));}
  catch(e){toast('Save failed — storage full');return false;}
  if(state===S)cloudQueue();          // Phase 47: local write first, cloud push debounced behind it
  return true;
}
function deleteSlot(n){localStorage.removeItem(slotKey(n));}

/* ============================================================
   CLOUD SAVES (Phase 47) — continue a career on any device
   ============================================================
   localStorage stays the source of truth and the fast path: nothing here can slow down or
   block a save. A write to a slot queues a debounced push; the cloud copy is a mirror the
   other device pulls from. With no endpoint configured the whole layer is inert, so the
   game is still a pure static file that works offline (see infra/README.md to deploy the
   backend: Lambda Function URL → DynamoDB slot index + private S3 blob).

   Identity is a "career code" — 60 bits minted in this browser, typed once on the other
   device. No accounts, no email, matching the app's no-backend-account rule.

   Concurrency: every career carries a monotonic `rev`. This device remembers the rev it
   last pushed/pulled (its watermark) plus the `lastSaved` it had then; comparing that
   triple — watermark, local save, cloud head — is the whole sync decision, and it's pure
   (cloudResolve), so the node lab can walk the entire table offline. */
const CLOUD_ENDPOINT='';                 // bake your Function URL in here to skip per-device setup
const CLOUD_CFG_KEY='sideline_cloud';
const CLOUD_DEBOUNCE=5000;               // ms of quiet after the last save before we push

// === CLOUD ENGINE (Phase 47) START ===
// Pure: code minting/normalizing, career identity, progress comparison, and the sync
// decision. No DOM, no network, no S — everything that decides what happens lives here.
const CLOUD_ALPHA='0123456789ABCDEFGHJKMNPQRSTVWXYZ';   // Crockford base32 — no I/L/O/U to misread
const CLOUD_CODE_LEN=12;                                 // 12 chars × 5 bits = 60 bits of key
const CLOUD_PHASE_ORD={'Preseason':0,'Regular Season':1,'Conference Championships':2,'Postseason':3,'Offseason':4,'Retired':5};
function cloudMintCode(rand){let s='';for(let i=0;i<CLOUD_CODE_LEN;i++)s+=CLOUD_ALPHA[Math.floor(rand()*CLOUD_ALPHA.length)%CLOUD_ALPHA.length];return s;}
// Accept anything a human might type back: lowercase, spaces, the SIDE- prefix, the dashes,
// and the classic base32 lookalikes (I/L→1, O→0, U→V).
function cloudNormCode(raw){
  let s=String(raw==null?'':raw).toUpperCase().replace(/[^0-9A-Z]/g,'');
  if(s.length===CLOUD_CODE_LEN+4&&s.slice(0,4)==='SIDE')s=s.slice(4);
  return s.replace(/[IL]/g,'1').replace(/O/g,'0').replace(/U/g,'V');
}
function cloudValidCode(raw){
  const s=cloudNormCode(raw);
  return (s.length===CLOUD_CODE_LEN&&s.split('').every(c=>CLOUD_ALPHA.indexOf(c)>=0))?s:null;
}
function cloudFormatCode(code){const s=cloudNormCode(code);return 'SIDE-'+(s.match(/.{1,4}/g)||[]).join('-');}
// A career's cloud id, derived from the state itself (never stored, never re-minted) so the
// same career keeps one identity across devices, slots and reinstalls. Lowercase+dash only.
function cloudCareerId(state){
  return 'c'+Number(state&&state.createdAt||0).toString(36)+'-'+((state&&state.seed||0)>>>0).toString(36);
}
// How far along a save is, as one sortable number — used to say "Wk 8 vs Wk 5" in a conflict.
function cloudProgress(meta){
  if(!meta)return -1;
  const ph=CLOUD_PHASE_ORD[meta.phase];
  return (meta.year||0)*1000+(ph==null?1:ph)*100+(meta.week||0);
}
// The sync decision.
//   mark  = this device's watermark: {rev, savedAt} it last pushed/pulled, or null
//   local = the save in this browser right now: {savedAt}, or null
//   cloud = the server's head: {rev, updatedAt, meta}, or null
function cloudResolve(mark,local,cloud){
  if(!local&&!cloud)return {action:'none',why:'nothing to sync'};
  if(local&&!cloud)return {action:'push',why:'not backed up yet'};
  if(!local&&cloud)return {action:'pull',why:'only in the cloud'};
  const rev=mark?mark.rev:0;
  const dirty=!mark||(local.savedAt||0)>(mark.savedAt||0);
  if(rev>cloud.rev)return {action:'push',why:'cloud is behind this device'};
  if(rev===cloud.rev)return dirty?{action:'push',why:'local changes not uploaded'}:{action:'insync',why:'up to date'};
  return dirty?{action:'conflict',why:'both sides moved on'}:{action:'pull',why:'another device is ahead'};
}
// === CLOUD ENGINE (Phase 47) END ===

/* ---------- config (endpoint + code + per-career watermarks) ---------- */
function cloudCfg(){
  let c={};try{c=JSON.parse(localStorage.getItem(CLOUD_CFG_KEY)||'null')||{};}catch(e){c={};}
  return {endpoint:c.endpoint||CLOUD_ENDPOINT||'',code:c.code||'',auto:c.auto!==false,
    device:c.device||(/Mobi|Android|iPhone/i.test(navigator.userAgent)?'Phone':'Desktop'),
    careers:c.careers||{}};
}
function cloudSetCfg(patch){
  const c=Object.assign(cloudCfg(),patch);
  try{localStorage.setItem(CLOUD_CFG_KEY,JSON.stringify(c));}catch(e){}
  return c;
}
function cloudLinked(){const c=cloudCfg();return !!(c.endpoint&&c.code);}
function cloudMark(id){return cloudCfg().careers[id]||null;}
function cloudSetMark(id,mark){
  const c=cloudCfg(),m=Object.assign({},c.careers);
  if(mark)m[id]=mark;else delete m[id];
  cloudSetCfg({careers:m});
}
// Storage only — deliberately never touches UI, because the ?reset=1 hook calls this before
// `let UI` is initialized (a TDZ reference there would take down the whole boot).
function cloudDisconnect(){try{localStorage.removeItem(CLOUD_CFG_KEY);}catch(e){}}

/* ---------- status (what the Cloud screen + menu line show) ---------- */
const CLOUD_STATUS={state:'idle',msg:'',at:0};   // idle|pending|syncing|ok|offline|error|conflict
function cloudSetStatus(state,msg){
  CLOUD_STATUS.state=state;CLOUD_STATUS.msg=msg||'';CLOUD_STATUS.at=Date.now();
  if(UI.view==='cloud')render();
}
const CLOUD_STATUS_LABEL={idle:'Connected',pending:'Changes queued',syncing:'Syncing…',ok:'In sync',
  offline:'Offline — will retry',error:'Sync failed',conflict:'Needs a choice'};
// Entry-point buttons only earn a status suffix when something is actually happening.
function cloudStatusSuffix(){
  if(!cloudLinked())return '';
  return CLOUD_STATUS.state==='idle'?'':' — '+(CLOUD_STATUS_LABEL[CLOUD_STATUS.state]||'');
}

/* ---------- wire format: gzip + base64 (CompressionStream, with a raw fallback) ---------- */
function cloudB64(u8){let s='';const CH=0x8000;for(let i=0;i<u8.length;i+=CH)s+=String.fromCharCode.apply(null,u8.subarray(i,i+CH));return btoa(s);}
function cloudUnb64(b64){const bin=atob(b64),u8=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u8[i]=bin.charCodeAt(i);return u8;}
async function cloudPack(state){
  const json=JSON.stringify({v:1,state:encodeState(state)});   // same columnar codec as a slot
  if(typeof CompressionStream==='function'){
    const buf=await new Response(new Blob([json]).stream().pipeThrough(new CompressionStream('gzip'))).arrayBuffer();
    return {enc:'gz',blob:cloudB64(new Uint8Array(buf))};
  }
  return {enc:'raw',blob:cloudB64(new TextEncoder().encode(json))};
}
async function cloudUnpack(enc,b64){
  const bytes=cloudUnb64(b64);
  const text=enc==='gz'
    ? await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'))).text()
    : new TextDecoder().decode(bytes);
  const o=JSON.parse(text);
  return migrateState(decodeState(o&&o.state?o.state:o));
}
// The little card the other device's Load screen renders before it downloads anything.
function cloudMetaFor(state){
  const t=state.world.teams.find(x=>x.id===state.teamId);
  return {coach:state.coach.first+' '+state.coach.last,team:t?t.name:'—',teamAbbr:t?t.abbr:'',
    color:t?t.color:'#c9a227',week:state.week,phase:state.phase,year:state.year,
    savedAt:state.lastSaved||Date.now(),wins:t&&t.rec?t.rec.w:0,losses:t&&t.rec?t.rec.l:0};
}

/* ---------- transport ---------- */
async function cloudFetch(path,opts){
  const c=cloudCfg();
  if(!c.endpoint)throw new Error('No cloud endpoint set');
  if(!c.code)throw new Error('No career code set');
  const r=await fetch(c.endpoint.replace(/\/+$/,'')+path,Object.assign({},opts,{
    headers:Object.assign({authorization:'Bearer '+c.code,'content-type':'application/json'},(opts&&opts.headers)||{})}));
  let body=null;try{body=await r.json();}catch(e){}
  if(!r.ok){const e=new Error((body&&(body.message||body.error))||('HTTP '+r.status));e.status=r.status;e.body=body;throw e;}
  return body;
}
async function cloudList(){const r=await cloudFetch('/v1/careers');return (r&&r.careers)||[];}
async function cloudPullCareer(id){
  const head=await cloudFetch('/v1/careers/'+encodeURIComponent(id));
  return {head,state:await cloudUnpack(head.enc,head.blob)};
}
async function cloudPushCareer(state,force){
  const id=cloudCareerId(state),mark=cloudMark(id);
  const savedAt=state.lastSaved||Date.now();       // captured BEFORE packing: a save during the
  const pk=await cloudPack(state);                 // upload leaves the watermark stale → re-push
  const r=await cloudFetch('/v1/careers/'+encodeURIComponent(id),{method:'PUT',body:JSON.stringify({
    baseRev:force?0:(mark?mark.rev:0),force:!!force,meta:cloudMetaFor(state),
    enc:pk.enc,blob:pk.blob,device:cloudCfg().device})});
  cloudSetMark(id,{rev:r.rev,savedAt});
  return r;
}
async function cloudRemove(id){await cloudFetch('/v1/careers/'+encodeURIComponent(id),{method:'DELETE'});cloudSetMark(id,null);}
// Refresh the cached list the Load + Cloud screens read. Never throws — offline is normal.
async function cloudRefresh(){
  if(!cloudLinked())return null;
  try{UI.cloudCareers=await cloudList();UI.cloudCareersAt=Date.now();
    if(CLOUD_STATUS.state==='error'||CLOUD_STATUS.state==='offline')cloudSetStatus('idle','');
    return UI.cloudCareers;}
  catch(e){cloudSetStatus(navigator.onLine===false?'offline':'error',e.message);return null;}
}

/* ---------- the debounced push queue ---------- */
let _cloudTimer=null,_cloudBusy=false,_cloudAgain=false,_cloudFails=0;
function cloudQueue(){
  const c=cloudCfg();
  if(!S||!c.endpoint||!c.code||!c.auto)return;
  if(CLOUD_STATUS.state==='conflict')return;              // frozen until the user picks a side
  clearTimeout(_cloudTimer);_cloudTimer=setTimeout(()=>cloudFlush(),CLOUD_DEBOUNCE);
  cloudSetStatus('pending','changes queued');
}
async function cloudFlush(manual){
  clearTimeout(_cloudTimer);_cloudTimer=null;
  if(!S||!cloudLinked())return null;
  if(!manual&&CLOUD_STATUS.state==='conflict')return null;
  if(_cloudBusy){_cloudAgain=true;return null;}
  _cloudBusy=true;cloudSetStatus('syncing','uploading…');
  try{
    const r=await cloudPushCareer(S);
    _cloudFails=0;cloudSetStatus('ok','saved to cloud');
    if(UI.cloudCareers)UI.cloudCareers=null;              // list is stale now; refetch on demand
    if(_cloudAgain){_cloudAgain=false;cloudQueue();}
    return r;
  }catch(e){
    if(e.status===409){                                   // another device moved first
      cloudSetStatus('conflict','another device is ahead');
      cloudConflictSheet(e.body||{});
      return null;
    }
    _cloudFails++;
    cloudSetStatus(navigator.onLine===false?'offline':'error',e.message||'sync failed');
    if(_cloudFails<6)_cloudTimer=setTimeout(()=>cloudFlush(),Math.min(60000,CLOUD_DEBOUNCE*Math.pow(2,_cloudFails)));
    else if(manual)toast('Sync failed — '+(e.message||'try again later'));
    return null;
  }finally{_cloudBusy=false;}
}
// Status for one local slot (what badge the Load screen paints), or null when cloud is off.
function cloudSlotStatus(slot){
  if(!cloudLinked()||!slot||!slot.state)return null;
  const id=(slot.meta&&slot.meta.careerId)||cloudCareerId(slot.state);
  const c=(UI.cloudCareers||[]).find(x=>x.careerId===id)||null;
  return Object.assign({careerId:id,cloud:c},
    cloudResolve(cloudMark(id),{savedAt:slot.state.lastSaved||(slot.meta&&slot.meta.savedAt)||0},
      c?{rev:c.rev,updatedAt:c.updatedAt,meta:c.meta}:null));
}

/* ---------- flows ---------- */
// A push lost the race. Show both saves and let the coach pick — never silently overwrite.
function cloudConflictSheet(head){
  const body=el('div');
  body.append(el('div','hint','This career was saved on another device after your last sync. Both versions still exist — choose which one continues.'));
  const mine=cloudMetaFor(S),theirs=head.meta||{};
  body.append(cloudCompareCard('On this device',mine,'Their save is '+(cloudProgress(theirs)>cloudProgress(mine)?'further along':'behind')));
  body.append(cloudCompareCard('In the cloud'+(head.device?' ('+head.device+')':''),theirs,''));
  const keepCloud=el('button','btn','Continue from the cloud');keepCloud.style.marginTop='14px';
  keepCloud.onclick=async()=>{
    closeSheet();toast('Downloading…');
    try{
      const id=cloudCareerId(S),{head:h,state}=await cloudPullCareer(id);
      const n=findSlotFor(S)||cloudFirstFreeSlot()||1;
      writeSlot(n,state);cloudSetMark(id,{rev:h.rev,savedAt:state.lastSaved});
      S=state;cloudSetStatus('ok','using the cloud save');UI.view='home';render();toast('Loaded the cloud save');
    }catch(e){cloudSetStatus('error',e.message);toast('Download failed — '+e.message);}
  };
  const keepMine=el('button','btn line','Keep this device’s save');keepMine.style.marginTop='9px';
  keepMine.onclick=async()=>{
    closeSheet();cloudSetStatus('syncing','overwriting the cloud…');
    try{await cloudPushCareer(S,true);cloudSetStatus('ok','cloud overwritten');toast('Cloud updated from this device');}
    catch(e){cloudSetStatus('error',e.message);toast('Upload failed — '+e.message);}
  };
  const later=el('button','btn ghost','Decide later');later.style.marginTop='9px';later.onclick=closeSheet;
  body.append(keepMine,later);
  openSheet('Two versions of this career',body);
}
function cloudCompareCard(title,meta,note){
  const c=el('div','card');c.style.marginTop='10px';
  const rec=(meta.wins!=null&&meta.losses!=null)?meta.wins+'–'+meta.losses:'';
  c.innerHTML=`<div class="row spread"><div class="cond" style="font-weight:700">${title}</div>
    <div class="meta dim">${meta.savedAt?timeAgo(meta.savedAt):''}</div></div>
    <div class="meta">${meta.team||'—'} · ${meta.year||''} ${meta.phase||''}${meta.week?' · Wk '+meta.week:''}${rec?' · '+rec:''}</div>
    ${note?'<div class="meta dim">'+note+'</div>':''}`;
  return c;
}
function cloudFirstFreeSlot(){for(const n of SLOTS)if(!readSlot(n))return n;return null;}
function cloudPickSlotSheet(title,sub,onPick){
  const body=el('div');body.append(el('div','hint',sub));
  SLOTS.forEach(n=>{
    const ex=readSlot(n);
    const b=el('button','btn '+(ex?'line':'ghost'),'Slot '+n+(ex?' — replace '+ex.meta.team:' — empty'));
    b.style.marginTop='9px';
    b.onclick=()=>{closeSheet();onPick(n);};
    body.append(b);
  });
  const cancel=el('button','btn ghost','Cancel');cancel.style.marginTop='14px';cancel.onclick=closeSheet;
  body.append(cancel);openSheet(title,body);
}
// Download a cloud career into a local slot (and load it if asked).
async function cloudDownload(careerId,slotNo,thenLoad){
  toast('Downloading…');cloudSetStatus('syncing','downloading…');
  try{
    const {head,state}=await cloudPullCareer(careerId);
    writeSlot(slotNo,state);                       // stamps a fresh lastSaved…
    cloudSetMark(careerId,{rev:head.rev,savedAt:state.lastSaved});   // …so mark it clean after
    cloudSetStatus('ok','downloaded');
    UI.cloudCareers=null;
    if(thenLoad){S=state;UI.view='home';render();toast('Career loaded');}
    else{render();toast('Saved to slot '+slotNo);}
  }catch(e){cloudSetStatus('error',e.message);toast('Download failed — '+e.message);}
}
// Loading a slot the cloud has moved past: offer the newer copy instead of silently rewinding.
function cloudLoadSlot(n,slot){
  const open=()=>{S=migrateState(decodeState(slot.state));UI.view='home';render();};
  const st=cloudSlotStatus(slot);
  if(!st||st.action!=='pull'||!st.cloud){open();return;}
  const body=el('div');
  body.append(el('div','hint','A newer save for this career is in the cloud.'));
  body.append(cloudCompareCard('In the cloud'+(st.cloud.device?' ('+st.cloud.device+')':''),st.cloud.meta||{},''));
  body.append(cloudCompareCard('On this device',slot.meta||{},''));
  const go=el('button','btn','Continue from the cloud');go.style.marginTop='14px';
  go.onclick=()=>{closeSheet();cloudDownload(st.careerId,n,true);};
  const local=el('button','btn line','Open this device’s save');local.style.marginTop='9px';
  local.onclick=()=>{closeSheet();open();};
  body.append(go,local);
  openSheet('Continue where you left off?',body);
}

/* ---------- test hooks: deterministic seed / slot reset via URL ----------
   ?seed=N  → New Game uses seed N (reproducible world for screenshots/assertions)
   ?reset=1 → clear all save slots on load (clean state)
   Rows carry data-id (player id / coach role / team id); nav+tabs carry data-tid;
   #app carries data-screen / data-tab. S, UI, controlled() are global for evaluate(). */
const _QS=new URLSearchParams(location.search);
const TEST_SEED=_QS.has('seed')?((parseInt(_QS.get('seed'),10)||0)>>>0):null;
if(_QS.get('reset')==='1'){SLOTS.forEach(n=>deleteSlot(n));cloudDisconnect();}   // Phase 47: unlink too, so a test run is hermetic

/* ---------- live game state ---------- */
let S=null;            // current state
let UI={view:'menu',tab:'roster',newgame:null};

function controlled(){return S.world.teams.find(t=>t.id===S.teamId);}
function applyAccent(team){
  const root=document.documentElement.style;
  if(team){root.setProperty('--accent',team.color);root.setProperty('--accent-ink',textOn(team.color));
    document.querySelector('meta[name=theme-color]').setAttribute('content','#0d0f12');}
  else{root.setProperty('--accent','#c9a227');root.setProperty('--accent-ink','#0d0f12');}
}

/* ============================================================
   RENDER
   ============================================================ */
function render(){
  const app=$('#app');app.innerHTML='';
  app.dataset.screen=UI.view; app.dataset.tab=UI.tab||'';   // test hooks
  if(UI.view==='menu')         return renderMenu(app);
  if(UI.view==='load')         return renderLoad(app);
  if(UI.view==='cloud')        return renderCloud(app);   // Phase 47 — works with or without a live career
  if(UI.view==='newgame')      return renderNewGame(app);
  if(UI.view==='browse_pick')  return renderBrowse(app,true);
  // in-game views
  applyAccent(controlled());
  if(S.phase==='Retired') return renderRetired(app);   // Phase 19c: career over → the retrospective
  if(UI.view==='game') return renderGame(app);   // full-screen, no bottom nav (commit to exit)
  if(UI.view==='home') renderHome(app);
  if(UI.view==='team') renderTeam(app);
  if(UI.view==='recruit') renderRecruiting(app);
  if(UI.view==='portal') renderPortal(app);
  if(UI.view==='camp') renderCamp(app);
  if(UI.view==='media') renderMedia(app);
  if(UI.view==='records') renderRecords(app);
  if(UI.view==='season') renderSeason(app);
  if(UI.view==='browse') renderBrowse(app,false);
  if(UI.view==='program') renderProgram(app);
  renderNav(app);
}

/* ---------- load / slot manager ---------- */
// Phase 47: each slot also carries its cloud standing, and any career that lives only in the
// cloud (started on another device) shows up underneath, one tap from being downloaded.
function cloudBadge(st){
  if(!st)return null;
  const txt={insync:'☁ In sync',push:'☁ Not uploaded',pull:'☁ Newer in cloud',conflict:'☁ Two versions',none:''}[st.action]||'';
  if(!txt)return null;
  const b=el('span','meta');b.dataset.tid='cloud-badge';b.dataset.action=st.action;
  b.style.cssText='font-weight:700;'+(st.action==='insync'?'opacity:.65':'color:var(--accent)');
  b.textContent=txt;return b;
}
function renderLoad(app){
  applyAccent(null);
  const v=el('div','view');
  v.append(headerBar('Save Slots','Load, overwrite, or delete',()=>{UI.view='menu';render();}));
  const cbtn=el('button','btn line',cloudLinked()?'Cloud saves'+cloudStatusSuffix():'Set up cloud saves');
  cbtn.dataset.tid='load-cloud';
  cbtn.onclick=()=>{UI.cloudBack='load';UI.view='cloud';render();};
  v.append(cbtn);
  const localIds=[];
  SLOTS.forEach(n=>{
    const slot=readSlot(n);
    const c=el('div','card');
    if(slot){
      const m=slot.meta,st=cloudSlotStatus(slot);
      if(st)localIds.push(st.careerId);
      c.innerHTML=`<div class="row spread">
        <div class="row">
          <div class="crest" style="background:${m.color};color:${textOn(m.color)}">${m.teamAbbr}</div>
          <div><div class="cond" style="font-size:18px;font-weight:700">${m.team}</div>
          <div class="meta">${m.coach} · ${m.phase} · Wk ${m.week}</div>
          <div class="meta dim">Saved ${timeAgo(m.savedAt)}</div></div>
        </div></div>`;
      const badge=cloudBadge(st);
      if(badge){const r=el('div');r.style.marginTop='6px';r.append(badge);c.append(r);}
      const br=el('div','btn-row');
      const load=el('button','btn sm','Load');
      load.onclick=()=>cloudLoadSlot(n,slot);
      const del=el('button','btn sm danger','Delete');
      del.onclick=()=>cloudDeleteSlotSheet(n,slot,st);
      br.append(load,del);c.append(br);
    }else{
      c.innerHTML=`<div class="empty" style="padding:18px">Slot ${n} — empty</div>`;
    }

  });
  // careers that exist only in the cloud
  const remote=(UI.cloudCareers||[]).filter(x=>localIds.indexOf(x.careerId)<0);
  if(cloudLinked()&&remote.length){

// One cloud career, rendered the same on the Load screen and the Cloud screen.
function cloudCareerCard(x,withDownload){
  const m=x.meta||{},c=el('div','card');c.dataset.id=x.careerId;
  const rec=(m.wins!=null&&m.losses!=null)?' · '+m.wins+'–'+m.losses:'';
  c.innerHTML=`<div class="row">
      <div class="crest" style="background:${m.color||'#c9a227'};color:${textOn(m.color||'#c9a227')}">${m.teamAbbr||'??'}</div>
      <div><div class="cond" style="font-size:18px;font-weight:700">${m.team||'—'}</div>
      <div class="meta">${m.coach||''} · ${m.year||''} ${m.phase||''}${m.week?' · Wk '+m.week:''}${rec}</div>
      <div class="meta dim">${x.device?x.device+' · ':''}rev ${x.rev} · ${x.updatedAt?timeAgo(x.updatedAt):''}${x.size?' · '+Math.round(x.size/1024)+' KB':''}</div></div>
    </div>`;
  const br=el('div','btn-row');
  if(withDownload){
    const dl=el('button','btn sm','Download');dl.dataset.tid='cloud-download';
    dl.onclick=()=>{
      const free=cloudFirstFreeSlot();
      if(free)cloudDownload(x.careerId,free,false);
      else cloudPickSlotSheet('Download to which slot?','All three slots are full — pick one to replace.',n=>cloudDownload(x.careerId,n,false));
    };
    br.append(dl);
  }
  const rm=el('button','btn sm danger','Remove');
  rm.onclick=()=>confirmSheet('Remove from the cloud?',(m.team||'This career')+' stays on any device that already has it.',
    async()=>{try{await cloudRemove(x.careerId);UI.cloudCareers=null;await cloudRefresh();render();toast('Removed from the cloud');}
      catch(e){toast('Failed — '+e.message);}});
  br.append(rm);c.append(br);
  return c;
}
// Deleting a local slot: when the career is also in the cloud, "delete" is two different acts.
function cloudDeleteSlotSheet(n,slot,st){
  const m=slot.meta;
  if(!st||!st.cloud){
    confirmSheet('Delete this career?',m.team+' — '+m.coach,()=>{deleteSlot(n);toast('Slot deleted');render();});
    return;
  }

/* ---------- roster import / template ---------- */
const TEMPLATE={format:"sideline-roster",version:1,teams:[{
  name:"Example State",nickname:"Mockingbirds",abbr:"EXST",conference:"SEC",division:"",color:"#1b5e20",
  prestige:74,facilities:{stadium:8,strength:7,training:7,academics:6,nil:7,scouting:7},
  // Phase 51: all six attributes are OPTIONAL. Supply a subset and the rest are generated from the
  // player's identity; supply none and he gets a full profile. Whatever you give is re-centred so its
  // weighted mean equals `overall`, so an all-90s profile on a 75-overall player is still a 75.
  players:[{first:"John",last:"Smith",pos:"QB",year:"JR",age:21,homeState:"TX",stars:4,overall:88,potential:92,
    spd:80,agi:78,str:70,awr:86,bal:82,dur:74,captain:true}]}]};
function downloadTemplate(){
  const blob=new Blob([JSON.stringify(TEMPLATE,null,2)],{type:'application/json'});
  const a=el('a');a.href=URL.createObjectURL(blob);a.download='sideline-roster-template.json';a.click();
  toast('Template downloaded');
}
function importRosters(ng){
  const inp=el('input');inp.type='file';inp.accept='.json,application/json';
  inp.onchange=()=>{const f=inp.files[0];if(!f)return;const rd=new FileReader();
    rd.onload=()=>{try{const data=JSON.parse(rd.result);const n=mergeRosters(ng,data);
      toast('Imported '+n+' team'+(n===1?'':'s'));render();}catch(e){toast('Invalid file: '+e.message);}};
    rd.readAsText(f);};
  inp.click();
}
function mergeRosters(ng,data){
  if(!data||!Array.isArray(data.teams))throw new Error('missing teams[]');
  ensureWorld(ng);let count=0;
  data.teams.forEach(td=>{
    const id=(td.abbr||td.name||'').toLowerCase().replace(/[^a-z0-9]/g,'');if(!id)return;
    let t=ng.world.teams.find(x=>x.id===id||x.name.toLowerCase()===String(td.name||'').toLowerCase());
    const roster=(td.players||[]).map(p=>normPlayer(p));
    if(roster.length){const byPos={};roster.forEach(p=>(byPos[p.pos]=byPos[p.pos]||[]).push(p));
      Object.values(byPos).forEach(a=>{a.sort((x,y)=>y.ov-x.ov);a.forEach((p,i)=>p.so=i);});}
    if(t){ // override existing
      if(roster.length){t.roster=roster;reRateRoster(t);}   // Phase 51: imported players rate for THIS team's system
      if(td.facilities)Object.assign(t.fac,td.facilities);
      if(td.prestige!=null)t.prestige=td.prestige;
      if(td.color)t.color=td.color;
    }else{ // brand new team
      const staff=genStaff(rng(id.length*7+1),td.prestige||60);
      t={id,name:td.name||id,nick:td.nickname||'',abbr:(td.abbr||id.slice(0,4)).toUpperCase(),
         conf:td.conference||'Independent',div:td.division||'',color:td.color||'#888',
         homeState:td.homeState||TEAM_STATE[(td.abbr||'').toUpperCase()]||'TX',
         prestige:td.prestige||60,roster,ratings:teamRatings(roster,staff),
         fac:Object.assign({stadium:5,strength:5,training:5,academics:5,nil:5,scouting:5},td.facilities||{}),
         revenue:30e6,budget:6e6,staff,payroll:0,facilityDebt:0,legends:[]};
      t.payroll=t.staff.reduce((s,x)=>s+x.salary,0);
      ng.world.teams.push(t);
    }
    count++;
  });
  recomputeRanks(ng.world);
  return count;
}
function normPlayer(p){
  const ov=clamp(+p.overall||60,40,99);
  // Phase 49: an imported player gets a temperament too, drawn deterministically from his identity.
  // The schema has no trait fields, so these used to come back absent — which read as exactly 50
  // everywhere. That was harmless while composure only reshaped a draw (identity at 50), but the
  // penalty model's propensity is exponential, so a trait-less roster would foul ~20% less than a
  // generated one. Imported teams also just deserve real personalities.
  const tr=genTraits(rng(hashStr((p.first||'')+'|'+(p.last||'')+'|'+(p.pos||''))));
  const out={id:'p'+Math.random().toString(36).slice(2,9),fn:p.first||'New',ln:p.last||'Player',
    pos:p.pos||'WR',yr:p.year||'FR',age:+p.age||18,st:p.homeState||'TX',
    stars:+p.stars||(ov>=88?4:ov>=78?3:2),ov,pot:clamp(+p.potential||ov,ov,99),
    cap:!!p.captain,so:0,mot:tr.mot,comp:tr.comp,ego:tr.ego};
  // Phase 51: attributes. Honour whatever the file supplies — including the three new optional ones
  // — but RE-CENTRE the profile so its weighted mean is the `overall` the file asked for: a roster
  // handing us all-90s attributes on a 75-overall player must not collect the difference for free.
  // A file with no attribute fields gets a generated profile (deterministic from identity) instead
  // of the old flat spd=str=awr=ov, which left every imported league with no spread at all to read.
  const pos=out.pos;
  const keys=posAttrs(pos);
  if(keys.some(k=>p[k]!=null)){
    const gen=genProfile(rng(hashStr('attr|'+(p.first||'')+'|'+(p.last||'')+'|'+pos)),ov,pos);
    keys.forEach(k=>out[k]=p[k]!=null?clamp(+p[k]||ov,40,99):gen[k]);   // fill the gaps rather than flat-lining them
    centerAttrs(out,ov,pos);
    const a=classifyArch(out); if(a)out.arch=a.n;
  }
  else Object.assign(out,genProfile(rng(hashStr('attr|'+(p.first||'')+'|'+(p.last||'')+'|'+pos)),ov,pos));
  return out;
}
// Bring an older save up to the current schema. v1 staff lacked coordinator/position
// tiers and group boosts; backfill them, re-derive ratings (now coach-aware), re-rank.
function migrateState(state){
  if(!state||!state.world)return state;
  if((state.version||1)<2){
    state.world.teams.forEach(t=>{normalizeStaff(t.staff);t.ratings=teamRatings(t.roster,t.staff);});
    recomputeRanks(state.world);
    state.version=2;
  }
  if((state.version||1)<3){            // Phase 2: season fields. Schedule is created at kickoff.
    if(!('schedule' in state))state.schedule=null;
    if(state.lastPlayedWeek==null)state.lastPlayedWeek=0;
    state.world.teams.forEach(t=>{if(!t.rec)t.rec=emptyRec();});
    recomputeRanks(state.world);
    state.version=3;
  }
  if((state.version||1)<4){            // Phase 3: per-player season stats (p.gs). Absence of
    state.version=4;                   // p.gs reads as "no stats yet", so no backfill needed.
  }
  if((state.version||1)<5){            // Phase 3.5: weekly Player of the Week honors.
    if(!Array.isArray(state.weeklyHonors))state.weeklyHonors=[];
    state.version=5;
  }
  if((state.version||1)<6){            // Phase 4: recruiting. Created at kickoff (like the
    if(!('recruiting' in state))state.recruiting=null;   // schedule), so a null backfill is enough.
    state.version=6;
  }
  if((state.version||1)<7){            // Phase 5: season rollover adds a calendar-year counter.
    if(state.year==null)state.year=2026;
    state.version=7;
  }
  if((state.version||1)<8){            // Phase 6: coaching carousel market + per-team finances.
    if(!('coachMarket' in state))state.coachMarket=null;   // created at the first offseason
    state.world.teams.forEach(t=>{if(!('lastFinances' in t))t.lastFinances=null;});
    state.version=8;
  }
  if((state.version||1)<9){            // Phase 7: per-player offseason growth (p.dev). Absence
    state.version=9;                   // reads as "no growth recorded yet" → no backfill needed.
  }
  if((state.version||1)<10){           // Phase 8: AI geography + season awards + non-conf series.
    if(!Array.isArray(state.awards))state.awards=[];
    if(!Array.isArray(state.series))state.series=[];
    state.world.teams.forEach(t=>{if(!t.homeState)t.homeState=TEAM_STATE[t.abbr]||'TX';});
    state.version=10;                  // p.honors stays optional (absence reads as no honors)
  }
  if((state.version||1)<11){           // Phase 8+: AI-initiated series offers (created when managing).
    if(!('seriesOffers' in state))state.seriesOffers=null;
    state.version=11;
  }
  if((state.version||1)<12){           // Phase 10: per-player traits (p.mot/p.comp). Structural
    state.version=12;                  // no-op — absence reads as average (TRAIT_DEF) until set.
  }
  if((state.version||1)<13){           // Phase 11: program legacy. Backfill an empty Ring of Honor
    state.world.teams.forEach(t=>{if(!Array.isArray(t.legends))t.legends=[];});  // (career/peakOv
    state.version=13;                  // absent → zero/none; honors already persist; aura reads 0).
  }
  if((state.version||1)<14){           // Phase 12: postseason (bowls + 12-team playoff). Created at
    if(!('postseason' in state))state.postseason=null;   // the end of the regular season, like the schedule.
    state.version=14;                  // postseasonBoost/lastPostseason/titles absent → no effect yet.
  }
  if((state.version||1)<15){           // Phase 13: NFL draft + position factories. Draft class is created
    if(!('draft' in state))state.draft=null;   // at the first rollover; team.factory builds from picks (absent → none).
    state.version=15;
  }
  if((state.version||1)<16){           // Phase 14: recruiting calendar (signing moved to the offseason).
    if(state.recruiting&&!state.recruiting.stage)   // derive a stage for an in-progress class
      state.recruiting.stage=state.recruiting.signed?'closed':'open';
    state.version=16;
  }
  if((state.version||1)<17){           // Phase 15: conference championships + CFP auto-bid seeding.
    if(!('champWeek' in state))state.champWeek=null;   // Championship Week is created after the regular season, like the postseason.
    state.world.teams.forEach(t=>{if(!Array.isArray(t.confTitles))t.confTitles=[];});
    state.version=17;
  }

  }                                    // marks a game as played on the old engine, so replay is refused for it

  }                                    // so pre-Phase-50 games decline replay instead of re-simming: the clutch

    // attributes carry that ability — and from here on the sim reads the shape.
    // The ATTRIBUTE half of this step is superseded by v48 below, which rebuilds every profile over

  }

    // Like v47 this is a real mutation of every player in the save (~11.3k plus both pools), and it
    // has to be: a v47 player carries six generic attributes, and no channel in the sim reads those
    // any more — a corner has `mcv`/`zcv` now, not "ball skills".
    //
    // The contract is the one v47 set and is what makes this safe: EVERY PLAYER KEEPS THE `ov` HE
    // HAD. The profile is drawn deterministically from his id, his surviving attributes are kept as
    // the shape wherever the new vocabulary still has a word for them, and the whole thing is
    // re-centred onto his existing overall. Nobody gets better, depth charts hold, and the record
    // book still agrees with the roster.
    const LEGACY={spd:'spd',agi:'agi',str:'str',awr:'awr',dur:'dur',bal:'cth'};   // bal was the catch point
    const fill=o=>{
      if(!o||!o.pos)return;

      const keys=posAttrs(o.pos);

      const old={};for(const k in LEGACY)if(o[k]!=null)old[LEGACY[k]]=clamp(+o[k],40,99);
      for(const k in LEGACY)delete o[k];

      centerAttrs(o,target,o.pos);
