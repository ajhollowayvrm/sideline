<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0d0f12">
<title>Sideline — CFB Coach Sim</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0d0f12; --panel:#15181d; --panel2:#1c2026; --line:#2a2f37;
  --ink:#e9ecf1; --ink2:#aab3c0; --ink3:#6b7480;
  --accent:#c9a227; --accent-ink:#0d0f12;
  --good:#3ea66b; --warn:#d8a24a; --bad:#d35450;
  --r:12px;
  --safe-b: env(safe-area-inset-bottom, 0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  background:var(--bg); color:var(--ink);
  font-family:'Inter',system-ui,-apple-system,sans-serif;
  font-size:15px; line-height:1.45;
  overscroll-behavior-y:none;
}
.cond{font-family:'Saira Condensed','Inter',sans-serif;letter-spacing:.01em}
button{font-family:inherit;color:inherit;cursor:pointer;border:none;background:none}
input,select{font-family:inherit;font-size:16px;color:var(--ink);background:var(--panel2);
  border:1px solid var(--line);border-radius:10px;padding:11px 12px;width:100%}
input:focus,select:focus{outline:2px solid var(--accent);outline-offset:1px}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--ink2) 50%),linear-gradient(135deg,var(--ink2) 50%,transparent 50%);
  background-position:calc(100% - 18px) 19px,calc(100% - 13px) 19px;background-size:5px 5px;background-repeat:no-repeat;padding-right:34px}
label.fld{display:block;margin-bottom:14px}
label.fld>span{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--ink3);margin-bottom:5px;font-weight:600}

#app{max-width:560px;margin:0 auto;min-height:100%;padding-bottom:calc(76px + var(--safe-b))}
.view{padding:18px 16px 8px}
.noscroll{padding-bottom:0}

/* header / scoreboard */
.topbar{position:sticky;top:0;z-index:20;background:linear-gradient(180deg,var(--bg) 70%,transparent);
  padding:12px 16px 10px;display:flex;align-items:center;gap:12px}
.crest{width:42px;height:42px;border-radius:10px;display:grid;place-items:center;
  font-family:'Saira Condensed';font-weight:800;font-size:18px;color:#fff;
  background:var(--accent);box-shadow:inset 0 0 0 1px rgba(255,255,255,.18)}
.topbar h1{font-family:'Saira Condensed';font-weight:700;font-size:21px;line-height:1;letter-spacing:.01em}
.topbar .sub{font-size:11.5px;color:var(--ink2);margin-top:2px}

h2.sec{font-family:'Saira Condensed';font-weight:700;font-size:13px;text-transform:uppercase;
  letter-spacing:.13em;color:var(--ink3);margin:22px 2px 9px}
h2.sec:first-child{margin-top:6px}

.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.card+.card{margin-top:10px}
.row{display:flex;align-items:center;gap:12px}
.spread{justify-content:space-between}
.muted{color:var(--ink2)}
.dim{color:var(--ink3)}
.big-num{font-family:'Saira Condensed';font-weight:800;font-size:30px;line-height:1}
.tag{display:inline-block;font-family:'Saira Condensed';font-weight:700;font-size:11px;letter-spacing:.06em;
  text-transform:uppercase;padding:3px 8px;border-radius:6px;background:var(--panel2);color:var(--ink2);border:1px solid var(--line)}
.tag.accent{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.tag.good{color:var(--good);border-color:color-mix(in srgb,var(--good) 40%,transparent)}
.tag.bad{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,transparent)}

.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;
  padding:14px;border-radius:11px;font-family:'Saira Condensed';font-weight:700;font-size:16px;
  letter-spacing:.04em;text-transform:uppercase;background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:var(--panel2);color:var(--ink);border:1px solid var(--line)}
.btn.line{background:transparent;border:1px solid var(--line);color:var(--ink2)}
.btn.danger{background:transparent;border:1px solid color-mix(in srgb,var(--bad) 50%,transparent);color:var(--bad)}
.btn.sm{padding:9px 12px;font-size:13px;width:auto}
.btn:disabled{opacity:.4}
.btn-row{display:flex;gap:9px;margin-top:10px}

.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px 13px}
.stat .k{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink3);font-weight:600}
.stat .v{font-family:'Saira Condensed';font-weight:800;font-size:23px;margin-top:3px}

/* rank pills */
.ranks{display:flex;gap:8px}
.rankpill{flex:1;text-align:center;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:11px 6px}
.rankpill .n{font-family:'Saira Condensed';font-weight:800;font-size:26px;line-height:1}
.rankpill .l{font-size:10px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink3);margin-top:4px;font-weight:600}

/* list rows */
.lrow{display:flex;align-items:center;gap:11px;padding:11px 13px;background:var(--panel);
  border:1px solid var(--line);border-radius:var(--r)}
.lrow+.lrow{margin-top:7px}
.ovr{font-family:'Saira Condensed';font-weight:800;font-size:19px;width:34px;text-align:center;
  border-radius:8px;padding:3px 0;background:var(--panel2)}
.ovr.elite{color:var(--accent)}
.pos{font-family:'Saira Condensed';font-weight:700;font-size:12px;color:var(--ink3);width:30px}
.nm{font-weight:600;font-size:14.5px}
.meta{font-size:11.5px;color:var(--ink3)}
.cap{color:var(--accent);font-weight:700;font-size:11px}

/* tabs */
.tabs{display:flex;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:4px;margin-bottom:14px}
.tabs button{flex:1;padding:9px;border-radius:9px;font-family:'Saira Condensed';font-weight:700;
  font-size:14px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink3)}
.tabs button.on{background:var(--accent);color:var(--accent-ink)}

/* bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(13,15,18,.92);
  backdrop-filter:blur(12px);border-top:1px solid var(--line);
  padding:8px 0 calc(8px + var(--safe-b));display:flex;max-width:560px;margin:0 auto}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--ink3);font-size:10px;font-weight:600;letter-spacing:.04em}
.nav button.on{color:var(--accent)}
.nav svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9}

/* menu hero */
.hero{min-height:100svh;display:flex;flex-direction:column;justify-content:center;padding:24px 22px calc(40px + var(--safe-b))}
.hero .kick{font-family:'Saira Condensed';font-weight:600;font-size:13px;letter-spacing:.32em;text-transform:uppercase;color:var(--accent)}
.hero h1{font-family:'Saira Condensed';font-weight:800;font-size:62px;line-height:.92;margin:8px 0 4px;letter-spacing:.005em}
.hero .by{color:var(--ink3);font-size:13px;margin-bottom:38px}
.hero .btn{margin-top:11px}

.steps{display:flex;gap:6px;margin-bottom:18px}
.steps span{flex:1;height:3px;border-radius:3px;background:var(--line)}
.steps span.on{background:var(--accent)}

.choice{display:flex;flex-direction:column;gap:8px}
.opt{text-align:left;padding:13px 14px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r)}
.opt.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.opt .t{font-family:'Saira Condensed';font-weight:700;font-size:16px}
.opt .d{font-size:12.5px;color:var(--ink2);margin-top:3px}

.team-pick{display:flex;align-items:center;gap:11px;padding:11px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r)}
.team-pick.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.dot{width:14px;height:14px;border-radius:4px;flex:none}

.search{margin-bottom:11px}
.fac{display:flex;gap:5px;margin-top:8px;flex-wrap:wrap}
.fac .f{font-size:10.5px;color:var(--ink2);background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:3px 7px}
.bar{height:6px;border-radius:6px;background:var(--panel2);overflow:hidden;margin-top:7px}
.bar i{display:block;height:100%;background:var(--accent)}

.toast{position:fixed;left:50%;bottom:calc(86px + var(--safe-b));transform:translateX(-50%);
  background:var(--ink);color:var(--bg);font-weight:600;font-size:13px;padding:10px 16px;border-radius:99px;
  z-index:50;opacity:0;transition:opacity .2s, transform .2s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(-4px)}

.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:560px;background:var(--panel);border-top-left-radius:18px;border-top-right-radius:18px;
  border:1px solid var(--line);padding:18px 16px calc(18px + var(--safe-b));max-height:88vh;overflow:auto}
.sheet h3{font-family:'Saira Condensed';font-weight:700;font-size:20px;margin-bottom:4px}
.grab{width:38px;height:4px;border-radius:4px;background:var(--line);margin:0 auto 14px}
.kv{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.kv:last-child{border-bottom:none}
.kv .k{color:var(--ink2)}
hr.div{border:none;border-top:1px solid var(--line);margin:14px 0}
.hint{font-size:12px;color:var(--ink3);line-height:1.5}
.center{text-align:center}
.empty{text-align:center;color:var(--ink3);padding:40px 20px;font-size:14px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

/* ---------- world generation ---------- */
function genPlayer(r,prestige,posCode){
  const cls=pick(r,CLASSES);
  const ageBase={"FR":18,"RS-FR":19,"SO":19,"RS-SO":20,"JR":20,"RS-JR":21,"SR":21,"RS-SR":22}[cls];
  const seniorPush=cls.includes("SR")?6:cls.includes("JR")?3:cls.includes("SO")?1:-1;
  const base=prestige*0.55 + ri(r,-9,9) + seniorPush + 30;
  const ov=clamp(Math.round(base),48,99);
  const pot=clamp(ov+ri(r,-3,16),ov,99);
  const stars=ov>=90?5:ov>=82?4:ov>=72?3:ov>=62?2:1;
  return {id:'p'+Math.floor(r()*1e9).toString(36),
    fn:pick(r,FN),ln:pick(r,LN),pos:posCode,yr:cls,age:ageBase+ri(r,0,1),
    st:pick(r,STATES),stars,ov,pot,cap:false,
    spd:clamp(ov+ri(r,-12,12),40,99),str:clamp(ov+ri(r,-12,12),40,99),awr:clamp(ov+ri(r,-14,10),40,99)};
}
function genRoster(r,prestige){
  const out=[];
  POS.forEach(([code,,n])=>{for(let i=0;i<n;i++)out.push(genPlayer(r,prestige,code));});
  // depth order: sort each position by OVR, mark order; one captain overall (best non-K/P)
  const byPos={};out.forEach(p=>{(byPos[p.pos]=byPos[p.pos]||[]).push(p);});
  Object.values(byPos).forEach(arr=>{
    arr.sort((a,b)=>b.ov-a.ov);
    arr.forEach((p,i)=>{
      // realistic depth taper: past the two-deep, backups & walk-ons fall off steeply.
      // Starters (so 0-1) are untouched, so team ratings (top-11/side) are unaffected.
      if(i>=2){
        const pen=Math.min(2+(i-2)*2.6,26);
        p.ov=clamp(Math.round(p.ov-pen),44,99);
        p.pot=clamp(Math.round(p.pot-pen*0.4),p.ov,99);
        p.stars=p.ov>=90?5:p.ov>=82?4:p.ov>=72?3:p.ov>=62?2:1;
      }
      p.so=i;
    });
  });
  const field=out.filter(p=>p.pos!=='K'&&p.pos!=='P').sort((a,b)=>b.ov-a.ov);
  if(field[0])field[0].cap=true; if(field[1])field[1].cap=true;
  return out;
}
// Per-position OVR boost the staff confers (coordinators buff a whole side; position
// coaches buff their group). Returns { posCode: points }.
function staffBoosts(staff){
  const m={};
  (staff||[]).forEach(c=>{if(!c.boost||!c.groups)return;c.groups.forEach(code=>{m[code]=(m[code]||0)+c.boost;});});
  return m;
}
function teamRatings(roster,staff){
  const boost=staffBoosts(staff);
  const eff=p=>clamp(p.ov+(boost[p.pos]||0),40,99);
  const grp=s=>roster.filter(p=>POS.find(x=>x[0]===p.pos)[1]===s);
  const avgTop=(arr,k)=>{const s=[...arr].sort((a,b)=>eff(b)-eff(a)).slice(0,k);return s.length?Math.round(s.reduce((t,p)=>t+eff(p),0)/s.length):60;};
  const off=avgTop(grp('off'),11), def=avgTop(grp('def'),11);
  return {off,def,ovr:Math.round((off+def)/2)};
}
// boost = small, derived from rating. Coordinators 0..2 (side-wide); position coaches 0..3.
function coachBoost(tier,rating){return tier==='coord'?clamp(Math.round((rating-55)/20),0,2):clamp(Math.round((rating-50)/15),0,3);}
function genStaff(r,prestige){
  const mk=(code,title,tier,scope,groups,mult)=>{
    const rt=clamp(Math.round(prestige*0.5+ri(r,-8,12)+35),45,95);
    const sal=Math.round((prestige*9000 + rt*7000 + ri(r,-40,40)*1000) * mult);
    return {role:code,title,name:pick(r,FN)+' '+pick(r,LN),rating:rt,salary:Math.max(90000,sal),
      years:ri(r,1,4),tier,scope,groups,boost:coachBoost(tier,rt)};
  };
  const out=[];
  COORD_ROLES.forEach(([code,title,side])=>{
    const groups=POS.filter(p=>p[1]===side).map(p=>p[0]);
    const scope={off:'OFF',def:'DEF',st:'ST'}[side];
    out.push(mk(code,title,'coord',scope,groups,code==='STC'?1.3:2.4));
  });
  POS_COACHES.forEach(([code,title,scope,groups])=>out.push(mk(code,title,'pos',scope,groups,1)));
  return out;
}
// Backfill structural fields on staff loaded from an older save (v1 had no tier/groups/boost).
function normalizeStaff(staff){
  if(!Array.isArray(staff))return staff;
  staff.forEach(c=>{
    if(c.tier)return;
    const co=COORD_ROLES.find(x=>x[0]===c.role);
    if(co){c.tier='coord';c.scope={off:'OFF',def:'DEF',st:'ST'}[co[2]];c.groups=POS.filter(p=>p[1]===co[2]).map(p=>p[0]);}
    else{const pc=POS_COACHES.find(x=>x[0]===c.role)||['','','',[]];c.tier='pos';c.scope=pc[2]||c.role;c.groups=pc[3]||[];}
    c.boost=coachBoost(c.tier,c.rating);
  });
  return staff;
}
function genWorld(seed){
  const r=rng(seed);
  const teams=TEAMS.map(([name,nick,abbr,conf,div,color])=>{
    const prestige=clamp(Math.round((CONF_BASE[conf]||45)+(BUMP[name]||0)+ri(r,-7,7)),20,98);
    const roster=genRoster(r,prestige);
    const staff=genStaff(r,prestige);
    const ratings=teamRatings(roster,staff);
    const p4=["SEC","Big Ten","ACC","Big 12"].includes(conf);
    const fac={stadium:clamp(Math.round(prestige/11)+ri(r,-1,1),1,10),
      strength:clamp(Math.round(prestige/11)+ri(r,-1,1),1,10),
      training:clamp(Math.round(prestige/12)+ri(r,-1,1),1,10),
      academics:clamp(ri(r,3,9),1,10),
      nil:clamp(Math.round(prestige/10)+ri(r,-2,1),1,10)};
    const revenue=Math.round((p4?55:18)*1e6 + prestige*420000 + ri(r,-6,6)*1e6);
    const payroll=staff.reduce((t,s)=>t+s.salary,0);
    const budget=Math.round(revenue*0.18 + ri(r,-3,4)*1e6);
    return {id:abbr.toLowerCase().replace(/[^a-z0-9]/g,''),name,nick,abbr,conf,div,color,
      prestige,roster,ratings,fac,revenue,budget,staff,payroll,
      facilityDebt:Math.round(ri(r,0,prestige>70?40:12)*1e6)};
  });
  // rankings
  const sorted=[...teams].sort((a,b)=>b.ratings.ovr-a.ratings.ovr);
  sorted.forEach((t,i)=>t.natRank=i+1);
  const byConf={},byDiv={};
  teams.forEach(t=>{(byConf[t.conf]=byConf[t.conf]||[]).push(t);
    const dk=t.conf+'|'+(t.div||'');(byDiv[dk]=byDiv[dk]||[]).push(t);});
  Object.values(byConf).forEach(a=>{a.sort((x,y)=>y.ratings.ovr-x.ratings.ovr);a.forEach((t,i)=>t.confRank=i+1);});
  Object.values(byDiv).forEach(a=>{a.sort((x,y)=>y.ratings.ovr-x.ratings.ovr);a.forEach((t,i)=>t.divRank=i+1);});
  return {teams};
}

/* ---------- save system (localStorage, 3 slots) ---------- */
const SLOTS=[1,2,3];
const slotKey=n=>'sideline_slot_'+n;
function readSlot(n){try{const raw=localStorage.getItem(slotKey(n));return raw?JSON.parse(raw):null;}catch(e){return null;}}
function writeSlot(n,state){
  state.lastSaved=Date.now();
  const team=state.world.teams.find(t=>t.id===state.teamId);
  const meta={coach:state.coach.first+' '+state.coach.last,team:team?team.name:'—',
    teamAbbr:team?team.abbr:'',color:team?team.color:'#c9a227',
    week:state.week,phase:state.phase,savedAt:state.lastSaved};
  try{localStorage.setItem(slotKey(n),JSON.stringify({meta,state}));return true;}
  catch(e){toast('Save failed — storage full');return false;}
}
function deleteSlot(n){localStorage.removeItem(slotKey(n));}

/* ---------- test hooks: deterministic seed / slot reset via URL ----------
   ?seed=N  → New Game uses seed N (reproducible world for screenshots/assertions)
   ?reset=1 → clear all save slots on load (clean state)
   Rows carry data-id (player id / coach role / team id); nav+tabs carry data-tid;
   #app carries data-screen / data-tab. S, UI, controlled() are global for evaluate(). */
const _QS=new URLSearchParams(location.search);
const TEST_SEED=_QS.has('seed')?((parseInt(_QS.get('seed'),10)||0)>>>0):null;
if(_QS.get('reset')==='1')SLOTS.forEach(n=>deleteSlot(n));

/* ---------- live game state ---------- */
let S=null;            // current state
let UI={view:'menu',tab:'roster',newgame:null};

function controlled(){return S.world.teams.find(t=>t.id===S.teamId);}
function applyAccent(team){
  const root=document.documentElement.style;
  if(team){root.setProperty('--accent',team.color);root.setProperty('--accent-ink',textOn(team.color));
    document.querySelector('meta[name=theme-color]').setAttribute('content','#0d0f12');}
  else{root.setProperty('--accent','#c9a227');root.setProperty('--accent-ink','#0d0f12');}
}

/* ============================================================
   RENDER
   ============================================================ */
function render(){
  const app=$('#app');app.innerHTML='';
  app.dataset.screen=UI.view; app.dataset.tab=UI.tab||'';   // test hooks
  if(UI.view==='menu')         return renderMenu(app);
  if(UI.view==='load')         return renderLoad(app);
  if(UI.view==='newgame')      return renderNewGame(app);
  if(UI.view==='browse_pick')  return renderBrowse(app,true);
  // in-game views
  applyAccent(controlled());
  if(UI.view==='game') return renderGame(app);   // full-screen, no bottom nav (commit to exit)
  if(UI.view==='home') renderHome(app);
  if(UI.view==='team') renderTeam(app);
  if(UI.view==='season') renderSeason(app);
  if(UI.view==='browse') renderBrowse(app,false);
  if(UI.view==='program') renderProgram(app);
  renderNav(app);
}

  applyAccent(null);

      const br=el('div','btn-row');

function freshNewGame(){return {step:0,coach:{first:'',last:'',homeState:'TX',archetype:'Recruiter',history:'Former Player'},
  seed:(TEST_SEED!=null?TEST_SEED:((Date.now()^(Math.random()*1e9))>>>0)),world:null,teamId:null};}

function renderNewGame(app){

    HISTORIES.forEach(([t,d])=>h.append(optEl(t,d,ng.coach.history===t,()=>{ng.coach.history=t;render();})));
    v.append(h);
    const next=el('button','btn','Continue');next.style.marginTop='14px';
    next.onclick=()=>{ensureWorld(ng);ng.step=2;render();};
    v.append(next);

  }else if(ng.step===2){ // rosters
    ensureWorld(ng);
    v.append(el('div','card','<div class="hint">A full league of all '+TEAMS.length+
      ' FBS teams has been generated. You can play with these, or import your own custom rosters (real teams, edited ratings — your call).</div>'));
    const imp=el('button','btn ghost','Import custom rosters (.json)');
    imp.onclick=()=>importRosters(ng);
    const edit=el('button','btn line','Edit a team\u2019s roster');
    edit.style.marginTop='9px';
    edit.onclick=()=>{UI._editReturn='newgame';UI.view='browse_pick';UI._editMode=true;render();};
    const dl=el('button','btn line','Download blank roster template');
    dl.style.marginTop='9px';dl.onclick=downloadTemplate;
    v.append(imp,edit,dl);
    const next=el('button','btn','Continue to team select');next.style.marginTop='16px';
    next.onclick=()=>{ng.step=3;render();};
    v.append(next);

  }else if(ng.step===3){ // pick team
    ensureWorld(ng);
    const rand=el('button','btn ghost','Surprise me — assign a random program');
    rand.onclick=()=>{const t=ng.world.teams[Math.floor(Math.random()*ng.world.teams.length)];ng.teamId=t.id;finishNewGame(ng);};
    v.append(rand);
    v.append(el('div','hint center','— or pick one below —'));
    v.append(buildTeamList(ng.world.teams,t=>{ng.teamId=t.id;finishNewGame(ng);},'pick'));
  }
  app.append(v);
}
function ensureWorld(ng){if(!ng.world)ng.world=genWorld(ng.seed);}
function finishNewGame(ng){
  S={version:5,seed:ng.seed,createdAt:Date.now(),coach:ng.coach,teamId:ng.teamId,
     week:0,phase:'Preseason',world:ng.world,schedule:null,lastPlayedWeek:0,weeklyHonors:[],
     task:{type:'Media Day',label:'Preseason Media Day',note:'Set the tone with the press, then kick off the season.'}};
  // choose a save slot
  chooseSlotSheet();
}
function chooseSlotSheet(){
  const body=el('div');
  body.append(el('div','hint','Choose a slot to save this career to. Saving over a slot replaces what\u2019s there.'));
  SLOTS.forEach(n=>{
    const ex=readSlot(n);
    const b=el('button','btn '+(ex?'line':'ghost'),'Slot '+n+(ex?' — replace '+ex.meta.team:' — empty'));
    b.style.marginTop='9px';
    b.onclick=()=>{
      const go=()=>{writeSlot(n,S);closeSheet();UI.view='home';UI.newgame=null;render();toast('Career started');};
      if(ex)confirmSheet('Overwrite Slot '+n+'?',ex.meta.team+' — '+ex.meta.coach,go);else go();
    };
    body.append(b);
  });
  openSheet('Save your career',body);
}

/* ---------- roster import / template ---------- */
const TEMPLATE={format:"sideline-roster",version:1,teams:[{
  name:"Example State",nickname:"Mockingbirds",abbr:"EXST",conference:"SEC",division:"",color:"#1b5e20",
  prestige:74,facilities:{stadium:8,strength:7,training:7,academics:6,nil:7},
  players:[{first:"John",last:"Smith",pos:"QB",year:"JR",age:21,homeState:"TX",stars:4,overall:88,potential:92,
    spd:80,str:70,awr:86,captain:true}]}]};
function downloadTemplate(){
  const blob=new Blob([JSON.stringify(TEMPLATE,null,2)],{type:'application/json'});
  const a=el('a');a.href=URL.createObjectURL(blob);a.download='sideline-roster-template.json';a.click();
  toast('Template downloaded');
}
function importRosters(ng){
  const inp=el('input');inp.type='file';inp.accept='.json,application/json';
  inp.onchange=()=>{const f=inp.files[0];if(!f)return;const rd=new FileReader();
    rd.onload=()=>{try{const data=JSON.parse(rd.result);const n=mergeRosters(ng,data);
      toast('Imported '+n+' team'+(n===1?'':'s'));render();}catch(e){toast('Invalid file: '+e.message);}};
    rd.readAsText(f);};
  inp.click();
}
function mergeRosters(ng,data){
  if(!data||!Array.isArray(data.teams))throw new Error('missing teams[]');
  ensureWorld(ng);let count=0;
  data.teams.forEach(td=>{
    const id=(td.abbr||td.name||'').toLowerCase().replace(/[^a-z0-9]/g,'');if(!id)return;
    let t=ng.world.teams.find(x=>x.id===id||x.name.toLowerCase()===String(td.name||'').toLowerCase());
    const roster=(td.players||[]).map(p=>normPlayer(p));
    if(roster.length){const byPos={};roster.forEach(p=>(byPos[p.pos]=byPos[p.pos]||[]).push(p));
      Object.values(byPos).forEach(a=>{a.sort((x,y)=>y.ov-x.ov);a.forEach((p,i)=>p.so=i);});}
    if(t){ // override existing
      if(roster.length){t.roster=roster;t.ratings=teamRatings(roster,t.staff);}
      if(td.facilities)Object.assign(t.fac,td.facilities);
      if(td.prestige!=null)t.prestige=td.prestige;
      if(td.color)t.color=td.color;
    }else{ // brand new team
      const staff=genStaff(rng(id.length*7+1),td.prestige||60);
      t={id,name:td.name||id,nick:td.nickname||'',abbr:(td.abbr||id.slice(0,4)).toUpperCase(),
         conf:td.conference||'Independent',div:td.division||'',color:td.color||'#888',
         prestige:td.prestige||60,roster,ratings:teamRatings(roster,staff),
         fac:Object.assign({stadium:5,strength:5,training:5,academics:5,nil:5},td.facilities||{}),
         revenue:30e6,budget:6e6,staff,payroll:0,facilityDebt:0};
      t.payroll=t.staff.reduce((s,x)=>s+x.salary,0);
      ng.world.teams.push(t);
    }
    count++;
  });
  recomputeRanks(ng.world);
  return count;
}
function normPlayer(p){
  const ov=clamp(+p.overall||60,40,99);
  return {id:'p'+Math.random().toString(36).slice(2,9),fn:p.first||'New',ln:p.last||'Player',
    pos:p.pos||'WR',yr:p.year||'FR',age:+p.age||18,st:p.homeState||'TX',
    stars:+p.stars||(ov>=88?4:ov>=78?3:2),ov,pot:clamp(+p.potential||ov,ov,99),
    cap:!!p.captain,spd:+p.spd||ov,str:+p.str||ov,awr:+p.awr||ov,so:0};
}
// Bring an older save up to the current schema. v1 staff lacked coordinator/position
// tiers and group boosts; backfill them, re-derive ratings (now coach-aware), re-rank.
function migrateState(state){
  if(!state||!state.world)return state;
  if((state.version||1)<2){
    state.world.teams.forEach(t=>{normalizeStaff(t.staff);t.ratings=teamRatings(t.roster,t.staff);});
    recomputeRanks(state.world);
    state.version=2;
  }
  if((state.version||1)<3){            // Phase 2: season fields. Schedule is created at kickoff.
    if(!('schedule' in state))state.schedule=null;
    if(state.lastPlayedWeek==null)state.lastPlayedWeek=0;
    state.world.teams.forEach(t=>{if(!t.rec)t.rec=emptyRec();});
    recomputeRanks(state.world);
    state.version=3;
  }
  if((state.version||1)<4){            // Phase 3: per-player season stats (p.gs). Absence of
    state.version=4;                   // p.gs reads as "no stats yet", so no backfill needed.
  }
  if((state.version||1)<5){            // Phase 3.5: weekly Player of the Week honors.
    if(!Array.isArray(state.weeklyHonors))state.weeklyHonors=[];
    state.version=5;
  }
  return state;
}
// Ranking score: preseason (no games) is pure OVR; once games are played it blends in
// record and point margin so winners climb and undefeated underdogs can crack the polls.
function rankScore(t){
  const ovr=t.ratings.ovr, rec=t.rec;
  if(!rec||(rec.w+rec.l)===0)return ovr;
  const g=rec.w+rec.l, margin=(rec.pf-rec.pa)/g;
  return ovr + (rec.w-rec.l)*5 + clamp(margin,-28,28)*0.4;
}
function recomputeRanks(world){
  const ts=world.teams;
  [...ts].sort((a,b)=>rankScore(b)-rankScore(a)).forEach((t,i)=>t.natRank=i+1);
  const c={},d={};ts.forEach(t=>{(c[t.conf]=c[t.conf]||[]).push(t);const k=t.conf+'|'+(t.div||'');(d[k]=d[k]||[]).push(t);});
  Object.values(c).forEach(a=>{a.sort((x,y)=>rankScore(y)-rankScore(x));a.forEach((t,i)=>t.confRank=i+1);});
  Object.values(d).forEach(a=>{a.sort((x,y)=>rankScore(y)-rankScore(x));a.forEach((t,i)=>t.divRank=i+1);});
}

/* ============================================================
   SEASON ENGINE — schedule, game sim, records, standings  (Phase 2)
   ============================================================ */
const SEASON_WEEKS=15;       // 12 games + ~3 byes, mirrors a real CFB regular season
function emptyRec(){return {w:0,l:0,cw:0,cl:0,pf:0,pa:0,streak:0};}

// Build a full-league schedule: each team ~12 games (conference-weighted), one game per
// week, packed into SEASON_WEEKS. Deterministic from the world seed. (Validated standalone:
// ~11.9 games/team avg, 0 same-week conflicts, no duplicate matchups.)
function genSchedule(world,seed){
  const ids=world.teams.map(t=>t.id);
  const confOf={};world.teams.forEach(t=>confOf[t.id]=t.conf);
  const r=rng((seed^0x5ca1ab1e)>>>0);
  const TARGET=12;
  const pri=new Map(ids.map(id=>[id,r()]));          // random per-team key → seed-varied slate
  const adj=new Map(ids.map(id=>[id,new Set()]));
  const deg=id=>adj.get(id).size;
  // 1) pick matchups: repeatedly connect the neediest team to a same-conference (then any)
  //    opponent it hasn't played, until everyone has ~12 games.
  let guard=ids.length*TARGET*6;
  while(guard-->0){
    const need=ids.filter(id=>deg(id)<TARGET);
    if(need.length<2)break;
    need.sort((a,b)=>deg(a)-deg(b)||pri.get(a)-pri.get(b));
    const A=need[0],an=adj.get(A);
    let cands=need.filter(B=>B!==A&&!an.has(B));
    if(!cands.length){cands=ids.filter(B=>B!==A&&!an.has(B)&&deg(B)<TARGET);if(!cands.length)break;}
    const sameConf=cands.filter(B=>confOf[B]===confOf[A]);
    const pool=sameConf.length?sameConf:cands;
    pool.sort((a,b)=>deg(a)-deg(b)||pri.get(a)-pri.get(b));
    const B=pool[0];adj.get(A).add(B);adj.get(B).add(A);
  }
  // 2) assign each matchup to the lowest week free for both teams (greedy edge-coloring).
  const matchups=[];const seen=new Set();
  ids.forEach(A=>adj.get(A).forEach(B=>{const k=A<B?A+'|'+B:B+'|'+A;
    if(!seen.has(k)){seen.add(k);matchups.push({A,B,d:deg(A)+deg(B),key:r(),ha:r()});}}));
  matchups.sort((m,n)=>n.d-m.d||m.key-n.key);   // hardest (busiest) first
  const busy=new Map(ids.map(id=>[id,new Set()]));
  const games=[];let gi=0;
  matchups.forEach(m=>{
    let wk=-1;
    for(let w=0;w<SEASON_WEEKS;w++){if(!busy.get(m.A).has(w)&&!busy.get(m.B).has(w)){wk=w;break;}}
    if(wk<0)return;                              // couldn't place → mutual bye (rare)
    busy.get(m.A).add(wk);busy.get(m.B).add(wk);
    const home=m.ha<0.5?m.A:m.B,away=m.ha<0.5?m.B:m.A;
    games.push({id:'g'+(gi++).toString(36),week:wk+1,home,away,played:false,hs:null,as:null});
  });
  return {weeks:SEASON_WEEKS,games};
}

function teamById(id){return S.world.teams.find(t=>t.id===id);}
function teamGame(teamId,week){return S.schedule?S.schedule.games.find(g=>g.week===week&&(g.home===teamId||g.away===teamId)):null;}
function teamGames(teamId){return S.schedule?S.schedule.games.filter(g=>g.home===teamId||g.away===teamId).sort((a,b)=>a.week-b.week):[];}
function lastGameFor(teamId){const gs=teamGames(teamId).filter(g=>g.played);return gs.length?gs[gs.length-1]:null;}

function startSeason(){
  S.schedule=genSchedule(S.world,S.seed);
  S.world.teams.forEach(t=>t.rec=emptyRec());
  S.weeklyHonors=[];
  S.phase='Regular Season';S.week=1;S.lastPlayedWeek=0;
  recomputeRanks(S.world);
  setWeeklyTask();
  autosave();
}

// === SIM ENGINE (Phase 3) START ===
// Drive/play state machine. Pure + deterministic from `seed`: simEngine(home,away,seed)
// returns { hs, as, box } and never mutates its inputs, so re-running reproduces the same
// score AND the same per-player box. `box` maps playerId -> stat deltas for ONE game; the
// season layer folds it into each player's season totals (see applyResult). Depends only on
// rng/clamp/ri (no DOM, no globals) so test/simlab.js can extract + validate it offline.
//
// Coordinate: `los` = offense's own yard line, 0..100, scoring end at 100. Possession flips
// by mirroring (opp los = 100 - los). Efficiency is driven by (offense.off - defense.def)
// in rating points, plus a small home-field bump to the home offense.

// Depth-weighted usage pools for one team-game (starters get the lion's share of touches).
function gamePools(team){
  const byPos={}; team.roster.forEach(p=>{(byPos[p.pos]=byPos[p.pos]||[]).push(p);});
  for(const k in byPos) byPos[k].sort((a,b)=>a.so-b.so);
  const dep=p=>1/Math.pow((p.so||0)+1,1.35);              // so 0 ≫ so 1 ≫ deep backups
  const W=(codes,base)=>{const out=[];codes.forEach(([c,m])=>(byPos[c]||[]).forEach(p=>out.push([p,base*m*dep(p)])));return out;};
  return {
    qb:(byPos.QB||[])[0]||null,
    k:(byPos.K||[])[0]||(byPos.QB||[])[0]||null,
    rush:W([['RB',1.0]],1),                                // designed runs go to RBs
    recv:W([['WR',1.15],['TE',0.75],['RB',0.55]],1),       // targets: WR > TE > checkdown RB
    tkl:W([['LB',1.0],['S',0.8],['CB',0.7],['DE',0.55],['DT',0.45]],1),
    rush4:W([['DE',1.0],['DT',0.7],['LB',0.5]],1),         // pass rush (sacks)
    hawk:W([['CB',1.0],['S',0.85],['LB',0.4]],1)           // ball-hawks (INTs)
  };
}
function wpick(pool,r){ let tot=0;for(const e of pool)tot+=e[1]; if(tot<=0)return null;
  let x=r()*tot; for(const e of pool){x-=e[1];if(x<0)return e[0];} return pool[pool.length-1][0]; }

// opts.log → also return res.log, a flat list of {q,team,kind,text,dd,hs,as,big} events for the
// watchable viewer. Logging pushes strings only (no rng), so the score + box are identical with
// it on or off — a "watch" is a faithful replay of the committed result, never a re-roll.
function simEngine(home,away,seed,opts){
  const r=rng(seed>>>0);
  const box={};
  const log=opts&&opts.log?[]:null;
  const add=(id,k,v)=>{ if(!id)return; (box[id]=box[id]||{gp:1})[k]=(box[id][k]||0)+(v==null?1:v); };
  const pools={[home.id]:gamePools(home),[away.id]:gamePools(away)};
  const score={[home.id]:0,[away.id]:0};
  const HFA=2.3;                                           // home-field, in rating points
  // per-game "form": each team runs a little hot or cold tonight (std ≈ 4 pts), which lets
  // underdogs steal games and keeps the favorite from winning ~every time.
  const form={[home.id]:(r()+r()+r()-1.5)*8, [away.id]:(r()+r()+r()-1.5)*8};
  const flipTo=spot=>100-clamp(spot,1,99);                 // mirror a spot for the opponent
  const nm=p=>p?((p.fn?p.fn[0]+'. ':'')+(p.ln||p.pos||'')).trim():'';
  const fpos=l=>l===50?'midfield':(l<50?'own ':'opp ')+(l<50?l:100-l);
  const L=(team,kind,text,dd,big)=>{ if(log)log.push({q:L._q,team:team?team.id:null,kind,text,dd:dd||'',hs:score[home.id],as:score[away.id],big:!!big}); };
  L._q=1;

  // One possession, start at `startLos` (offense's own yard line). Returns the spot the
  // opponent takes over (mutates `score` + `box`); ~drive time charged to the caller's clock.
  function playDrive(off,def,startLos){
    const oP=pools[off.id], dP=pools[def.id];
    const adv=(off.ratings.off-def.ratings.def)+(off===home?HFA:0)+form[off.id]-form[def.id];
    let los=startLos, down=1, togo=10, time=0;
    L(off,'drive',off.abbr?off.abbr+' ball at '+fpos(los):'Ball at '+fpos(los));
    while(true){
      const dd=(down)+' & '+(togo>=(100-los)?'goal':togo);
      // ---- 4th down: kick or go ----
      if(down===4){
        const fgDist=(100-los)+17, inFgRange=fgDist<=57, shortPlus=los>=58&&togo<=2;
        if(inFgRange && !(shortPlus && r()<0.45)){          // field-goal attempt
          time+=8; add(oP.k&&oP.k.id,'fga');
          if(r()<clamp(0.965-(fgDist-20)*0.013,0.40,0.985)){ add(oP.k&&oP.k.id,'fgm'); score[off.id]+=3; L(off,'score',nm(oP.k)+' '+fgDist+'-yd field goal is GOOD',dd,true); return {nextLos:25,time}; }
          L(off,'play',nm(oP.k)+' '+fgDist+'-yd field goal MISSED',dd); return {nextLos:flipTo(los),time};
        } else if(!(shortPlus && r()<0.55)){                // punt (net ~42; into EZ → touchback @20)
          time+=10; L(off,'play','Punt',dd); return {nextLos:clamp(flipTo(los+ri(r,38,46)),20,99),time};
        } // else: go for it → fall through and run a normal play
      }

      // ---- run / pass ----
      const passProb=clamp(0.45+(togo>7?0.18:togo<3?-0.18:0)+(down>=3?0.17:0)+adv*0.003,0.12,0.92);
      let gain=0, turnover=false, scored=false, tackled=true, txt='';

      if(r()<passProb){                                     // dropback (sacks aren't pass attempts)
        if(r()<clamp(0.062-adv*0.0012,0.02,0.11)){          // sack
          gain=-ri(r,4,9); time+=36; const s=wpick(dP.rush4,r); add(s&&s.id,'sk'); txt=nm(oP.qb)+' sacked by '+nm(s)+' for '+gain;
        } else if(r()<clamp(0.615+adv*0.007,0.32,0.83)){    // completion
          const rec=wpick(oP.recv,r);
          gain=Math.max(-3,Math.round((2.2+r()*7.5)+(r()<0.18?r()*42:0)+adv*0.06));
          add(oP.qb&&oP.qb.id,'pAtt'); add(oP.qb&&oP.qb.id,'pCmp'); add(oP.qb&&oP.qb.id,'pYds',gain);
          add(rec&&rec.id,'rec'); add(rec&&rec.id,'reYds',gain);
          time+=(r()<0.28?14:34); txt=nm(oP.qb)+' pass to '+nm(rec)+' for '+gain;
          if(los+gain>=100){ scored=true; add(oP.qb&&oP.qb.id,'pTD'); add(rec&&rec.id,'reTD'); }
        } else {                                            // incomplete (maybe picked)
          time+=6; tackled=false; add(oP.qb&&oP.qb.id,'pAtt'); txt=nm(oP.qb)+' incomplete';
          if(r()<clamp(0.030-adv*0.0008,0.008,0.06)){ turnover=true; add(oP.qb&&oP.qb.id,'pInt'); const h=wpick(dP.hawk,r); add(h&&h.id,'dInt'); txt=nm(oP.qb)+' INTERCEPTED by '+nm(h); }
        }
      } else {                                              // run
        const rb=wpick(oP.rush,r)||oP.qb;
        gain=Math.max(-4,Math.round((2.7+r()*4.1)+(r()<0.11?r()*30:0)+adv*0.035));
        time+=36; add(rb&&rb.id,'rAtt'); add(rb&&rb.id,'rYds',gain); txt=nm(rb)+' run for '+gain;
        if(los+gain>=100){ scored=true; add(rb&&rb.id,'rTD'); }
        if(!scored && r()<0.011){ turnover=true; txt=nm(rb)+' FUMBLES — lost'; }
      }

      // ---- resolve the play ----
      if(scored){
        score[off.id]+=6;
        add(oP.k&&oP.k.id,'xpa'); const xp=r()<0.965; if(xp){ add(oP.k&&oP.k.id,'xpm'); score[off.id]+=1; }
        L(off,'score','TOUCHDOWN — '+txt+(xp?' (XP good)':' (XP no good)'),dd,true);
        return {nextLos:25,time};
      }
      if(tackled){ const t=wpick(dP.tkl,r); add(t&&t.id,'tkl'); }
      if(turnover){ L(off,'play',txt,dd,true); return {nextLos:flipTo(clamp(los+gain,1,99)),time}; }

      const wasFirst=togo-gain<=0;
      los=clamp(los+gain,1,99); togo-=gain;
      L(off,'play',txt+(wasFirst?' — 1ST DOWN':''),dd);
      if(togo<=0){ down=1; togo=10; }                       // first down
      else if(++down>4){ L(off,'play','Turnover on downs',dd); return {nextLos:flipTo(los),time}; }
    }
  }

  // regulation: alternate possessions until the clock runs out (a drive may overrun the
  // final seconds — symmetric, and the scoreboard impact is negligible).
  let clock=3600, off=r()<0.5?home:away, def=off===home?away:home, startLos=25;
  while(clock>0){
    L._q=clamp(Math.floor((3600-clock)/900)+1,1,4);
    const d=playDrive(off,def,startLos);
    clock-=Math.max(d.time,12); startLos=d.nextLos;
    const swap=off; off=def; def=swap;
  }
  // overtime: each team a possession from the opponent's 25 (los 75) until someone leads.
  let ot=0;
  while(score[home.id]===score[away.id] && ot++<25){
    L._q='OT'+ot;
    playDrive(home,away,75); playDrive(away,home,75);
  }
  L(null,'final','Final',null,true);

  return { hs:score[home.id], as:score[away.id], box, log };
}
// === SIM ENGINE (Phase 3) END ===

// Resolve a game with the drive/play engine. Seeded per game id so outcomes are reproducible
// regardless of advance order. Sets g.hs/g.as/g.played and RETURNS the per-game box (player
// id → stat deltas) for stat folding. Pure w.r.t. players/teams — re-simming a clone is safe.
function simGame(g){
  const home=teamById(g.home),away=teamById(g.away);
  const res=simEngine(home,away,(hashStr(g.id)^(S.seed>>>0))>>>0);
  g.hs=res.hs;g.as=res.as;g.played=true;
  return res.box;
}
// Fold a game's box score into each player's season totals (p.gs). Stored only for players
// who recorded something, so the save-size hit is limited to players who saw the field.
function applyStats(g,box){
  if(!box)return;
  [g.home,g.away].forEach(tid=>{const t=teamById(tid);
    t.roster.forEach(p=>{const d=box[p.id];if(!d)return;const s=p.gs=p.gs||{};for(const k in d)s[k]=(s[k]||0)+d[k];});});
}
function applyResult(g,box){
  const home=teamById(g.home),away=teamById(g.away),homeWon=g.hs>g.as;
  home.rec.pf+=g.hs;home.rec.pa+=g.as;away.rec.pf+=g.as;away.rec.pa+=g.hs;
  const W=homeWon?home:away,L=homeWon?away:home;
  W.rec.w++;L.rec.l++;
  W.rec.streak=W.rec.streak>=0?W.rec.streak+1:1;
  L.rec.streak=L.rec.streak<=0?L.rec.streak-1:-1;
  if(home.conf===away.conf){W.rec.cw++;L.rec.cl++;}
  applyStats(g,box);
}
function advanceWeek(){
  const wk=S.week;
  const boxes=S.schedule.games.filter(g=>g.week===wk&&!g.played).map(g=>{const box=simGame(g);applyResult(g,box);return {g,box};});
  computeWeeklyHonors(wk,boxes);
  S.lastPlayedWeek=wk;S.week++;
  recomputeRanks(S.world);
  if(S.week>S.schedule.weeks)endSeason();else setWeeklyTask();
  autosave();
}
// Player of the Week from the week's per-game boxes — Offensive & Defensive, at national scope
// and one per conference. Stored lean in S.weeklyHonors with a snapshotted stat line so the
// honor survives later roster edits / season rollover.
function honorLine(s,side){
  if(side==='def'){const d=[];if(s.tkl)d.push(s.tkl+' tkl');if(s.sk)d.push(s.sk+' sk');if(s.dInt)d.push(s.dInt+' INT');return d.join(', ')||'—';}
  const p=[];
  if(s.pYds||s.pTD)p.push(`${s.pYds||0} pass yd${s.pTD?', '+s.pTD+' TD':''}${s.pInt?', '+s.pInt+' INT':''}`);
  if(s.rYds||s.rTD)p.push(`${s.rYds||0} rush yd${s.rTD?', '+s.rTD+' TD':''}`);
  if(s.reYds||s.reTD)p.push(`${s.rec||0} rec, ${s.reYds||0} yd${s.reTD?', '+s.reTD+' TD':''}`);
  return p.join(' · ')||'—';
}
function computeWeeklyHonors(week,boxes){
  const cand=[];
  boxes.forEach(({g,box})=>[g.home,g.away].forEach(tid=>{const t=teamById(tid);
    t.roster.forEach(p=>{const s=box[p.id];if(!s)return;
      const off=(s.pYds||0)*0.04+(s.pTD||0)*4+(s.rYds||0)*0.1+(s.rTD||0)*6+(s.reYds||0)*0.1+(s.reTD||0)*6-(s.pInt||0)*2;
      const def=(s.tkl||0)+(s.sk||0)*4+(s.dInt||0)*6;
      cand.push({p,t,conf:t.conf,off,def,s});});}));
  const bestBy=(arr,key)=>arr.reduce((b,c)=>(!b||c[key]>b[key])?c:b,null);
  const mk=(c,side)=>c?{pid:c.p.id,teamId:c.t.id,name:c.p.fn+' '+c.p.ln,pos:c.p.pos,abbr:c.t.abbr,color:c.t.color,line:honorLine(c.s,side)}:null;
  const pick=arr=>({off:mk(bestBy(arr,'off'),'off'),def:mk(bestBy(arr,'def'),'def')});
  const byConf={};[...new Set(cand.map(c=>c.conf))].forEach(cf=>byConf[cf]=pick(cand.filter(c=>c.conf===cf)));
  S.weeklyHonors=S.weeklyHonors||[];
  S.weeklyHonors.push({week,national:pick(cand),byConf});
}
function setWeeklyTask(){
  const t=controlled(),g=teamGame(t.id,S.week);
  if(!g){S.task={type:'Bye',label:'Bye Week',note:'No game scheduled. Rest the roster and advance.'};return;}
  const home=g.home===t.id,opp=teamById(home?g.away:g.home);
  S.task={type:'Game',label:(home?'vs ':'@ ')+opp.name+' '+opp.nick,
    note:'Week '+S.week+' · '+(home?'Home':'Away')+' · '+opp.conf+' · OVR '+opp.ratings.ovr};
}
function endSeason(){
  const t=controlled();
  S.phase='Offseason';
  S.task={type:'Offseason',label:'Season Complete',
    note:'Final record '+t.rec.w+'–'+t.rec.l+' ('+t.rec.cw+'–'+t.rec.cl+' '+t.conf+'). Offseason, hiring, and player development arrive in a later phase.'};
}
// Result of a game from one team's perspective, formatted for the UI.
function gameView(g,teamId){
  const home=g.home===teamId,opp=teamById(home?g.away:g.home);
  let res='',cls='',my=null,th=null;
  if(g.played){my=home?g.hs:g.as;th=home?g.as:g.hs;const win=my>th;
    res=(win?'W ':'L ')+my+'–'+th;cls=win?'good':'bad';}
  return {opp,home,res,cls,my,th,week:g.week,played:g.played};
}
function recStr(t){return t.rec?t.rec.w+'–'+t.rec.l:'';}

/* ============================================================
   WATCHABLE GAME — animate simEngine's play log, then commit.
   Two entry points: openGameViewer (your week → watch-then-commit) and openGameReplay
   (a decided game → replay only). Both animate the SAME deterministic log, so the watched
   score always equals the committed/recorded score.
   ============================================================ */
let gameTimer=null;
function buildGameLog(gameId){
  const g=S.schedule.games.find(x=>x.id===gameId); if(!g)return null;
  const home=teamById(g.home),away=teamById(g.away);
  const res=simEngine(home,away,(hashStr(g.id)^(S.seed>>>0))>>>0,{log:true});
  return {gameId,home:g.home,away:g.away,log:res.log,hs:res.hs,as:res.as,idx:0,fast:false,done:false};
}
function openGameViewer(g){ UI.game=Object.assign(buildGameLog(g.id)||{},{replay:false}); UI.view='game'; render(); scheduleGameTick(); }
function openGameReplay(gameId){ const G=buildGameLog(gameId); if(!G)return; G.replay=true; UI.game=G; UI.view='game'; render(); scheduleGameTick(); }
function curGameScore(G){const e=G.idx>0?G.log[G.idx-1]:null;return e?{hs:e.hs,as:e.as,q:e.q}:{hs:0,as:0,q:1};}
function qLabel(q){return (''+q).startsWith('OT')?q:'Q'+q;}
function gameEventEl(e){
  if(e.kind==='final')return null;
  const line=el('div');
  if(e.kind==='drive'){line.className='meta dim';line.style.cssText='margin:11px 2px 3px;font-weight:700;letter-spacing:.04em';line.textContent=e.text;}
  else if(e.kind==='score'){line.className='lrow';line.style.cssText='box-shadow:inset 0 0 0 1px var(--accent);font-weight:700;margin:4px 0';line.innerHTML=`<div style="flex:1;font-size:13px">${e.text}</div>`;}
  else{line.className='row';line.style.cssText='gap:8px;margin:3px 2px';line.innerHTML=`<span class="meta dim" style="flex:none;width:46px">${e.dd||''}</span><span style="flex:1;font-size:13px">${e.text}</span>`;}
  return line;
}
function applyGameEvent(e){
  const hs=$('#g-hs'),as=$('#g-as'),q=$('#g-q');
  if(hs)hs.textContent=e.hs; if(as)as.textContent=e.as; if(q&&e.q)q.textContent=qLabel(e.q);
  const ln=gameEventEl(e),feed=$('#g-feed'); if(ln&&feed){feed.append(ln);feed.scrollTop=feed.scrollHeight;}
}
function scheduleGameTick(){
  const G=UI.game; if(!G||G.done)return;
  if(G.idx>=G.log.length){gameDone();return;}
  const e=G.log[G.idx];
  const base=e.kind==='score'?760:e.kind==='drive'?260:e.kind==='final'?10:230;
  gameTimer=setTimeout(()=>{ if(UI.view!=='game'||!UI.game){gameTimer=null;return;} applyGameEvent(e); UI.game.idx++; scheduleGameTick(); }, G.fast?Math.max(35,base/4):base);
}
function gameDone(){ if(gameTimer){clearTimeout(gameTimer);gameTimer=null;} if(UI.game){UI.game.done=true;render();} }
function skipGame(){ const G=UI.game; if(!G)return; if(gameTimer){clearTimeout(gameTimer);gameTimer=null;} G.idx=G.log.length; G.done=true; render(); }
function finishGame(){
  if(gameTimer){clearTimeout(gameTimer);gameTimer=null;}
  const G=UI.game; if(!G)return; const replay=G.replay, gid=G.gameId; UI.game=null;
  if(replay){ UI.view='season'; render(); return; }
  UI.view='home'; advanceWeek();
  const g=S.schedule.games.find(x=>x.id===gid); render();
  if(g){const gv=gameView(g,controlled().id);toast((gv.cls==='good'?'Won ':'Lost ')+gv.res.slice(2)+(gv.home?' vs ':' @ ')+gv.opp.abbr);}
}
function renderGame(app){
  const G=UI.game; if(!G){UI.view='home';return renderHome(app);}
  const home=teamById(G.home),away=teamById(G.away),t=controlled(),cs=curGameScore(G);
  const v=el('div','view');v.style.paddingBottom='10px';
  const sb=el('div','card');sb.dataset.tid='game-board';sb.style.cssText='position:sticky;top:0;z-index:5';
  sb.innerHTML=`<div class="row spread" style="align-items:center">
      <div class="row" style="gap:8px;min-width:0"><span class="dot" style="background:${home.color};flex:none"></span><div class="nm">${home.abbr}${home.id===t.id?' <span class="cap">YOU</span>':''}</div></div>
      <div class="cond" style="font-size:30px;font-weight:800;white-space:nowrap"><span id="g-hs">${cs.hs}</span> – <span id="g-as">${cs.as}</span></div>
      <div class="row" style="gap:8px;min-width:0;justify-content:flex-end"><div class="nm">${away.abbr}${away.id===t.id?' <span class="cap">YOU</span>':''}</div><span class="dot" style="background:${away.color};flex:none"></span></div></div>
    <div class="meta dim" style="text-align:center;margin-top:6px"><span id="g-q">${qLabel(cs.q)}</span> · ${G.replay?'Replay':'Live'} · ${home.name} vs ${away.name}</div>`;
  v.append(sb);
  const feed=el('div');feed.id='g-feed';feed.style.cssText='max-height:46vh;overflow-y:auto;margin-top:12px';
  for(let i=0;i<G.idx;i++){const ln=gameEventEl(G.log[i]);if(ln)feed.append(ln);}
  v.append(feed);
  const ctr=el('div','btn-row');ctr.style.marginTop='14px';
  if(G.done){
    const cont=el('button','btn',G.replay?'Done':'Continue → commit week');cont.dataset.tid='game-continue';
    cont.onclick=finishGame;ctr.append(cont);
  }else{
    const skip=el('button','btn line','Skip to result');skip.dataset.tid='game-skip';skip.onclick=skipGame;
    const fast=el('button','btn ghost',G.fast?'Fast ✓':'Fast');fast.dataset.tid='game-fast';fast.onclick=()=>{G.fast=!G.fast;render();};
    ctr.append(skip,fast);
  }
  v.append(ctr);
  app.append(v);
  requestAnimationFrame(()=>{const f=$('#g-feed');if(f)f.scrollTop=f.scrollHeight;});
}

// Curated highlight reel: the season's most notable results, each replayable. Tag + score by
// upset (underdog won), shootout (high total), nailbiter (≤3 / OT), and your signature wins.
function greatestGames(limit){
  const scored=S.schedule.games.filter(g=>g.played).map(g=>{
    const home=teamById(g.home),away=teamById(g.away),homeWon=g.hs>g.as;
    const win=homeWon?home:away,lose=homeWon?away:home;
    const margin=Math.abs(g.hs-g.as),total=g.hs+g.as,upset=lose.ratings.ovr-win.ratings.ovr;
    const iWon=(win.id===S.teamId);
    let tag='',score=0;
    [['Upset',upset>=8?upset*2.0:0],['Shootout',total>=80?(total-60)*0.7:0],
     ['Nailbiter',margin<=3?(8-margin)*2.5:0],['Signature win',iWon&&upset>=4?upset*1.5+12:0]]
      .forEach(([tg,sc])=>{if(sc>score){score=sc;tag=tg;}});
    return {g,win,lose,winScore:Math.max(g.hs,g.as),loseScore:Math.min(g.hs,g.as),tag,score};
  }).filter(x=>x.tag);
  scored.sort((a,b)=>b.score-a.score);
  return scored.slice(0,limit||6);
}

  const wk=S.lastPlayedWeek;

function seasonHonors(v,t){

  const conf=UI.honorsConf||t.conf;

/* ---------- player progression: scouted ceiling + development stage ---------- */
// Ceiling tiers by potential (high → low). index 0 = best. "Superstar" upside lives here.
const CEILINGS=[[95,'Generational'],[89,'Superstar'],[83,'Star'],[77,'Starter'],[70,'Rotational'],[0,'Depth']];
function ceilingIndex(pot){return CEILINGS.findIndex(([m])=>pot>=m);}
function hashStr(s){let h=2166136261;for(let i=0;i<String(s).length;i++){h^=String(s).charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
// Scouting confidence: older/experienced players have a track record; freshmen are projections.
function scoutConfidence(p){if(p.age>=22||/SR/.test(p.yr))return 'high';if(p.age>=20||/JR/.test(p.yr))return 'med';return 'low';}
// Fuzzy ceiling read: a tier (or band) with uncertainty. Exact potential stays hidden;
// the noise is deterministic per player (so it's stable) and shrinks as scouting improves later.
function scoutedCeiling(p){
  const conf=scoutConfidence(p), spread=conf==='high'?0:conf==='med'?3:7;
  const noise=spread?(hashStr(p.id)%(2*spread+1))-spread:0;
  const est=clamp(p.pot+noise,40,99);
  const li=ceilingIndex(clamp(est-spread,40,99)), hi=ceilingIndex(clamp(est+spread,40,99));
  const text=li===hi?CEILINGS[hi][1]+(spread?' ?':''):CEILINGS[li][1]+'–'+CEILINGS[hi][1]+' ?';
  return {text, best:hi, hot:hi<=2, uncertain:spread>0};   // hot = upside reaches Star or better
}
// Development stage from growth remaining (ov→pot gap). Qualitative; exact gap not shown.
function devStage(p){const gap=p.pot-p.ov;return gap<=2?'Maxed':gap<=7?'Polished':gap<=13?'Developing':'Raw';}
function ceilingChip(p){const sc=scoutedCeiling(p);return `<span class="tag ${sc.hot?'accent':''}" style="font-size:10px">${sc.text}</span>`;}
// Season box for a player, grouped by what they actually did (only nonzero categories show).
// Returns {gp, lines:[[label,value]]} or null if the player has logged nothing yet.
function statLines(p){
  const s=p.gs; if(!s) return null;
  const L=[];
  if(s.pAtt) L.push(['Passing', `${s.pCmp||0}/${s.pAtt} · ${s.pYds||0} yds · ${s.pTD||0} TD · ${s.pInt||0} INT`]);
  if(s.rAtt) L.push(['Rushing', `${s.rAtt} car · ${s.rYds||0} yds · ${s.rTD||0} TD`]);
  if(s.rec)  L.push(['Receiving', `${s.rec} rec · ${s.reYds||0} yds · ${s.reTD||0} TD`]);
  if(s.tkl||s.sk||s.dInt){const d=[];if(s.tkl)d.push(s.tkl+' tkl');if(s.sk)d.push(s.sk+' sk');if(s.dInt)d.push(s.dInt+' INT');L.push(['Defense',d.join(' · ')]);}
  if(s.fga||s.xpa){const d=[];if(s.fga)d.push(`${s.fgm||0}/${s.fga} FG`);if(s.xpa)d.push(`${s.xpm||0}/${s.xpa} XP`);L.push(['Kicking',d.join(' · ')]);}
  return L.length?{gp:s.gp||0,lines:L}:null;
}
// "Stats (this year)" block for the player sheet: preseason → placeholder; in-season → the
// player's box, or "did not play" if a body has logged nothing.
function statBlock(p){
  const preseason=!S.schedule||S.phase==='Preseason';
  const sl=statLines(p);
  if(preseason||!sl) return `<div class="kv"><span class="k">Stats (this year)</span><span class="dim">${preseason?'— preseason —':'— did not play —'}</span></div>`;
  const rows=sl.lines.map(([k,v])=>`<div class="kv"><span class="k">${k}</span><span>${v}</span></div>`).join('');
  return `<div class="kv"><span class="k">Stats (this year)</span><span class="dim">${sl.gp} game${sl.gp===1?'':'s'}</span></div>${rows}`;
}
function playerRow(p,isStarter,t){
  const row=el('button','lrow');row.style.width='100%';row.style.textAlign='left';row.dataset.id=p.id;

      <div class="meta">${p.yr} · ${p.age}y · ${p.st} · ${'★'.repeat(p.stars)}${'☆'.repeat(5-p.stars)}</div>

    </div>
    <div style="text-align:right">
      ${isStarter?'<span class="tag accent" style="font-size:10px">ST</span>':'<span class="tag" style="font-size:10px">#'+(p.so+1)+'</span>'}

function makeStarter(p,t){
  const grp=t.roster.filter(x=>x.pos===p.pos).sort((a,b)=>a.so-b.so);
  grp.splice(grp.indexOf(p),1);grp.unshift(p);grp.forEach((x,i)=>x.so=i);autosave();
}
function swapDepth(p,t,dir){
  const grp=t.roster.filter(x=>x.pos===p.pos).sort((a,b)=>a.so-b.so);
  const i=grp.indexOf(p),j=i+dir;if(j<0||j>=grp.length)return;
  [grp[i].so,grp[j].so]=[grp[j].so,grp[i].so];autosave();
}

function buildTeamList(teams,onTap,mode){
  const wrap=el('div');
  const search=el('input','search');search.placeholder='Search teams…';search.style.marginBottom='11px';
  const list=el('div');
  const sortSel=el('select');sortSel.style.marginBottom='11px';

    .forEach(([v2,l])=>{const o=el('option');o.value=v2;o.textContent=l;sortSel.append(o);});

    list.innerHTML='';
    let arr=[...teams];
    const q=search.value.toLowerCase().trim();
    if(q)arr=arr.filter(t=>(t.name+' '+t.nick+' '+t.conf).toLowerCase().includes(q));

      s==='conf'?(a.conf.localeCompare(b.conf)||b.ratings.ovr-a.ratings.ovr):

function inputEl(val,on,ph,type){const i=el('input');i.type=type||'text';if(ph)i.placeholder=ph;i.value=val==null?'':val;i.oninput=()=>on(i.value);return i;}
function selectEl(opts,val,on){const s=el('select');opts.forEach(o=>{const op=el('option');op.value=o;op.textContent=o;if(o===val)op.selected=true;s.append(op);});s.onchange=()=>on(s.value);return s;}
function optEl(t,d,on,cb){const b=el('button','opt'+(on?' on':''));b.innerHTML=`<div class="t">${t}</div><div class="d">${d}</div>`;b.onclick=cb;return b;}
function posName(c){return {QB:'Quarterback',RB:'Running Back',WR:'Wide Receiver',TE:'Tight End',OT:'Offensive Tackle',OG:'Offensive Guard',C:'Center',DE:'Defensive End',DT:'Defensive Tackle',LB:'Linebacker',CB:'Cornerback',S:'Safety',K:'Kicker',P:'Punter'}[c]||c;}
function timeAgo(ts){const s=(Date.now()-ts)/1000;if(s<60)return'just now';if(s<3600)return Math.floor(s/60)+'m ago';if(s<86400)return Math.floor(s/3600)+'h ago';return Math.floor(s/86400)+'d ago';}

/* sheets */
function openSheet(title,bodyNode){
  const bg=el('div','sheet-bg');const sh=el('div','sheet');bg.dataset.tid='sheet-bg';sh.dataset.tid='sheet';
  sh.append(el('div','grab'),el('h3',null,title),bodyNode);
  bg.append(sh);bg.onclick=e=>{if(e.target===bg)closeSheet();};
  $('#sheet').innerHTML='';$('#sheet').append(bg);
}
function closeSheet(){$('#sheet').innerHTML='';}
function confirmSheet(title,sub,onYes){
  const body=el('div');body.append(el('div','hint',sub));
  const yes=el('button','btn danger','Yes, continue');yes.style.marginTop='14px';
  yes.onclick=()=>{closeSheet();onYes();};
  const no=el('button','btn line','Cancel');no.style.marginTop='9px';no.onclick=closeSheet;
  body.append(yes,no);openSheet(title,body);
}

/* ---------- boot ---------- */
render();
</script>
